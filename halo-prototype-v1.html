      <div className="px-6 pt-8 lg:px-0">
        <h1 className="sf-display text-[26px] font-bold text-white leading-tight tracking-[-0.025em] text-center mb-1.5">
          Set a new password
        </h1>
        <p className="sf text-[13px] text-center mb-7" style={{ color: 'rgba(255,255,255,0.60)' }}>
          6+ characters. Use something memorable.
        </p>
        <div className="space-y-3">
          <AuthGlassField label="New password" type="password" value={password} onChange={setPassword}
            placeholder="6+ characters" autoFocus />
          <AuthGlassField label="Confirm" type="password" value={confirm} onChange={setConfirm}
            placeholder="Type it again" error={confirmError} />
        </div>
        <button onClick={valid ? () => setDone(true) : undefined} disabled={!valid}
          className="mt-5 squircle-md py-3.5 w-full sf text-[14.5px] font-semibold transition-all"
          style={{
            color: !valid ? 'rgba(255,255,255,0.40)' : '#0a0d18',

            boxShadow: !valid ? 'none' : '0 8px 24px -8px rgba(0,214,254,0.55), inset 0 1px 0 rgba(255,255,255,0.40)',

/* AuthSubScreen — orchestrator for #/auth/forgot and #/auth/reset.
   Wraps the screen in the same atmosphere + vignette as the main auth
   surface so the visual frame stays consistent. */
const AuthSubScreen = ({ step, onBack, onRequestNewLink }) => (
  <div data-theme="dark" className="anim-fade text-white sf relative" style={{ minHeight: '100vh', background: 'var(--canvas-bg)' }}>
    <div className="lg-atmosphere" />
    <div className="absolute inset-0 z-[1] pointer-events-none"
      style={{ background: 'linear-gradient(180deg, var(--vignette-corner) 0%, transparent 30%, transparent 70%, var(--vignette-corner-soft) 100%)' }} />

      {step === 'forgot' && <ForgotPasswordScreen onBack={onBack} />}

);

/* ============================================================
   11. APP — phone shell + desktop SideNav + router
   ============================================================ */
const App = () => {
  const [theme, setTheme] = useState('dark');
  const [auth, setAuth] = useState(false);
  const [tab, setTab] = useState('home');
  const [pushed, setPushed] = useState(null); // { kind: 'post-game'|'highlight-viewer'|'storytelling-drop'|'pack-reveal', id?, momentIndex? }
  const [menuOpen, setMenuOpen] = useState(false);
  const [bellOpen, setBellOpen] = useState(false);
  const [gameState, setGameState] = useState('off'); // off | live | ready
  /* Onboarding flow overlay — null = no onboarding, 'fan' = generic Onboarding
     (persona picker → teams → players → done), 'player' = PlayerOnboarding
     (coach-invite → signup/signin → teams-locked → claim-and-follow → notif).
     Driven by hash route (#/onboard, #/onboard/player). When set, the App
     renders the onboarding orchestrator instead of the auth or app tree. */
  const [onboardFlow, setOnboardFlow] = useState(null);
  /* Auth sub-route — null = SignIn (the existing default), 'forgot' = forgot
     password, 'reset' = reset password. Driven by #/auth/forgot, #/auth/reset
     hash routes. Placeholders stubbed in Phase 0; real screens in Phase 3. */
  const [authStep, setAuthStep] = useState(null);
  /* Locale — 'en' (default) or 'he'. Hebrew flips dir="rtl" on the app
     wrapper. Switched via the Language sub-page in SideMenu. Persisted
     to localStorage so the next session restores the same direction. */
  const [locale, setLocaleState] = useState(() => {
    try { return localStorage.getItem('halo.lang') || 'en'; }
    catch (e) { return 'en'; }
  });
  const setLocale = (next) => {
    setLocaleState(next);
    try { localStorage.setItem('halo.lang', next); } catch (e) {}
  };
  /* Email-verification state — demo only. Defaults to false so the
     verify-email banner is visible the first time the user opens the
     SideMenu. Tapping "Resend link" flips it to true (banner hides). */
  const [emailVerified, setEmailVerified] = useState(false);
  /* Capture Mode state — fan-recorded media flow.
     - atVenue: demo toggle in SideMenu. When true, the home morph card
       morphs to its capture variant (red glowing). Replaces the rest of
       the morph cycle.
     - captures: session capture pool, seeded with sample fan captures
       so the rails on player profiles + game pages have content on
       first load.
     - captureFlow: which step of the capture overlay flow is open
       (null = no flow, else 'permissions' | 'pick-game' | 'camera' |
       'review'). Driven by #/capture/{step} hash routes.
     - captureSession: scratch state during a capture flow — which
       game the user picked + the array of just-captured clips not
       yet published. Reset on flow close.
     - On approve/decline tag, mutate the relevant capture's
       tagApprovalStatus + privacy via updateCapture. */
  const [atVenue, setAtVenue] = useState(false);
  const [captures, setCaptures] = useState(SEED_CAPTURES);
  const [captureFlow, setCaptureFlow] = useState(null);
  const [captureSession, setCaptureSession] = useState({ gameId: null, pending: [] });
  const updateCapture = (id, patch) => setCaptures(cs => cs.map(c => c.id === id ? { ...c, ...patch } : c));
  const addCaptures = (newCaps) => setCaptures(cs => [...newCaps, ...cs]);
  /* SideNav collapse — persists across reloads via localStorage. */
  const [sideNavCollapsed, setSideNavCollapsed] = useState(() => {
    try { return localStorage.getItem('halo.sidenav.collapsed') === '1'; }
    catch (e) { return false; }
  });
  const toggleSideNav = () => {
    setSideNavCollapsed(v => {
      const next = !v;
      try { localStorage.setItem('halo.sidenav.collapsed', next ? '1' : '0'); } catch (e) {}
      return next;
    });
  };

  // Hash-based routing for shareable URLs
  useEffect(() => {
    const apply = () => {
      const h = window.location.hash.replace(/^#\/?/, '') || 'auth';
      const [route, sub, ...rest] = h.split('/');
      /* Onboarding routes — show the orchestrator instead of auth or app
         tree. `#/onboard` = fan/parent persona picker flow. `#/onboard/player`
         = coach-invite player flow. Both branches keep auth=false so the
         onboarding screens own the canvas (no SideNav/BottomNav chrome). */
      if (route === 'onboard') {
        setAuth(false);
        setAuthStep(null);
        setOnboardFlow(sub === 'player' ? 'player' : 'fan');
        return;
      }
      /* Auth sub-routes — `#/auth/forgot`, `#/auth/reset`. Default `#/auth`
         falls back to SignIn (authStep=null). */
      if (route === 'auth') {
        setAuth(false);
        setOnboardFlow(null);
        setAuthStep(sub === 'forgot' ? 'forgot' : sub === 'reset' ? 'reset' : null);
        return;
      }
      setAuth(true);
      setOnboardFlow(null);
      setAuthStep(null);
      /* Capture Mode flow — overlay route. `#/capture` = enter at
         permissions; `#/capture/{step}` = jump directly to that step.
         Steps: permissions | pick-game | camera | review. The flow
         overlays the current tab so closing the flow returns the
         user to where they were. */
      if (route === 'capture') {
        const step = sub || 'permissions';
        setCaptureFlow(['permissions','pick-game','camera','review'].includes(step) ? step : 'permissions');
        return;
      }
      setCaptureFlow(null);
      if (['home','games','watch','profile'].includes(route)) {
        setTab(route);
        setPushed(null);
      } else if (route === 'post-game') {
        setPushed({ kind: 'post-game', id: sub || 'gE' });
      } else if (route === 'highlight') {
        setPushed({ kind: 'highlight-viewer', momentIndex: Number(sub || 0) });
      } else if (route === 'story') {
        setPushed({ kind: 'storytelling-drop', id: sub || 'sd1' });
      } else if (route === 'pack') {
        setPushed({ kind: 'pack-reveal', id: sub || 'gE' });
      } else if (route === 'game-video') {
        setPushed({ kind: 'game-video', id: sub || 'gE' });
      } else if (route === 'capture-view') {
        setPushed({ kind: 'capture-view', id: sub });
      }
    };
    apply();
    window.addEventListener('hashchange', apply);
    return () => window.removeEventListener('hashchange', apply);
  }, []);
  const navigate = (h) => { window.location.hash = '#/' + h; };

  const onSignIn = () => { setAuth(true); navigate('home'); };
  /* Sign-Up entry — routes into the generic FanOnboarding persona picker.
     PersonaStep auto-forks to PlayerOnboarding (#/onboard/player) when the
     user picks "Player", so this single entry covers fan, parent, and
     player paths. The user keeps onboard chrome (no SideNav) until the
     orchestrator calls onOnboardDone. */
  const onSignUp = () => { navigate('onboard'); };
  /* Sign out — clears auth + sends user back to the SignIn screen via the
     #/auth hash route. Same effect from phone SideMenu and desktop SideNav. */
  const onSignOut = () => { setAuth(false); navigate('auth'); };
  /* Demo handler — wired to the "Player invite (demo)" affordance in both
     the desktop SideNav and the phone SideMenu. Drops the signed-in user
     directly at PlayerInviteEntry, the first screen a real player would
     see after tapping a coach's invite link. Closes the phone drawer
     before navigating so the overlay doesn't sit on top of the flow. */
  const onDemoPlayerInvite = () => { setMenuOpen(false); navigate('onboard/player'); };
  /* Same handler reused on the SignIn screen's mail icon — lets a brand
     new player from a coach link jump straight to PlayerInviteEntry
     without going through Sign Up first. No menu state to close here. */
  const onOpenInviteFromAuth = () => navigate('onboard/player');
  /* Onboarding completion handlers — both flows land on Home when done. */
  const onOnboardDone = () => { setOnboardFlow(null); setAuth(true); navigate('home'); };
  const onSetTab = (k) => { navigate(k); };
  const onPickMoment = (idx) => navigate('highlight/' + idx);

  /* ── Highlight-viewer cross-owner chain state ──────────────────
     The set of person/team IDs the user has consumed (Instagram-style
     "seen story"). Lives at the app shell so both HighlightCircles
     (READ — renders gray ring) and HighlightViewer (WRITE — marks the
     current owner viewed when chaining to the next person) share the
     same source of truth. Persisted to localStorage. */
  const [viewed, setViewed] = useState(loadViewedSet);
  const markViewed = (id) => {
    setViewed(prev => {
      if (prev.has(id)) return prev;
      const next = new Set(prev);
      next.add(id);
      saveViewedSet(next);
      return next;
    });
  };
  /* Wrapper builder — returns an onClick that marks the circle as
     viewed first, then runs the original action. */
  const onWatch = (id, handler) => () => { markViewed(id); handler(); };
  /* The currently-viewing highlight owner. Drives the eyebrow label,
     the auto-chain pointer, and gets passed as a `key` to
     HighlightViewer so the component remounts (idx resets to 0) when
     the chain advances. Defaults to 'self'. */
  const [hlOwner, setHlOwner] = useState('self');
  /* onChainNextOwner — called by HighlightViewer when goNext fires
     past the last clip. Marks the current owner viewed (idempotent if
     already there), walks forward through HL_OWNER_QUEUE starting at
     the position AFTER the current owner, returns the first not-yet-
     viewed candidate. Wraps around the queue. If everyone's been
     viewed, closes the viewer back to the active tab. */
  const onChainNextOwner = () => {
    const after = new Set(viewed);
    after.add(hlOwner);
    saveViewedSet(after);
    setViewed(after);
    const cur = HL_OWNER_QUEUE.indexOf(hlOwner);
    for (let step = 1; step <= HL_OWNER_QUEUE.length; step++) {
      const candidate = HL_OWNER_QUEUE[(cur + step) % HL_OWNER_QUEUE.length];
      if (!after.has(candidate)) {
        setHlOwner(candidate);
        navigate('highlight/0');
        return;
      }
    }
    // All owners viewed — close the viewer.
    navigate(tab);
  };
  /* Demo · Reset viewed — clears the entire seen-story set so the
     gray-ring + auto-chain flow can be re-demoed cleanly. Wired into
     the SideMenu demo block. Closes the menu after firing so the
     visual change is visible on home immediately. */
  const onResetViewed = () => {
    setViewed(new Set());
    saveViewedSet(new Set());
    setHlOwner('self');
    setMenuOpen(false);
  };
  /* Game card tap — opens the PostGameScreen recap (stats + tabs). */
  const onOpenGame = (id) => navigate('post-game/' + id);
  /* 16:9 game-video tap — opens GameVideoViewer (full game / team
     highlight playback). Distinct from `onOpenGame` (which opens the
     stat recap). Per the May 2026 critique: video viewer for video
     content, recap for stats. */
  const onOpenGameVideo = (id) => navigate('game-video/' + id);
  /* Story drop tap — routes to the dedicated StorytellingDropViewer
     (60-40 layout with horizontal-snap moment cards + insight panel). */
  const onOpenStory = (id) => navigate('story/' + id);
  const onOpenAthlete = (id) => navigate('profile');
  /* "Drop is ready" CTA on the GameCard — routes to the cinematic
     PackReveal ceremony (3-stage anim), which then jumps into
     HighlightViewer when the user picks a moment. */
  const onOpenDrop = (id) => navigate('pack/' + id);

  const phoneHeader = (
    <HomeHeader
      greeting={tab === 'home' ? 'Game day' : tab === 'games' ? 'Games' : tab === 'profile' ? 'You' : ''}
      theme={theme}
      onTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
      onMenu={() => setMenuOpen(true)}
      onBell={() => setBellOpen(true)}
    />
  );

  const renderTabContent = (showHeader = true) => {
    const header = showHeader ? phoneHeader : null;
    if (tab === 'home') return <HomeScreen header={header} gameState={gameState} viewed={viewed} onWatch={onWatch} setHlOwner={setHlOwner} onPickMoment={onPickMoment} onOpenGame={onOpenGame} onOpenGameVideo={onOpenGameVideo} onOpenStory={onOpenStory} onOpenAthlete={onOpenAthlete} onOpenDrop={onOpenDrop} atVenue={atVenue} onStartCapture={() => navigate('capture')} />;
    if (tab === 'games') return <GamesScreen onOpenGame={onOpenGame} onOpenGameVideo={onOpenGameVideo} />;
    if (tab === 'watch') return <WatchScreen onOpenGame={onOpenGame} onOpenGameVideo={onOpenGameVideo} onPickMoment={onPickMoment} />;
    if (tab === 'profile') return <AthleteProfileScreen onPickMoment={onPickMoment} onOpenGame={onOpenGame} onBack={() => navigate('home')} asTab captures={captures} />;
    return null;
  };

  // === ONBOARDING ===
  // Routed via #/onboard (fan) and #/onboard/player. Auth stays false
  // (onboarding screens own the canvas; no SideNav/BottomNav chrome).
  if (onboardFlow) {
    const Flow = onboardFlow === 'player' ? PlayerOnboarding : FanOnboarding;
    /* onExit — fired when the user hits the back chevron from the first
       onboarding screen. Routes back to the auth screen so they can
       sign in instead of continuing onboarding. */
    const onExitOnboard = () => navigate('auth');
    return (
      <div className={`glass-app app-stage`} data-theme={theme} dir={locale === 'he' ? 'rtl' : 'ltr'}>
        <div className="stage-phone">
          <div className="phone" data-theme={theme}>
            {/* 100dvh, not 100vh — see .phone CSS rationale. The
                phone-screen wrapper has to match the .phone height
                exactly or the orchestrator card's `absolute inset:0`
                stretches past the visible viewport. */}
            <div className="phone-screen relative" style={{ minHeight: '100dvh' }}>
              <Flow onDone={onOnboardDone} onExit={onExitOnboard} />
            </div>
          </div>
        </div>
        <div className="stage-desktop relative" style={{ minHeight: '100vh' }}>
          <Flow onDone={onOnboardDone} onExit={onExitOnboard} />
        </div>
      </div>
    );
  }

  // === AUTH ===
  // Phone: ClientLogoHero (lg:hidden) + form. Desktop: BrandPanel (~55% navy + cyan mark) + form (~45%, max-w-440).
  // Mirrors halo-design-system/src/layouts/AuthCanvas.tsx. Sub-routes:
  //   #/auth          → SignIn (default)
  //   #/auth/forgot   → ForgotPassword (placeholder until Phase 3)
  //   #/auth/reset    → ResetPassword (placeholder until Phase 3)
  if (!auth) {
    /* Sub-route placeholder — shown above the normal SignIn surface. */
    if (authStep === 'forgot' || authStep === 'reset') {
      return (
        <div className={`glass-app app-stage`} data-theme={theme} dir={locale === 'he' ? 'rtl' : 'ltr'}>
          <div className="stage-phone">
            <div className="phone" data-theme={theme}>
              <div className="phone-screen relative">
                {/* scroll-area wrap matches the main auth fix above —
                    forgot/reset password screens also need to scroll
                    on phone. */}
                <div className="scroll-area">
                  <AuthSubScreen step={authStep} onBack={() => navigate('auth')} onRequestNewLink={() => navigate('auth/forgot')} />
                </div>
              </div>
            </div>
          </div>
          <div className="stage-desktop relative" style={{ minHeight: '100vh' }}>
            <AuthSubScreen step={authStep} onBack={() => navigate('auth')} onRequestNewLink={() => navigate('auth/forgot')} />
          </div>
        </div>
      );
    }
    return (
      <div className={`glass-app app-stage`} data-theme={theme} dir={locale === 'he' ? 'rtl' : 'ltr'}>
        {/* PHONE — ClientLogoHero + form.
            .scroll-area wrap added: without it the phone-screen's
            overflow:hidden clips the Sign Up form (the fields below the
            fold became unreachable on phone). Post-auth tabs already
            wrap their content in .scroll-area, auth had been missing
            this. */}
        <div className="stage-phone">
          <div className="phone" data-theme={theme}>
            <div className="phone-screen">
              <div className="scroll-area">
                <SignInScreen onSignIn={onSignIn} onSignUp={onSignUp} onOpenInvite={onOpenInviteFromAuth}
                  theme={theme} onToggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} />
              </div>
            </div>
          </div>
        </div>
        {/* DESKTOP — split: BrandPanel (left ~55%) + form (right ~45%).
            position:relative is required so the InviteIconButton below
            anchors to this stage instead of the document body. */}
        <div className="stage-desktop" style={{ minHeight: '100vh', position: 'relative', color: 'var(--text-primary)', background: 'var(--canvas-bg)' }}>
          {/* Top-corner cluster — theme toggle inline-start of the
              invite mail icon. Both anchor to .stage-desktop (position
              relative). Pre-auth there's no SideNav yet, so this is
              where the theme flip lives until the user signs in. */}
          <AuthThemeToggle theme={theme} onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} />
          <InviteIconButton onClick={onOpenInviteFromAuth} />
          <aside data-theme="dark" aria-hidden="true"
            style={{
              flex: '11 1 0',
              display: 'flex',
              flexDirection: 'column',
              justifyContent: 'center',
              alignItems: 'center',
              position: 'relative',
              overflow: 'hidden',
              background: 'radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0,214,254,0.10) 0%, transparent 65%), linear-gradient(180deg, transparent 0%, transparent 50%, rgba(0,0,0,0.20) 100%), var(--client-accent)',
              boxShadow: 'inset 0 -1px 0 rgba(255,255,255,0.06)',
              color: '#fff',
            }}>
            <div style={{ filter: 'drop-shadow(0 0 40px rgba(0,214,254,0.35))' }}>
              <ClientLogoMark />
            </div>
          </aside>
          <main className="relative z-10 flex flex-col px-10 xl:px-16 pb-16 max-h-screen overflow-y-auto"
            style={{ flex: '9 1 0', paddingTop: '20vh' }}>
            <div className="w-full mx-auto" style={{ maxWidth: 440 }}>
              <SignInForm onSubmit={onSignIn} onSignUp={onSignUp} />
            </div>
          </main>
        </div>
      </div>
    );
  }

  // === APP (post-auth) ===

  // Phone-mode pushed screens cover the tab — desktop pushes inline.
  const phonePush = pushed && (
    pushed.kind === 'post-game' ? <PostGameScreen gameId={pushed.id} onBack={() => navigate(tab)} onPickMoment={onPickMoment} setHlOwner={setHlOwner} captures={captures} />
    : null
  );
  /* Overlay layer — sits above the tab tree. Routed by `pushed.kind`.
     Aspect ratio of the video follows the CONTENT (not the device):
       'highlight-viewer'  → 9:16 (player HL drops)
       'storytelling-drop' → 9:16 multi-moment story
       'game-video'        → 16:9 (full game / team highlight)
       'pack-reveal'       → ceremony (no video; routes forward to HL viewer)
     "Watch full game" CTA inside HighlightViewer routes to game-video,
     not post-game (post-game is the stat recap, not the video). */
  const overlay = (
    pushed?.kind === 'highlight-viewer'
      ? <HighlightViewer key={hlOwner} hlOwner={hlOwner} momentIndex={pushed.momentIndex} onClose={() => navigate(tab)}
          onWatchFullGame={(gid) => navigate('game-video/' + gid)}
          onChainNext={onChainNextOwner} />
    : pushed?.kind === 'storytelling-drop'
      ? <StorytellingDropViewer storyId={pushed.id} onClose={() => navigate(tab)}
          onPickMoment={(idx) => navigate('highlight/' + idx)} />
    : pushed?.kind === 'game-video'
      ? <GameVideoViewer gameId={pushed.id} onClose={() => navigate(tab)} />
    : pushed?.kind === 'pack-reveal'
      ? <PackReveal gameId={pushed.id} onClose={() => navigate(tab)}
          onPickMoment={(idx) => navigate('highlight/' + idx)} />
    : pushed?.kind === 'capture-view'
      ? <CaptureViewer captureId={pushed.id} captures={captures} onClose={() => navigate(tab)} />
    : null
  );

  return (
    <div className={`glass-app app-stage`} data-theme={theme} dir={locale === 'he' ? 'rtl' : 'ltr'}>
      {/* Overlay rendered once here — fixed inset-0 so it covers the viewport
          regardless of stage. Previously duplicated in phone-screen AND
          stage-desktop, causing two StorytellingDropViewer instances to mount
          simultaneously (competing RAFs, scroll listeners, body-scroll locks). */}
      {overlay}
      {/* === PHONE STAGE (< lg) === */}
      <div className="stage-phone">
        <div className="phone" data-theme={theme}>
          <div className="phone-screen">
            <div className="scroll-area">
              {phonePush || renderTabContent(true)}
            </div>
            {(!pushed || (pushed.kind !== 'highlight-viewer' && pushed.kind !== 'storytelling-drop' && pushed.kind !== 'pack-reveal' && pushed.kind !== 'game-video')) && <BottomNav active={tab} onSet={onSetTab} />}
            {menuOpen && <SideMenu onClose={() => setMenuOpen(false)} onNav={onSetTab}
              theme={theme} onTheme={() => { setTheme(t => t === 'dark' ? 'light' : 'dark'); }}
              onSignOut={onSignOut}
              locale={locale} setLocale={setLocale}
              emailVerified={emailVerified} onVerifyEmail={() => setEmailVerified(true)}
              onDemoPlayerInvite={onDemoPlayerInvite}
              atVenue={atVenue} onToggleAtVenue={() => setAtVenue(v => !v)}
              onResetViewed={onResetViewed} viewedCount={viewed.size} />}
            {bellOpen && <NotificationsSheet onClose={() => setBellOpen(false)} onOpenGame={onOpenGame}
              captures={captures}
              onApproveTag={(id) => updateCapture(id, { tagApprovalStatus: 'approved' })}
              onDeclineTag={(id) => updateCapture(id, { tagApprovalStatus: 'declined' })} />}
            {captureFlow && <CaptureFlow step={captureFlow} captureSession={captureSession} setCaptureSession={setCaptureSession} addCaptures={addCaptures} navigate={navigate} onClose={() => { setCaptureSession({ gameId: null, pending: [] }); navigate('home'); }} />}
          </div>
        </div>
      </div>

      {/* === DESKTOP STAGE (lg+) === */}
      <div className="stage-desktop" style={{ position: 'relative', minHeight: '100vh' }}>
        <div className="lg-atmosphere" />
        <div className="relative z-10 flex w-full" style={{ minHeight: '100vh' }}>
          {/* Side nav — collapsible. Toggle persists in localStorage. */}
          <aside className={`ds-sidenav ${sideNavCollapsed ? 'collapsed' : ''}`}>
            {/* Header — brand-row + toggle wrapped together so their total
                height stays fixed at 78px in both modes. That's what locks
                the nav items below to a consistent Y-position when the
                bar collapses/expands.
                Expanded: chevron sits flush-right on the same row as the
                wordmark. Collapsed: chevron stacks centered below the H
                mark. The transition between the two looks like the chevron
                rotates and drops into place rather than jumping. */}
            <div className="ds-sidenav-header">
              <div className="ds-sidenav-brand-row">
                <div className="ds-sidenav-brand-mark">H</div>
                <div className="ds-sidenav-brand-wordmark flex items-baseline gap-1.5">
                  <span className="sf-display font-bold text-[18px] leading-none" style={{ color: 'var(--text-primary)' }}>HALO</span>
                  <span className="sf text-[9px] tracking-[0.18em] uppercase font-bold" style={{ color: 'var(--brand-cyan-text)' }}>player</span>
                </div>
              </div>
              <button onClick={toggleSideNav} className="ds-sidenav-toggle" aria-label={sideNavCollapsed ? 'Expand sidebar' : 'Collapse sidebar'}>
                <svg width={11} height={11} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">
                  <path d="M8.5 2.5 L4 7 L8.5 11.5" />
                </svg>
              </button>
            </div>
            {[
              { key: 'home',    label: 'Home', icon: 'home' },
              { key: 'games',   label: 'Games', icon: 'games' },
              { key: 'watch',   label: 'Watch', icon: 'watch' },
              { key: 'profile', label: 'You',   icon: 'profile' },
            ].map(it => (
              <button key={it.key} onClick={() => onSetTab(it.key)} title={sideNavCollapsed ? it.label : ''}
                className={`ds-sidenav-item ${tab === it.key ? 'active' : ''}`}>
                <Icon name={it.icon} size={18} stroke={tab === it.key ? 2 : 1.6} />
                <span className="ds-sidenav-label">{it.label}</span>
              </button>
            ))}
            <div className="flex-1" />
            <button onClick={() => setBellOpen(true)} className="ds-sidenav-item" title={sideNavCollapsed ? 'Notifications · 3 unread' : ''}>
              <span className="ds-sidenav-icon-wrap">
                <Icon name="bell" size={18} />
                <span className="ds-sidenav-dot" aria-hidden="true" />
              </span>
              <span className="ds-sidenav-label">Notifications</span>
              <span className="ds-sidenav-badge ms-auto sf text-[10px] live-red rounded-full px-1.5 py-0.5 font-bold leading-none" style={{ minWidth: 18, textAlign: 'center' }}>3</span>
            </button>
            {/* Settings gear — opens the SideMenu drawer. Per user spec
                (P4a), this is the desktop entry point for Account /
                Notifications / Language / Subscription / Permissions /
                Help — all the surfaces the hamburger gives phone users.
                Sits between Notifications and Theme so it groups with
                the other "system" actions in the bottom cluster. */}
            <button onClick={() => setMenuOpen(true)} className="ds-sidenav-item" title={sideNavCollapsed ? 'Settings' : ''}>
              <Icon name="settings" size={18} />
              <span className="ds-sidenav-label">Settings</span>
            </button>
            {/* Demo · Player invite — drops the user at PlayerInviteEntry,
                the first screen a real player sees after tapping a coach
                invite link. Cyan-tinted "(demo)" suffix so reviewers know
                this row is a prototype shortcut, not production UX.
                Sits right after Settings per Yoni's spec. */}
            <button onClick={onDemoPlayerInvite} className="ds-sidenav-item" title={sideNavCollapsed ? 'Demo: Player invite link' : ''}>
              <Icon name="mail" size={18} />
              <span className="ds-sidenav-label">
                Player invite
                <span className="ms-1.5 sf text-[9.5px] tracking-[0.16em] uppercase font-bold"
                  style={{ color: 'var(--brand-cyan-text)' }}>demo</span>
              </span>
            </button>
            {/* Desktop mirror of the SideMenu's "I'm at the venue" toggle.
                When ON the row glows red (mirrors the Capture Mode red
                accent) so the demo state is visible at a glance from the
                persistent sidebar. */}
            <button onClick={() => setAtVenue(v => !v)} className="ds-sidenav-item"
              title={sideNavCollapsed ? 'Demo: At venue toggle' : ''}
              style={atVenue ? { background: 'rgba(220,38,38,0.15)', color: '#ff9090' } : undefined}>
              <Icon name="map-pin" size={18} />
              <span className="ds-sidenav-label">
                At venue
                <span className="ms-1.5 sf text-[9.5px] tracking-[0.16em] uppercase font-bold"
                  style={{ color: atVenue ? '#ff9090' : 'var(--brand-cyan-text)' }}>
                  {atVenue ? 'ON' : 'DEMO'}
                </span>
              </span>
            </button>
            {/* Desktop mirror of the SideMenu's "Reset viewed" demo row.
                Only renders when there's something in the viewed set to
                reset, so the row stays hidden on a fresh demo. Trailing
                badge shows the seen-count next to the cyan demo tag. */}
            {viewed.size > 0 && (
              <button onClick={onResetViewed} className="ds-sidenav-item"
                title={sideNavCollapsed ? `Demo: Reset ${viewed.size} viewed circle${viewed.size === 1 ? '' : 's'}` : ''}>
                <Icon name="check" size={18} />
                <span className="ds-sidenav-label">
                  Reset viewed
                  <span className="ms-1.5 sf text-[9.5px] tracking-[0.16em] uppercase font-bold"
                    style={{ color: 'var(--brand-cyan-text)' }}>{viewed.size} seen</span>
                </span>
              </button>
            )}
            <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} className="ds-sidenav-item" title={sideNavCollapsed ? (theme === 'dark' ? 'Light mode' : 'Dark mode') : ''}>
              <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={18} />
              <span className="ds-sidenav-label">{theme === 'dark' ? 'Light' : 'Dark'} mode</span>
            </button>
            {/* Sign out — danger-tinted text. Same handler as the phone
                SideMenu version. Sits between Theme and the user card so
                it's visible whether the bar is expanded or collapsed
                (icon-only in the collapsed bar; tooltip clarifies). */}
            <button onClick={onSignOut} className="ds-sidenav-item" title={sideNavCollapsed ? 'Sign out' : ''} style={{ color: '#fca5a5' }}>
              <Icon name="logout" size={18} />
              <span className="ds-sidenav-label">Sign out</span>
            </button>
            {/* Divider before user card. SAME my-3 spacing in both modes
                so the user card's Y-position doesn't shift when toggling
                the sidebar. In collapsed mode we hide the border line but
                preserve the spacing. */}
            <div className={`mx-2 my-3 ${sideNavCollapsed ? '' : 'border-t'}`}
              style={{ borderColor: 'var(--hairline)', height: sideNavCollapsed ? 0 : undefined }} />
            <button onClick={() => onSetTab('profile')} className="ds-sidenav-user" title={sideNavCollapsed ? `${PLAYER.name} · #${PLAYER.number}` : ''}>
              <div className="ds-sidenav-avatar">{PLAYER.initials}</div>
              <div className="ds-sidenav-meta flex-1 min-w-0">
                <div className="sf text-[13px] font-semibold leading-tight" style={{ color: 'var(--text-primary)' }}>{PLAYER.name}</div>
                <div className="sf text-[10.5px]" style={{ color: 'var(--text-tertiary)' }}>#{PLAYER.number} · {PLAYER.team}</div>
              </div>
            </button>
          </aside>

          {/* Main — Watch escapes the 920px cap and goes full-bleed
              per DS WatchShell. Other tabs stay in the capped main column. */}
          {tab === 'watch' && !phonePush ? (
            <div className="ds-watch-full">
              {renderTabContent(false)}
            </div>
          ) : (
            <main className="ds-desktop-main relative">
              {phonePush || renderTabContent(false)}
            </main>
          )}
        </div>
        {bellOpen && <NotificationsSheet onClose={() => setBellOpen(false)} onOpenGame={onOpenGame}
          captures={captures}
          onApproveTag={(id) => updateCapture(id, { tagApprovalStatus: 'approved' })}
          onDeclineTag={(id) => updateCapture(id, { tagApprovalStatus: 'declined' })} />}
        {/* CaptureFlow — desktop mount. Same overlay as phone (fixed
            inset-0 z-110), so it covers the SideNav + content area. */}
        {captureFlow && <CaptureFlow step={captureFlow} captureSession={captureSession}
          setCaptureSession={setCaptureSession} addCaptures={addCaptures}
          navigate={navigate}
          onClose={() => { setCaptureSession({ gameId: null, pending: [] }); navigate('home'); }} />}
        {/* SettingsModal — desktop render. Replaces the phone-style
            right-side drawer with a centered 2-column glass modal that
            fits a desktop canvas. Reuses every Menu*Page component the
            drawer uses; only the outer shell differs. Triggered by the
            gear icon in the desktop SideNav. */}
        {menuOpen && <SettingsModal onClose={() => setMenuOpen(false)}
          theme={theme} onTheme={() => { setTheme(t => t === 'dark' ? 'light' : 'dark'); }}
          onSignOut={onSignOut}
          locale={locale} setLocale={setLocale}
          emailVerified={emailVerified} onVerifyEmail={() => setEmailVerified(true)} />}
      </div>
    </div>
  );
};

/* ============================================================
   CAPTURE MODE — fan-recorded media flow
   Triggered by the "I'm at the venue" toggle. 4 sequential screens
   in one overlay orchestrator. Glass-dark canvas, red live-style
   accents (matches MorphCaptureCard's tone). Closes back to the
   home tab on done OR abandon.
   ============================================================ */

/* SummaryChip — small count + label pill used at the top of the
   capture review screen. Cyan brand accent for the primary count,
   neutral for kind breakdowns, green for public. */
const SummaryChip = ({ count, label, accent = 'plain' }) => {
  const styles = accent === 'brand'
    ? { background: 'rgba(0,214,254,0.12)', border: '1px solid var(--brand-cyan-border)', color: 'var(--brand-cyan-text)', numColor: '#fff' }
    : accent === 'success'
    ? { background: 'rgba(74,222,128,0.10)', border: '1px solid rgba(74,222,128,0.40)', color: '#86efac', numColor: '#86efac' }
    : { background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.12)', color: 'rgba(255,255,255,0.65)', numColor: '#fff' };
  return (
    <div className="inline-flex items-baseline gap-1.5 px-2.5 py-1 rounded-full"
      style={{ background: styles.background, border: styles.border }}>
      <span className="sf-display text-[13px] tabular-nums font-bold leading-none" style={{ color: styles.numColor }}>{count}</span>
      <span className="sf text-[10px] tracking-[0.10em] uppercase font-semibold leading-none" style={{ color: styles.color }}>{label}</span>
    </div>
  );
};

/* CaptureSheet — shared shell for all 4 capture screens. Fixed-position
   overlay, dark-glass canvas, top chrome (back + step label + close),
   flex-1 scrollable content, optional shrink-0 dock CTA. */
const CaptureSheet = ({ stepLabel, stepCount, currentStep, onBack, onClose, children, dock }) => (
  <div className="fixed inset-0 z-[110] anim-fade flex flex-col"
    style={{
      background:
        'radial-gradient(ellipse 80% 50% at 50% 0%, rgba(220,38,38,0.18) 0%, transparent 55%),' +
        'radial-gradient(ellipse 70% 50% at 50% 100%, rgba(8,12,20,0.85) 0%, transparent 60%),' +
        '#06080e',
      color: '#fff',
    }}>
    {/* Top chrome — back (if available) + step indicator + close */}
    <div className="shrink-0 relative z-30 flex items-center justify-between px-5 lg:px-8 pt-4 pb-3">
      {onBack ? (
        <button onClick={onBack} aria-label="Back"
          className="w-9 h-9 rounded-full flex items-center justify-center transition-all hover:bg-white/8 active:scale-[0.96]"
          style={{
            background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.10)',
            color: 'rgba(255,255,255,0.85)',
          }}>
          <Icon name="chevL" size={12} stroke={2} />
        </button>
      ) : <div className="w-9 h-9" />}
      <div className="flex items-center gap-2">
        <span className="sf text-[9.5px] tracking-[0.24em] uppercase font-bold" style={{ color: 'rgba(255,255,255,0.45)' }}>
          {stepLabel}
        </span>
        {stepCount && (
          <span className="sf text-[9.5px] tracking-[0.18em] uppercase font-semibold tabular-nums" style={{ color: 'rgba(255,255,255,0.30)' }}>
            · {currentStep}/{stepCount}
          </span>
        )}
      </div>
      <button onClick={onClose} aria-label="Close"
        className="w-9 h-9 rounded-full flex items-center justify-center transition-all hover:scale-[1.04] active:scale-[0.95]"
        style={{
          background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.10)',
          color: 'rgba(255,255,255,0.95)',
        }}>
        <Icon name="close" size={11} stroke={2} />
      </button>
    </div>
    {/* Content */}
    <div className="flex-1 min-h-0 overflow-y-auto onb-scroll px-5 lg:px-8 pb-6">
      <div className="w-full lg:max-w-[560px] mx-auto pt-4">
        {children}
      </div>
    </div>
    {/* Optional dock */}
    {dock && (
      <div className="shrink-0 px-5 lg:px-8 pb-6 pt-3"
        style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(6,8,14,0.72) 60%, rgba(6,8,14,0.92) 100%)' }}>
        <div className="w-full lg:max-w-[560px] mx-auto">{dock}</div>
      </div>
    )}
  </div>
);

/* CapturePermissionsStep — mock permission sheet with 3 toggles.
   None of the toggles request real browser permissions; they just flip
   visual state. Continue is enabled when all three are flipped on
   (mimicking the "you need to allow these to proceed" flow). */
const CapturePermissionsStep = ({ onContinue, onClose }) => {
  /* All three permissions default to ON so demo viewers can tap
     Continue immediately. The toggles are still tappable in case
     someone wants to demo the "denied" state, but the happy-path
     friction is gone. */
  const [perms, setPerms] = useState({ location: true, camera: true, media: true });
  const allOn = perms.location && perms.camera && perms.media;
  const ROWS = [
    { key: 'location', icon: 'map-pin', title: 'Location', sub: 'Confirm you\'re at the venue' },
    { key: 'camera',   icon: 'camera',  title: 'Camera',   sub: 'For photos + video' },
    { key: 'media',    icon: 'download',title: 'Photo library', sub: 'To save what you capture' },
  ];
  return (
    <CaptureSheet stepLabel="Capture · Permissions" stepCount={4} currentStep={1} onClose={onClose}
      dock={
        <button onClick={allOn ? onContinue : undefined} disabled={!allOn}
          className="w-full squircle-md py-3.5 sf text-[14px] font-bold transition-all"
          style={{
            color: allOn ? '#fff' : 'rgba(255,255,255,0.40)',
            background: allOn ? 'linear-gradient(180deg, rgba(255,54,54,1) 0%, rgba(200,30,30,1) 100%)' : 'rgba(255,255,255,0.06)',
            border: allOn ? 'none' : '1px solid rgba(255,255,255,0.10)',
            boxShadow: allOn ? '0 8px 24px -8px rgba(255,54,54,0.55), inset 0 1px 0 rgba(255,255,255,0.30)' : 'none',
            cursor: allOn ? 'pointer' : 'not-allowed',
          }}>
          {allOn ? 'Continue' : 'Allow all three to continue'}
        </button>
      }>
      <h1 className="sf-display text-[26px] lg:text-[32px] font-bold leading-[1.05] tracking-[-0.02em] mb-2 text-white">
        Quick permissions
      </h1>
      <p className="sf text-[13px] lg:text-[14px] leading-relaxed mb-7" style={{ color: 'rgba(255,255,255,0.55)' }}>
        We only ask once — these stay on while you're at the venue tonight.
      </p>
      <div className="space-y-3">
        {ROWS.map(row => {
          const on = perms[row.key];
          return (
            <button key={row.key} onClick={() => setPerms(p => ({ ...p, [row.key]: !p[row.key] }))}
              className="w-full squircle-md p-4 flex items-center gap-3.5 text-start transition-all hover:scale-[1.005] active:scale-[0.995]"
              style={{
                background: on ? 'rgba(0,214,254,0.10)' : 'rgba(255,255,255,0.04)',
                border: '1px solid ' + (on ? 'rgba(0,214,254,0.45)' : 'rgba(255,255,255,0.10)'),
                boxShadow: on ? '0 0 16px -4px rgba(0,214,254,0.30), inset 0 1px 0 rgba(255,255,255,0.08)' : 'inset 0 1px 0 rgba(255,255,255,0.05)',
              }}>
              <div className="w-11 h-11 squircle-sm flex items-center justify-center shrink-0"
                style={{
                  background: on ? 'rgba(0,214,254,0.20)' : 'rgba(255,255,255,0.05)',
                  border: '1px solid ' + (on ? 'rgba(0,214,254,0.45)' : 'rgba(255,255,255,0.10)'),
                  color: on ? '#7ce8ff' : 'rgba(255,255,255,0.55)',
                }}>
                <Icon name={row.icon} size={18} stroke={1.7} />
              </div>
              <div className="flex-1 min-w-0">
                <div className="sf-display text-[14.5px] font-bold leading-tight text-white">{row.title}</div>
                <div className="sf text-[11.5px] mt-0.5" style={{ color: 'rgba(255,255,255,0.50)' }}>{row.sub}</div>
              </div>
              <div className="w-11 h-7 rounded-full relative transition-colors"
                style={{
                  background: on ? 'var(--brand-cyan)' : 'rgba(255,255,255,0.16)',
                }}>
                <div className="absolute top-1 w-5 h-5 rounded-full bg-white transition-all"
                  style={{ insetInlineStart: on ? 'calc(100% - 24px)' : '4px', boxShadow: '0 1px 3px rgba(0,0,0,0.30)' }} />
              </div>
            </button>
          );
        })}
      </div>
    </CaptureSheet>
  );
};

/* CapturePickGameStep — pick the game to attach captures to. Lists
   all "live" + "just-ended" games as nearby (tournament-aware demo).
   Each row: cyan team initials + matchup + status pill. */
const CapturePickGameStep = ({ onPick, onBack, onClose }) => {
  /* Live + upcoming games only — capture mode only makes sense for games
     that are happening or about to happen. Finished games are intentionally
     excluded (fan captures are for in-the-moment recording, not retroactive
     uploads to old games). Live games sort first, then upcoming by
     kickoff proximity. */
  const nearbyGames = SEED_GAMES
    .filter(g => g.status === 'live' || g.status === 'upcoming')
    .sort((a, b) => {
      if (a.status === 'live' && b.status !== 'live') return -1;
      if (b.status === 'live' && a.status !== 'live') return 1;
      return (a.kickoffInSec || 0) - (b.kickoffInSec || 0);
    })
    .slice(0, 3);
  return (
    <CaptureSheet stepLabel="Capture · Pick game" stepCount={4} currentStep={2} onBack={onBack} onClose={onClose}>
      <h1 className="sf-display text-[26px] lg:text-[32px] font-bold leading-[1.05] tracking-[-0.02em] mb-2 text-white">
        Which game?
      </h1>
      <p className="sf text-[13px] lg:text-[14px] leading-relaxed mb-7" style={{ color: 'rgba(255,255,255,0.55)' }}>
        Multiple games detected at this venue. Pick the one you're watching.
      </p>
      <div className="space-y-3">
        {nearbyGames.map(g => {
          const isLive = g.status === 'live';
          /* Tipoff label for upcoming games — uses the existing fmt.until
             helper to render "in 32h", "in 4d", etc. Imminent threshold
             (< 2h) flips the pill to "STARTING SOON" with a cyan glow
             instead of the calmer "upcoming" treatment, mirroring the
             pre-game state on the morph card. */
          const imminent = !isLive && g.kickoffInSec && g.kickoffInSec < 7200;
          return (
            <button key={g.id} onClick={() => onPick(g.id)}
              className="w-full squircle-md p-4 flex items-center gap-3.5 text-start transition-all hover:scale-[1.005] active:scale-[0.99]"
              style={{
                background: 'rgba(255,255,255,0.04)',
                border: '1px solid rgba(255,255,255,0.10)',
                boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.05)',
              }}>
              <div className="w-12 h-12 squircle-sm flex items-center justify-center shrink-0 sf-display text-[13px] font-bold text-white"
                style={{ background: 'rgba(0,214,254,0.18)', border: '1px solid rgba(0,214,254,0.45)' }}>
                {g.home.charAt(0)}{g.away.charAt(0)}
              </div>
              <div className="flex-1 min-w-0">
                <div className="sf-display text-[15px] font-bold leading-tight text-white">{g.home} <span style={{ color: 'rgba(255,255,255,0.45)', fontWeight: 600 }}>vs</span> {g.away}</div>
                <div className="sf text-[11.5px] mt-0.5" style={{ color: 'rgba(255,255,255,0.55)' }}>
                  {isLive
                    ? `LIVE · ${g.period} · ${g.scoreHome}–${g.scoreAway}`
                    : `Tip-off ${fmt.until(g.kickoffInSec)}${g.venue ? ' · ' + g.venue : ''}`}
                </div>
              </div>
              {isLive ? (
                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full shrink-0"
                  style={{ background: 'rgba(220,38,38,0.95)', boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.25), 0 0 12px rgba(220,38,38,0.45)' }}>
                  <span className="w-1.5 h-1.5 rounded-full bg-white anim-pulse-dot" />
                  <span className="sf text-[9.5px] tracking-[0.14em] font-bold uppercase text-white">Live</span>
                </div>
              ) : imminent ? (
                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full shrink-0"
                  style={{ background: 'rgba(0,214,254,0.18)', border: '1px solid rgba(0,214,254,0.50)', boxShadow: '0 0 12px rgba(0,214,254,0.30)' }}>
                  <span className="w-1.5 h-1.5 rounded-full anim-pulse-dot" style={{ background: 'var(--brand-cyan)' }} />
                  <span className="sf text-[9.5px] tracking-[0.14em] font-bold uppercase" style={{ color: 'var(--brand-cyan-text)' }}>Starting soon</span>
                </div>
              ) : (
                <div className="inline-flex items-center px-2.5 py-1 rounded-full shrink-0"
                  style={{ background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.14)' }}>
                  <span className="sf text-[9.5px] tracking-[0.14em] font-bold uppercase" style={{ color: 'rgba(255,255,255,0.55)' }}>Upcoming</span>
                </div>
              )}
            </button>
          );
        })}
      </div>
    </CaptureSheet>
  );
};

/* CaptureCameraStep — full-bleed mock camera. Mode toggle at top
   (Photo / Video-V / Video-H), preview area in the middle (gradient
   placeholder since we don't have real camera), big record button at
   bottom, captured count + Done CTA. */
const CaptureCameraStep = ({ pending, onCapture, onDone, onBack, onClose }) => {
  const [mode, setMode] = useState('video');
  /* Recording state — only meaningful in video mode. Photo mode captures
     instantly on tap. Video mode is a record/stop toggle: first tap
     starts recording (red disc morphs to a square + timer ticks), second
     tap stops and adds the capture to the pending list. */
  const [recording, setRecording] = useState(false);
  const [recSeconds, setRecSeconds] = useState(0);
  useEffect(() => {
    if (!recording) return;
    const t = setInterval(() => setRecSeconds(s => s + 1), 1000);
    return () => clearInterval(t);
  }, [recording]);
  /* Two modes only — Photo + Video. Vertical-vs-horizontal video used
     to be two separate pills, but the distinction was confusing to
     demo viewers (real camera apps let the phone orientation decide).
     Captures still flag video kind as 'video-v' so downstream consumers
     can change layout if needed; horizontal-video is collapsed into
     plain "Video" and would be detected from sensor orientation in
     production. */
  const MODES = [
    { key: 'photo', label: 'Photo' },
    { key: 'video', label: 'Video' },
  ];
  const HUES = [
    { a: 'rgba(0,214,254,0.40)',  b: 'rgba(132,88,255,0.32)' },
    { a: 'rgba(255,90,158,0.40)', b: 'rgba(255,140,40,0.30)' },
    { a: 'rgba(74,222,128,0.36)', b: 'rgba(0,170,220,0.30)' },
    { a: 'rgba(255,210,80,0.36)', b: 'rgba(255,90,50,0.30)' },
  ];
  const fmtRecTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const addCapture = (kindFinal) => {
    const hue = HUES[pending.length % HUES.length];
    onCapture({
      id: 'cap_local_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      kind: kindFinal,
      hue,
      caption: '',
    });
  };
  const handleCapture = () => {
    if (mode === 'photo') {
      addCapture('photo');
    } else {
      if (recording) {
        // Stop recording → finalize as 'video-v' capture
        addCapture('video-v');
        setRecording(false);
        setRecSeconds(0);
      } else {
        setRecording(true);
        setRecSeconds(0);
      }
    }
  };
  return (
    <div className="fixed inset-0 z-[110] anim-fade flex flex-col" style={{ background: '#000', color: '#fff' }}>
      {/* Top chrome — back + mode label + close + counter */}
      <div className="shrink-0 relative z-30 flex items-center justify-between px-5 pt-4 pb-3"
        style={{ background: 'linear-gradient(180deg, rgba(0,0,0,0.65) 0%, transparent 100%)' }}>
        <button onClick={onBack} aria-label="Back"
          className="w-9 h-9 rounded-full flex items-center justify-center"
          style={{ background: 'rgba(255,255,255,0.08)', color: 'rgba(255,255,255,0.85)' }}>
          <Icon name="chevL" size={12} stroke={2} />
        </button>
        <div className="sf text-[9.5px] tracking-[0.24em] uppercase font-bold" style={{ color: 'rgba(255,255,255,0.55)' }}>
          Camera
        </div>
        <button onClick={onClose} aria-label="Close"
          className="w-9 h-9 rounded-full flex items-center justify-center"
          style={{ background: 'rgba(255,255,255,0.08)', color: 'rgba(255,255,255,0.95)' }}>
          <Icon name="close" size={11} stroke={2} />
        </button>
      </div>
      {/* Camera viewfinder — gradient placeholder. Live "REC" pill if video. */}
      <div className="flex-1 relative overflow-hidden">
        <div className="absolute inset-0"
          style={{
            background:
              'radial-gradient(ellipse 70% 50% at 30% 30%, rgba(0,214,254,0.18) 0%, transparent 60%),' +
              'radial-gradient(ellipse 70% 50% at 75% 75%, rgba(132,88,255,0.14) 0%, transparent 60%),' +
              'linear-gradient(180deg, #0a0e1a 0%, #050810 100%)',
          }} />
        <div className="absolute inset-0 hatch-dark opacity-30 pointer-events-none" />
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div className="sf-display font-extrabold tracking-[-0.04em] select-none"
            style={{
              fontSize: 'clamp(80px, 16vw, 200px)',
              color: 'rgba(255,255,255,0.06)',
              letterSpacing: '-0.06em', lineHeight: 1,
            }}>HALO</div>
        </div>
        {/* Recording timer — center-top of viewfinder when recording.
            Tabular-num so digits don't jiggle as the seconds tick. */}
        {recording && (
          <div className="absolute top-4 left-1/2 -translate-x-1/2 z-20 inline-flex items-center gap-2 px-3 py-1.5 rounded-full"
            style={{ background: 'rgba(220,38,38,0.95)', boxShadow: '0 0 20px rgba(220,38,38,0.55)' }}>
            <span className="w-2 h-2 rounded-full bg-white anim-pulse-dot" />
            <span className="sf-display text-[13px] tabular-nums font-bold text-white">REC {fmtRecTime(recSeconds)}</span>
          </div>
        )}
        {/* Captured count badge — top-right (suppressed while recording so
            it doesn't compete with the REC timer). */}
        {!recording && pending.length > 0 && (
          <div className="absolute top-4 end-5 z-20 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full"
            style={{ background: 'rgba(0,214,254,0.18)', border: '1px solid rgba(0,214,254,0.50)' }}>
            <span className="w-1.5 h-1.5 rounded-full anim-pulse-dot" style={{ background: 'var(--brand-cyan)' }} />
            <span className="sf text-[11px] tabular-nums font-bold" style={{ color: 'var(--brand-cyan-text)' }}>{pending.length} captured</span>
          </div>
        )}
      </div>
      {/* Bottom dock — mode toggle + record button + done.
          While recording: hide mode toggle (can't switch mid-record) and
          hide Done (must stop the recording first). Stopping flushes the
          capture to pending and re-enables everything. */}
      <div className="shrink-0 relative z-30 px-5 pt-3 pb-6"
        style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.75) 60%, #000 100%)' }}>
        {/* Mode toggle pills — only when NOT recording */}
        {!recording && (
          <div className="flex justify-center gap-2 mb-5">
            {MODES.map(m => (
              <button key={m.key} onClick={() => setMode(m.key)}
                className="sf text-[11px] tracking-[0.12em] uppercase font-bold px-3.5 py-2 rounded-full transition-all"
                style={{
                  color: mode === m.key ? '#0a0d18' : 'rgba(255,255,255,0.75)',
                  background: mode === m.key ? '#fff' : 'rgba(255,255,255,0.08)',
                  border: '1px solid ' + (mode === m.key ? '#fff' : 'rgba(255,255,255,0.14)'),
                }}>
                {m.label}
              </button>
            ))}
          </div>
        )}
        {/* Record row: spacer | record/stop | done. When recording, the
            inner red disc morphs to a small rounded square (iOS-Camera
            style "stop" affordance). Tap = stop + add capture. */}
        <div className="flex items-center justify-between max-w-[400px] mx-auto">
          <div className="w-14" />
          <button onClick={handleCapture} aria-label={recording ? 'Stop recording' : (mode === 'photo' ? 'Take photo' : 'Start recording')}
            className="w-[72px] h-[72px] rounded-full flex items-center justify-center transition-all active:scale-[0.92]"
            style={{
              background: '#fff',
              boxShadow: recording
                ? '0 0 0 4px rgba(255,54,54,0.35), 0 0 32px rgba(255,54,54,0.55)'
                : '0 0 0 4px rgba(255,255,255,0.12), 0 0 24px rgba(255,54,54,0.20)',
            }}>
            {/* Inner shape morphs based on mode + recording state */}
            {mode === 'photo' ? (
              /* Photo: solid white inner disc with thin dark ring */
              <div className="w-[54px] h-[54px] rounded-full"
                style={{ background: '#fff', border: '2px solid rgba(0,0,0,0.12)' }} />
            ) : recording ? (
              /* Video + recording: small red rounded square (iOS-Camera stop) */
              <div className="transition-all"
                style={{
                  width: 26, height: 26, borderRadius: 6,
                  background: 'linear-gradient(180deg, #ff3636 0%, #c81e1e 100%)',
                  boxShadow: '0 0 12px rgba(255,54,54,0.55)',
                }} />
            ) : (
              /* Video + idle: full red disc */
              <div className="w-[54px] h-[54px] rounded-full"
                style={{ background: 'linear-gradient(180deg, #ff3636 0%, #c81e1e 100%)' }} />
            )}
          </button>
          {!recording && pending.length > 0 ? (
            <button onClick={onDone} className="sf text-[13px] font-bold px-4 py-2.5 squircle-sm"
              style={{ background: 'rgba(255,255,255,0.14)', color: '#fff', border: '1px solid rgba(255,255,255,0.20)' }}>
              Done
            </button>
          ) : <div className="w-14" />}
        </div>
      </div>
    </div>
  );
};

/* CaptureReviewStep — vertical list of captured clips. Each row has:
   thumb (gradient hue), kind label, tag-player chip → opens picker,
   privacy toggle (Private/Public), delete. Bottom CTA "Publish N". */
const CaptureReviewStep = ({ pending, gameId, onPublish, onBack, onClose, onUpdatePending, onDeleteLocal }) => {
  const [pickerForId, setPickerForId] = useState(null);
  const game = SEED_GAMES.find(g => g.id === gameId);
  // Roster — derive from PLAYER + a few teammates. In production this
  // would come from the game's team roster API.
  const ROSTER = [
    { id: 'r1', name: 'Tal Weiss',    number: 7,  team: 'Varsity' },
    { id: 'r2', name: 'Sarah Kim',    number: 12, team: 'Varsity' },
    { id: 'r3', name: 'Dylan Torres', number: 23, team: 'Varsity' },
    { id: 'r4', name: 'Marcus Lee',   number: 9,  team: 'Varsity' },
  ];
  const pickedFor = pickerForId ? pending.find(p => p.id === pickerForId) : null;
  /* Summary chips at the top of the review — give the user a sense of
     scale before they scan the list. Counts derived once from pending. */
  const photoCount = pending.filter(c => c.kind === 'photo').length;
  const videoCount = pending.filter(c => c.kind !== 'photo').length;
  const taggedCount = pending.filter(c => c.taggedPlayerId).length;
  const publicCount = pending.filter(c => c.privacy === 'public').length;
  return (
    <>
    <CaptureSheet stepLabel="Capture · Review" stepCount={4} currentStep={4} onBack={onBack} onClose={onClose}
      dock={
        <button onClick={onPublish} disabled={pending.length === 0}
          className="w-full squircle-md py-3.5 sf text-[14px] font-bold transition-all"
          style={{
            color: pending.length === 0 ? 'rgba(255,255,255,0.40)' : '#0a0d18',
            background: pending.length === 0 ? 'rgba(255,255,255,0.06)' : 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            border: pending.length === 0 ? '1px solid rgba(255,255,255,0.10)' : 'none',
            boxShadow: pending.length === 0 ? 'none' : '0 8px 24px -8px rgba(0,214,254,0.55), inset 0 1px 0 rgba(255,255,255,0.40)',
          }}>
          {pending.length === 0 ? 'No captures' : `Publish ${pending.length} ${pending.length === 1 ? 'capture' : 'captures'}`}
        </button>
      }>
      {/* Editorial header — eyebrow + hero headline + summary chips.
          The summary chips replace the prior "Tag a player, set privacy"
          subtitle with concrete counts so the user knows what they're
          reviewing at a glance. */}
      <div className="mb-6">
        <div className="sf text-[10px] tracking-[0.24em] uppercase font-bold mb-2" style={{ color: 'var(--brand-cyan-text)' }}>
          Final step
        </div>
        <h1 className="sf-display text-[28px] lg:text-[36px] font-bold leading-[1.02] tracking-[-0.025em] mb-2 text-white">
          Review &amp; share
        </h1>
        <p className="sf text-[13px] lg:text-[14px] leading-relaxed" style={{ color: 'rgba(255,255,255,0.55)' }}>
          {game ? `${game.home} vs ${game.away}` : 'This game'} — tag a player and set privacy. Captures stay yours forever.
        </p>
        <div className="flex flex-wrap items-center gap-2 mt-4">
          <SummaryChip count={pending.length} label={pending.length === 1 ? 'capture' : 'captures'} accent="brand" />
          {videoCount > 0 && <SummaryChip count={videoCount} label={videoCount === 1 ? 'video' : 'videos'} />}
          {photoCount > 0 && <SummaryChip count={photoCount} label={photoCount === 1 ? 'photo' : 'photos'} />}
          {taggedCount > 0 && <SummaryChip count={taggedCount} label={taggedCount === 1 ? 'tagged' : 'tagged'} />}
          {publicCount > 0 && <SummaryChip count={publicCount} label="public" accent="success" />}
        </div>
      </div>

      <div className="space-y-5">
        {pending.map((cap, idx) => {
          const player = cap.taggedPlayerId ? ROSTER.find(p => p.id === cap.taggedPlayerId) : null;
          const isPublic = cap.privacy === 'public';
          const isVideo = cap.kind !== 'photo';
          const isHoriz = cap.kind === 'video-h';
          /* Each capture renders as an editorial card:
              · Big preview (full width, aspect-ratio matches kind)
              · Index pill top-left "01 / 03"
              · Kind chip top-right with duration for video
              · Caption input — editable, defaults to placeholder
              · Tag player CTA — primary action, full width
              · Privacy segmented toggle + delete (secondary)
             Stacks vertically with proper breathing room (space-y-5). */
          return (
            <div key={cap.id} className="squircle-md overflow-hidden anim-fade"
              style={{
                background: 'linear-gradient(180deg, rgba(255,255,255,0.045) 0%, rgba(255,255,255,0.02) 100%)',
                border: '1px solid rgba(255,255,255,0.10)',
                boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 24px -12px rgba(0,0,0,0.45)',
              }}>
              {/* Big preview */}
              <div className="relative w-full overflow-hidden"
                style={{
                  aspectRatio: isHoriz ? '16 / 9' : (cap.kind === 'photo' ? '4 / 3' : '9 / 12'),
                  background: `radial-gradient(ellipse 70% 50% at 30% 30%, ${cap.hue.a} 0%, transparent 60%), radial-gradient(ellipse 70% 50% at 75% 75%, ${cap.hue.b} 0%, transparent 60%), linear-gradient(180deg, #0a0e1a 0%, #050810 100%)`,
                }}>
                <div className="absolute inset-0 hatch-dark opacity-30 pointer-events-none" />
                {/* HALO monogram poster — same pattern as other capture
                    surfaces so previews don't look like dead gradients. */}
                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                  <span className="sf-display font-extrabold tracking-[-0.04em] select-none"
                    style={{
                      fontSize: 'clamp(60px, 14vw, 160px)',
                      color: 'rgba(255,255,255,0.05)',
                      letterSpacing: '-0.06em', lineHeight: 1,
                    }}>HALO</span>
                </div>
                {/* Index pill — "01 / 03" — top-left */}
                <div className="absolute top-3 start-3 lg-glass-strong squircle-sm px-2 py-1 z-10">
                  <span className="sf text-[10px] tabular-nums tracking-tight font-bold leading-none text-white">
                    {String(idx + 1).padStart(2, '0')}<span style={{ color: 'rgba(255,255,255,0.45)' }}>/{String(pending.length).padStart(2, '0')}</span>
                  </span>
                </div>
                {/* Kind chip + duration — top-right */}
                <div className="absolute top-3 end-3 z-10 inline-flex items-center gap-1.5 lg-glass-strong squircle-sm px-2 py-1">
                  {isVideo ? (
                    <>
                      <svg width={10} height={10} viewBox="0 0 14 14" fill="currentColor" style={{ color: '#fff' }}>
                        <path d="M2 2 H10 V12 H2 Z M11 4 L13 3 V11 L11 10 Z" />
                      </svg>
                      <span className="sf text-[9.5px] tabular-nums font-bold leading-none text-white">
                        0:{String(Math.floor(Math.random() * 20 + 6)).padStart(2, '0')}
                      </span>
                    </>
                  ) : (
                    <>
                      <svg width={10} height={10} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={1.6}>
                        <rect x={2} y={3} width={10} height={8} rx={1} stroke="#fff" />
                        <circle cx={7} cy={7} r={2} stroke="#fff" />
                      </svg>
                      <span className="sf text-[9.5px] tracking-[0.14em] uppercase font-bold leading-none text-white">
                        Photo
                      </span>
                    </>
                  )}
                </div>
                {/* Center play affordance for video previews */}
                {isVideo && (
                  <div className="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
                    <div className="w-14 h-14 rounded-full flex items-center justify-center"
                      style={{
                        background: 'rgba(8,12,20,0.62)',
                        backdropFilter: 'blur(20px) saturate(180%)',
                        WebkitBackdropFilter: 'blur(20px) saturate(180%)',
                        border: '1px solid rgba(255,255,255,0.20)',
                        boxShadow: '0 0 24px rgba(0,214,254,0.30), 0 8px 20px -6px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.25)',
                      }}>
                      <svg width={16} height={20} viewBox="0 0 14 16" fill="white"
                        style={{ marginInlineStart: 2 }}>
                        <path d="M0 1.5v13c0 1 1.1 1.55 1.9 1.05l11-6.5c.8-.5.8-1.7 0-2.2l-11-6.5C1.1 -.05 0 .5 0 1.5z" />
                      </svg>
                    </div>
                  </div>
                )}
                {/* Bottom-fade caption preview — readable on top of any
                    capture hue. Picks up the user's caption (or a hint). */}
                <div className="absolute inset-x-0 bottom-0 px-4 pt-12 pb-3 z-10"
                  style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.78) 70%, rgba(0,0,0,0.92) 100%)' }}>
                  <div className="sf-display text-white text-[15px] font-bold leading-tight tracking-[-0.01em] truncate">
                    {cap.caption || 'Untitled capture'}
                  </div>
                </div>
              </div>

              {/* Card body — controls */}
              <div className="p-4 space-y-3">
                {/* Caption input */}
                <div>
                  <label className="sf text-[9.5px] tracking-[0.16em] uppercase font-bold block mb-1.5" style={{ color: 'rgba(255,255,255,0.45)' }}>
                    Caption
                  </label>
                  <input type="text" value={cap.caption || ''}
                    onChange={(e) => onUpdatePending(cap.id, { caption: e.target.value })}
                    placeholder="Add a caption…"
                    className="w-full bg-transparent border-0 outline-none sf text-[15px] font-semibold leading-tight"
                    style={{ color: '#fff' }} />
                  <div className="h-px mt-2" style={{ background: 'rgba(255,255,255,0.10)' }} />
                </div>

                {/* Tag player — primary action */}
                <button onClick={() => setPickerForId(cap.id)}
                  className="w-full squircle-sm px-3.5 py-3 flex items-center gap-3 text-start transition-all hover:scale-[1.005] active:scale-[0.99]"
                  style={{
                    background: player ? 'rgba(0,214,254,0.10)' : 'rgba(255,255,255,0.04)',
                    border: '1px solid ' + (player ? 'rgba(0,214,254,0.50)' : 'rgba(255,255,255,0.10)'),
                  }}>
                  {player ? (
                    <>
                      <div className="w-9 h-9 squircle-sm flex items-center justify-center shrink-0 sf-display text-[13px] font-bold tabular-nums leading-none text-white"
                        style={{ background: 'rgba(0,214,254,0.25)', border: '1px solid rgba(0,214,254,0.55)' }}>
                        {player.number}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="sf text-[13px] font-bold leading-tight" style={{ color: '#7ce8ff' }}>
                          {player.name}
                        </div>
                        <div className="sf text-[10.5px] leading-tight mt-0.5" style={{ color: 'rgba(124,232,255,0.55)' }}>
                          Tagged · pending their approval
                        </div>
                      </div>
                      <span className="sf text-[10px] tracking-[0.14em] uppercase font-bold shrink-0" style={{ color: 'rgba(124,232,255,0.85)' }}>
                        Change
                      </span>
                    </>
                  ) : (
                    <>
                      <div className="w-9 h-9 squircle-sm flex items-center justify-center shrink-0"
                        style={{ background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.14)', color: 'rgba(255,255,255,0.65)' }}>
                        <Icon name="plus" size={14} stroke={2} />
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="sf text-[13px] font-bold leading-tight text-white">
                          Tag a player
                        </div>
                        <div className="sf text-[10.5px] leading-tight mt-0.5" style={{ color: 'rgba(255,255,255,0.50)' }}>
                          Optional — surfaces this clip on their profile.
                        </div>
                      </div>
                      <span className="sf text-[14px] icon-flip-rtl shrink-0" style={{ color: 'rgba(255,255,255,0.45)' }}>›</span>
                    </>
                  )}
                </button>

                {/* Privacy segmented toggle + delete */}
                <div className="flex items-center gap-2">
                  <div className="flex-1 lg-glass squircle-sm p-1 flex gap-1"
                    style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.10)' }}>
                    {[
                      { key: 'private', label: 'Private', icon: 'eye-off' },
                      { key: 'public',  label: 'Public',  icon: 'eye' },
                    ].map(opt => {
                      const active = (cap.privacy || 'private') === opt.key;
                      return (
                        <button key={opt.key} onClick={() => onUpdatePending(cap.id, { privacy: opt.key })}
                          className="flex-1 py-2 sf text-[11.5px] font-semibold tracking-tight squircle-sm transition-all inline-flex items-center justify-center gap-1.5"
                          style={active
                            ? { background: opt.key === 'public' ? 'rgba(74,222,128,0.16)' : 'rgba(255,255,255,0.10)', color: opt.key === 'public' ? '#86efac' : '#fff', boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.10)' }
                            : { color: 'rgba(255,255,255,0.55)' }}>
                          <Icon name={opt.icon} size={11} stroke={1.8} />
                          {opt.label}
                        </button>
                      );
                    })}
                  </div>
                  <button onClick={() => onDeleteLocal(cap.id)} aria-label="Delete capture"
                    className="w-10 h-10 squircle-sm flex items-center justify-center transition-all hover:scale-[1.04] active:scale-[0.94]"
                    style={{ background: 'rgba(255,90,90,0.10)', border: '1px solid rgba(255,90,90,0.30)', color: 'rgba(255,150,150,0.95)' }}>
                    <svg width={13} height={13} viewBox="0 0 14 14" fill="none" stroke="currentColor"
                      strokeWidth={1.7} strokeLinecap="round" strokeLinejoin="round"
                      style={{ width: 13, height: 13, display: 'block' }}>
                      <path d="M3 3 L11 11 M11 3 L3 11" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          );
        })}
        {pending.length === 0 && (
          <div className="squircle-md p-8 text-center"
            style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.10)' }}>
            <div className="w-12 h-12 squircle-sm mx-auto mb-3 flex items-center justify-center"
              style={{ background: 'rgba(255,255,255,0.05)', color: 'rgba(255,255,255,0.55)' }}>
              <Icon name="camera" size={20} stroke={1.6} />
            </div>
            <div className="sf-display text-[15px] font-bold text-white mb-1">Nothing captured yet</div>
            <p className="sf text-[12.5px]" style={{ color: 'rgba(255,255,255,0.55)' }}>Tap back to record some moments.</p>
          </div>
        )}
      </div>
    </CaptureSheet>
    {/* Player picker overlay — rendered on top of the review sheet
        when a tag chip is tapped. Single-select, scoped to the
        game's roster (mock here), plus a Skip-tag option. */}
    {pickerForId && (
      <div className="fixed inset-0 z-[120] anim-fade flex items-end lg:items-center justify-center"
        onClick={() => setPickerForId(null)}
        style={{ background: 'rgba(0,0,0,0.65)', backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)' }}>
        <div onClick={(e) => e.stopPropagation()}
          className="w-full lg:max-w-[420px] anim-slide-sheet"
          style={{
            background: 'linear-gradient(180deg, #0e1118 0%, #06080e 100%)',
            border: '1px solid rgba(255,255,255,0.10)',
            borderRadius: '20px 20px 0 0',
            maxHeight: '80vh',
            display: 'flex', flexDirection: 'column',
          }}>
          <div className="px-5 pt-5 pb-3 flex items-center justify-between">
            <div className="sf-display text-[16px] font-bold text-white">Tag a player</div>
            <button onClick={() => setPickerForId(null)} aria-label="Close"
              className="w-8 h-8 rounded-full flex items-center justify-center"
              style={{ background: 'rgba(255,255,255,0.08)', color: '#fff' }}>
              <Icon name="close" size={10} stroke={2} />
            </button>
          </div>
          <div className="flex-1 overflow-y-auto px-3 pb-4">
            {/* Skip — set to null */}
            <button onClick={() => { onUpdatePending(pickerForId, { taggedPlayerId: null }); setPickerForId(null); }}
              className="w-full squircle-sm p-3 mb-2 flex items-center gap-3 text-start"
              style={{
                background: pickedFor && !pickedFor.taggedPlayerId ? 'rgba(255,255,255,0.10)' : 'transparent',
                border: '1px solid rgba(255,255,255,0.10)',
              }}>
              <div className="w-9 h-9 squircle-sm flex items-center justify-center shrink-0"
                style={{ background: 'rgba(255,255,255,0.05)', color: 'rgba(255,255,255,0.55)' }}>
                <Icon name="close" size={12} stroke={1.8} />
              </div>
              <span className="sf text-[13px] font-semibold text-white">No tag — just the moment</span>
            </button>
            {ROSTER.map(p => {
              const selected = pickedFor && pickedFor.taggedPlayerId === p.id;
              return (
                <button key={p.id} onClick={() => { onUpdatePending(pickerForId, { taggedPlayerId: p.id }); setPickerForId(null); }}
                  className="w-full squircle-sm p-3 mb-2 flex items-center gap-3 text-start transition-all"
                  style={{
                    background: selected ? 'rgba(0,214,254,0.12)' : 'transparent',
                    border: '1px solid ' + (selected ? 'rgba(0,214,254,0.45)' : 'rgba(255,255,255,0.08)'),
                  }}>
                  <div className="w-9 h-9 squircle-sm flex items-center justify-center shrink-0 sf-display text-[12px] font-bold text-white"
                    style={{ background: 'rgba(0,214,254,0.18)', border: '1px solid rgba(0,214,254,0.40)' }}>
                    {p.number}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="sf-display text-[13.5px] font-bold leading-tight text-white">{p.name}</div>
                    <div className="sf text-[10.5px] mt-0.5" style={{ color: 'rgba(255,255,255,0.55)' }}>#{p.number} · {p.team}</div>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    )}
    </>
  );
};

/* CaptureFlow — orchestrator. Reads `step` to decide which sub-screen
   to render. Manages pending captures via captureSession. Routes step
   transitions via hash + setCaptureSession side effects. */
const CaptureFlow = ({ step, captureSession, setCaptureSession, addCaptures, onClose, navigate }) => {
  if (!step) return null;
  if (step === 'permissions') {
    return <CapturePermissionsStep
      onClose={onClose}
      onContinue={() => navigate('capture/pick-game')} />;
  }
  if (step === 'pick-game') {
    return <CapturePickGameStep
      onClose={onClose}
      onBack={() => navigate('capture')}
      onPick={(id) => { setCaptureSession({ gameId: id, pending: [] }); navigate('capture/camera'); }} />;
  }
  if (step === 'camera') {
    return <CaptureCameraStep
      pending={captureSession.pending || []}
      onCapture={(cap) => setCaptureSession(s => ({ ...s, pending: [...(s.pending || []), cap] }))}
      onDone={() => navigate('capture/review')}
      onBack={() => navigate('capture/pick-game')}
      onClose={onClose} />;
  }
  if (step === 'review') {
    return <CaptureReviewStep
      pending={captureSession.pending || []}
      gameId={captureSession.gameId}
      onClose={onClose}
      onBack={() => navigate('capture/camera')}
      onUpdatePending={(id, patch) => setCaptureSession(s => ({
        ...s, pending: s.pending.map(p => p.id === id ? { ...p, ...patch } : p),
      }))}
      onDeleteLocal={(id) => setCaptureSession(s => ({
        ...s, pending: s.pending.filter(p => p.id !== id),
      }))}
      onPublish={() => {
        const finalized = (captureSession.pending || []).map(p => ({
          ...p,
          gameId: captureSession.gameId,
          privacy: p.privacy || 'private',
          taggedPlayerId: p.taggedPlayerId || null,
          tagApprovalStatus: p.taggedPlayerId ? 'pending' : null,
          capturedBy: 'You',
          capturedAt: Date.now(),
        }));
        addCaptures(finalized);
        setCaptureSession({ gameId: null, pending: [] });
        /* Land on Profile (not Home) so the user immediately sees their
           new captures in the "My captures" rail. The Bell badge surfaces
           any pending tag-approval cards for review. */
        navigate('profile');
