/* VsPosterCard — split-versus card used on the Full games and
   Suggestions rails (Game highlights keeps the real-frame PosterCard
   since the action still IS the highlight). Layout: 50/50 vertical
   split, each half tinted with that team's TEAMS_DB accentA at higher
   alpha for solid color blocks; crest disc + "VS" pill at the seam;
   bottom strip carries the matchup line + final score. No play button
   per the user spec — the split-color treatment is the visual hook
   and the card affordance is implicit. */
const VsPosterCard = ({ game, big = false, onClick, width, height, eyebrow, subtitle, hideText = false }) => {
  /* Default sizing follows the Watch tab convention (260x156 big,
     220x130 small). Call sites with their own footprint (e.g. the
     Home tab's Upcoming rail at 240x120) can override via
     width/height props. eyebrow + subtitle let those same call sites
     replace the default Final/Upcoming text without forking the
     whole component. */
  const W = width  != null ? width  : (big ? 260 : 220);
  const H = height != null ? height : (big ? 156 : 130);
  const homeTeam = teamByName(game.home);
  const awayTeam = teamByName(game.away);
  /* Parse a team's accentA `rgba(r,g,b,a)` so we can re-emit it at
     different alphas. Mirrors the same helper OtherPlayersSection and
     TeamStatsSection use — keeps the color logic consistent across
     the prototype's team-colored surfaces. */
  const _parse = (accent) => {
    const m = (accent || 'rgba(0,214,254,1)').match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    return { r: m ? +m[1] : 0, g: m ? +m[2] : 214, b: m ? +m[3] : 254 };
  };
  const h = _parse(homeTeam.accentA);
  const a = _parse(awayTeam.accentA);
  const isLight = (c) => (c.r + c.g + c.b) / 3 > 180;
  /* Each half painted with a top-to-bottom gradient (0.95 → 0.55 alpha)
     so the color block has depth rather than reading as flat fill —
     especially important when one team is Sesh Rigs (bone/cream) and
     a flat 1.0-alpha bone would wash out everything. */
  const homeBg = `linear-gradient(160deg, rgba(${h.r},${h.g},${h.b},0.95) 0%, rgba(${h.r},${h.g},${h.b},0.55) 100%)`;
  const awayBg = `linear-gradient(200deg, rgba(${a.r},${a.g},${a.b},0.95) 0%, rgba(${a.r},${a.g},${a.b},0.55) 100%)`;
  return (
    <button onClick={onClick}
      className="shrink-0 squircle-md relative overflow-hidden lg-shine lg-aura sf transition-transform hover:scale-[1.02]"
      style={{
        width: W, height: H,
        background: '#050810',
        boxShadow: big
          ? '0 12px 32px -10px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10)'
          : '0 8px 24px -8px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,255,255,0.08)',
        color: '#fff',
      }}>
      {/* Two halves. Each is absolutely positioned so the seam in the
         middle stays pixel-tight regardless of card width. */}
      <div className="absolute inset-y-0 start-0 pointer-events-none" style={{ width: '50%', background: homeBg }} />
      <div className="absolute inset-y-0 end-0 pointer-events-none" style={{ width: '50%', background: awayBg }} />
      {/* Diagonal seam — soft gradient between the two halves so the
         hard line doesn't read as a screenshot crop. */}
      <div className="absolute inset-y-0 pointer-events-none"
        style={{
          insetInlineStart: '42%', width: '16%',
          background: 'linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.18) 50%, transparent 100%)',
        }} />
      {/* Crests + VS row — centered both axes inside the card. The
         row is absolutely positioned to fill the card, then uses
         flex centering, so the trio (crest · VS · crest) sits in the
         optical middle regardless of card aspect.
         Crests render as direct images clipped to a circle — no
         nested disc-inside-disc treatment (TeamCrest's default
         renders the logo on its own white square, which looked
         like a square-in-a-circle here). The logo PNGs already
         have white padding bg baked in, so a circular crop reads
         as a clean coin. */}
      <div className="absolute inset-0 flex items-center justify-center gap-5 z-10"
        style={{ paddingBottom: hideText ? 0 : 36 }}>
        <div className="rounded-full overflow-hidden flex items-center justify-center shrink-0"
          style={{
            /* Crest auto-shrinks for shorter cards: take 60% of the
               available vertical space (card height minus the bottom
               strip ~36px if it's rendered) and cap at the canonical
               size for this variant. Lets 240x120 Home upcoming cards
               render ~50px crests while the 260x156 Watch big still
               gets 72px. When hideText is true, the full card height
               is available so crests can grow further. */
            width: Math.min(big ? 72 : 60, Math.round((H - (hideText ? 0 : 36)) * 0.6)),
            height: Math.min(big ? 72 : 60, Math.round((H - (hideText ? 0 : 36)) * 0.6)),
            background: '#fff',
            border: '1px solid rgba(255,255,255,0.35)',
            boxShadow: '0 4px 14px rgba(0,0,0,0.30)',
          }}>
          {homeTeam.src
            ? <img src={homeTeam.src} alt="" className="w-full h-full" style={{ objectFit: 'cover' }} />
            : <span className="sf-display font-bold text-[20px]" style={{ color: '#0a0d18' }}>{homeTeam.initial}</span>}
        </div>
        <span className="sf-display font-bold text-white shrink-0"
          style={{
            fontSize: big ? 17 : 14,
            letterSpacing: '0.04em',
            textShadow: '0 1px 6px rgba(0,0,0,0.55), 0 0 14px rgba(0,0,0,0.35)',
          }}>VS</span>
        <div className="rounded-full overflow-hidden flex items-center justify-center shrink-0"
          style={{
            /* Crest auto-shrinks for shorter cards: take 60% of the
               available vertical space (card height minus the bottom
               strip ~36px if it's rendered) and cap at the canonical
               size for this variant. Lets 240x120 Home upcoming cards
               render ~50px crests while the 260x156 Watch big still
               gets 72px. When hideText is true, the full card height
               is available so crests can grow further. */
            width: Math.min(big ? 72 : 60, Math.round((H - (hideText ? 0 : 36)) * 0.6)),
            height: Math.min(big ? 72 : 60, Math.round((H - (hideText ? 0 : 36)) * 0.6)),
            background: '#fff',
            border: '1px solid rgba(255,255,255,0.35)',
            boxShadow: '0 4px 14px rgba(0,0,0,0.30)',
          }}>
          {awayTeam.src
            ? <img src={awayTeam.src} alt="" className="w-full h-full" style={{ objectFit: 'cover' }} />
            : <span className="sf-display font-bold text-[20px]" style={{ color: '#0a0d18' }}>{awayTeam.initial}</span>}
        </div>
      </div>
      {/* Optional eyebrow pill — top-start. Used by the Home tab's
         Upcoming rail to surface "UPCOMING" before the user has seen
         the bottom-strip subtitle. Watch tab call sites omit this
         (the rail title already communicates state). */}
      {eyebrow && (
        <div className="absolute top-3 start-3 lg-glass squircle-sm px-2 py-0.5 z-10">
          <span className="sf text-[9.5px] font-semibold tracking-[0.12em] uppercase leading-none" style={{ color: '#fff' }}>{eyebrow}</span>
        </div>
      )}
      {/* Bottom strip — only rendered when hideText is false. Call sites
         that want a pure logo-vs-logo card (e.g. the Home Upcoming rail
         where the SectionLabel already says 'Following · upcoming' and
         the eyebrow pill says 'UPCOMING') pass hideText so the card
         stays focused on team identity. */}
      {!hideText && (
        <div className="absolute inset-x-0 bottom-0 px-3 pt-6 pb-3 z-10"
          style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.85) 100%)' }}>
          <div className={`sf-display font-bold leading-tight tracking-[-0.01em] truncate text-start ${big ? 'text-[14px]' : 'text-[12.5px]'}`}>
            {game.home} vs {game.away}
          </div>
          <div className={`sf font-semibold leading-tight mt-0.5 text-start tabular-nums tracking-[0.01em] ${big ? 'text-[11.5px]' : 'text-[11px]'}`}
            style={{ color: 'rgba(255,255,255,0.85)' }}>
            {subtitle != null ? (
              subtitle
            ) : game.scoreHome != null ? (
              <>
                {game.scoreHome}–{game.scoreAway}<span style={{ color: 'rgba(255,255,255,0.55)', fontWeight: 500 }}> · Final</span>
              </>
            ) : (
              <span style={{ color: 'rgba(255,255,255,0.55)', fontWeight: 500, letterSpacing: '0.10em', textTransform: 'uppercase' }}>Upcoming</span>
            )}
          </div>
        </div>
      )}
    </button>
  );
};

/* WatchVThumb — vertical 9:16 highlight card for Player highlights rail.
   Size variants: sm/md/lg/xl with phone+desktop widths via static Tailwind
   responsive classes (lg: bumps the card up one step at 1280px+, matching
   the DS spec). Empty top corners, center PlayButton, bottom: title + game
   label + duration. Direct port of DS screens/watch/_shared.tsx VThumb. */
const VTHUMB_CLASSES = {
  sm: 'w-[92px]  h-[164px] lg:w-[120px] lg:h-[213px]',
  md: 'w-[120px] h-[213px] lg:w-[160px] lg:h-[284px]',
  lg: 'w-[156px] h-[277px] lg:w-[200px] lg:h-[356px]',
  xl: 'w-[196px] h-[349px] lg:w-[240px] lg:h-[427px]',
};
const WatchVThumb = ({ moment, size = 'md', onClick }) => {
  const game = SEED_GAMES.find(g => g.id === moment.gameId);
  const gameLabel = game ? `${game.home} vs ${game.away}` : moment.sub || '';
  const durationStr = moment.dur != null ? `0:${String(moment.dur).padStart(2, '0')}` : null;
  const sizeCls = VTHUMB_CLASSES[size] || VTHUMB_CLASSES.md;
  return (
    <button onClick={onClick} className={`relative shrink-0 overflow-hidden squircle-md lg-aura lg-shine transition-transform hover:scale-[1.02] ${sizeCls}`}
      style={{
        background: 'radial-gradient(ellipse 75% 65% at 25% 25%, rgba(0,214,254,0.20) 0%, transparent 60%), radial-gradient(ellipse 75% 65% at 80% 80%, rgba(132,88,255,0.16) 0%, transparent 60%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)',
        border: '1px solid var(--glass-card-border)',
        backdropFilter: 'blur(36px) saturate(180%)',
        WebkitBackdropFilter: 'blur(36px) saturate(180%)',
        boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
        color: '#fff',
      }}>
      {/* Poster — real frame from the underlying clip. Player clip
         posters are now 540×962 portrait (matches the 9:16 thumb shape
         natively — earlier MP4s were stored as 1920×1080 with SAR
         101:320 so they actually DISPLAY as portrait, and the
         regenerated posters apply the SAR). object-fit:cover fills
         the thumb edge-to-edge with no crop loss. */}
      {moment.poster ? (
        <>
          <img src={moment.poster} alt=""
            className="absolute inset-0 w-full h-full"
            style={{ objectFit: 'cover', objectPosition: 'center' }} />
        </>
      ) : (
        <div className="absolute inset-0 hatch opacity-40" />
      )}
      <div className="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
        <PlayButton />
      </div>
      <div className="absolute inset-x-0 bottom-0 px-3 pt-9 pb-3 z-10"
        style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 60%, rgba(0,0,0,0.95) 100%)' }}>
        <div className="sf-display text-[13px] font-bold leading-tight tracking-[-0.01em] text-start clip2">{moment.title || 'Highlight'}</div>
        <div className="sf text-[11px] font-semibold leading-tight mt-0.5 text-start truncate" style={{ color: 'rgba(255,255,255,0.80)' }}>
          {gameLabel}
          {durationStr && <span style={{ color: 'rgba(255,255,255,0.55)', fontWeight: 500 }}> · {durationStr}</span>}
        </div>
      </div>
    </button>
  );
};

/* FeaturedHero — phone hero. 62vh full-bleed, video bg + scrim that fades
   into the canvas color. LIVE pill (red) or LAST MATCH pill (glass).
   Bottom-anchored content cluster. Direct port of DS FeaturedHero.
   selectedState scopes the hero to the user's active state pick —
   without it the hero always showed QLD's gL even when the user
   switched the state pill to VIC or SA. */
const FeaturedHero = ({ onWatch, selectedState = 'QLD' }) => {
  const programs = WATCH_PROGRAMS_BY_STATE[selectedState] || [];
  const stateGameIds = new Set(programs.flatMap(p => p.games || []));
  const inState = (g) => stateGameIds.has(g.id);
  const liveGame = SEED_GAMES.find(g => g.status === 'live' && inState(g));
  const lastGame = SEED_GAMES.find(g => (g.status === 'just-ended' || g.status === 'final') && inState(g));
  const isLive = !!liveGame;
  const game = liveGame ?? lastGame;
  if (!game) return null;
  /* Eyebrow text — look up the program in the current state that
     owns this game. Was hardcoded 'Senior Domestic · Thursday Men D'
     (QLD's program) regardless of state, which read wrong after the
     state filter started picking VIC/SA games. Falls back to a state
     name string if no program owns the game (shouldn't happen but
     keeps the chrome stable). */
  const owningProgram = programs.find(p => p.games && p.games.includes(game.id));
  const eyebrowText = owningProgram
    ? `${owningProgram.name} · ${owningProgram.sub}`
    : stateName(selectedState);
  const theme = stateTheme(selectedState);
  return (
    <div className="relative w-full"
      style={{
        overflow: 'clip',
        minHeight: '62vh',
        background: theme.atmosphere,
      }}>
      {/* Atmosphere video — same clips/atmosphere_loop.mp4 the desktop
         hero uses (20s mid-game trim of condensed_game.mp4). Phone
         layout is bottom-anchored with content over a full-bleed
         video, so we keep the existing brightness/saturate filter
         (no right-anchor or blur — phone doesn't have the
         left-side-text breathing room that desktop's scrim creates,
         the bottom-fade scrim below handles legibility instead). */}
      <video src="clips/atmosphere_loop.mp4" autoPlay muted loop playsInline preload="auto" aria-hidden="true"
        className="absolute inset-0 w-full h-full object-cover pointer-events-none"
        style={{
          filter: 'brightness(0.55) saturate(0.7)',
        }} />
      {/* State-themed bottom scrim — was a neutral dark gradient
         for text legibility; now tinted in the selected state's
         scrim color (QLD maroon, VIC navy, SA blue→red sweep).
         Default cyan/purple states fall back to the original
         neutral fade. */}
      <div className="absolute inset-0 pointer-events-none"
        style={{ background: theme.scrim }} />
      <div className="absolute inset-x-0 bottom-0 z-10 px-4 pb-3">
        {/* LIVE / Last match pill stacked ABOVE the program eyebrow
           line on its own row — per spec the live state should read
           as a primary affordance, not as a tag next to the program
           name. */}
        <div className="flex flex-col items-start gap-2 mb-2">
          {isLive ? (
            <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full"
              style={{ background: 'rgba(220,38,38,0.95)', boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.25), 0 0 16px rgba(220,38,38,0.50)' }}>
              <div className="w-1.5 h-1.5 rounded-full anim-pulse-dot"
                style={{ background: theme.liveDot, boxShadow: `0 0 6px ${theme.liveDot}` }} />
              <span className="sf text-[9.5px] tracking-[0.16em] font-bold uppercase text-white">Live now</span>
            </div>
          ) : (
            <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full"
              style={{ background: 'rgba(255,255,255,0.16)', backdropFilter: 'blur(20px) saturate(160%)', WebkitBackdropFilter: 'blur(20px) saturate(160%)', border: '1px solid rgba(255,255,255,0.20)' }}>
              <span className="sf text-[9.5px] tracking-[0.16em] font-bold uppercase text-white">Last match</span>
            </div>
          )}
          <span className="sf text-[9.5px] tracking-[0.14em] uppercase font-semibold" style={{ color: 'var(--text-tertiary)' }}>
            {eyebrowText}
          </span>
        </div>
        <h1 className="sf-display font-bold leading-[0.95] tracking-[-0.025em] text-white" style={{ fontSize: 36 }}>
          {game.home} vs<br />
          <span style={{ color: 'rgba(255,255,255,0.85)' }}>{game.away}</span>
        </h1>
        <div className="sf text-[12.5px] mt-2" style={{ color: 'var(--text-tertiary)' }}>
          {game.scoreHome != null ? `${game.scoreHome} — ${game.scoreAway}` : (isLive ? game.period : 'Upcoming')}
          {/* Moments count suppressed during LIVE state — a running
             clip count next to a live score reads as a stat that
             ticks up, which it doesn't. Shown only for ended games. */}
          {!isLive && game.momentsCount ? ` · ${game.momentsCount} moments` : ''}
        </div>
        <button onClick={() => onWatch(game.id, isLive)}
          className="mt-3 lg-btn-primary lg-shine squircle-md sf font-bold text-[13px] flex items-center gap-2 px-5 py-3">
          <svg width={12} height={14} viewBox="0 0 12 14" fill="currentColor"><path d="M0 1.2v11.6c0 .9 1 1.4 1.7 1l9.6-5.8c.7-.4.7-1.5 0-1.9L1.7.2C1 -.2 0 .3 0 1.2z" /></svg>
          {isLive ? 'Watch live' : 'Watch full game'}
        </button>
      </div>
    </div>
  );
};

/* WatchHeroDesktop — 70vh cinematic full-bleed. Two CTAs side-by-side
   (Watch Live primary + More info glass). Video uses mix-blend-mode
   luminosity for the Netflix-ambient treatment. Direct port.
   selectedState scopes the hero pick to the user's current state —
   mirror of the same fix in FeaturedHero. */
const WatchHeroDesktop = ({ onWatch, selectedState = 'QLD' }) => {
  const programs = WATCH_PROGRAMS_BY_STATE[selectedState] || [];
  const stateGameIds = new Set(programs.flatMap(p => p.games || []));
  const inState = (g) => stateGameIds.has(g.id);
  const liveGame = SEED_GAMES.find(g => g.status === 'live' && inState(g));
  const lastGame = SEED_GAMES.find(g => (g.status === 'just-ended' || g.status === 'final') && inState(g));
  const isLive = !!liveGame;
  const game = liveGame ?? lastGame;
  if (!game) return null;
  const owningProgram = programs.find(p => p.games && p.games.includes(game.id));
  const eyebrowText = owningProgram
    ? `${owningProgram.name} · ${owningProgram.sub} · Rowland Cowan`
    : stateName(selectedState);
  const theme = stateTheme(selectedState);
  return (
    <div className="relative w-full"
      style={{
        overflow: 'clip',
        minHeight: '52vh',
        maxHeight: 560,
        background: theme.atmosphere,
      }}>
      {/* Atmosphere video — clips/atmosphere_loop.mp4 is a 20-second
         trim of clips/condensed_game (1).mp4 (t=32..52), no audio,
         scaled to 1280px and faststart-encoded so it can preload
         and start instantly. Wired here instead of the old remote
         HALO_VIDEO_URL so the demo plays a real Sesh-vs-MF clip as
         broadcast atmosphere behind the hero.
         Style picks (user elicitation, May 2026):
         - Medium prominence: opacity 0.5 + blur(10px) reads as ambient
           cinematic motion, not a foreground feature.
         - Right-side anchored: object-position right pulls the focal
           action toward where the existing horizontal scrim lets the
           image breathe. The scrim below already fades to opaque on
           the left so text stays legible.
         - brightness 0.55 / saturate 0.90 keeps enough color that the
           court reads as the court, not a grey wash. */}
      <video src="clips/atmosphere_loop.mp4" autoPlay muted loop playsInline preload="auto" aria-hidden="true"
        className="absolute inset-0 w-full h-full object-cover pointer-events-none"
        style={{
          /* Blur dropped per user feedback — the footage reads better
             sharp; the existing horizontal scrim already keeps the
             left-side text legible without softening the video. */
          filter: 'brightness(0.55) saturate(0.90)',
          opacity: 0.50,
          objectPosition: 'right center',
        }} />
      {/* Horizontal scrim — opaque at start, transparent at end. Netflix pattern. */}
      <div className="absolute inset-0 pointer-events-none"
        style={{ background: 'linear-gradient(to right, rgba(8,10,18,0.92) 0%, rgba(8,10,18,0.65) 40%, rgba(8,10,18,0.20) 75%, transparent 100%)' }} />
      {/* Bottom scrim — fades into the page canvas. State-themed
         (QLD maroon, VIC navy, SA blue→red sweep) so the bottom
         half of the hero where the title + score live takes the
         state's color identity. Default cyan/purple states keep
         the original neutral fade. */}
      <div className="absolute inset-0 pointer-events-none"
        style={{ background: theme.scrim }} />
      {/* Left-anchored content */}
      <div className="absolute inset-y-0 inset-x-0 z-10 flex flex-col justify-end px-10 xl:px-12 pb-8 max-w-[1000px]">
        {/* Same stacked treatment as the phone hero — LIVE pill on
           its own line above the program eyebrow. */}
        <div className="flex flex-col items-start gap-2 mb-2.5">
          {isLive ? (
            <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full"
              style={{ background: 'rgba(220,38,38,0.95)', boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.25), 0 0 16px rgba(220,38,38,0.50)' }}>
              <div className="w-1.5 h-1.5 rounded-full anim-pulse-dot"
                style={{ background: theme.liveDot, boxShadow: `0 0 6px ${theme.liveDot}` }} />
              <span className="sf text-[9.5px] tracking-[0.16em] font-bold uppercase text-white">Live now</span>
            </div>
          ) : (
            <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full"
              style={{ background: 'rgba(255,255,255,0.16)', backdropFilter: 'blur(20px) saturate(160%)', WebkitBackdropFilter: 'blur(20px) saturate(160%)', border: '1px solid rgba(255,255,255,0.20)' }}>
              <span className="sf text-[9.5px] tracking-[0.16em] font-bold uppercase text-white">Last match</span>
            </div>
          )}
          <span className="sf text-[10px] tracking-[0.16em] uppercase font-semibold" style={{ color: 'var(--text-tertiary)' }}>
            {eyebrowText}
          </span>
        </div>
        <h1 className="sf-display font-bold leading-[0.98] tracking-[-0.025em] text-white" style={{ fontSize: 44 }}>
          {game.home} vs<br />
          <span style={{ color: 'rgba(255,255,255,0.85)' }}>{game.away}</span>
        </h1>
        {/* Score readout — bumped from 15px to a clamp(34, 4.5vw, 52)
            tabular-num display weight so it reads as the primary
            scoreboard, not a caption. "X moments" suffix removed
            (was redundant info — moments live on the cards below). */}
        <div className="sf-display mt-2 tabular-nums font-bold tracking-[-0.025em]"
          style={{
            fontSize: 'clamp(34px, 4.5vw, 52px)',
            lineHeight: 1,
            color: '#fff',
            textShadow: '0 0 24px rgba(0,214,254,0.30)',
          }}>
          {game.scoreHome != null ? (
            <>{game.scoreHome}<span style={{ color: 'rgba(255,255,255,0.45)', margin: '0 0.35em' }}>—</span>{game.scoreAway}</>
          ) : (isLive ? game.period : 'Upcoming')}
        </div>
        <div className="flex items-center gap-2.5 mt-5">
          {/* Watch live primary CTA — More info button removed per spec
              (Bell + more-info copy didn't lead anywhere useful; the
              cards below already carry game detail). */}
          <button onClick={() => onWatch(game.id, isLive)}
            className="lg-btn-primary lg-shine squircle-md sf font-bold text-[13px] flex items-center gap-2 px-5 py-2.5">
            <svg width={12} height={14} viewBox="0 0 12 14" fill="currentColor"><path d="M0 1.2v11.6c0 .9 1 1.4 1.7 1l9.6-5.8c.7-.4.7-1.5 0-1.9L1.7.2C1 -.2 0 .3 0 1.2z" /></svg>
            {isLive ? 'Watch live' : 'Watch full game'}
          </button>
        </div>
      </div>
    </div>
  );
};

/* WatchShell — desktop layout primitive. Sticky top bar with brand +
   centered search + state switcher pill + atmosphere full-bleed +
   hero + rails column capped at 1200.
   The right-side slot used to render an "All Access" subscription
   badge, which was just chrome with no function — replaced with the
   BA state switcher pill that drives the Watch tab's per-state
   program filtering. */
const WatchShell = ({ hero, children, topBarCenter, selectedState, onSelectState }) => {
  const sweep = stateTheme(selectedState).pageSweep;
  return (
  <div data-theme="dark" className="relative min-h-screen text-white sf"
    style={{ overflowX: 'clip', ...(sweep ? { background: sweep } : {}) }}>
    {/* Atmosphere — full bleed. Suppressed for themed states because
       pageSweep handles the page background directly. */}
    {!sweep && <div className="lg-atmosphere" />}
    <div className="absolute inset-0 z-[1] pointer-events-none"
      style={{ background: 'linear-gradient(180deg, var(--vignette-corner) 0%, transparent 30%, transparent 70%, var(--vignette-corner-soft) 100%)' }} />
    {/* Sticky top bar */}
    <header className="sticky top-0 z-30"
      style={{
        background: 'linear-gradient(180deg, rgba(8,10,18,0.85) 0%, rgba(8,10,18,0.55) 70%, transparent 100%)',
        backdropFilter: 'blur(12px) saturate(160%)',
        WebkitBackdropFilter: 'blur(12px) saturate(160%)',
      }}>
      <div className="mx-auto max-w-[1200px] px-8 xl:px-12 py-3 flex items-center gap-5">
        {/* Brand slot — defaults to the HALO TV wordmark; swaps to
           the selected state's federation wordmark (Basketball
           Queensland / Victoria / SA) when that state has one
           shipped. Missing wordmark falls back to HALO TV so
           non-wired states (NSW, WA, etc.) still render. Image
           hides via onError if the file is absent. */}
        <div className="shrink-0 flex items-center" style={{ height: 48 }}>
          {(() => {
            const st = STATES_DATA.find(s => s.code === selectedState);
            if (st && st.wordmark) {
              const h = Math.round(32 * (st.wordmarkScale || 1));
              return (
                <img src={st.wordmark} alt={`${st.name} wordmark`}
                  style={{ height: h, width: 'auto', display: 'block' }}
                  onError={(e) => { e.target.style.display = 'none'; }} />
              );
            }
            return <span className="sf-display font-bold text-[18px] text-white">HALO <span className="text-halo-cyan">TV</span></span>;
          })()}
        </div>
        <div className="flex-1 min-w-0">{topBarCenter}</div>
        <div className="flex items-center gap-3 shrink-0">
          {selectedState && onSelectState && (
            <WatchStateSwitcherPill selected={selectedState} onSelect={onSelectState} />
          )}
        </div>
      </div>
    </header>
    {/* Hero — edge-to-edge */}
    <section className="relative z-10">{hero}</section>
    {/* Rails column — capped at 1200, gap-8 stacking */}
    <section className="relative z-10 mx-auto w-full max-w-[1200px] flex flex-col gap-7 pt-6 pb-12">
      {children}
    </section>
  </div>
  );
};

/* WatchSearchInput — lg-glass pill with search icon + suggestions

  const [focused, setFocused] = useState(false);
  const matches = query.trim()
    ? SEED_GAMES.filter(g =>
        g.home.toLowerCase().includes(query.toLowerCase()) ||
        g.away.toLowerCase().includes(query.toLowerCase())
      ).slice(0, 5)

    <div className="relative">
      <div className="lg-glass-strong squircle-sm h-9 px-3 flex items-center gap-2" style={{ minWidth: 200, color: '#fff' }}>
        <Icon name="search" size={14} />
        <input value={query} onChange={e => setQuery(e.target.value)}
          onFocus={() => setFocused(true)}
          onBlur={() => setTimeout(() => setFocused(false), 150)}
          placeholder="Search teams, players"
          className="auth-input sf text-[12.5px] flex-1" style={{ color: '#fff' }} />

          <button onClick={() => setQuery('')} className="opacity-65 hover:opacity-100">
            <Icon name="close" size={11} stroke={2} />

      {/* Search dropdown — was hardcoded rgba(20,22,30,0.95) which
          overrode lg-glass-strong's token-driven background and made
          the dropdown a dark island on cream in light mode. Now it
          relies entirely on lg-glass-strong's CSS for theme-aware
          surface, with text using --text-primary / --text-muted. */}
      {focused && matches.length > 0 && (
        <div className="absolute top-full inset-x-0 mt-2 lg-glass-strong squircle-md p-1 z-50">
          {matches.map(g => (
            <button key={g.id} onMouseDown={() => { onPickGame(g.id, g.status); setQuery(''); }}

              <Icon name="search" size={11} />
              <span className="sf text-[12.5px] flex-1" style={{ color: 'var(--text-primary)' }}>{g.home} vs {g.away}</span>

/* WatchRails — orchestrator for the 5 lanes. Honors activeDivision by
   filtering scope through WATCH_DIVISIONS[*].games whitelist. */
const WatchRails = ({ activeDivision, onPushGame, onPickMoment, selectedState = 'QLD' }) => {
  const programs = WATCH_PROGRAMS_BY_STATE[selectedState] || [];
  const div = activeDivision ? programs.find(d => d.id === activeDivision) : null;
  const liveGames = SEED_GAMES.filter(g => g.status === 'live');
  const ended = SEED_GAMES.filter(g => g.status === 'just-ended' || g.status === 'final');
  /* Bug fix: when no specific program is selected, rails used to fall
     back to ALL games across all states — meaning switching the state
     pill changed nothing on the page. Now build a Set of every game
     ID this state owns (union of all its programs' game lists) and
     filter the unscoped rails against it. Picking VIC shows only VIC
     games; picking SA shows only SA games. Selecting a specific
     program narrows further as before. */
  const stateGameIds = new Set(programs.flatMap(p => p.games || []));
  const scopedLive  = div
    ? liveGames.filter(g => div.games.includes(g.id))
    : liveGames.filter(g => stateGameIds.has(g.id));
  const scopedEnded = div
    ? ended.filter(g => div.games.includes(g.id))
    : ended.filter(g => stateGameIds.has(g.id));
  return (
    <>
      {scopedLive.length > 0 && (
        <WatchLane title="Live now">
          {scopedLive.map(g => <LiveCard key={g.id} game={g} onClick={() => onPushGame(g.id, 'live')} />)}
        </WatchLane>
      )}
      {/* Full games — VS split-color cards (per user spec). The
         pre-game/scheduling context is best served by team identity,
         not by a frame from inside a game that hasn't happened yet
         in the narrative. */}
      <WatchLane title="Full games">
        {scopedEnded.length > 0
          ? scopedEnded.map(g => <VsPosterCard key={g.id} game={g} big onClick={() => onPushGame(g.id, g.status)} />)
          : <EmptyScopedRail label="No full games in this division yet" />}
      </WatchLane>
      {/* Game highlights — keeps real-frame PosterCard. The content
         here IS the highlight, so showing actual basketball action
         beats a matchup card. */}
      <WatchLane title="Game highlights">
        {scopedEnded.length > 0
          ? scopedEnded.slice(0, 5).map(g => <PosterCard key={g.id} game={g} big onClick={() => onPushGame(g.id, g.status)} />)
          : <EmptyScopedRail label="No highlights yet in this division" />}
      </WatchLane>
      <WatchLane title="Player highlights">
        {SEED_MOMENTS.map((m, i) => (
          <WatchVThumb key={m.id} moment={m} onClick={() => onPickMoment(i)} />
        ))}
      </WatchLane>
      {/* Suggestions — also VS cards (these are pre-watch upsells, same
         pre-game framing as Full games). */}
      <WatchLane title="Suggestions">
        {scopedEnded.length > 0
          ? scopedEnded.slice().reverse().slice(0, 6).map(g => <VsPosterCard key={g.id} game={g} big onClick={() => onPushGame(g.id, g.status)} />)
          : <EmptyScopedRail label="Pick a different division to see suggestions" />}
      </WatchLane>
    </>
  );
};

const EmptyScopedRail = ({ label }) => (
  <div className="shrink-0 lg-glass squircle-md px-5 py-4 flex items-center" style={{ width: 260, height: 156, color: 'rgba(255,255,255,0.65)' }}>
    <span className="sf text-[12px] leading-relaxed">{label}</span>
  </div>
);

/* WatchScreen — phone + desktop trees. Phone uses absolute-positioned
   header over a 62vh FeaturedHero. Desktop uses WatchShell with
   WatchHeroDesktop slot + topBarCenter search slot. */
const WatchScreen = ({ onOpenGame, onOpenGameVideo, onPickMoment }) => {
  const [activeDivision, setActiveDivision] = useState(null);
  const [query, setQuery] = useState('');
  /* Selected BA state for the Watch tab — drives the program tiles +
     heading. Persisted to localStorage so a demo reload lands back in
     the state the user was browsing. Default QLD (Tal's home state). */
  const [selectedState, setSelectedStateInternal] = useState(loadWatchState);
  const setSelectedState = (code) => {
    setSelectedStateInternal(code);
    setActiveDivision(null); // clear the program filter when state changes
    try { localStorage.setItem(WATCH_STATE_STORAGE_KEY, code); } catch {}
  };
  /* Watch tab is a VIDEO surface. Tap routing:
     - LIVE  → GameVideoViewer (the canonical 16:9 horizontal player
               the rest of the prototype uses). Previously this
               opened a separate in-Watch LivePlayerScreen stub that
               duplicated the player surface — removed.
     - UPCOMING → PostGameScreen, which renders its PreGame variant
                  (countdown + lineups + "after tipoff" placeholders).
     - ENDED → GameVideoViewer (post-game stream playback). */
  const handlePush = (gameId, status) => {
    if (status === 'live')     { onOpenGameVideo(gameId); return; }
    if (status === 'upcoming') { onOpenGame(gameId);      return; }
    onOpenGameVideo(gameId);
  };
  const body = (
    <>
      <DivisionTileGrid active={activeDivision} onPick={setActiveDivision} selectedState={selectedState} />
      <DivisionFilterChip active={activeDivision} onClear={() => setActiveDivision(null)} selectedState={selectedState} />
      <WatchRails activeDivision={activeDivision} onPushGame={handlePush} onPickMoment={onPickMoment} selectedState={selectedState} />
    </>
  );
  /* Switcher pill — phone-only absolute overlay top-right. Desktop
     mounts the pill inside WatchShell's top bar (where the dead
     "All Access" pill used to live), so it doesn't need a separate
     overlay layer there. */
  const phoneStateSwitcher = (
    <div className="absolute top-4 end-4 z-40">
      <WatchStateSwitcherPill selected={selectedState} onSelect={setSelectedState} />
    </div>
  );
  return (
    <>
      {/* ──────────────── Phone (< lg) ──────────────── */}
      <div data-theme="dark" className="lg:hidden anim-fade pb-28 text-white sf relative min-h-screen"
        style={(() => {
          /* Gradient sweep — the state's saturated brand color
             paints the top 60-70% of the page (covering the hero
             zone) and fades into the dark canvas where the rails
             live. Non-themed states get a neutral dark bg via the
             lg-atmosphere class layer below. */
          const sweep = stateTheme(selectedState).pageSweep;
          return sweep ? { background: sweep } : null;
        })()}>
        {/* lg-atmosphere only renders when the state has no pageSweep — for
           themed states the page gradient replaces it entirely. */}
        {!stateTheme(selectedState).pageSweep && <div className="lg-atmosphere" />}
        <div className="absolute inset-0 z-[1] pointer-events-none"
          style={{ background: 'linear-gradient(180deg, var(--vignette-corner) 0%, transparent 30%, transparent 70%, var(--vignette-corner-soft) 100%)' }} />
        {phoneStateSwitcher}
        {/* Phone header — sticky so the brand + search stay pinned at the
            top of the scroll context (was `absolute` which scrolled away with
            the rest of the watch tree). */}
        <div className="sticky top-0 z-30 px-4 pt-5 pb-3"

            </div>
          </div>
        </div>
      ) : (
        <div className="lg-glass-card squircle-md p-4">
          <div className="sf text-[13px] leading-relaxed whitespace-pre-wrap" style={{ color: 'var(--text-secondary)' }}>{bioText}</div>
        </div>
      )}
    </div>
  );
};

/* CaptureThumb — 9:16 thumbnail used by all three capture-surfacing
   rails (From the stands · Fan captures · My captures). Hue-based
   gradient backdrop (each capture carries its own a/b hue pair),
   kind chip top-start, fan name + caption bottom overlay, tagged
   player jersey chip top-end if present. */
const CaptureThumb = ({ capture, onClick, size = 'md' }) => {
  const CLASSES = {
    sm: 'w-[110px] h-[196px]',
    md: 'w-[140px] h-[249px] lg:w-[160px] lg:h-[284px]',
  };
  const isHoriz = capture.kind === 'video-h';
  const isPhoto = capture.kind === 'photo';
  const kindLabel = isPhoto ? 'Photo' : isHoriz ? 'Video' : 'Video';
  return (
    <button onClick={onClick}
      className={`relative shrink-0 overflow-hidden squircle-md lg-aura lg-shine transition-transform hover:scale-[1.02] ${CLASSES[size] || CLASSES.md}`}
      style={{
        background: `radial-gradient(ellipse 70% 50% at 30% 30%, ${capture.hue.a} 0%, transparent 60%), radial-gradient(ellipse 70% 50% at 75% 75%, ${capture.hue.b} 0%, transparent 60%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)`,
        border: '1px solid var(--glass-card-border)',
        backdropFilter: 'blur(36px) saturate(180%)',
        WebkitBackdropFilter: 'blur(36px) saturate(180%)',
        boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
      }}>
      {/* Stock photo backdrop — Unsplash-licensed basketball/arena
         stills paired thematically with each caption. onError hides
         a broken-img so the hue gradient fallback remains. */}
      {capture.img && (
        <img src={capture.img} alt=""
          className="absolute inset-0 w-full h-full pointer-events-none"
          style={{ objectFit: 'cover', objectPosition: 'center' }}
          onError={(e) => { e.target.style.display = 'none'; }} />
      )}
      <div className="absolute inset-0 hatch opacity-40" />
      {/* Letterbox treatment for horizontal video — black bars top + bottom
          inside the 9:16 portrait card so the rail layout stays consistent
          but the user can SEE that this is a 16:9 clip. The thin bars sit
          on top of the hue gradient with the same dark-canvas color. */}
      {isHoriz && (
        <>
          <div className="absolute inset-x-0 top-0 h-[14%] z-[5] pointer-events-none" style={{ background: 'rgba(4,6,12,0.85)' }} />
          <div className="absolute inset-x-0 bottom-0 h-[14%] z-[5] pointer-events-none" style={{ background: 'rgba(4,6,12,0.85)' }} />
        </>
      )}
      {/* Kind chip top-start. Horizontal videos get a wider-aspect glyph
          (16:9 rectangle) next to the label so they read as wide. */}
      <div className="absolute top-2.5 start-2.5 lg-glass-strong squircle-sm px-2 py-0.5 z-10 inline-flex items-center gap-1.5">
        <svg width={11} height={8} viewBox="0 0 16 12" fill="none" stroke="currentColor"
          strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round"
          style={{ width: 11, height: 8, display: 'block', color: 'var(--text-primary)' }}>
          {isPhoto ? (
            <>
              <rect x={2} y={2} width={12} height={9} rx={1} />
              <circle cx={8} cy={6.5} r={2.2} />
            </>
          ) : isHoriz ? (
            <>
              {/* 16:9 wide rect — reads as horizontal video */}
              <rect x={1.5} y={3} width={11} height={6} rx={0.5} />
              <path d="M14 4 L15.5 3 V9 L14 8 Z" fill="currentColor" />
            </>
          ) : (
            <>
              {/* 9:16 tall rect — vertical video */}
              <rect x={4} y={1.5} width={6} height={9} rx={0.5} />
              <path d="M11.5 3.5 L13.5 2.5 V9.5 L11.5 8.5 Z" fill="currentColor" />
            </>
          )}
        </svg>
        <span className="sf text-[9px] font-bold tracking-[0.14em] uppercase leading-none" style={{ color: 'var(--text-primary)' }}>
          {kindLabel}
        </span>
      </div>
      {/* Tag chip top-end. Three states:
            · approved → cyan jersey number disc (visible to all)
            · pending  → amber "PENDING" pill (visible only to the uploader)
            · declined → no chip (capture stays hidden anyway) */}
      {capture.taggedPlayerId && capture.tagApprovalStatus === 'approved' && (
        <div className="absolute top-2.5 end-2.5 w-6 h-6 squircle-sm flex items-center justify-center z-10"
          style={{ background: 'var(--brand-cyan-soft)', border: '1px solid var(--brand-cyan-border)', color: 'var(--brand-cyan-text)' }}>
          <span className="sf-display text-[9.5px] font-bold tabular-nums leading-none">
            {capture.taggedPlayerId === 'r1' ? '7' : capture.taggedPlayerId === 'r2' ? '12' : '#'}
          </span>
        </div>
      )}
      {capture.taggedPlayerId && capture.tagApprovalStatus === 'pending' && (
        <div className="absolute top-2.5 end-2.5 squircle-sm flex items-center gap-1 px-1.5 py-0.5 z-10"
          style={{ background: 'rgba(255,170,90,0.18)', border: '1px solid rgba(255,170,90,0.55)' }}>
          <span className="w-1.5 h-1.5 rounded-full anim-pulse-dot" style={{ background: 'rgba(255,170,90,0.95)' }} />
          <span className="sf text-[8.5px] tracking-[0.14em] uppercase font-bold leading-none"
            style={{ color: 'rgba(255,200,140,0.95)' }}>Pending</span>
        </div>
      )}
      {/* Bottom fade — fan name + caption */}
      <div className="absolute inset-x-0 bottom-0 px-3 pt-9 pb-3 z-10"
        style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 60%, rgba(0,0,0,0.95) 100%)' }}>
        <div className="sf text-[9.5px] tracking-[0.16em] uppercase font-bold mb-0.5" style={{ color: 'rgba(255,255,255,0.55)' }}>
          {capture.capturedBy || 'You'}
        </div>
        <div className="sf-display text-[12.5px] font-bold leading-tight tracking-[-0.01em] text-start clip2 text-white">
          {capture.caption || 'From the stands'}
        </div>
      </div>
    </button>
  );
};

/* CaptureViewer — full-overlay detail view for a single capture. Opens
   when a CaptureThumb is tapped. Same vocabulary as HighlightViewer
   (phone-shape 9:16 frame on desktop, full-bleed on phone) but with
   capture-specific chrome: kind label, fan attribution, caption, tag
   status, captured-at relative time, share + report affordances.
   In production each capture would carry a real video src / image URL;
   here we render the hue-gradient poster as the visual placeholder. */
const fmtCapturedAt = (ts) => {
  const sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (sec < 60) return 'just now';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
  if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
  return Math.floor(sec / 86400) + 'd ago';
};
const CaptureViewer = ({ captureId, captures, onClose }) => {
  const capture = (captures || []).find(c => c.id === captureId);
  /* Roster lookup — used to render the tagged-player chip with their
     jersey number + name. Hardcoded mock; in production this comes
     from the team roster API tied to the capture's gameId. */
  const ROSTER = {
    r1: { name: 'Tal Weiss', number: 7 },
    r2: { name: 'Sarah Kim', number: 12 },
    r3: { name: 'Dylan Torres', number: 23 },
    r4: { name: 'Marcus Lee', number: 9 },
  };
  if (!capture) return null;
  const isVideo = capture.kind === 'video-v' || capture.kind === 'video-h';
  const isHorizontal = capture.kind === 'video-h';
  const player = capture.taggedPlayerId ? ROSTER[capture.taggedPlayerId] : null;
  const game = SEED_GAMES.find(g => g.id === capture.gameId);
  return (
    <div data-theme="dark" className="fixed inset-0 z-[100] anim-fade flex flex-col text-white sf"
      style={{
        background:
          'radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,40,72,0.45) 0%, transparent 55%),' +
          'radial-gradient(ellipse 70% 50% at 50% 100%, rgba(132,88,255,0.18) 0%, transparent 60%),' +
          '#04060c',
      }}>
      {/* Top chrome — close + kind label */}
      <div className="shrink-0 relative z-30 flex items-center justify-between px-5 lg:px-8 pt-4 pb-3">
        <div className="sf text-[9.5px] tracking-[0.24em] uppercase font-bold" style={{ color: 'rgba(255,255,255,0.45)' }}>
          Fan capture · {isVideo ? (isHorizontal ? 'Video' : 'Video') : 'Photo'}
        </div>
        <button onClick={onClose} aria-label="Close"
          className="w-9 h-9 rounded-full flex items-center justify-center transition-all hover:scale-[1.04] active:scale-[0.95]"
          style={{
            background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.10)',
            color: 'rgba(255,255,255,0.95)',
          }}>
          <Icon name="close" size={11} stroke={2} />
        </button>
      </div>
      {/* Main stage — capture viewport. Vertical kinds get a phone-shape
          9:16 frame centered; horizontal gets a 16:9 letterbox. Photo
          uses the same shape as its video sibling (vertical default). */}
      <div className="flex-1 min-h-0 overflow-y-auto onb-scroll px-5 lg:px-8 pb-6">
        <div className="w-full lg:max-w-[820px] mx-auto pt-2">
          <div className="relative w-full overflow-hidden squircle-md mx-auto"
            style={{
              aspectRatio: isHorizontal ? '16 / 9' : '9 / 16',
              maxWidth: isHorizontal ? '100%' : 'min(420px, 100%)',
              background: `radial-gradient(ellipse 70% 50% at 30% 30%, ${capture.hue.a} 0%, transparent 60%), radial-gradient(ellipse 70% 50% at 75% 75%, ${capture.hue.b} 0%, transparent 60%), linear-gradient(180deg, #0a0e1a 0%, #050810 100%)`,
              boxShadow:
                '0 28px 80px -20px rgba(0,0,0,0.75),' +
                '0 0 80px -16px rgba(0,214,254,0.18),' +
                'inset 0 1px 0 rgba(255,255,255,0.06)',
            }}>
            {/* Stock photo backdrop — same Unsplash still the
               CaptureThumb rendered, now at full viewer size.
               onError falls back to the HALO monogram below. */}
            {capture.img && (
              <img src={capture.img} alt=""
                className="absolute inset-0 w-full h-full pointer-events-none"
                style={{ objectFit: 'cover', objectPosition: 'center' }}
                onError={(e) => { e.target.style.display = 'none'; }} />
            )}
            <div className="absolute inset-0 hatch-dark opacity-30 pointer-events-none" />
            {/* HALO monogram fallback. Shows behind the img and
                remains visible if no img (or onError fires). */}
            {!capture.img && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                <span className="sf-display font-extrabold tracking-[-0.04em] select-none"
                  style={{
                    fontSize: 'clamp(80px, 18vw, 200px)',
                    color: 'rgba(255,255,255,0.05)',
                    letterSpacing: '-0.06em', lineHeight: 1,
                  }}>HALO</span>
              </div>
            )}
            {/* Captured-by attribution top-start + kind chip top-end.
                Both sit ON the poster so they read as overlays. */}
            <div className="absolute top-3 start-3 lg-glass-strong squircle-sm px-2 py-0.5 z-10">
              <span className="sf text-[9.5px] tracking-[0.16em] uppercase font-bold leading-none text-white">
                {capture.capturedBy}
              </span>
            </div>
            {isVideo && (
              <div className="absolute top-3 end-3 lg-glass squircle-sm px-2 py-0.5 z-10">
                <span className="sf text-[10px] tabular-nums font-semibold leading-none" style={{ color: 'rgba(255,255,255,0.85)' }}>
                  {capture.duration ? `0:${String(capture.duration).padStart(2, '0')}` : '0:00'}
                </span>
              </div>
            )}
            {/* Big mock play button for video — visible centered when the
                capture is a video. Photos skip this. Tapping is a no-op
                in the prototype (no real video URLs); in production it
                would start playback. */}
            {isVideo && (
              <div className="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
                <div className="w-20 h-20 lg:w-24 lg:h-24 rounded-full flex items-center justify-center"
                  style={{
                    background:
                      'radial-gradient(ellipse 80% 80% at 30% 20%, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0.04) 60%),' +
                      'rgba(8,12,20,0.62)',
                    backdropFilter: 'blur(20px) saturate(180%)',
                    WebkitBackdropFilter: 'blur(20px) saturate(180%)',
                    border: '1px solid rgba(255,255,255,0.12)',
                    boxShadow:
                      '0 0 48px rgba(0,214,254,0.35),' +
                      '0 12px 32px -10px rgba(0,0,0,0.65),' +
                      'inset 0 1px 0 rgba(255,255,255,0.32)',
                  }}>
                  <svg width={26} height={30} viewBox="0 0 14 16" fill="white"
                    style={{ marginInlineStart: 3, filter: 'drop-shadow(0 2px 6px rgba(0,0,0,0.45))' }}>
                    <path d="M0 1.5v13c0 1 1.1 1.55 1.9 1.05l11-6.5c.8-.5.8-1.7 0-2.2l-11-6.5C1.1 -.05 0 .5 0 1.5z" />
                  </svg>
                </div>
              </div>
            )}
          </div>

          {/* Editorial caption block below the frame */}
          <div className="px-1 lg:px-0 pt-6">
            <div className="flex items-center gap-2 mb-2 flex-wrap">
              {capture.taggedPlayerId && capture.tagApprovalStatus === 'approved' && player && (
                <div className="inline-flex items-center gap-2 px-2.5 py-1.5 rounded-full"
                  style={{ background: 'rgba(0,214,254,0.12)', border: '1px solid var(--brand-cyan-border)' }}>
                  <div className="w-5 h-5 squircle-sm flex items-center justify-center sf-display text-[10px] font-bold tabular-nums leading-none"
                    style={{ background: 'rgba(0,214,254,0.25)', color: 'var(--brand-cyan-text)' }}>
                    {player.number}
                  </div>
                  <span className="sf text-[11px] font-semibold leading-none" style={{ color: 'var(--brand-cyan-text)' }}>
                    {player.name}
                  </span>
                </div>
              )}
              {capture.taggedPlayerId && capture.tagApprovalStatus === 'pending' && (
                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full"
                  style={{ background: 'rgba(255,170,90,0.18)', border: '1px solid rgba(255,170,90,0.55)' }}>
                  <span className="w-1.5 h-1.5 rounded-full anim-pulse-dot" style={{ background: 'rgba(255,170,90,0.95)' }} />
                  <span className="sf text-[9.5px] tracking-[0.14em] uppercase font-bold leading-none" style={{ color: 'rgba(255,200,140,0.95)' }}>
                    Pending approval
                  </span>
                </div>
              )}
              {capture.privacy === 'private' && (
                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full"
                  style={{ background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.14)' }}>
                  <Icon name="eye-off" size={11} stroke={1.8} />
                  <span className="sf text-[9.5px] tracking-[0.14em] uppercase font-bold leading-none" style={{ color: 'rgba(255,255,255,0.65)' }}>
                    Private
                  </span>
                </div>
              )}
            </div>
            <h1 className="sf-display font-bold leading-[1.05] tracking-[-0.02em] mb-2"
              style={{ fontSize: 'clamp(22px, 3vw, 32px)', color: 'rgba(255,255,255,0.98)' }}>
              {capture.caption || 'Untitled capture'}
            </h1>
            <p className="sf text-[12.5px] leading-relaxed" style={{ color: 'rgba(255,255,255,0.55)' }}>
              {capture.capturedBy} · {fmtCapturedAt(capture.capturedAt)}
              {game ? ` · ${game.home} vs ${game.away}` : ''}
            </p>
          </div>
        </div>
      </div>
    </div>
  );
};

/* CaptureRail — horizontal-scroll rail with section header. Used on
   PostGameScreen (From the stands), AthleteProfile (Fan captures +
   My captures), with different captures arrays + labels. */
const CaptureRail = ({ title, subtitle, captures, emptyLabel = null, onPickCapture, accent = 'brand' }) => {
  if ((!captures || captures.length === 0) && !emptyLabel) return null;
  return (
    <div className="mb-7">
      <div className="px-5 lg:px-8 xl:px-12 mb-3 flex items-end justify-between">
        <div className="min-w-0">
          <h2 className="sf-display text-[17px] font-bold tracking-[-0.015em] leading-tight" style={{ color: 'var(--text-primary)' }}>
            {accent === 'brand' && <span className="lg-brand-dot" />}

          </h2>
          {subtitle && <p className="sf text-[12px] mt-0.5" style={{ color: 'var(--text-tertiary)' }}>{subtitle}</p>}
        </div>
        <span className="sf text-[10.5px] font-semibold tabular-nums" style={{ color: 'var(--text-tertiary)' }}>
          {(captures || []).length}

      </div>
      {captures && captures.length > 0 ? (
        <div className="flex gap-3 overflow-x-auto no-scrollbar px-5 lg:px-8 xl:px-12 pb-2">
          {captures.map(c => <CaptureThumb key={c.id} capture={c} onClick={() => onPickCapture && onPickCapture(c)} />)}

      ) : (
        <div className="px-5 lg:px-8 xl:px-12">
          <div className="lg-glass-card squircle-md p-5 text-center">
            <p className="sf text-[12.5px]" style={{ color: 'var(--text-tertiary)' }}>{emptyLabel}</p>
          </div>
        </div>
      )}
    </div>
  );
};

      {tab === 'fan-captures' && (
        <>
          {/* "Fan captures" — content OTHERS tagged you in, plus your
              own pending tags (so you can see your upload status). */}
          <CaptureRail
            title="Fan captures"
            subtitle="Public clips tagged with you."
            captures={(captures || []).filter(c =>
              c.taggedPlayerId === 'r1' && c.privacy === 'public' && (
                c.tagApprovalStatus === 'approved' ||
                (c.tagApprovalStatus === 'pending' && c.capturedBy === 'You')
              )
            )}
            onPickCapture={(c) => { window.location.hash = '#/capture-view/' + c.id; }}
            emptyLabel="No fan captures yet. When fans tag you in their clips, they'll show up here." />
          {/* "My captures" — your lifetime gallery (everything you've
              uploaded). Lives inside this same tab as a second section
              so all capture content is reachable from one place. Only
              renders on the user's own profile. */}
          {asTab && (
            <CaptureRail
              title="My captures"
              subtitle="Your view from the stands."
              accent="plain"
              captures={(captures || []).filter(c => c.capturedBy === 'You')}
              onPickCapture={(c) => { window.location.hash = '#/capture-view/' + c.id; }}
              emptyLabel="When you record from the venue, your captures live here." />
          )}
        </>
      )}

    </div>
  );
};

/* TeamTabs — reusable home/away tab strip with mini-crest + team name.
   Used by Other Players and Player Stats. Underline accent used to be
   hardcoded cyan (home) / purple (away) — purple was stale pre-BA data
   and read wrong for Medium Fundamentals (red team). Now the away
   accent is the actual away team's accentA from TEAMS_DB (MF → red,
   the SR-vs-anyone case still reads cyan as the user's-team brand
   tint). */
const TeamTabs = ({ game, tab, onChange }) => {
  const homeTeam = teamByName(game.home);
  const awayTeam = teamByName(game.away);
  return (
    <div className="flex mb-3" style={{ borderBottom: '1px solid var(--hairline)' }}>
      {['home', 'away'].map(k => {
        const active = tab === k;
        const team = k === 'home' ? homeTeam : awayTeam;
        /* Underline accent — pulls from each team's TEAMS_DB accentA so
           Sesh Rigs reads cream/bone, MF reads red. Cyan-as-home was a
           stale assumption from before BA migration (the user's team
           ≠ the brand color anymore). */
        const accent = team.accentA || 'rgba(132,88,255,0.85)';
        return (
          <button key={k} onClick={() => onChange(k)}
            className="relative pb-2 me-5 flex items-center gap-2"
            style={{ color: active ? 'var(--text-primary)' : 'var(--text-faint)' }}>
            <TeamCrest team={team} size={20} />
            <span className="sf text-[13.5px] font-bold tracking-tight">{team.name}</span>
            {active && <div className="absolute inset-x-0 -bottom-px h-[2px]" style={{ background: accent }} />}
          </button>
        );
      })}
    </div>
  );
};

/* OtherPlayersSection — home/away tabs + 3-col jersey grid. v3.2 line 11503.
   Tile + jersey chip used to be hardcoded cyan (home) / purple (away)
   regardless of which teams were playing. Now BOTH tabs pull from the
   active team's TEAMS_DB accentA — Sesh Rigs reads cream/bone (its
   real kit color), Medium Fundamentals reads red. Text color flips to
   dark on light kits, white on dark, so the jersey chip stays legible
   over both. */
const OtherPlayersSection = ({ game, onPickPlayer }) => {
  const [tab, setTab] = useState('home');
  const players = (tab === 'home' ? HOME_ROSTER.filter(p => p.id !== 'r1') : AWAY_ROSTER);
  const homeTeam = teamByName(game.home);
  const awayTeam = teamByName(game.away);
  const activeTeam = tab === 'home' ? homeTeam : awayTeam;
  /* Parse the team's accentA `rgba(r,g,b,a)` so we can re-emit it at
     different alphas (chip uses ~0.92, tile uses ~0.22) and pick a
     contrasting text color from the average channel value. */
  const _rgb = (activeTeam.accentA || 'rgba(0,214,254,1)').match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  const _r = _rgb ? +_rgb[1] : 0, _g = _rgb ? +_rgb[2] : 214, _b = _rgb ? +_rgb[3] : 254;
  const _isLight = (_r + _g + _b) / 3 > 180;
  const accentBg = `rgba(${_r},${_g},${_b},0.92)`;
  const accentText = _isLight ? '#101218' : '#fff';
  const tileTint = `rgba(${_r},${_g},${_b},0.22)`;
  return (
    <PgSection title="Other players">
      <TeamTabs game={game} tab={tab} onChange={setTab} />
      <div className="grid grid-cols-3 lg:grid-cols-4 gap-3">
        {players.map(p => {
          /* Pull this player's first clip poster (if they have clips).
             Bench players without a clip mapping fall back to the
             current initials-on-glass tint. */
          const clips = PLAYER_CLIPS[p.id];
          const tilePoster = clips && clips[0] && clips[0].poster;
          return (
          <button key={p.id} onClick={() => onPickPlayer(p)}
            className="relative overflow-hidden text-start squircle-md lg-aura lg-shine"
            style={{
              aspectRatio: '9 / 16',
              background: 'linear-gradient(160deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)',
              border: '1px solid var(--glass-card-border)',
              backdropFilter: 'blur(36px) saturate(180%)',
              WebkitBackdropFilter: 'blur(36px) saturate(180%)',
              boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
            }}>
            {tilePoster ? (
              <>
                {/* Poster — 9:16 portrait, natively matches the tile.
                   Simple cover fill, team-tinted bottom scrim for the
                   jersey-number chip + name to sit on. */}
                <img src={tilePoster} alt=""
                  className="absolute inset-0 w-full h-full"
                  style={{ objectFit: 'cover', objectPosition: 'center' }} />
                <div className="absolute inset-0"
                  style={{ background: `linear-gradient(180deg, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.0) 50%, ${tileTint.replace(/,[\d.]+\)$/, ',0.18)')} 80%, rgba(0,0,0,0.65) 100%)` }} />
              </>
            ) : (
              <>
                <div className="absolute inset-0" style={{
                  background: `radial-gradient(ellipse 70% 60% at 30% 25%, ${tileTint} 0%, transparent 60%)`
                }} />
                <div className="absolute inset-0 hatch opacity-30" />
                <div className="absolute inset-0 flex items-center justify-center">
                  <div className="w-10 h-10 rounded-full lg-glass-strong flex items-center justify-center sf-display text-[14px] font-bold" style={{ color: 'var(--text-primary)' }}>
                    {p.name.split(' ').map(s => s[0]).join('').slice(0,2)}
                  </div>
                </div>
              </>
            )}
            <div className="absolute bottom-2 start-2 squircle-sm px-1.5 py-0.5"
              style={{ background: accentBg, color: accentText }}>
              <span className="sf text-[10px] font-bold leading-none tabular-nums">#{p.number}</span>
            </div>
          </button>
          );
        })}
      </div>
    </PgSection>
  );
};

/* Team stats — 8-row H2H comparison. v3.2 line 11680.
   Bar fill + glow now pull from each team's TEAMS_DB accentA so a
   Sesh Rigs vs Medium Fundamentals match reads bone (home) / red
   (away), not the old hardcoded cyan / purple that was a stale
   pre-BA assumption. Same parse-rgba pattern OtherPlayersSection
   uses — extract the r/g/b channels, re-emit the bar at full
   saturation (0.92) and the glow at low alpha (0.35) so it never
   bleeds outside its row. */
const TeamStatsSection = ({ game }) => {
  const rows = teamStatsFor(game);
  const homeTeam = teamByName(game.home);
  const awayTeam = teamByName(game.away);
  const _accentBar = (team) => {
    const m = (team.accentA || 'rgba(0,214,254,1)').match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    const r = m ? +m[1] : 0, g = m ? +m[2] : 214, b = m ? +m[3] : 254;
    return {
      fill: `rgba(${r},${g},${b},0.92)`,
      glow: `0 0 8px rgba(${r},${g},${b},0.35)`,
    };
  };
  const homeBar = _accentBar(homeTeam);
  const awayBar = _accentBar(awayTeam);
  return (
    <PgSection title="Team stats">
      <div className="lg-glass-card squircle-md p-4">
        {/* Header row — team marks aligned with bars below */}
        <div className="grid items-center gap-3 mb-3 pb-3" style={{ gridTemplateColumns: '1fr auto 1fr', borderBottom: '1px solid var(--hairline)' }}>
          <div className="flex items-center justify-end gap-2 min-w-0">
            <span className="sf-display text-[13px] font-bold tracking-tight truncate" style={{ color: 'var(--text-primary)' }}>{homeTeam.name}</span>
            <TeamCrest team={homeTeam} size={24} />
          </div>
          <div className="sf text-[9px] uppercase tracking-[0.18em] font-bold px-2" style={{ color: 'var(--text-faint)' }}>vs</div>
          <div className="flex items-center gap-2 min-w-0">
            <TeamCrest team={awayTeam} size={24} />
            <span className="sf-display text-[13px] font-bold tracking-tight truncate" style={{ color: 'var(--text-primary)' }}>{awayTeam.name}</span>
          </div>
        </div>
        <div className="space-y-3">
          {rows.map(r => (
            <div key={r.label} className="grid items-center gap-3" style={{ gridTemplateColumns: '1fr auto 1fr' }}>
              <div className="min-w-0">
                <div className="sf text-[12px] font-semibold tabular-nums leading-none mb-1.5 text-end" style={{ color: 'var(--text-primary)' }}>{r.home}</div>
                <div className="h-1.5 rounded-full overflow-hidden flex justify-end" style={{ background: 'var(--hatch-grain)' }}>
                  <div className="h-full rounded-full" style={{ width: `${Math.max(6, Math.min(100, (r.hv / r.max) * 100))}%`, background: homeBar.fill, boxShadow: homeBar.glow }} />
                </div>
              </div>
              <div className="sf text-[11px] font-semibold text-center px-2 whitespace-nowrap" style={{ color: 'var(--text-tertiary)' }}>{r.label}</div>
              <div className="min-w-0">
                <div className="sf text-[12px] font-semibold tabular-nums leading-none mb-1.5" style={{ color: 'var(--text-tertiary)' }}>{r.away}</div>
                <div className="h-1.5 rounded-full overflow-hidden" style={{ background: 'var(--hatch-grain)' }}>
                  <div className="h-full rounded-full" style={{ width: `${Math.max(6, Math.min(100, (r.av / r.max) * 100))}%`, background: awayBar.fill, boxShadow: awayBar.glow }} />
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </PgSection>
  );
};

            <div className="min-w-0 text-end">
              <div className="sf-display font-bold leading-tight tracking-[-0.018em] truncate"
                style={{ fontSize: 20, color: awayWon ? 'var(--text-primary)' : 'var(--text-tertiary)' }}>
                {awayTeam.name}
              </div>
              <div className="sf text-[9.5px] uppercase tracking-[0.18em] font-semibold mt-1 truncate" style={{ color: 'var(--text-muted)' }}>
                {awayTeam.nickname}
              </div>
            </div>
            <TeamCrest team={awayTeam} size={48} />
          </div>
        </div>
      </div>
    </div>
  );
};

/* ── PRE-GAME HERO ────────────────────────────────────────
   For upcoming games where there's no score yet. Same visual
   shell as ScoreHero (so the page rhythm carries through state
   transitions), but the score column is replaced with a big
   cyan countdown and a Notify-me CTA. */
const PreGameHero = ({ game }) => {
  const homeTeam = teamByName(game.home);
  const awayTeam = teamByName(game.away);
  const c = countdownParts(game.kickoffInSec);
  const tipoffWhen = c.value === null
    ? 'Starting now'
    : c.unit === 'd'
      ? `In ${c.value} day${c.value > 1 ? 's' : ''}`
      : c.unit === 'h'
        ? `In about ${c.value} hour${c.value > 1 ? 's' : ''}`
        : `In ${c.value} minute${c.value > 1 ? 's' : ''}`;
  return (
    <div className="px-5 lg:px-8 xl:px-12 lg:max-w-[720px] lg:mx-auto pt-2 pb-6">
      <div className="relative overflow-hidden squircle-md p-5 lg:p-6" style={{
        background: `radial-gradient(ellipse 60% 100% at 0% 50%, ${homeTeam.accentA} 0%, transparent 60%), radial-gradient(ellipse 60% 100% at 100% 50%, ${awayTeam.accentA} 0%, transparent 60%), radial-gradient(ellipse 50% 80% at 50% 50%, rgba(0,214,254,0.16) 0%, transparent 65%), linear-gradient(180deg, var(--card-base-strong-top) 0%, var(--card-base-strong-bot) 100%)`,
        border: '1px solid var(--glass-card-border)',
        backdropFilter: 'blur(36px) saturate(180%)',
        WebkitBackdropFilter: 'blur(36px) saturate(180%)',
        boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
      }}>
        <div className="absolute inset-0 hatch opacity-25 pointer-events-none" />
        {/* Eyebrow — UPCOMING + venue */}
        <div className="relative z-10 flex items-center justify-between mb-4">
          <div className="sf text-[10px] tracking-[0.20em] uppercase font-bold flex items-center gap-2" style={{ color: 'var(--brand-cyan-text)' }}>
            <span className="lg-brand-dot" />Upcoming
          </div>
          <div className="sf text-[10px] tracking-[0.14em] uppercase font-semibold hidden sm:block" style={{ color: 'var(--text-muted)' }}>
            {game.venue || 'Venue TBD'}
          </div>
        </div>
        {/* Single horizontal row — home | countdown | away */}
        <div className="relative z-10 flex items-center gap-3 lg:gap-5">
          <div className="flex items-center gap-3 flex-1 min-w-0">
            <TeamCrest team={homeTeam} size={48} />
            <div className="min-w-0">
              <div className="sf-display font-bold leading-tight tracking-[-0.018em] truncate"
                style={{ fontSize: 18, color: 'var(--text-primary)' }}>
                {homeTeam.name}
              </div>
              <div className="sf text-[9.5px] uppercase tracking-[0.18em] font-semibold mt-1 truncate" style={{ color: 'var(--text-muted)' }}>
                {homeTeam.nickname}
              </div>
            </div>
          </div>
          <div className="flex items-baseline gap-0.5 shrink-0 leading-none">
            {c.value !== null ? (
              <>
                <span className="sf-display font-bold tabular-nums leading-none"
                  style={{ fontSize: 56, letterSpacing: '-0.04em', color: 'var(--brand-cyan-text)', textShadow: '0 0 24px rgba(0,214,254,0.45), 0 0 48px rgba(0,214,254,0.16)' }}>
                  {c.value}
                </span>
                <span className="sf-display leading-none"
                  style={{ fontSize: 22, fontWeight: 500, color: 'rgba(0,214,254,0.65)', marginInlineStart: 2 }}>
                  {c.unit}
                </span>
              </>
            ) : (
              <span className="sf-display font-bold leading-none"
                style={{ fontSize: 32, color: 'var(--brand-cyan-text)', textShadow: '0 0 18px rgba(0,214,254,0.55)' }}>
                NOW
              </span>
            )}
          </div>
          <div className="flex items-center gap-3 flex-1 min-w-0 justify-end">
            <div className="min-w-0 text-end">
              <div className="sf-display font-bold leading-tight tracking-[-0.018em] truncate"
                style={{ fontSize: 18, color: 'var(--text-primary)' }}>
                {awayTeam.name}
              </div>
              <div className="sf text-[9.5px] uppercase tracking-[0.18em] font-semibold mt-1 truncate" style={{ color: 'var(--text-muted)' }}>
                {awayTeam.nickname}
              </div>
            </div>
            <TeamCrest team={awayTeam} size={48} />
          </div>
        </div>

/* ── LINEUPS SECTION ──────────────────────────────────────
   Probable starting fives for both teams. Uses HOME_ROSTER /
   AWAY_ROSTER seed data (first 5 entries per the "starters first
   then bench" convention). Two-column grid on phone and desktop. */
const LineupsSection = ({ game }) => {
  const homeTeam = teamByName(game.home);
  const awayTeam = teamByName(game.away);
  const homeStarters = HOME_ROSTER.slice(0, 5);
  const awayStarters = AWAY_ROSTER.slice(0, 5);
  const PlayerRow = ({ p }) => (
    <div className="flex items-center gap-2.5 py-1.5">
      <div className="w-7 h-7 rounded-full lg-glass-strong flex items-center justify-center sf text-[11px] font-bold tabular-nums shrink-0" style={{ color: 'var(--text-primary)' }}>
        {p.number}
      </div>
      <div className="min-w-0 flex-1">
        <div className="sf text-[12.5px] font-semibold leading-tight truncate" style={{ color: 'var(--text-primary)' }}>{p.name}</div>
        <div className="sf text-[10px] mt-0.5" style={{ color: 'var(--text-tertiary)' }}>{p.position}</div>
      </div>
    </div>
  );
  const Column = ({ team, roster }) => (
    <div className="lg-glass squircle-md p-3.5">
      <div className="flex items-center gap-2 mb-2 pb-2" style={{ borderBottom: '1px solid var(--hairline)' }}>
        <TeamCrest team={team} size={22} />
        <span className="sf-display text-[12px] font-bold tracking-tight truncate" style={{ color: 'var(--text-primary)' }}>{team.name}</span>
        <span className="sf text-[9px] tracking-[0.14em] uppercase font-bold ms-auto" style={{ color: 'var(--text-muted)' }}>Starters</span>
      </div>
      {roster.map(p => <PlayerRow key={p.id} p={p} />)}
    </div>
  );
  return (
    <PgSection title="Probable lineups">
      <div className="grid grid-cols-2 gap-3">
        <Column team={homeTeam} roster={homeStarters} />
        <Column team={awayTeam} roster={awayStarters} />
      </div>
    </PgSection>
  );
};

/* ── AFTER TIPOFF placeholders ────────────────────────────
   Shows what'll populate the page once the game starts. Helps
   set expectations + makes the screen feel intentionally empty
   rather than half-built. */
const ComingAfterTipoff = () => {
  const Row = ({ iconName, label, sub }) => (
    <div className="flex items-start gap-3 py-2">
      <div className="w-9 h-9 rounded-xl lg-glass-strong flex items-center justify-center shrink-0" style={{ color: 'var(--text-muted)' }}>
        <Icon name={iconName} size={15} />
      </div>
      <div className="min-w-0">
        <div className="sf-display text-[13px] font-bold leading-tight" style={{ color: 'var(--text-primary)' }}>{label}</div>
        <div className="sf text-[11px] mt-0.5" style={{ color: 'var(--text-tertiary)' }}>{sub}</div>
      </div>
    </div>
  );
  return (
    <PgSection title="After tipoff">
      <div className="lg-glass squircle-md p-4">
        <Row iconName="play"  label="Game video & moments"   sub="Auto-clipped by play type as the game unfolds" />
        <Row iconName="flame" label="Live stats & box score" sub="Updates in real time once the clock starts" />
        <Row iconName="star"  label="Your highlight pack"    sub="Drops into your feed after the final whistle" />
