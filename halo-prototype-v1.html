/* CaptureThumb — 9:16 thumbnail used by all three capture-surfacing
   rails (From the stands · Fan captures · My captures). Hue-based
   gradient backdrop (each capture carries its own a/b hue pair),
   kind chip top-start, fan name + caption bottom overlay, tagged
   player jersey chip top-end if present. */
const CaptureThumb = ({ capture, onClick, size = 'md' }) => {
  const CLASSES = {
    sm: 'w-[110px] h-[196px]',
    md: 'w-[140px] h-[249px] lg:w-[160px] lg:h-[284px]',
  };
  const isHoriz = capture.kind === 'video-h';
  const isPhoto = capture.kind === 'photo';
  const kindLabel = isPhoto ? 'Photo' : isHoriz ? 'Video' : 'Video';
  return (
    <button onClick={onClick}
      className={`relative shrink-0 overflow-hidden squircle-md lg-aura lg-shine transition-transform hover:scale-[1.02] ${CLASSES[size] || CLASSES.md}`}
      style={{
        background: `radial-gradient(ellipse 70% 50% at 30% 30%, ${capture.hue.a} 0%, transparent 60%), radial-gradient(ellipse 70% 50% at 75% 75%, ${capture.hue.b} 0%, transparent 60%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)`,
        border: '1px solid var(--glass-card-border)',
        backdropFilter: 'blur(36px) saturate(180%)',
        WebkitBackdropFilter: 'blur(36px) saturate(180%)',
        boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
      }}>
      <div className="absolute inset-0 hatch opacity-40" />
      {/* Letterbox treatment for horizontal video — black bars top + bottom
          inside the 9:16 portrait card so the rail layout stays consistent
          but the user can SEE that this is a 16:9 clip. The thin bars sit
          on top of the hue gradient with the same dark-canvas color. */}
      {isHoriz && (
        <>
          <div className="absolute inset-x-0 top-0 h-[14%] z-[5] pointer-events-none" style={{ background: 'rgba(4,6,12,0.85)' }} />
          <div className="absolute inset-x-0 bottom-0 h-[14%] z-[5] pointer-events-none" style={{ background: 'rgba(4,6,12,0.85)' }} />
        </>
      )}
      {/* Kind chip top-start. Horizontal videos get a wider-aspect glyph
          (16:9 rectangle) next to the label so they read as wide. */}
      <div className="absolute top-2.5 start-2.5 lg-glass-strong squircle-sm px-2 py-0.5 z-10 inline-flex items-center gap-1.5">
        <svg width={11} height={8} viewBox="0 0 16 12" fill="none" stroke="currentColor"
          strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round"
          style={{ width: 11, height: 8, display: 'block', color: 'var(--text-primary)' }}>
          {isPhoto ? (
            <>
              <rect x={2} y={2} width={12} height={9} rx={1} />
              <circle cx={8} cy={6.5} r={2.2} />
            </>
          ) : isHoriz ? (
            <>
              {/* 16:9 wide rect — reads as horizontal video */}
              <rect x={1.5} y={3} width={11} height={6} rx={0.5} />
              <path d="M14 4 L15.5 3 V9 L14 8 Z" fill="currentColor" />
            </>
          ) : (
            <>
              {/* 9:16 tall rect — vertical video */}
              <rect x={4} y={1.5} width={6} height={9} rx={0.5} />
              <path d="M11.5 3.5 L13.5 2.5 V9.5 L11.5 8.5 Z" fill="currentColor" />
            </>
          )}
        </svg>
        <span className="sf text-[9px] font-bold tracking-[0.14em] uppercase leading-none" style={{ color: 'var(--text-primary)' }}>
          {kindLabel}
        </span>
      </div>
      {/* Tag chip top-end. Three states:
            · approved → cyan jersey number disc (visible to all)
            · pending  → amber "PENDING" pill (visible only to the uploader)
            · declined → no chip (capture stays hidden anyway) */}
      {capture.taggedPlayerId && capture.tagApprovalStatus === 'approved' && (
        <div className="absolute top-2.5 end-2.5 w-6 h-6 squircle-sm flex items-center justify-center z-10"
          style={{ background: 'var(--brand-cyan-soft)', border: '1px solid var(--brand-cyan-border)', color: 'var(--brand-cyan-text)' }}>
          <span className="sf-display text-[9.5px] font-bold tabular-nums leading-none">
            {capture.taggedPlayerId === 'r1' ? '7' : capture.taggedPlayerId === 'r2' ? '12' : '#'}
          </span>
        </div>
      )}
      {capture.taggedPlayerId && capture.tagApprovalStatus === 'pending' && (
        <div className="absolute top-2.5 end-2.5 squircle-sm flex items-center gap-1 px-1.5 py-0.5 z-10"
          style={{ background: 'rgba(255,170,90,0.18)', border: '1px solid rgba(255,170,90,0.55)' }}>
          <span className="w-1.5 h-1.5 rounded-full anim-pulse-dot" style={{ background: 'rgba(255,170,90,0.95)' }} />
          <span className="sf text-[8.5px] tracking-[0.14em] uppercase font-bold leading-none"
            style={{ color: 'rgba(255,200,140,0.95)' }}>Pending</span>
        </div>
      )}
      {/* Bottom fade — fan name + caption */}
      <div className="absolute inset-x-0 bottom-0 px-3 pt-9 pb-3 z-10"
        style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 60%, rgba(0,0,0,0.95) 100%)' }}>
        <div className="sf text-[9.5px] tracking-[0.16em] uppercase font-bold mb-0.5" style={{ color: 'rgba(255,255,255,0.55)' }}>
          {capture.capturedBy || 'You'}
        </div>
        <div className="sf-display text-[12.5px] font-bold leading-tight tracking-[-0.01em] text-start clip2 text-white">
          {capture.caption || 'From the stands'}
        </div>
      </div>
    </button>
  );
};

/* CaptureViewer — full-overlay detail view for a single capture. Opens
   when a CaptureThumb is tapped. Same vocabulary as HighlightViewer
   (phone-shape 9:16 frame on desktop, full-bleed on phone) but with
   capture-specific chrome: kind label, fan attribution, caption, tag
   status, captured-at relative time, share + report affordances.
   In production each capture would carry a real video src / image URL;
   here we render the hue-gradient poster as the visual placeholder. */
const fmtCapturedAt = (ts) => {
  const sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (sec < 60) return 'just now';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
  if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
  return Math.floor(sec / 86400) + 'd ago';
};
const CaptureViewer = ({ captureId, captures, onClose }) => {
  const capture = (captures || []).find(c => c.id === captureId);
  /* Roster lookup — used to render the tagged-player chip with their
     jersey number + name. Hardcoded mock; in production this comes
     from the team roster API tied to the capture's gameId. */
  const ROSTER = {
    r1: { name: 'Tal Weiss', number: 7 },
    r2: { name: 'Sarah Kim', number: 12 },
    r3: { name: 'Dylan Torres', number: 23 },
    r4: { name: 'Marcus Lee', number: 9 },
  };
  if (!capture) return null;
  const isVideo = capture.kind === 'video-v' || capture.kind === 'video-h';
  const isHorizontal = capture.kind === 'video-h';
  const player = capture.taggedPlayerId ? ROSTER[capture.taggedPlayerId] : null;
  const game = SEED_GAMES.find(g => g.id === capture.gameId);
  return (
    <div data-theme="dark" className="fixed inset-0 z-[100] anim-fade flex flex-col text-white sf"
      style={{
        background:
          'radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,40,72,0.45) 0%, transparent 55%),' +
          'radial-gradient(ellipse 70% 50% at 50% 100%, rgba(132,88,255,0.18) 0%, transparent 60%),' +
          '#04060c',
      }}>
      {/* Top chrome — close + kind label */}
      <div className="shrink-0 relative z-30 flex items-center justify-between px-5 lg:px-8 pt-4 pb-3">
        <div className="sf text-[9.5px] tracking-[0.24em] uppercase font-bold" style={{ color: 'rgba(255,255,255,0.45)' }}>
          Fan capture · {isVideo ? (isHorizontal ? 'Video' : 'Video') : 'Photo'}
        </div>
        <button onClick={onClose} aria-label="Close"
          className="w-9 h-9 rounded-full flex items-center justify-center transition-all hover:scale-[1.04] active:scale-[0.95]"
          style={{
            background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.10)',
            color: 'rgba(255,255,255,0.95)',
          }}>
          <Icon name="close" size={11} stroke={2} />
        </button>
      </div>
      {/* Main stage — capture viewport. Vertical kinds get a phone-shape
          9:16 frame centered; horizontal gets a 16:9 letterbox. Photo
          uses the same shape as its video sibling (vertical default). */}
      <div className="flex-1 min-h-0 overflow-y-auto onb-scroll px-5 lg:px-8 pb-6">
        <div className="w-full lg:max-w-[820px] mx-auto pt-2">
          <div className="relative w-full overflow-hidden squircle-md mx-auto"
            style={{
              aspectRatio: isHorizontal ? '16 / 9' : '9 / 16',
              maxWidth: isHorizontal ? '100%' : 'min(420px, 100%)',
              background: `radial-gradient(ellipse 70% 50% at 30% 30%, ${capture.hue.a} 0%, transparent 60%), radial-gradient(ellipse 70% 50% at 75% 75%, ${capture.hue.b} 0%, transparent 60%), linear-gradient(180deg, #0a0e1a 0%, #050810 100%)`,
              boxShadow:
                '0 28px 80px -20px rgba(0,0,0,0.75),' +
                '0 0 80px -16px rgba(0,214,254,0.18),' +
                'inset 0 1px 0 rgba(255,255,255,0.06)',
            }}>
            <div className="absolute inset-0 hatch-dark opacity-30 pointer-events-none" />
            {/* HALO monogram poster placeholder. Same pattern as the
                other video frames in the prototype. */}
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
              <span className="sf-display font-extrabold tracking-[-0.04em] select-none"
                style={{
                  fontSize: 'clamp(80px, 18vw, 200px)',
                  color: 'rgba(255,255,255,0.05)',
                  letterSpacing: '-0.06em', lineHeight: 1,
                }}>HALO</span>
            </div>
            {/* Captured-by attribution top-start + kind chip top-end.
                Both sit ON the poster so they read as overlays. */}
            <div className="absolute top-3 start-3 lg-glass-strong squircle-sm px-2 py-0.5 z-10">
              <span className="sf text-[9.5px] tracking-[0.16em] uppercase font-bold leading-none text-white">
                {capture.capturedBy}
              </span>
            </div>
            {isVideo && (
              <div className="absolute top-3 end-3 lg-glass squircle-sm px-2 py-0.5 z-10">
                <span className="sf text-[10px] tabular-nums font-semibold leading-none" style={{ color: 'rgba(255,255,255,0.85)' }}>
                  {capture.duration ? `0:${String(capture.duration).padStart(2, '0')}` : '0:00'}
                </span>
              </div>
            )}
            {/* Big mock play button for video — visible centered when the
                capture is a video. Photos skip this. Tapping is a no-op
                in the prototype (no real video URLs); in production it
                would start playback. */}
            {isVideo && (
              <div className="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
                <div className="w-20 h-20 lg:w-24 lg:h-24 rounded-full flex items-center justify-center"
                  style={{
                    background:
                      'radial-gradient(ellipse 80% 80% at 30% 20%, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0.04) 60%),' +
                      'rgba(8,12,20,0.62)',
                    backdropFilter: 'blur(20px) saturate(180%)',
                    WebkitBackdropFilter: 'blur(20px) saturate(180%)',
                    border: '1px solid rgba(255,255,255,0.12)',
                    boxShadow:
                      '0 0 48px rgba(0,214,254,0.35),' +
                      '0 12px 32px -10px rgba(0,0,0,0.65),' +
                      'inset 0 1px 0 rgba(255,255,255,0.32)',
                  }}>
                  <svg width={26} height={30} viewBox="0 0 14 16" fill="white"
                    style={{ marginInlineStart: 3, filter: 'drop-shadow(0 2px 6px rgba(0,0,0,0.45))' }}>
                    <path d="M0 1.5v13c0 1 1.1 1.55 1.9 1.05l11-6.5c.8-.5.8-1.7 0-2.2l-11-6.5C1.1 -.05 0 .5 0 1.5z" />
                  </svg>
                </div>
              </div>
            )}
          </div>

          {/* Editorial caption block below the frame */}
          <div className="px-1 lg:px-0 pt-6">
            <div className="flex items-center gap-2 mb-2 flex-wrap">
              {capture.taggedPlayerId && capture.tagApprovalStatus === 'approved' && player && (
                <div className="inline-flex items-center gap-2 px-2.5 py-1.5 rounded-full"
                  style={{ background: 'rgba(0,214,254,0.12)', border: '1px solid var(--brand-cyan-border)' }}>
                  <div className="w-5 h-5 squircle-sm flex items-center justify-center sf-display text-[10px] font-bold tabular-nums leading-none"
                    style={{ background: 'rgba(0,214,254,0.25)', color: 'var(--brand-cyan-text)' }}>
                    {player.number}
                  </div>
                  <span className="sf text-[11px] font-semibold leading-none" style={{ color: 'var(--brand-cyan-text)' }}>
                    {player.name}
                  </span>
                </div>
              )}
              {capture.taggedPlayerId && capture.tagApprovalStatus === 'pending' && (
                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full"
                  style={{ background: 'rgba(255,170,90,0.18)', border: '1px solid rgba(255,170,90,0.55)' }}>
                  <span className="w-1.5 h-1.5 rounded-full anim-pulse-dot" style={{ background: 'rgba(255,170,90,0.95)' }} />
                  <span className="sf text-[9.5px] tracking-[0.14em] uppercase font-bold leading-none" style={{ color: 'rgba(255,200,140,0.95)' }}>
                    Pending approval
                  </span>
                </div>
              )}
              {capture.privacy === 'private' && (
                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full"
                  style={{ background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.14)' }}>
                  <Icon name="eye-off" size={11} stroke={1.8} />
                  <span className="sf text-[9.5px] tracking-[0.14em] uppercase font-bold leading-none" style={{ color: 'rgba(255,255,255,0.65)' }}>
                    Private
                  </span>
                </div>
              )}
            </div>
            <h1 className="sf-display font-bold leading-[1.05] tracking-[-0.02em] mb-2"
              style={{ fontSize: 'clamp(22px, 3vw, 32px)', color: 'rgba(255,255,255,0.98)' }}>
              {capture.caption || 'Untitled capture'}
            </h1>
            <p className="sf text-[12.5px] leading-relaxed" style={{ color: 'rgba(255,255,255,0.55)' }}>
              {capture.capturedBy} · {fmtCapturedAt(capture.capturedAt)}
              {game ? ` · ${game.home} vs ${game.away}` : ''}
            </p>
          </div>
        </div>
      </div>
    </div>
  );
};

/* CaptureRail — horizontal-scroll rail with section header. Used on
   PostGameScreen (From the stands), AthleteProfile (Fan captures +
   My captures), with different captures arrays + labels. */
const CaptureRail = ({ title, subtitle, captures, emptyLabel = null, onPickCapture, accent = 'brand' }) => {
  if ((!captures || captures.length === 0) && !emptyLabel) return null;
  return (
    <div className="mb-7">
      <div className="px-5 lg:px-8 xl:px-12 mb-3 flex items-end justify-between">
        <div className="min-w-0">
          <h2 className="sf-display text-[17px] font-bold tracking-[-0.015em] leading-tight" style={{ color: 'var(--text-primary)' }}>
            {accent === 'brand' && <span className="lg-brand-dot" />}
            {title}
          </h2>
          {subtitle && <p className="sf text-[12px] mt-0.5" style={{ color: 'var(--text-tertiary)' }}>{subtitle}</p>}
        </div>
        <span className="sf text-[10.5px] font-semibold tabular-nums" style={{ color: 'var(--text-tertiary)' }}>
          {(captures || []).length}
        </span>
      </div>
      {captures && captures.length > 0 ? (
        <div className="flex gap-3 overflow-x-auto no-scrollbar px-5 lg:px-8 xl:px-12 pb-2">

        <div className="px-5 lg:px-8 xl:px-12">

          </div>
        </div>
      )}

  );
};

const AthleteProfileScreen = ({ onPickMoment, onBack, onOpenGame, asTab = true, captures = [] }) => {

  return (
    <div className="anim-fade pb-28 sf relative" style={{ color: 'var(--text-primary)' }}>
      {/* asTab header — "Profile" 22px sf-display. The icon button that
          used to sit on the right was removed per user critique — the
          rendered glyph read as a sun and the affordance was redundant
          (settings live in the SideMenu / SettingsModal). */}
      <div className="sticky top-0 z-20 lg-header-fade px-5 lg:px-8 xl:px-12 pt-12 pb-3">
        <h1 className="sf-display text-[22px] font-bold leading-none" style={{ color: 'var(--text-primary)' }}>Profile</h1>
      </div>

      {/* Identity row — cinematic glass card with jersey-block + name + meta + Edit profile */}
      <div className="px-5 lg:px-8 xl:px-12 pt-3 pb-5">
        <div className="relative squircle-md p-4 overflow-hidden lg-aura"
          style={{

          }}>

                {PLAYER.name}
              </div>
              <div className="sf text-[12px] mt-0.5 truncate" style={{ color: 'var(--text-tertiary)' }}>

              </div>

            </div>
          </div>
        </div>
      </div>

      {/* Tab segmented control — Profile / Highlights / Bio / Fan captures.
          Fan captures is a dedicated tab (per user spec) carrying a
          NEW badge whenever there are pending tag-approvals for THIS
          player. The badge clears once the user approves/declines via
          the Bell sheet. */}
      <div className="px-5 lg:px-8 xl:px-12 mb-5">
        {(() => {
          /* Count of fan captures that need attention. Pending captures
             (someone tagged you, waiting for your approval) drive the
             NEW badge. Once approved/declined, badge clears. */
          const newFanTags = (captures || []).filter(c =>
            c.taggedPlayerId === 'r1' && c.tagApprovalStatus === 'pending' && c.capturedBy !== 'You'
          ).length;
          return (
            <div className="lg-glass squircle-md p-1 flex gap-1">
              {[
                { key: 'profile',     label: 'Profile' },
                { key: 'highlights',  label: 'Highlights' },
                { key: 'bio',         label: 'Bio' },
                { key: 'fan-captures', label: 'Captured', badge: newFanTags },

                const active = tab === t.key;
                return (
                  <button key={t.key} onClick={() => setTab(t.key)}
                    className="flex-1 py-2 sf text-[12px] font-semibold tracking-tight squircle-sm transition-colors relative"

                    <span className="inline-flex items-center gap-1.5">

                      {t.badge > 0 && (
                        <span className="sf text-[8.5px] tracking-[0.14em] uppercase font-extrabold leading-none px-1.5 py-0.5 rounded-full"
                          style={{
                            background: 'rgba(255,170,90,0.95)',
                            color: '#1a0d00',
                            boxShadow: '0 0 8px rgba(255,170,90,0.55)',
                          }}>
                          New
                        </span>
                      )}
                    </span>
                  </button>
                );
              })}
            </div>
          );
        })()}
      </div>

      {/* Tab bodies */}
      {tab === 'profile'    && <ProfileTabBody onPickMoment={onPickMoment} />}
      {tab === 'highlights' && <HighlightsTabBody onPickMoment={onPickMoment} />}
      {tab === 'bio'        && <BioTabBody />}
      {tab === 'fan-captures' && (
        <>
          {/* "Fan captures" — content OTHERS tagged you in, plus your
              own pending tags (so you can see your upload status). */}
          <CaptureRail
            title="Fan captures"
            subtitle="Public clips tagged with you."
            captures={(captures || []).filter(c =>
              c.taggedPlayerId === 'r1' && c.privacy === 'public' && (
                c.tagApprovalStatus === 'approved' ||
                (c.tagApprovalStatus === 'pending' && c.capturedBy === 'You')
              )
            )}
            onPickCapture={(c) => { window.location.hash = '#/capture-view/' + c.id; }}
            emptyLabel="No fan captures yet. When fans tag you in their clips, they'll show up here." />
          {/* "My captures" — your lifetime gallery (everything you've
              uploaded). Lives inside this same tab as a second section
              so all capture content is reachable from one place. Only
              renders on the user's own profile. */}
          {asTab && (
            <CaptureRail
              title="My captures"
              subtitle="Your view from the stands."
              accent="plain"
              captures={(captures || []).filter(c => c.capturedBy === 'You')}
              onPickCapture={(c) => { window.location.hash = '#/capture-view/' + c.id; }}
              emptyLabel="When you record from the venue, your captures live here." />
          )}
        </>
      )}

    </div>
  );
};

        fontSize: 56,

  return (
    <div className="px-5 lg:px-8 xl:px-12 lg:max-w-[720px] lg:mx-auto pt-2 pb-6">
      <div className="relative overflow-hidden squircle-md p-5 lg:p-6" style={{

        backdropFilter: 'blur(36px) saturate(180%)',
        WebkitBackdropFilter: 'blur(36px) saturate(180%)',

      }}>
        <div className="absolute inset-0 hatch opacity-25 pointer-events-none" />
        {/* Meta eyebrow */}
        <div className="relative z-10 flex items-center justify-between mb-4">
          <div className="sf text-[10px] tracking-[0.20em] uppercase font-bold flex items-center" style={{ color: 'var(--brand-cyan-text)' }}>

          </div>
          <div className="sf text-[10px] tracking-[0.14em] uppercase font-semibold hidden sm:block" style={{ color: 'var(--text-muted)' }}>
            {game.venue || 'Eastside Gym'}
          </div>
        </div>
        {/* Single horizontal row — home | scores | away */}
        <div className="relative z-10 flex items-center gap-3 lg:gap-5">
          {/* HOME block */}
          <div className="flex items-center gap-3 flex-1 min-w-0">
            <TeamCrest team={homeTeam} size={48} />
            <div className="min-w-0">
              <div className="sf-display font-bold leading-tight tracking-[-0.018em] truncate"
                style={{ fontSize: 20, color: homeWon ? 'var(--text-primary)' : 'var(--text-tertiary)' }}>
                {homeTeam.name}
              </div>
              <div className="sf text-[9.5px] uppercase tracking-[0.18em] font-semibold mt-1 truncate" style={{ color: 'var(--text-muted)' }}>
                {homeTeam.nickname}
              </div>
            </div>

            <Score value={game.scoreAway} won={awayWon} />

          {/* AWAY block — mirrored */}

                {awayTeam.name}
              </div>

/* ── ShareSheet ──────────────────────────────────────────────────
   Bottom-sheet share modal with 6 targets. Direct port of DS
   screens/home/ShareSheet.tsx, glyphs simplified to single-color
   line icons so we don't need brand assets.

   Copy-link target shows inline "Copied!" confirmation for ~1.5s.
   Other targets fire the onShare callback and close after 200ms. */
const SHARE_TARGETS = [
  { id: 'copy',      label: 'Copy link', icon: 'copy' },
  { id: 'facebook',  label: 'Facebook',  icon: 'facebook' },
  { id: 'instagram', label: 'Instagram', icon: 'instagram' },
  { id: 'x',         label: 'X',         icon: 'x' },
  { id: 'tiktok',    label: 'TikTok',    icon: 'tiktok' },
  { id: 'whatsapp',  label: 'WhatsApp',  icon: 'whatsapp' },
];

const ShareSheet = ({ title, subtitle, url, thumbnail, onShare, onClose }) => {
  const [copied, setCopied] = useState(false);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const handle = (targetId) => {
    if (targetId === 'copy') {
      try { navigator.clipboard?.writeText(url || ''); } catch (e) {}
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
      return;
    }
    onShare?.(targetId);
    setTimeout(onClose, 200);
  };
  return (
    <div className="absolute inset-0 z-[70] anim-fade">
      <button onClick={onClose} aria-label="Close share sheet" className="absolute inset-0"
        style={{ background: 'rgba(0,0,0,0.55)', backdropFilter: 'blur(8px) saturate(120%)', WebkitBackdropFilter: 'blur(8px) saturate(120%)' }} />
      <div className="absolute inset-x-0 bottom-0 anim-slide-sheet lg:inset-auto lg:bottom-auto lg:top-1/2 lg:start-1/2 lg:-translate-y-1/2 lg:-translate-x-1/2 lg:max-w-[480px] lg:w-full"
        style={{
          background: 'var(--canvas-bg-soft)',
          borderTop: '1px solid var(--glass-card-border)',
          borderTopLeftRadius: 20,
          borderTopRightRadius: 20,
          padding: '14px 20px 32px',
        }}>
        {/* Drag handle (phone only) */}
        <div className="lg:hidden mx-auto mb-4" style={{ width: 40, height: 4, borderRadius: 2, background: 'rgba(255,255,255,0.20)' }} />
        {/* Title block */}
        <div className="flex items-center gap-3 mb-5 pb-4" style={{ borderBottom: '1px solid var(--hairline)' }}>
          {thumbnail && (
            <div className="w-12 h-12 squircle-sm lg-glass-strong flex items-center justify-center shrink-0">
              <span className="sf-display text-[16px] font-bold text-white">{thumbnail}</span>
            </div>
          )}
          <div className="flex-1 min-w-0">
            <div className="sf-display text-[14.5px] font-bold leading-tight truncate" style={{ color: 'var(--text-primary)' }}>{title || 'Share moment'}</div>
            {subtitle && <div className="sf text-[11.5px] mt-0.5 truncate" style={{ color: 'var(--text-tertiary)' }}>{subtitle}</div>}
          </div>
        </div>
        {/* Targets grid */}
        <div className="grid grid-cols-3 gap-3">
          {SHARE_TARGETS.map(t => {
            const isCopiedHere = t.id === 'copy' && copied;
            return (
              <button key={t.id} onClick={() => handle(t.id)}
                className="flex flex-col items-center gap-2 py-2 lg-aura"
                aria-label={t.label}>
                <div className="w-12 h-12 squircle-sm flex items-center justify-center"
                  style={isCopiedHere
                    ? { background: 'var(--brand-cyan-soft)', border: '1px solid var(--brand-cyan-border)', color: 'var(--brand-cyan-text)' }
                    : { background: 'var(--glass-card-bg)', backdropFilter: 'blur(36px) saturate(180%)', WebkitBackdropFilter: 'blur(36px) saturate(180%)', border: '1px solid var(--glass-card-border)', color: 'var(--text-secondary)' }
                  }>
                  <ShareIcon name={t.icon} />
                </div>
                <span className="sf text-[10.5px] font-semibold"
                  style={{ color: isCopiedHere ? 'var(--brand-cyan-text)' : 'var(--text-secondary)' }}>
                  {isCopiedHere ? 'Copied!' : t.label}
                </span>
              </button>
            );
          })}
        </div>
        {/* URL preview */}
        {url && (
          <div className="mt-4 pt-3 sf text-[11px] text-center truncate"
            style={{ color: 'var(--text-tertiary)', borderTop: '1px solid var(--hairline)' }}>
            {url}
          </div>
        )}
      </div>
    </div>
  );

/* ── HighlightViewer — VERTICAL viewer (player HL drops only) ────
   Aspect ratio follows CONTENT, not device:
     - Phone (< lg):  9:16 fills the entire phone screen (Instagram pattern)
     - Desktop (lg+): 9:16 video CENTERED in dark landscape canvas with
                      sidebars (letterboxed) + info panel docked on the right

   Used by:
     - Home DropsSection (auto-clipped player highlights)
     - Profile recent drops
     - PackReveal moment grid tap-through

   For 16:9 game footage (full games, team highlights) the entry point
   routes to <GameVideoViewer/> instead — that one keeps the 16:9 shape
   on both phone and desktop. This split is the core fix from the
   May 2026 critique: video aspect = content type, NOT device. */
const HighlightViewer = ({ momentIndex = 0, onClose, onWatchFullGame }) => {
  const [idx, setIdx] = useState(momentIndex);
  const [playing, setPlaying] = useState(true);
  const [shareOpen, setShareOpen] = useState(false);
  const m = SEED_MOMENTS[idx];
  const game = m ? SEED_GAMES.find(g => g.id === m.gameId) : null;
  /* All moments in SEED_MOMENTS are the player's own — treat them as
     player highlights with jersey #7 (PLAYER constant). */
  const isPlayerHL = true;
  const jerseyNum = PLAYER.number;
  const sectionLabel = isPlayerHL ? 'Player highlights' : 'Team moment';
  const total = SEED_MOMENTS.length;
  const goNext = () => setIdx(i => (i + 1) % total);
  const goPrev = () => setIdx(i => (i - 1 + total) % total);
  /* Keyboard navigation — arrow keys for prev/next + Esc to close.
     A real story player needs these or it feels broken on desktop. */
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight') goNext();
      else if (e.key === 'ArrowLeft') goPrev();
      else if (e.key === 'Escape') onClose();
      else if (e.key === ' ') { e.preventDefault(); setPlaying(p => !p); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  if (!m) return null;

  /* Top progress segments — Instagram story pattern. Brighter inactive
     state (0.25 vs 0.18) so the count is legible at a glance per
     critique. Current segment now has a slight cyan glow. */
  const ProgressSegments = () => (
    <div className="flex gap-1 flex-1 me-3">
      {SEED_MOMENTS.map((_, i) => (
        <div key={i} className="flex-1 h-[2.5px] overflow-hidden rounded-full"
          style={{ background: 'rgba(255,255,255,0.25)' }}>
          <div className="h-full" style={{
            width: i < idx ? '100%' : i === idx ? '60%' : '0%',
            background: '#fff',
            boxShadow: i === idx ? '0 0 8px rgba(0,214,254,0.65)' : 'none',
            transition: 'width 200ms linear',
          }} />
        </div>
      ))}
    </div>
  );

  /* Index pill — "1 / 7" indicator next to the close X. Tiny tabular
     nums so it reads as wayfinding, not content. Added per critique:
     users navigating through highlights need to know where they are. */
  const IndexPill = () => (
    <div className="sf text-[10.5px] tabular-nums font-bold tracking-tight pe-2"
      style={{ color: 'rgba(255,255,255,0.65)' }}>
      <span style={{ color: '#fff' }}>{idx + 1}</span>
      <span style={{ color: 'rgba(255,255,255,0.40)' }}> / {total}</span>
    </div>
  );

  /* Top-overlay eyebrow — sits at the TOP of the video frame as a
     story-style HUD chip (Q4 · 0:08 · YOURS). Replaces the prior
     SectionChip "PLAYER HIGHLIGHTS" pill that duplicated the H1.
     The descriptive context (quarter + clip duration + Yours marker)
     IS the eyebrow now — no redundant section label. */
  const TopOverlayEyebrow = () => (
    <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full"
      style={{
        background: 'rgba(8,12,20,0.55)',
        backdropFilter: 'blur(14px) saturate(160%)',
        WebkitBackdropFilter: 'blur(14px) saturate(160%)',
        border: '1px solid rgba(255,255,255,0.10)',
      }}>
      <span className="sf text-[10px] tracking-[0.14em] uppercase font-bold text-white leading-none">{m.sub}</span>
      {isPlayerHL && (
        <>
          <span className="w-[3px] h-[3px] rounded-full" style={{ background: 'var(--brand-cyan)', boxShadow: '0 0 6px rgba(0,214,254,0.85)' }} />
          <span className="sf text-[10px] tracking-[0.14em] uppercase font-bold leading-none" style={{ color: 'var(--brand-cyan-text)' }}>Yours</span>
        </>
      )}
    </div>
  );

  /* Glass play button — visible when paused. Tapping resumes. */
  const PlayHero = () => (
    <button onClick={(e) => { e.stopPropagation(); setPlaying(true); }}
      className="w-20 h-20 rounded-full lg-glass-strong flex items-center justify-center transition-transform duration-200 hover:scale-[1.06] active:scale-[0.98]"
      aria-label="Play"
      style={{
        boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.30), 0 0 40px -8px rgba(0,214,254,0.50), 0 8px 32px -8px rgba(0,0,0,0.55)',
        border: '1px solid rgba(255,255,255,0.25)',
      }}>
      <svg width={22} height={26} viewBox="0 0 22 26" fill="#fff"
        style={{ marginInlineStart: 4, filter: 'drop-shadow(0 0 8px rgba(255,255,255,0.40))', width: 22, height: 26, display: 'block' }}>
        <path d="M2 2 L20 13 L2 24 Z" />
      </svg>
    </button>
  );

  /* VideoPoster — radial bleed + giant HALO monogram + hatch grain.
     Renders behind the video element so a slow / failed video doesn't
     read as a broken black box. Same poster pattern used by the
     GameVideoViewer for visual consistency across video surfaces. */
  const VideoPoster = () => (
    <>
      <div className="absolute inset-0 pointer-events-none"
        style={{
          background:
            'radial-gradient(ellipse 70% 50% at 30% 30%, rgba(0,214,254,0.32) 0%, transparent 60%),' +
            'radial-gradient(ellipse 70% 50% at 75% 75%, rgba(132,88,255,0.28) 0%, transparent 60%),' +
            'linear-gradient(180deg, #0a0e1a 0%, #050810 100%)',
        }} />
      <div className="absolute inset-0 hatch-dark opacity-30 pointer-events-none" />
      <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
        <span className="sf-display font-extrabold tracking-[-0.04em] select-none"
          style={{
            fontSize: 'clamp(120px, 36vw, 320px)',
            color: 'rgba(255,255,255,0.05)',
            letterSpacing: '-0.06em',
            lineHeight: 1,
          }}>H</span>
      </div>
    </>
  );

  /* Score chip — text-only treatment. Replaces the prior
     "round letter discs" UI which read as toggle controls per critique.
     Team names sit as muted eyebrow-cased text flanking the dominant
     tabular score in the middle. */
  const ScoreChip = () => game && game.scoreHome != null ? (
    <div className="squircle-sm px-4 py-2.5 mb-4 flex items-center justify-between"
      style={{
        background: 'var(--glass-card-bg)',
        backdropFilter: 'blur(20px) saturate(180%)',
        WebkitBackdropFilter: 'blur(20px) saturate(180%)',
        border: '1px solid var(--glass-card-border)',
        boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top)',
      }}>
      <span className="sf text-[10.5px] tracking-[0.14em] uppercase font-bold flex-1"
        style={{ color: 'rgba(255,255,255,0.65)' }}>{game.home}</span>
      <div className="sf-display text-[19px] font-bold tabular-nums leading-none flex items-baseline gap-1.5 px-3"
        style={{ color: '#fff' }}>
        <span style={{ color: (game.scoreHome > game.scoreAway) ? '#fff' : 'rgba(255,255,255,0.55)' }}>{game.scoreHome}</span>
        <span style={{ color: 'rgba(255,255,255,0.30)', fontSize: 13 }}>·</span>
        <span style={{ color: (game.scoreAway > game.scoreHome) ? '#fff' : 'rgba(255,255,255,0.55)' }}>{game.scoreAway}</span>
      </div>
      <span className="sf text-[10.5px] tracking-[0.14em] uppercase font-bold flex-1 text-end"
        style={{ color: 'rgba(255,255,255,0.65)' }}>{game.away}</span>
    </div>
  ) : null;

  /* Action row — Watch full game (primary, flex-1) + Save (icon) +
     Share (icon). Save added per critique so social actions match the
     CTA's weight more equitably and the user can stash a highlight. */
  const ActionRow = () => (
    <div className="flex items-stretch gap-2">
      <button onClick={() => { onClose(); onWatchFullGame && onWatchFullGame(m.gameId, m.id); }}
        className="flex-1 squircle-sm py-3 sf text-[12.5px] font-semibold flex items-center justify-center gap-2"
        style={{
          color: '#0a0d18',
          background: 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
          boxShadow: '0 4px 12px -2px rgba(0,214,254,0.45), inset 0 1px 0 rgba(255,255,255,0.40)',
        }}>
        <svg width={11} height={12} viewBox="0 0 11 12" fill="currentColor"
          style={{ width: 11, height: 12, display: 'block' }}>
          <path d="M1 1 L10 6 L1 11 Z" />
        </svg>
        <span>Watch full game</span>
      </button>
      <button onClick={() => {}} aria-label="Save"
        className="w-12 lg-glass squircle-sm flex items-center justify-center text-white transition-all hover:scale-[1.04] active:scale-[0.95]">
        <svg width={14} height={14} viewBox="0 0 16 16" fill="none" stroke="currentColor"
          strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round"
          style={{ width: 14, height: 14, display: 'block' }}>
          <path d="M3 2 v12 L8 11 L13 14 V2 Z" />
        </svg>
      </button>
      <button onClick={() => setShareOpen(true)} aria-label="Share"
        className="w-12 lg-glass squircle-sm flex items-center justify-center text-white transition-all hover:scale-[1.04] active:scale-[0.95]">
        <svg width={14} height={14} viewBox="0 0 16 16" fill="none" stroke="currentColor"
          strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round"
          style={{ width: 14, height: 14, display: 'block' }}>
          <path d="M3 8 v5 h10 v-5" />
          <path d="M8 2 v9 M5 5 L8 2 L11 5" />
        </svg>
      </button>
    </div>
  );

  /* Info block — title + caption + score chip + CTAs. Always renders as
     a bottom-overlay on the video (phone-style). Headline is now
     content-first ("Game-winning 3") not category-first ("#7 Player
     highlights") per critique — the descriptive m.title becomes the H1,
     and "#7 · Player highlights" demotes to a small eyebrow under it. */
  const InfoBlock = () => (
    <div className="px-5 pb-5 pt-2">
      <div className="sf-display text-white font-bold tracking-[-0.025em] leading-[1.0] mb-2 text-[26px] lg:text-[28px]"
        style={{ textShadow: '0 2px 12px rgba(0,0,0,0.45)' }}>
        {m.title || 'Highlight'}
      </div>
      <div className="sf text-[12px] tracking-[0.12em] uppercase font-semibold mb-4"
        style={{ color: 'rgba(255,255,255,0.60)' }}>
        {isPlayerHL && jerseyNum != null ? `#${jerseyNum} · ${sectionLabel}` : sectionLabel}
      </div>
      <ScoreChip />
      <ActionRow />
    </div>
  );

  return (
    <div data-theme="dark" className="absolute inset-0 z-50 lg:fixed lg:z-[100] anim-fade flex flex-col"
      style={{
        background:
          'radial-gradient(ellipse 60% 45% at 50% 35%, rgba(0,214,254,0.14) 0%, transparent 65%),' +
          'radial-gradient(ellipse 70% 50% at 50% 100%, rgba(132,88,255,0.10) 0%, transparent 70%),' +
          'linear-gradient(180deg, #050810 0%, #020308 100%)',
      }}>
      {/* === PHONE LAYOUT (< lg) — full-bleed vertical ===
          Top chrome: progress segments + index pill + close. Eyebrow
          overlay (Q4 · 0:08 · YOURS) tucked at the top-left of the
          video frame as a story-style HUD chip. Bottom info block
          ditches the duplicate "PLAYER HIGHLIGHTS" section pill —
          the headline carries the section context now. */}
      <div className="lg:hidden flex-1 relative overflow-hidden">
        {/* Video poster behind the live video — radial gradient + HALO
            monogram so a slow/failed video doesn't render as a broken
            black box. */}
        <VideoPoster />
        <video key={`hv-phone-${idx}`} src={HALO_VIDEO_URL}
          autoPlay={playing} muted loop playsInline preload="auto"
          className="absolute inset-0 w-full h-full object-cover" />
        {/* Top chrome — progress segments + index pill + close */}
        <div className="absolute top-0 inset-x-0 z-30 px-4 pt-11 pb-4 flex items-center justify-between gap-2">
          <ProgressSegments />
          <div className="flex items-center gap-1.5 shrink-0">
            <IndexPill />
            <button onClick={onClose} aria-label="Close"
              className="w-9 h-9 lg-glass squircle-sm flex items-center justify-center text-white">
              <Icon name="close" size={12} stroke={1.8} />
            </button>
          </div>
        </div>
        {/* Story-style eyebrow overlay — sits at top-left of the video
            frame with breathing room from the progress segments. */}
        <div className="absolute top-[80px] start-4 z-30">
          <TopOverlayEyebrow />
        </div>
        {/* Tap zones — prev / next */}
        <button onClick={goPrev} className="absolute start-0 top-[140px] bottom-[240px] w-1/3 z-10" aria-label="Previous" />
        <button onClick={goNext} className="absolute end-0 top-[140px] bottom-[240px] w-1/3 z-10" aria-label="Next" />
        {/* Center play hero — only when paused */}
        {!playing && (
          <div className="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
            <div className="pointer-events-auto"><PlayHero /></div>
          </div>
        )}
        {/* Bottom info — overlay with gradient scrim */}
        <div className="absolute bottom-0 inset-x-0 z-10 pt-20"
          style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.45) 30%, rgba(0,0,0,0.92) 100%)' }}>
          <InfoBlock />
        </div>
      </div>

      {/* === DESKTOP LAYOUT (lg+) — 3-frame composition ===
          Per critique, the 9:16 card was stranded in a sea of black on
          desktop. Now: ghosted prev + next neighbor frames flank the
          focal card at 60% scale, tap to jump. Frames are also
          backed by the VideoPoster so even the dimmed neighbors look
          like real story cards, not placeholder rectangles. The eye
          can SEE there are 7 highlights without leaving this card.

          The arrows are gone — clicking a neighbor jumps to it. Keyboard
          arrow keys still navigate (wired via useEffect at the top). */}
      <div className="hidden lg:flex flex-1 items-center justify-center relative overflow-hidden">
        {/* Ghost prev — left of focal. Simple percentage-based offset
            (start:6%) avoids fragile calc() math that could be parsed
            differently across browsers. Tap = jump. */}
        <button onClick={goPrev} aria-label="Previous highlight"
          className="absolute z-10 overflow-hidden squircle-md transition-all hover:opacity-80 active:scale-[0.97]"
          style={{
            height: 'min(60vh, 520px)',
            aspectRatio: '9 / 16',
            insetInlineStart: '6%',
            top: '50%',
            transform: 'translateY(-50%) scale(0.94)',
            transformOrigin: 'center',
            opacity: 0.55,
            filter: 'blur(0.5px) saturate(0.85)',
            boxShadow: '0 24px 60px -20px rgba(0,0,0,0.55)',
          }}>
          <VideoPoster />
          <div className="absolute inset-0" style={{ background: 'linear-gradient(90deg, transparent 0%, rgba(4,6,12,0.35) 100%)' }} />
          <div className="absolute bottom-4 inset-x-4 z-10">
            <div className="sf text-[9.5px] tracking-[0.18em] uppercase font-bold mb-1" style={{ color: 'rgba(255,255,255,0.55)' }}>Previous</div>
            <div className="sf-display text-[13px] font-bold leading-tight truncate" style={{ color: 'rgba(255,255,255,0.85)' }}>
              {SEED_MOMENTS[(idx - 1 + total) % total].title || 'Highlight'}
            </div>
          </div>
        </button>

        {/* Ghost next — right of focal, same simple offset. */}
        <button onClick={goNext} aria-label="Next highlight"
          className="absolute z-10 overflow-hidden squircle-md transition-all hover:opacity-80 active:scale-[0.97]"
          style={{
            height: 'min(60vh, 520px)',
            aspectRatio: '9 / 16',
            insetInlineEnd: '6%',
            top: '50%',
            transform: 'translateY(-50%) scale(0.94)',
            transformOrigin: 'center',
            opacity: 0.55,
            filter: 'blur(0.5px) saturate(0.85)',
            boxShadow: '0 24px 60px -20px rgba(0,0,0,0.55)',
          }}>
          <VideoPoster />
          <div className="absolute inset-0" style={{ background: 'linear-gradient(270deg, transparent 0%, rgba(4,6,12,0.35) 100%)' }} />
          <div className="absolute bottom-4 inset-x-4 z-10 text-end">
            <div className="sf text-[9.5px] tracking-[0.18em] uppercase font-bold mb-1" style={{ color: 'rgba(255,255,255,0.55)' }}>Next</div>
            <div className="sf-display text-[13px] font-bold leading-tight truncate" style={{ color: 'rgba(255,255,255,0.85)' }}>
              {SEED_MOMENTS[(idx + 1) % total].title || 'Highlight'}
            </div>
          </div>
        </button>

        {/* The focal phone-shape player frame */}
        <div className="relative z-20 overflow-hidden squircle-md"
          style={{
            height: 'min(88vh, 760px)',
            aspectRatio: '9 / 16',
            background: '#000',
            boxShadow:
              '0 32px 96px -16px rgba(0,0,0,0.80),' +
              '0 0 60px -10px rgba(0,214,254,0.20),' +
              '0 0 0 1px rgba(255,255,255,0.06)',
          }}>
          {/* Video poster + video, same as phone */}
          <VideoPoster />
          <video key={`hv-desktop-${idx}`} src={HALO_VIDEO_URL}
            autoPlay={playing} muted loop playsInline preload="auto"
            className="absolute inset-0 w-full h-full object-cover" />
          {/* Top chrome — progress segments + index pill + close */}
          <div className="absolute top-0 inset-x-0 z-30 px-4 pt-6 pb-5 flex items-center justify-between gap-2">
            <ProgressSegments />
            <div className="flex items-center gap-1.5 shrink-0">
              <IndexPill />
              <button onClick={onClose} aria-label="Close"
                className="w-9 h-9 lg-glass squircle-sm flex items-center justify-center text-white">
                <Icon name="close" size={12} stroke={1.8} />
              </button>
            </div>
          </div>
          {/* Story-style eyebrow at top-left of video frame */}
          <div className="absolute top-[72px] start-4 z-30">
            <TopOverlayEyebrow />
          </div>
          {/* Center play hero — only when paused */}
          {!playing && (
            <div className="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
              <div className="pointer-events-auto"><PlayHero /></div>
            </div>
          )}
          {/* Bottom info — overlay with gradient scrim */}
          <div className="absolute bottom-0 inset-x-0 z-10 pt-20"
            style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.45) 30%, rgba(0,0,0,0.92) 100%)' }}>
            <InfoBlock />
          </div>
        </div>
      </div>

      {shareOpen && (
        <ShareSheet
          title={isPlayerHL && jerseyNum != null ? `#${jerseyNum} ${sectionLabel}` : sectionLabel}
          subtitle={game ? `${game.home} vs ${game.away}` : null}
          url={`halo.app/m/${m.id}`}
          thumbnail={jerseyNum != null ? String(jerseyNum) : null}
          onClose={() => setShareOpen(false)} />
      )}
    </div>
  );
};

/* ── StorytellingDropViewer ──────────────────────────────────────
   Direct port of DS screens/home/StorytellingDropViewer.tsx.
   60-40 layout: horizontal-snap moment cards on top (60%), insight
   panel on bottom (40%). Per-card cyan/purple/pink/amber hues so each
   moment reads as its own vibe. Tapping a card jumps into HighlightViewer
   at that moment.

   Desktop variant: same shape, centered max-w-[1200px], static card
   carousel (no snap) with arrows. */
const STORYTELLING_HUES = [
  { a: 'rgba(0,214,254,0.42)',  b: 'rgba(132,88,255,0.32)' },
  { a: 'rgba(255,90,158,0.42)', b: 'rgba(255,140,40,0.30)' },

];
const hueForStory = (id) =>
  STORYTELLING_HUES[(id || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0) % STORYTELLING_HUES.length];

const SD_VideoFrame = ({ tsLabel, captionLabel, captionAlign = 'top', ratio = '9/16', maxWidth = 360, imgSrc = SD_CLIP_IMGS[0], videoSrc = null }) => {
  const [playing, setPlaying] = React.useState(false);
  const [progress, setProgress] = React.useState(0);
  const [duration, setDuration] = React.useState(0);
  const [muted, setMuted] = React.useState(true);
  const videoRef = React.useRef(null);
  const containerRef = React.useRef(null);

  React.useEffect(() => {
    if (!videoSrc) return;
    const video = videoRef.current;
    if (!video) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
          video.play().then(() => setPlaying(true)).catch(() => {});
        } else if (!entry.isIntersecting) {
          video.pause();
          setPlaying(false);
        }
      });
    }, { threshold: 0.5 });

    if (containerRef.current) observer.observe(containerRef.current);

    const onTimeUpdate = () => {
      if (video.duration) setProgress(video.currentTime / video.duration);
    };
    const onMeta = () => setDuration(video.duration);
    const onEnded = () => { setPlaying(false); setProgress(0); };

    video.addEventListener('timeupdate', onTimeUpdate);
    video.addEventListener('loadedmetadata', onMeta);
    video.addEventListener('ended', onEnded);

    return () => {
      observer.disconnect();
      video.removeEventListener('timeupdate', onTimeUpdate);
      video.removeEventListener('loadedmetadata', onMeta);
      video.removeEventListener('ended', onEnded);
    };
  }, [videoSrc]);

  const togglePlay = () => {
    const video = videoRef.current;
    if (!video) return;
    if (playing) { video.pause(); setPlaying(false); }
    else { video.play().then(() => setPlaying(true)).catch(() => {}); }
  };

  const toggleMute = (e) => {
    e.stopPropagation();
    const video = videoRef.current;
    if (!video) return;
    video.muted = !video.muted;
    setMuted(video.muted);
  };

  const fmtTime = (s) => {
    if (!s || isNaN(s)) return '0:00';
    return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  };

  const currentSecs = videoRef.current ? videoRef.current.currentTime : 0;
  const pct = `${(progress * 100).toFixed(1)}%`;

  return (
    <div ref={containerRef} className="relative mx-auto w-full" style={{ maxWidth }}>
      <div className="sd-video-frame"
        onClick={videoSrc ? togglePlay : undefined}
        style={{ aspectRatio: ratio, borderRadius: '6px', overflow: 'hidden', border: '1px solid rgba(240,235,225,0.12)', boxShadow: '0 24px 64px rgba(0,0,0,0.70)', cursor: videoSrc ? 'pointer' : 'default' }}>

        {/* The image renders as a poster underneath the video. autoPlay
            + muted + playsInline make modern browsers auto-start the
            video as soon as metadata is available — the
            IntersectionObserver above is a backup that pauses/resumes
            on scroll. preload="auto" forces the browser to fetch the
            full media right away (default "metadata" was making play()
            reject because the video wasn't ready when the IO fired).
            Log errors instead of hiding the element — silent
            display:none was masking real failures and making the frame
            look like an intentional static placeholder. */}
        <img src={imgSrc} alt="Game clip"
          className="absolute inset-0 w-full h-full object-cover"
          style={{ opacity: 0.88 }} />
        {videoSrc && (
          <video ref={videoRef} src={videoSrc}
            autoPlay muted playsInline loop preload="auto" poster={imgSrc}
            onError={(e) => { console.warn('[SD_VideoFrame] video failed to load:', videoSrc, e.currentTarget.error); }}
            className="absolute inset-0 w-full h-full object-cover"
            style={{ opacity: 0.92 }} />
        )}

        {/* vignette */}
        <div className="absolute inset-0" style={{ background: 'linear-gradient(to bottom, rgba(0,0,0,0.18) 0%, transparent 35%, transparent 55%, rgba(0,0,0,0.72) 100%)', pointerEvents: 'none' }} />

        {/* top-left: timestamp badge */}
        {tsLabel && (
          <div className="absolute top-3 left-3 z-10 flex items-center gap-1.5"
            style={{ background: 'rgba(0,0,0,0.62)', backdropFilter: 'blur(8px)', borderRadius: '3px', padding: '3px 7px', border: '1px solid rgba(240,235,225,0.14)', pointerEvents: 'none' }}>
            <div style={{ width: 5, height: 5, borderRadius: '50%', background: playing ? '#FF3B3B' : 'rgba(255,59,59,0.4)', flexShrink: 0, transition: 'background 0.3s' }} />
            <span className="sd-mono text-[8px] tracking-[0.20em] uppercase sd-tx85">{tsLabel}</span>
          </div>
        )}

        {/* top-right: HD badge */}
        <div className="absolute top-3 right-3 z-10 sd-mono text-[7.5px] tracking-[0.18em] sd-tx55"
          style={{ background: 'rgba(0,0,0,0.50)', backdropFilter: 'blur(6px)', borderRadius: '2px', padding: '2px 5px', border: '1px solid rgba(240,235,225,0.10)', pointerEvents: 'none' }}>
          HD
        </div>

        {/* center play/pause button — hidden while playing */}
        <div className="absolute inset-0 flex items-center justify-center z-10"
          style={{ opacity: playing ? 0 : 1, transition: 'opacity 0.25s ease', pointerEvents: 'none' }}>
          <div style={{
            width: 52, height: 52, borderRadius: '50%',
            background: 'rgba(0,0,0,0.55)', backdropFilter: 'blur(12px)',
            border: '1.5px solid rgba(240,235,225,0.30)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <svg width="18" height="20" viewBox="0 0 18 20" fill="none">
              <path d="M2 1.5L16 10L2 18.5V1.5Z" fill="rgba(240,235,225,0.92)" />
            </svg>
          </div>
        </div>

        {/* bottom controls bar */}
        <div className="absolute bottom-0 left-0 right-0 z-10 px-3 pb-3 pt-5" style={{ background: 'linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%)', pointerEvents: 'none' }}>
          {/* progress bar */}
          <div className="relative w-full mb-2.5" style={{ height: 3, background: 'rgba(240,235,225,0.18)', borderRadius: 2 }}>
            <div style={{ position: 'absolute', left: 0, top: 0, height: '100%', width: videoSrc ? pct : '38%', background: 'rgba(240,235,225,0.85)', borderRadius: 2, transition: 'width 0.25s linear' }} />
            <div style={{ position: 'absolute', left: videoSrc ? pct : '38%', top: '50%', transform: 'translate(-50%,-50%)', width: 7, height: 7, borderRadius: '50%', background: '#F0EBE1', boxShadow: '0 0 4px rgba(0,0,0,0.5)', transition: 'left 0.25s linear' }} />
          </div>
          {/* controls row */}
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              {/* play/pause icon */}
              {playing ? (
                <svg width="11" height="12" viewBox="0 0 11 12" fill="none">
                  <rect x="1" y="1" width="3" height="10" rx="1" fill="rgba(240,235,225,0.75)" />
                  <rect x="7" y="1" width="3" height="10" rx="1" fill="rgba(240,235,225,0.75)" />
                </svg>
              ) : (
                <svg width="11" height="12" viewBox="0 0 11 12" fill="none">
                  <path d="M1 0.8L10 6L1 11.2V0.8Z" fill="rgba(240,235,225,0.75)" />
                </svg>
              )}
              {/* volume icon — clickable */}
              <svg width="13" height="12" viewBox="0 0 13 12" fill="none" onClick={videoSrc ? toggleMute : undefined}
                style={{ cursor: videoSrc ? 'pointer' : 'default', pointerEvents: 'auto' }}>
                <path d="M2 4H0V8H2L5.5 11V1L2 4Z" fill={muted ? 'rgba(240,235,225,0.25)' : 'rgba(240,235,225,0.55)'} />
                {!muted && <path d="M8 2.5C9.38 3.38 10.3 4.89 10.3 6.5C10.3 8.11 9.38 9.62 8 10.5" stroke="rgba(240,235,225,0.55)" strokeWidth="1.2" strokeLinecap="round" fill="none"/>}
                {muted && <path d="M8 4.5L11 7.5M11 4.5L8 7.5" stroke="rgba(240,235,225,0.35)" strokeWidth="1.2" strokeLinecap="round"/>}
              </svg>
              <span className="sd-mono text-[8px] sd-tx45">
                {videoSrc ? `${fmtTime(currentSecs)} / ${fmtTime(duration)}` : '0:38 / 1:42'}
              </span>
            </div>
            {/* fullscreen icon */}
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M1 4V1H4M8 1H11V4M11 8V11H8M4 11H1V8" stroke="rgba(240,235,225,0.55)" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </div>
        </div>
      </div>

      {captionLabel && (
        <div className="sd-mono text-[9px] tracking-[0.25em] uppercase sd-tx25 mt-3 text-center">
          {captionLabel}
        </div>
      )}
    </div>
  );
};

const SD_AnchoredOpen = ({ scrollEl }) => {
  const sectionRef  = useRef(null);
  const ballRef     = useRef(null);
  const lastLandedRef = useRef(false);
  const rafRef      = useRef(null);
  const [landed, setLanded] = useState(false);

  useEffect(() => {
    if (!scrollEl) return;
    const apply = () => {
      rafRef.current = null;
      const sec = sectionRef.current;
      const ball = ballRef.current;
      if (!sec) return;
      const rect = sec.getBoundingClientRect();
      const scrollable = sec.offsetHeight - window.innerHeight;
      if (scrollable <= 0) return;
      const p = Math.max(0, Math.min(1, -rect.top / scrollable));
      /* Ball drops in over first 55% of scroll travel.
         Gravity ease-in: starts slow, accelerates. */
      const fall  = Math.min(1, p / 0.55);
      const eased = fall * fall * fall;
      const ballY = -12 + 80 * eased;
      if (ball) {
        ball.style.transform = `translate(-50%, ${ballY}vh)`;
      }
      const isLanded = p > 0.55;
      if (isLanded !== lastLandedRef.current) {
        lastLandedRef.current = isLanded;
        setLanded(isLanded);
      }
    };
    const onScroll = () => {
      if (rafRef.current) return;
      rafRef.current = requestAnimationFrame(apply);
    };
    scrollEl.addEventListener('scroll', onScroll, { passive: true });
    apply();
    return () => {
      scrollEl.removeEventListener('scroll', onScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [scrollEl]);

  return (
    <section ref={sectionRef} className="relative" style={{ height: '190vh' }}>
      <div className="sticky top-0 h-screen" style={{ clipPath: 'inset(0)' }}>

        {/* ── pre-land: eyebrow + headline — staggered clip-path reveal on mount ── */}

          style={{ top: '8%', zIndex: 10, opacity: landed ? 0 : 1, transition: 'opacity 0.35s ease-in' }}>

            <span className="sd-rh2 block">One shot.</span>
            <span className="sd-rh3 block">Everything changed.</span>
          </div>
        </div>

        {/* ── backboard — fades last in chain ── */}
        <div className="absolute left-1/2"
          style={{ top: '57%', transform: 'translateX(-50%)', zIndex: 5, opacity: landed ? 0 : 1, transition: 'opacity 0.35s ease-in 0.35s' }}>
          <SD_HoopBackboard />
        </div>

        {/* ── rim + net — fades second ── */}
        <div className="absolute left-1/2"
          style={{ top: '57%', transform: 'translateX(-50%)', zIndex: 20, opacity: landed ? 0 : 1, transition: 'opacity 0.3s ease-in 0.18s' }}>
          <SD_HoopRimNet />
        </div>

        {/* ── basketball — fades first, ball "enters" the net ── */}
        <div ref={ballRef} className="absolute left-1/2"
          style={{ top: 0, transform: 'translate(-50%, -12vh)', zIndex: 30, willChange: 'transform',
            filter: 'drop-shadow(0 16px 32px rgba(0,0,0,0.70))',
            opacity: landed ? 0 : 1, transition: 'opacity 0.2s ease-in' }}>
          <SD_Basketball />
        </div>

        {/* ── post-land: editorial reveal — translateY stagger ── */}
        <div className="absolute inset-0 z-40 px-6 lg:px-16 flex items-center"
          style={{ pointerEvents: landed ? 'auto' : 'none' }}>
          <div className="w-full max-w-[1280px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-16 items-center">
            <div className="lg:col-span-7 flex flex-col">

                {SD_OPENING.q} · {SD_OPENING.ts} · First basket
              </div>
              <div className="sd-serif italic sd-tx" style={{ fontSize: 'clamp(3.8rem, 10vw, 8rem)', fontWeight: 300, lineHeight: 0.85, letterSpacing: '-0.01em',

const SD_QuarterScroll = ({ scrollEl }) => {
  const sectionRef = useRef(null);
  const trackRef = useRef(null);
  const progressRef = useRef(null);
  const [active, setActive] = useState(0);
  const activeRef = useRef(0);
  const rafRef = useRef(null);

  useEffect(() => {
    if (!scrollEl) return;
    /* On mobile the QuarterScroll converts to a vertical panel stack via
       CSS (see media query). The scroll handler then has nothing to
       drive — bail out so we don't burn frames on no-op work. */
    const isMobile = () => window.matchMedia('(max-width: 767px)').matches;
    const onScroll = () => {
      if (rafRef.current) return;
      rafRef.current = requestAnimationFrame(() => {
        rafRef.current = null;
        if (isMobile()) return;
        const sec = sectionRef.current;
        if (!sec) return;
        const rect = sec.getBoundingClientRect();
        const scrollable = sec.offsetHeight - window.innerHeight;
        if (scrollable <= 0) return;
        const p = Math.max(0, Math.min(1, -rect.top / scrollable));
        /* Track + progress = pure DOM mutation, never a React re-render. */
        if (trackRef.current) trackRef.current.style.transform = `translate3d(-${p * 300}vw, 0, 0)`;
        if (progressRef.current) progressRef.current.style.width = `${p * 100}%`;
        const a = Math.max(0, Math.min(3, Math.round(p * 3)));
        /* Skip the React render when active hasn't actually flipped to a
           new panel. */
        if (a !== activeRef.current) {
          activeRef.current = a;
          setActive(a);
        }
      });
    };
    scrollEl.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => {
      scrollEl.removeEventListener('scroll', onScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [scrollEl]);

  return (
    /* 400vh (was 460vh): 100vh sticky phase + 300vh of scroll = 100vh
       per quarter transition. Tighter pacing.
       sd-q-scroll-section / sd-q-indicators / sd-q-header tags are the
       mobile-override hooks — phones convert this whole thing to a
       vertical stack of panels (no sticky horizontal track), which is
       drastically lighter than rendering 4 viewport-wide panels at once. */
    <section ref={sectionRef} className="sd-q-scroll-section relative" style={{ height: '400vh' }}>
      <div className="sticky top-0 h-screen overflow-hidden">
        <div ref={progressRef} className="absolute top-0 start-0 h-[3px] sd-progress-bar z-30" style={{ width: '0%' }} />
        <div className="sd-q-header absolute top-7 inset-x-0 text-center z-20 pointer-events-none">
          <div className="sd-mono text-[10px] tracking-[0.30em] uppercase sd-tx30 mb-0.5">Quarter by quarter</div>
          <div className="sd-serif italic sd-tx85" style={{ fontSize: 'clamp(1rem, 1.5vw, 1.25rem)' }}>how all 24 happened</div>
        </div>
        <div ref={trackRef} className="sd-q-track flex h-full"
          style={{ width: '400vw', transition: 'transform 55ms cubic-bezier(0,0,0.2,1)' }}>
          {SD_QUARTERS.map((q, i) => (
            <SD_QuarterPanel key={i} q={q} isActive={active === i} />
          ))}
        </div>
        <div className="sd-q-indicators absolute bottom-8 left-1/2 -translate-x-1/2 flex gap-7 z-30">
          {SD_QUARTERS.map((q, i) => (
            <div key={i} className="sd-mono text-[11px] tracking-[0.25em] uppercase transition-all duration-300"
              style={{
                color: i === active ? 'var(--sd-cream)' : 'var(--sd-cream-25)',
                transform: i === active ? 'scale(1.15)' : 'scale(1)',
              }}>{q.q}</div>
          ))}
        </div>
      </div>
    </section>
  );
};

const SD_ScoreBoard = ({ scrollEl }) => {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    if (!scrollEl) return;
    /* IntersectionObserver respects scrollable ancestors via its `root`
       option — we pass the overlay's scroll container so the threshold
       triggers when the section enters the overlay's viewport, not the
       document's. */
    /* threshold 0.05 (was 0.35) — fire as soon as the scoreboard slides
       even slightly into view. The 0.35 threshold meant the user had
       scrolled 35vh into a 100vh section before the score animated,
       which read as empty scroll. */
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) setVis(true); },
      { root: scrollEl, threshold: 0.05 }

    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();

const SD_Closing = ({ scrollEl, onPickMoment }) => {
  const wrapRef = useRef(null);
  const [visible, setVisible] = useState(false);
  const [activeIdx, setActiveIdx] = useState(SD_SEASON_TOP_THREE.findIndex(g => g.isThis));
  const [hoverIdx, setHoverIdx] = useState(null);
  useEffect(() => {
    if (!scrollEl) return;
    /* threshold 0.05 (was 0.20) — same reasoning as ScoreBoard: fire on
       first intersection so the section doesn't look empty during its
       opening run-in. */
    const obs = new IntersectionObserver(
      (entries) => entries.forEach(e => { if (e.isIntersecting) setVisible(true); }),
      { root: scrollEl, threshold: 0.05 }
    );
    if (wrapRef.current) obs.observe(wrapRef.current);
    return () => obs.disconnect();
  }, [scrollEl]);

/* ── StorytellingDropViewer ─────────────────────────────────────────
   Fullscreen scrollytelling overlay. Replaces the earlier 60/40 split
   viewer with the Tal Weiss editorial experience ported from
   prototype/storydrop-tal-weiss.html.
   - The overlay itself owns the scroll (overflow-y: auto on its
     absolute-inset child). Sticky sections inside sticky to the
     overlay, not to window.
   - AnchoredOpen / QuarterScroll / ScoreBoard / Closing all receive the
     scroll element as a prop so their scroll listeners and
     IntersectionObservers bind to the overlay's scroll, not the
     document's.
   - Close button is fixed top-end above all content.
   For the prototype, every story drop (sd1/sd2/sd3) renders the same
   Tal Weiss vs Northside story — per-drop data branching is a future
   enhancement. */
const StorytellingDropViewer = ({ storyId, onClose, onPickMoment }) => {
  const scrollRef = useRef(null);
  const [scrollEl, setScrollEl] = useState(null);
  const [badgeVisible, setBadgeVisible] = useState(true);
  const badgeRef = useRef(true);
  useEffect(() => {
    setScrollEl(scrollRef.current);
  }, []);
  /* Lock body scroll while the overlay is mounted. Stops iOS Safari from
     rubber-banding the underlying document and prevents the prototype's
     ambient live-amp / shine / ember animations from chewing CPU behind
     a fixed overlay the user can't see. Restore prior state on unmount. */
  useEffect(() => {
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = prevOverflow; };
  }, []);
  /* Badge fade — only setState when the boolean actually flips (not on
     every scroll tick). */
  useEffect(() => {
    if (!scrollEl) return;
    const onScroll = () => {
      const next = scrollEl.scrollTop < scrollEl.clientHeight * 0.85;
      if (next !== badgeRef.current) {
        badgeRef.current = next;
        setBadgeVisible(next);
      }
    };
    scrollEl.addEventListener('scroll', onScroll, { passive: true });
    return () => scrollEl.removeEventListener('scroll', onScroll);
  }, [scrollEl]);
  return (
    <div data-theme="dark" className="fixed inset-0 z-[100] sd-root anim-fade">
      {/* Plain overflow scroll — no transform, no `contain: paint`. Both
          previously broke `position: sticky` resolution inside the
          overlay (sticky children unstuck on first scroll, exposing the
          tall containing sections as 100-360vh of empty scroll). The
          isolation we still get from `fixed inset-0` on the parent is
          enough; aggressive containment was a premature optimization. */}
      <div ref={scrollRef} className="absolute inset-0 overflow-y-auto"
        style={{
          overflowX: 'clip',
          WebkitOverflowScrolling: 'touch',
        }}>
        <SD_Hero />
        <SD_Marquee />
        <SD_AnchoredOpen scrollEl={scrollEl} />
        <SD_QuarterScroll scrollEl={scrollEl} />
        <SD_ScoreBoard scrollEl={scrollEl} />
        <SD_Closing scrollEl={scrollEl} onPickMoment={onPickMoment} />
      </div>
      {/* SD_ScrollBadge removed per critique — corner brand mark was
          beautiful but invisible to most users. The bottom-center
          scroll prompt inside SD_Hero now carries the affordance
          alone, more prominently. */}
      <button onClick={onClose} aria-label="Close"
        className="fixed top-4 end-4 z-[110] w-10 h-10 lg-glass squircle-sm flex items-center justify-center text-white">
        <Icon name="close" size={12} stroke={1.8} />
      </button>
    </div>
  );
};

/* ── GameVideoViewer — HORIZONTAL viewer (16:9 content) ──────────
   Used by every entry point where the video is wide-camera game footage:
     - "Full game" tap on Watch (ended posters in the Full games rail)
     - "Game highlight" tap (TeamMomentsRail on Home)
     - "Watch full game" CTA from inside HighlightViewer

   Aspect ratio is 16:9 on BOTH phone and desktop (content drives the
   shape, not the device). On phone the video sits letterboxed in the
   middle of the portrait phone with info BELOW it. On desktop the video
   centers at max-w-[1200px] with info flowing below. Reuses the
   LivePlayerScreen control dock pattern (play/pause + scrubber + time

const GameVideoViewer = ({ gameId, momentId, onClose }) => {
  const game = SEED_GAMES.find(g => g.id === gameId) || SEED_GAMES.find(g => g.status === 'just-ended') || SEED_GAMES[0];

  const [secs, setSecs] = useState(0);
  /* Mocked VOD timeline — fake a 1h:30m game with a moving playhead.
     Real VOD would expose timeupdate from the video element. */
  const TOTAL = 90 * 60;
  useEffect(() => {
    if (!playing) return;
    const t = setInterval(() => setSecs(v => Math.min(TOTAL, v + 1)), 1000);
    return () => clearInterval(t);
  }, [playing]);
  const mm = Math.floor(secs / 60);
  const ss = secs % 60;
  const time = `${String(Math.floor(mm / 60)).padStart(2,'0')}:${String(mm % 60).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  const total = '01:30:00';
  const pct = (secs / TOTAL) * 100;
  if (!game) return null;

  /* Layout (May 2026 — critique pass after the prior centered version
     buried the H1 under the dock):

       │      Full game · 1h 30m                          │  meta
       │      Moments                                     │  rail header
       │      [thumb][thumb][thumb][thumb]...             │  EditorialDropThumb rail
       ├──────────────────────────────────────────────────┤
       │  ╭──────────────────────╮                        │  sticky dock pill
       │  │ ▶ ━━━●━━━━ 0:00:12/1:30:00 ⛶ │              │
       │  ╰──────────────────────╯                        │
       └──────────────────────────────────────────────────┘
     Three zones, no vertical centering — content stacks top-down with
     explicit padding. The middle zone scrolls so longer moment rails
     stay reachable; the dock stays pinned at the bottom of the viewport
     via shrink-0 outside the scroll container. Kills the prior issue
     where the H1 was rendering under the dock due to fragile flex math. */
  return (
    <div data-theme="dark" className="absolute inset-0 z-50 lg:fixed lg:z-[100] anim-fade flex flex-col text-white sf"
      style={{
        background:
          'radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,40,72,0.45) 0%, transparent 55%),' +
          'radial-gradient(ellipse 70% 50% at 50% 100%, rgba(132,88,255,0.18) 0%, transparent 60%),' +

        <button onClick={onClose} aria-label="Close"

          style={{
            background: 'rgba(255,255,255,0.08)',
            backdropFilter: 'blur(20px) saturate(180%)',
            WebkitBackdropFilter: 'blur(20px) saturate(180%)',

            boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.10)',
