            </div>

            {/* Verify banner — same as drawer, narrower */}
            {!emailVerified && (
              <div className="px-3 pb-2 shrink-0">
                <div className="squircle-sm p-2.5"
                  style={{ background: 'var(--brand-cyan-soft)', border: '1px solid var(--brand-cyan-border)' }}>
                  <div className="sf text-[10.5px] font-bold leading-tight" style={{ color: 'var(--brand-cyan-text)' }}>
                    Verify your email
                  </div>
                  <button onClick={onVerifyEmail}
                    className="sf text-[10.5px] font-semibold underline mt-1"
                    style={{ color: 'var(--brand-cyan-text)' }}>
                    Resend link
                  </button>
                </div>
              </div>
            )}

            {/* Nav groups */}
            <nav className="flex-1 px-2 pb-2">
              <RailSectionHead>Account</RailSectionHead>
              <RailItem k="account"          icon="profile"    label="Account & profile" />
              <RailItem k="notifications"    icon="bell"       label="Notifications" />
              <RailItem k="manage-following" icon="heart"      label="Manage following" />

              <RailSectionHead>Plan</RailSectionHead>
              <RailItem k="subscription"     icon="card"       label="Subscription & billing" />
              <RailItem k="permissions"      icon="shield"     label="Privacy & permissions" />

              <RailSectionHead>App</RailSectionHead>
              <RailItem k="language"         icon="languages"  label="Language"
                trailing={locale === 'he' ? 'עברית' : 'English'} />
              <RailItem k="theme"            icon={theme === 'dark' ? 'sun' : 'moon'}
                label={theme === 'dark' ? 'Light mode' : 'Dark mode'}
                onClick={onTheme} />
              <RailItem k="info"             icon="info"       label="Help & about"
                onClick={() => setPage('info-about')} />

              {/* Sign out — destructive, separated */}
              <div className="mt-2 mb-1 mx-2 border-t" style={{ borderColor: 'var(--hairline)' }} />
              <button onClick={() => { onClose(); onSignOut && onSignOut(); }}
                className="w-full flex items-center gap-3 px-3 py-2.5 squircle-sm transition-colors text-start"
                style={{ color: '#fca5a5', marginBlockEnd: 2 }}>
                <span className="w-7 h-7 squircle-sm flex items-center justify-center shrink-0"
                  style={{
                    background: 'rgba(220,38,38,0.12)',
                    border: '1px solid rgba(220,38,38,0.32)',
                    color: '#fca5a5',
                  }}>
                  <Icon name="logout" size={13} stroke={1.7} />
                </span>
                <span className="sf text-[13px] font-semibold flex-1">Sign out</span>
              </button>
            </nav>
          </div>

          {/* Right column — active page renders here. Same Menu*Page
              components the phone drawer uses; we just pass onBack=undefined
              for top-level pages so MenuPageHeader drops its chevron. */}
          <div className="flex-1 min-h-0 flex flex-col relative">
            {page === 'account' && (
              <MenuAccountPage onBack={undefined} onSubPage={setPage} />
            )}
            {page === 'change-password' && (
              <MenuChangePasswordPage onBack={goAccount} />
            )}
            {page === 'delete-account' && (
              <MenuDeleteAccountPage onBack={goAccount}
                onSignOut={() => { onClose(); onSignOut && onSignOut(); }} />
            )}
            {page === 'notifications' && (
              <MenuNotificationsPage onBack={undefined} />
            )}
            {page === 'manage-following' && (
              <MenuManageFollowingPage onBack={undefined} />
            )}
            {page === 'subscription' && (
              <MenuSubscriptionPage onBack={undefined} />
            )}
            {page === 'permissions' && (
              <MenuPermissionsPage onBack={undefined} onSubPage={setPage} />
            )}
            {page === 'language' && (
              <MenuLanguagePage locale={locale} setLocale={setLocale} onBack={undefined} />
            )}
            {page && page.startsWith('info-') && (
              <MenuInfoPage infoId={page.slice(5)}
                onBack={undefined}
                onNavigate={(otherId) => setPage('info-' + otherId)} />
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

        <button key={t.key} onClick={() => onChange(t.key)}
          className={`flex-1 py-2.5 sf text-[12.5px] font-semibold tracking-tight squircle-sm transition-all ${active ? '' : 'opacity-65'}`}
          style={active
            ? { background: 'var(--auth-tab-active-bg)', color: 'var(--auth-tab-active-text)', border: '1px solid var(--auth-tab-active-bg)', boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.10), 0 2px 8px -2px rgba(0,0,0,0.18)' }
            : { border: '1px solid transparent', color: 'var(--text-muted)' }
          }>
          {t.label}
        </button>
      );
    })}
  </div>
);

/* GlassField — token-driven input with focus ring + error ring */
const GlassField = ({ label, type = 'text', value, onChange, placeholder, autoFocus, rightSlot, hint, error }) => {
  const [focused, setFocused] = useState(false);
  const showError = !!error && !focused && !!value;
  return (
    <div>
      <label className="sf text-[10px] tracking-[0.16em] uppercase font-semibold mb-2 block px-1" style={{ color: 'var(--text-muted)' }}>{label}</label>
      <div className="lg-glass-card squircle-md px-3.5 py-3 flex items-center gap-2"
        style={showError
          ? { boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.14), 0 0 0 2px rgba(220,38,38,0.55), 0 12px 40px -12px rgba(0,0,0,0.55)', borderColor: 'rgba(220,38,38,0.65)' }
          : focused
          ? { boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.14), 0 0 0 2px rgba(0,214,254,0.45), 0 12px 40px -12px rgba(0,0,0,0.55)', borderColor: 'rgba(0,214,254,0.55)' }
          : undefined}>
        <input type={type} value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} autoFocus={autoFocus}
          onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} className="auth-input sf text-[15px] flex-1" />
        {rightSlot}
      </div>
      {(hint || showError) && (
        <div className="sf text-[10.5px] mt-1.5 px-1 leading-snug" style={{ color: showError ? '#FCA5A5' : 'var(--text-faint)' }}>
          {showError ? error : hint}
        </div>
      )}
    </div>
  );
};

/* SignIn / SignUp form body — single component, owns mode state.

const SignInForm = ({ onSubmit, onSignUp }) => {

        <GlassField label="Password" type={showPw ? 'text' : 'password'} value={password} onChange={setPassword}

      </div>
      {/* Primary CTA — sticky to the bottom of the viewport on mobile so
          the user can submit from anywhere in the (often-tall) Sign Up

          - `z-30` keeps it above the OR/Apple/Google block that follows

/* ============================================================
   5. HOME — DS Home composition: Header → Circles → GameCard →
   Drops → Following → Storytelling → TeamMoments
   ============================================================ */

/* HighlightCircles — DS sort: YOU → followed teams (live first) → followed players (claimed first).
   No Add button (DS doesn't have one — empty state is a separate invite card).

   Tap behavior (per May-2026 Yoni spec): every circle opens a VIDEO viewer,
   never a profile/game-stats page.
     - YOU             → HighlightViewer (story-style 9:16 reel) starting at
                         your most recent moment, then auto-advances through
                         the rest of the moment feed.
     - Team-member     → HighlightViewer starting at that player's most
                         recent moment, then feeds onward.
     - Live team       → GameVideoViewer for the live game (16:9 landscape
                         video in portrait phone shell, fullscreen on
                         desktop).
     - Non-live team   → GameVideoViewer of that team's most recent finished
                         game (e.g. Tigers vs another team highlight).
   Seed data caveat: SEED_MOMENTS are currently all "self" so the per-player
   start indices collapse to 0 in this prototype. The routing contract is
   correct; the data will get its own per-player slicing later. */
const HighlightCircles = ({ onPickMoment, onOpenGame, onOpenGameVideo, onOpenAthlete }) => {
  const liveGame = SEED_GAMES.find(g => g.status === 'live');
  /* Helper: pick a representative game id for a non-live team circle.
     Order of preference: most-recent finished/just-ended game whose home
     OR away matches → first upcoming game for that team → fall back to
     the live game so the click never dead-ends in the prototype. */
  const gameIdForTeam = (teamName) => {
    const finished = SEED_GAMES.find(g =>
      (g.status === 'just-ended' || g.status === 'final')
      && (g.home === teamName || g.away === teamName));
    if (finished) return finished.id;
    const upcoming = SEED_GAMES.find(g =>
      g.status === 'upcoming'
      && (g.home === teamName || g.away === teamName));
    if (upcoming) return upcoming.id;
    return liveGame ? liveGame.id : (SEED_GAMES[0] && SEED_GAMES[0].id);
  };
  /* Per-person starting index inside the moment feed. Until SEED_MOMENTS
     carries personId, every circle starts at 0 — but the contract is in
     place for when we slice data per player. */
  const indexForPerson = (_personId) => 0;
  return (
    <div className="px-5 lg:px-8 xl:px-12 pt-2 pb-5">
      <div className="flex gap-4 overflow-x-auto no-scrollbar">
        {/* YOU — opens HighlightViewer starting at your latest moment. */}
        <IdentityCircle kind="self" avatar={{ initial: 'T' }} label="You" isNew
          onClick={() => onPickMoment(indexForPerson('self'))} />
        {/* Live team — opens GameVideoViewer of the live game. */}
        <IdentityCircle kind="team" avatar={{ initial: 'EP' }} label="Varsity"
          liveGame={{ gameId: liveGame.id }}
          onClick={() => onOpenGameVideo(liveGame.id)} />
        {/* Non-live team — opens GameVideoViewer of the team's last/next
            game so the circle leads to actual team video, not a profile. */}
        <IdentityCircle kind="team" avatar={{ initial: 'LH' }} label="Tigers"
          onClick={() => onOpenGameVideo(gameIdForTeam('Tigers'))} />
        {/* Followed players — every circle opens HighlightViewer at that
            player's most recent moment (claimed silhouette + unclaimed
            jersey both behave the same — tap = watch their reel). */}
        <IdentityCircle kind="player" avatar={{ initial: 'S' }} team={{ initial: 'EP' }} label="Sarah" isClaimed isNew
          onClick={() => onPickMoment(indexForPerson('sarah'))} />
        <IdentityCircle kind="player" avatar={{ initial: 'D' }} team={{ initial: 'EP' }} label="Dylan" isClaimed
          onClick={() => onPickMoment(indexForPerson('dylan'))} />
        <IdentityCircle kind="player" avatar={{ jersey: 23 }} team={{ initial: 'EP' }} label="Player #23" isClaimed={false}
          onClick={() => onPickMoment(indexForPerson('p-23'))} />
        <IdentityCircle kind="player" avatar={{ jersey: 11 }} team={{ initial: 'LH' }} label="Player #11" isClaimed={false}
          onClick={() => onPickMoment(indexForPerson('p-11'))} />
      </div>
    </div>
  );
};

/* GameCard — morphing variants.
   Renders 5 states from the DS spec (off | pre | live | just-ended | ready).
   `error` is intentionally skipped for the prototype.

   Demo cycle: tapping any variant's eyebrow strip advances the displayed
   state. The off state (NextGameTeaser) is the resting home; tapping its
   eyebrow ENTERS the game-day cycle at `pre`. Once inside the cycle,
   tapping advances through pre → live → just-ended → ready → pre — never
   returns to off (off is non-cyclic).

   Internal state lets the demo work even when the parent passes a fixed
   `state` prop — we use the prop as the initial value, then override on
   user interaction. */
/* Demo-only state sequencing for the morph GameCard.
   GAME_CYCLE — the 4 "game-day" states that loop in the legacy
                tap-the-eyebrow flow (off enters via the eyebrow on the
                resting NextGameTeaser).
   ALL_STATES  — the FULL 5-state sequence used by StateNav prev/next
                so demo viewers can also step back to the off resting
                state, not just cycle through the active 4.
   advanceState — pure helper, wraps both directions around the 5-state
                array. Used by the StateNav arrow buttons. */
/* 'ad' is the sponsored-banner slot — included in the demo cycle so
   reviewers see how the morph card looks when monetised. Lives between
   'ready' and looping back to 'pre' (a natural "content pause"). */
const GAME_CYCLE = ['pre', 'live', 'just-ended', 'ready', 'ad'];
const ALL_STATES = ['off', 'pre', 'live', 'just-ended', 'ready', 'ad'];
const nextDemoState = (s) => {
  if (s === 'off') return 'pre';
  const i = GAME_CYCLE.indexOf(s);
  return GAME_CYCLE[(i + 1) % GAME_CYCLE.length];
};
const advanceState = (s, dir) => {
  const i = ALL_STATES.indexOf(s);
  const n = (i + dir + ALL_STATES.length) % ALL_STATES.length;
  return ALL_STATES[n];
};

/* StateNav — compact glass-pill prev/next chevron pair.
   Renders as `[ < ‖ > ]` — two 24x24 buttons split by a hairline,
   wrapped in a frosted glass capsule that matches the liquid-glass
   language without competing with real app chrome. Sits adjacent to
   each variant's eyebrow so the demo viewer can step forward OR back
   through the 5-state sequence (off + 4 active states).

   stopPropagation on each click so taps don't bubble to the parent
   card's onClick (which would open the linked game/drop). */
const StateNav = ({ onPrev, onNext }) => {
  const handle = (e, fn) => { e.stopPropagation(); e.preventDefault(); fn(); };
  return (
    <div className="inline-flex items-center rounded-full overflow-hidden shrink-0"
      style={{
        background: 'rgba(255,255,255,0.06)',
        border: '1px solid var(--glass-card-border)',
        backdropFilter: 'blur(12px) saturate(160%)',
        WebkitBackdropFilter: 'blur(12px) saturate(160%)',
        boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.06)',
      }}
      title="Step through demo states"
      onClick={(e) => e.stopPropagation()}>
      <button type="button" onClick={(e) => handle(e, onPrev)} aria-label="Previous demo state"
        className="w-6 h-6 flex items-center justify-center transition-all hover:bg-white/10 active:scale-[0.92]"
        style={{ color: 'var(--text-tertiary)' }}>
        <svg width={9} height={9} viewBox="0 0 14 14" fill="none" stroke="currentColor"
          strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"
          className="icon-flip-rtl" style={{ width: 9, height: 9, display: 'block' }}>
          <path d="M9 3 L5 7 L9 11" />
        </svg>
      </button>
      <div className="w-px h-3" style={{ background: 'var(--glass-card-border)' }} />
      <button type="button" onClick={(e) => handle(e, onNext)} aria-label="Next demo state"
        className="w-6 h-6 flex items-center justify-center transition-all hover:bg-white/10 active:scale-[0.92]"
        style={{ color: 'var(--text-tertiary)' }}>
        <svg width={9} height={9} viewBox="0 0 14 14" fill="none" stroke="currentColor"
          strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"
          className="icon-flip-rtl" style={{ width: 9, height: 9, display: 'block' }}>
          <path d="M5 3 L9 7 L5 11" />
        </svg>
      </button>
    </div>
  );
};

/* CycleEyebrow — reusable tappable eyebrow strip. Renders a row with a
   pulse dot + uppercase tracking-wide label, and on tap calls onCycle to
   advance the demo. The cursor + active-scale make it discoverable as a

const CycleEyebrow = ({ children, onCycle, color = 'var(--brand-cyan-text)', glow = '0 0 12px rgba(0,214,254,0.95), 0 0 4px rgba(0,214,254,0.65)', trailing }) => (

            <div className="absolute rounded-full anim-pulse-dot"
              style={{
                top: 2, insetInlineEnd: 2, width: 14, height: 14,
                background: 'var(--brand-cyan)',
                boxShadow: '0 0 12px rgba(0,214,254,0.7), 0 0 0 2.5px var(--canvas-bg)',
              }} />
          </div>
          <h2 className="sf-display text-[22px] font-bold leading-[1.05] tracking-[-0.02em] mb-2" style={{ color: 'var(--text-primary)' }}>
            Never miss a moment
          </h2>
          <p className="sf text-[12.5px] leading-relaxed mb-6 max-w-[300px]" style={{ color: 'var(--text-tertiary)' }}>
            Halo notifies you when it actually matters. No spam — just the stuff worth opening the app for.
          </p>
          <ul className="space-y-2.5 mb-6 w-full">
            {NOTIFY_PERKS.map(perk => (
              <li key={perk} className="flex items-center gap-3 text-start">
                <span className="w-6 h-6 rounded-full flex items-center justify-center shrink-0"
                  style={{ background: 'var(--brand-cyan-soft)', border: '1px solid var(--brand-cyan-border)', color: 'var(--brand-cyan-text)' }}>
                  <svg width={11} height={11} viewBox="0 0 14 14" fill="none" stroke="currentColor"
                    strokeWidth={2.4} strokeLinecap="round" strokeLinejoin="round"
                    style={{ width: 11, height: 11, display: 'block' }}>
                    <path d="M3 7 L6 10 L11 4" />
                  </svg>
                </span>
                <span className="sf text-[12.5px] font-medium" style={{ color: 'var(--text-primary)' }}>{perk}</span>
              </li>
            ))}
          </ul>
          <button onClick={onClose}
            className="squircle-md py-3.5 w-full sf text-[14px] font-semibold"
            style={{
              color: '#0a0d18',
              background: 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
              boxShadow: '0 8px 24px -8px rgba(0,214,254,0.55), inset 0 1px 0 rgba(255,255,255,0.40)',
            }}>
            Allow notifications
          </button>
          <button onClick={onClose} className="w-full sf text-[12px] py-2 mt-1.5 text-center" style={{ color: 'var(--text-tertiary)' }}>
            Not now
          </button>
        </div>
      </div>
    </div>
  );
};

/* MorphPreCard — extracted into its own component so its useState +
   useEffect hooks live at the top of THIS function's scope, not nested
   inside a GameCard conditional. Rules-of-Hooks compliance: when state
   transitions in/out of this branch, the component mounts/unmounts as
   a whole, instead of changing the hook count of its parent mid-render
   (which would crash React with a black-screen runtime error). Same
   fix pattern is applied to MorphLiveCard below. */
const MorphPreCard = ({ cycle, goPrev, goNext, onNotify }) => {
  const g = SEED_GAMES.find(x => x.status === 'upcoming') || SEED_GAMES[0];
  const [remaining, setRemaining] = useState(Math.max(0, Math.min(g.kickoffInSec ?? 7200, 7200)));
  useEffect(() => {
    const tick = setInterval(() => setRemaining(r => Math.max(0, r - 1)), 1000);
    return () => clearInterval(tick);
  }, []);
  const isImminent = remaining > 0 && remaining < 600;
  const progress = 100 - Math.min(100, remaining / 72);
  return (
    <div className={`relative squircle-md p-4 overflow-hidden lg-aura ${isImminent ? 'lg-pre-imminent' : ''}`}
        style={{
          background: `radial-gradient(ellipse 60% 70% at 18% 28%, rgba(0,214,254,${isImminent ? 0.22 : 0.12}) 0%, transparent 60%), radial-gradient(ellipse 60% 70% at 88% 78%, rgba(132,88,255,0.10) 0%, transparent 60%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)`,
          border: '1px solid var(--glass-card-border)',
          backdropFilter: 'blur(36px) saturate(180%)',
          WebkitBackdropFilter: 'blur(36px) saturate(180%)',
          boxShadow: `inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow), 0 0 ${isImminent ? 40 : 20}px -8px rgba(0,214,254,${isImminent ? 0.40 : 0.18})`,
        }}>
        <div className="relative z-10 flex items-center justify-between mb-3">
          <button onClick={cycle} className="flex items-center gap-2 -m-1 p-1 squircle-sm active:scale-[0.96]" title="Tap to cycle demo state">
            <div className="w-1.5 h-1.5 rounded-full bg-halo-cyan anim-pulse-dot" style={{ boxShadow: '0 0 8px rgba(0,214,254,0.7)' }} />
            <span className="sf text-[10px] font-bold tracking-[0.16em] uppercase" style={{ color: 'var(--brand-cyan-text)' }}>
              {isImminent ? 'Starting soon' : 'Drop incoming · pre-game'}
            </span>
          </button>
          <StateNav onPrev={goPrev} onNext={goNext} />
        </div>
        <div className="relative z-10">
          <div className="sf-display text-[20px] font-bold tracking-[-0.015em] leading-none" style={{ color: 'var(--text-primary)' }}>{g.home}</div>
          <div className="sf text-[12.5px] mt-1" style={{ color: 'var(--text-secondary)' }}>vs {g.away}</div>
          <div className="sf text-[11px] mt-1" style={{ color: 'var(--text-tertiary)' }}>{g.venue || 'Eastside Gym'}</div>
        </div>
        {/* Countdown row + Notify me CTA aligned on opposite ends.
            justify-between pushes the cyan-soft "Notify me" pill to the
            trailing edge so the cluster reads as "big number / action
            button" — same RH-edge alignment the just-ended prep card uses,
            keeping the pre/post-game CTA in a predictable visual spot. */}
        <div className="relative z-10 mt-4 flex items-end justify-between gap-3">
          <div className="flex items-baseline gap-2 min-w-0">
            <div className="sf-display text-[34px] font-bold tabular-nums leading-none"
              style={{ color: 'var(--text-primary)', textShadow: isImminent ? '0 0 18px rgba(0,214,254,0.40)' : 'none' }}>
              {fmt.countdown(remaining)}
            </div>
            <span className="sf text-[11px]" style={{ color: 'var(--text-tertiary)' }}>tipoff</span>
          </div>
          <button onClick={onNotify}
            className="shrink-0 sf text-[11px] font-bold squircle-sm px-3 py-2 inline-flex items-center gap-1.5 transition-all hover:scale-[1.02] active:scale-[0.97]"
            style={{
              color: 'var(--brand-cyan-text)',
              background: 'var(--brand-cyan-soft)',
              border: '1px solid var(--brand-cyan-border)',
              boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.10)',
            }}>
            <svg width={11} height={11} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round" style={{ width: 11, height: 11, display: 'block' }}>
              <path d="M3.5 6 a3.5 3.5 0 0 1 7 0 v2 l1 1.5 H2.5 l1 -1.5 Z" />
              <path d="M5.5 10 a1.5 1.5 0 0 0 3 0" />
            </svg>
            Notify me
          </button>
        </div>
      <div className="relative z-10 h-[3px] mt-3 overflow-hidden rounded-full" style={{ background: 'var(--hairline-strong)' }}>
        <div className="h-full bg-halo-cyan" style={{
          width: progress + '%',
          transition: 'width 1s linear',
          boxShadow: `0 0 ${isImminent ? 14 : 8}px rgba(0,214,254,${isImminent ? 0.75 : 0.5})`,
        }} />
      </div>
    </div>
  );
};

/* MorphLiveCard — extracted for the same Rules-of-Hooks reason as
   MorphPreCard. Its useState + useEffect for the moments ticker live
   at the top of THIS component's scope, so transitions in/out of the
   live state mount/unmount the component cleanly. */
const MorphLiveCard = ({ cycle, goPrev, goNext, onOpenGame }) => {
  const g = SEED_GAMES.find(x => x.status === 'live') || SEED_GAMES[0];
  const [moments, setMoments] = useState(g.momentsCount || 5);
  useEffect(() => {
    const t = setInterval(() => setMoments(m => m + (Math.random() > 0.5 ? 1 : 0)), 6000);
    return () => clearInterval(t);
  }, []);
  return (
    <div role="button" tabIndex={0} onClick={() => onOpenGame(g.id)}
      className="relative w-full text-start squircle-md overflow-hidden lg-aura lg-shine lg-live-ember cursor-pointer"
      style={{
        background: 'linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)',
          border: '1px solid var(--glass-card-border)',
          backdropFilter: 'blur(36px) saturate(180%)',
          WebkitBackdropFilter: 'blur(36px) saturate(180%)',
          color: 'var(--text-primary)',
        }}>
        <div className="lg-live-amp" aria-hidden="true" />
        <div className="relative px-4 pt-3 pb-2 lg:px-5 flex items-center justify-between"
          style={{ borderBottom: '1px solid var(--hairline)', zIndex: 2 }}>
          <button onClick={(e) => { e.stopPropagation(); cycle(); }}
            className="live-red squircle-sm px-2 py-1 inline-flex items-center gap-1.5 active:scale-[0.96]" title="Tap to cycle demo state">
            <div className="w-2 h-2 rounded-full bg-white anim-pulse-dot" style={{ boxShadow: '0 0 6px rgba(255,255,255,0.95)', flexShrink: 0 }} />
            <span className="sf text-[10px] font-bold tracking-[0.18em] uppercase leading-none" style={{ color: '#FFF' }}>LIVE</span>
          </button>
          <div className="flex items-center gap-2">
            <span className="sf text-[10px] font-medium tracking-tight" style={{ color: 'var(--text-muted)' }}>{moments} moments</span>
            <span className="sf text-[10px] font-semibold" style={{ color: 'var(--text-tertiary)' }}>· {g.period}</span>
            <StateNav onPrev={goPrev} onNext={goNext} />
          </div>
        </div>
        <div className="relative px-4 lg:px-5 py-4 flex items-center justify-between" style={{ zIndex: 2 }}>
          <div className="flex-1 min-w-0">
            <div className="sf-display text-[18px] font-bold leading-tight tracking-[-0.015em]" style={{ color: 'var(--text-primary)' }}>{g.home}</div>
            <div className="sf text-[12px]" style={{ color: 'var(--text-tertiary)' }}>vs {g.away}</div>
          </div>
          <div className="flex items-baseline gap-3 sf-display font-bold tabular-nums">
            <span className="text-[28px]" style={{ color: 'var(--text-primary)' }}>{g.scoreHome}</span>
            <span className="text-[16px]" style={{ color: 'var(--text-tertiary)' }}>—</span>
            <span className="text-[28px]" style={{ color: 'var(--text-tertiary)' }}>{g.scoreAway}</span>
          </div>
        </div>
      <div className="relative px-4 lg:px-5 pb-3 flex items-center justify-start" style={{ zIndex: 2 }}>
        <button onClick={(e) => { e.stopPropagation(); onOpenGame(g.id); }} className="lg-btn-primary squircle-sm sf text-[12px] font-bold px-4 py-2 flex items-center gap-1.5">
          <svg width={11} height={11} viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M3 2 L12 7 L3 12 Z" /></svg>
          Watch live
        </button>
      </div>
    </div>
  );
};

/* MorphAdCard — sponsored-banner variant of the morph card.
   Renders the YONI × CLAUDE custom creative. <picture> swaps the
   asset by breakpoint:
     - Phone (default): 1.91/1 frame + vertical-stack creative
     - Desktop (lg+):   4/1 frame + horizontal-layout creative
   Aspect ratio is breakpoint-aware on the card frame, and the
   <picture> element ships the right image at each breakpoint so
   nothing gets cropped at either layout.
   Top chrome (Sponsored disclosure + StateNav) sits over the image
   with semi-transparent backgrounds so the eyebrow-tap-cycle pattern
   stays consistent with every other morph variant. */
const MorphAdCard = ({ cycle, goPrev, goNext }) => {
  return (
    <div className="relative w-full squircle-md overflow-hidden lg-aura lg-shine aspect-[1.91/1] lg:aspect-[4/1]"
      style={{
        // Yoni-x-Claude poster's light-blue bg, shown behind the img while it decodes
        background: '#9CC9E6',
        border: '1px solid var(--glass-card-border)',
        boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
        color: '#FFF',
      }}>

      {/* Full-bleed creative. Browser picks the right source by media
          query — no JS resize listener, no extra render path. */}
      <picture style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', display: 'block', pointerEvents: 'none' }}>
        <source media="(min-width: 1024px)" srcSet={YONI_AD_DESKTOP_DATA_URI} />
        <img src={YONI_AD_DATA_URI}
          alt="Sponsored: Yoni x Claude — A Netflix Series"
          draggable={false}
          style={{
            width: '100%', height: '100%',
            objectFit: 'cover', objectPosition: 'center',
          }} />
      </picture>

      {/* Top chrome — Sponsored disclosure (eyebrow tap target,
          advances state) + StateNav. Dark-tinted pill backdrops
          keep the chrome legible over the light-blue poster bg. */}
      <div className="absolute top-3 inset-x-3 z-20 flex items-center justify-between">
        <button onClick={cycle} className="squircle-sm px-2 py-1 inline-flex items-center gap-1.5 active:scale-[0.96]" title="Tap to cycle demo state"
          style={{
            background: 'rgba(0,0,0,0.55)',
            backdropFilter: 'blur(8px)',
            WebkitBackdropFilter: 'blur(8px)',
            border: '1px solid rgba(255,255,255,0.08)',
          }}>
          <span className="sf text-[9px] font-bold tracking-[0.18em] uppercase leading-none"
            style={{ color: 'rgba(255,255,255,0.85)' }}>
            Sponsored
          </span>
        </button>
        <StateNav onPrev={goPrev} onNext={goNext} />
      </div>
    </div>
  );
};

/* MorphJustEndedCard / MorphReadyCard / MorphOffCard — these branches
   don't have their own hooks, so they're rendered inline as plain JSX
   sub-trees from GameCard's switch below. Only PRE + LIVE needed
   component extraction (they call useState/useEffect for tickers). */
const GameCard = ({ state: initialState = 'off', onOpenGame, onOpenDrop, atVenue = false, onStartCapture }) => {
  const [state, setState] = useState(initialState);
  /* Notify-me overlay state — driven by Notify me CTAs on PRE + just-ended
     variants. Lives at GameCard root so:
     1. The overlay can render as a sibling of any state's card (escapes
        per-card overflow:hidden contexts).
     2. The user can open it from any variant that has a CTA (currently
        PRE for tipoff alerts + just-ended for drop-ready alerts).
     3. Cycling states while the overlay is open doesn't unmount it. */
  const [notifyOpen, setNotifyOpen] = useState(false);
  const openNotify = () => setNotifyOpen(true);
  const cycle = () => setState(nextDemoState);
  const goPrev = () => setState(s => advanceState(s, -1));
  const goNext = () => setState(s => advanceState(s, +1));

  /* Capture override — when the "I'm at the venue" SideMenu toggle is
     on, the morph card becomes the red-glow Capture variant regardless
     of any other state. Returns early before the normal switch since
     atVenue trumps the demo cycle (no StateNav arrows on capture). */
  if (atVenue) {
    return <MorphCaptureCard onStartCapture={onStartCapture || (() => { window.location.hash = '#/capture'; })} />;
  }

  /* Render strategy: every state branch assigns `card`, then a single
     fragment return wraps the card + the optional overlay. That way the
     overlay renders regardless of which state is active. */
  let card;

  /* PRE — countdown card (hooks isolated in MorphPreCard component). */
  if (state === 'pre') {
    card = <MorphPreCard cycle={cycle} goPrev={goPrev} goNext={goNext} onNotify={openNotify} />;
    return (
      <>
        {card}
        {notifyOpen && <NotifyMeOverlay onClose={() => setNotifyOpen(false)} />}
      </>
    );
  }
  /* LIVE — in-game card with moments ticker (hooks isolated in MorphLiveCard). */
  if (state === 'live') {
    return <MorphLiveCard cycle={cycle} goPrev={goPrev} goNext={goNext} onOpenGame={onOpenGame} />;
  }

  /* AD — sponsored billboard variant. No hooks needed (static creative)
     but extracted to its own component for consistency with the other
     state branches. */
  if (state === 'ad') {
    return <MorphAdCard cycle={cycle} goPrev={goPrev} goNext={goNext} />;
  }

  /* ── JUST-ENDED ── Score's final, drop assembling. Animated cyan ring +
     78% progress bar. Direct port of DS GameCardJustEnded. */
  if (state === 'just-ended') {
    const g = SEED_GAMES.find(x => x.status === 'just-ended') || SEED_GAMES[0];
    return (
      <div className="relative squircle-md overflow-hidden"
        style={{
          background: 'radial-gradient(ellipse 50% 70% at 22% 28%, rgba(0,214,254,0.10) 0%, transparent 60%), radial-gradient(ellipse 50% 70% at 80% 78%, rgba(255,170,90,0.08) 0%, transparent 60%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)',
          border: '1px solid var(--glass-card-border)',
          backdropFilter: 'blur(36px) saturate(180%)',
          WebkitBackdropFilter: 'blur(36px) saturate(180%)',
          boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
        }}>
        <div className="relative z-10 px-4 pt-3 pb-2 flex items-center justify-between" style={{ borderBottom: '1px solid var(--hairline)' }}>
          <button onClick={cycle} className="flex items-center gap-2 -m-1 p-1 squircle-sm active:scale-[0.96]" title="Tap to cycle demo state">
            <div className="w-1.5 h-1.5 rounded-full bg-halo-cyan anim-pulse-dot" style={{ boxShadow: '0 0 8px rgba(0,214,254,0.7)' }} />
            <span className="sf text-[10px] font-bold tracking-[0.14em] uppercase" style={{ color: 'var(--brand-cyan-text)' }}>Drop incoming</span>
          </button>
          <div className="flex items-center gap-2">
            <span className="sf text-[10px] font-bold tracking-[0.14em] uppercase" style={{ color: 'var(--text-tertiary)' }}>Final</span>
            <StateNav onPrev={goPrev} onNext={goNext} />
          </div>
        </div>
        <div className="relative z-10 p-4 flex items-end justify-between">
          <div>
            <div className="sf-display text-[15px] font-bold tracking-[-0.01em] leading-tight" style={{ color: 'var(--text-primary)' }}>{g.home}</div>
            <div className="sf text-[11.5px] mt-0.5" style={{ color: 'var(--text-secondary)' }}>vs {g.away}</div>
          </div>
          <div className="sf-display text-[28px] font-bold tabular-nums leading-none" style={{ color: 'var(--text-primary)' }}>
            {g.scoreHome}<span className="mx-2" style={{ color: 'var(--text-faint)' }}>·</span>{g.scoreAway}
          </div>
        </div>
        <div className="relative z-10 px-4 pb-4">
          {/* Prep card — single-line "Building drop... 78%" headline now
              carries the percentage inline (replaces the prior "N moments
              captured" headline + "Building drop · 78%" sub-text combo —
              one less line, percentage stays prominent). Notify me CTA
              opens the NotifyMeOverlay so the user can opt-in to push
              before the drop finishes. */}
          <div className="squircle-sm p-3 flex items-center gap-3 lg-prep-card"
            style={{
              background: 'var(--glass-card-bg)',
              border: '1px solid var(--brand-cyan-border)',
              boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), 0 4px 14px -6px rgba(0,214,254,0.25)',
            }}>
            <div className="relative w-12 h-12 shrink-0 flex items-center justify-center">
              <div className="absolute inset-0 rounded-full lg-prep-spinner"
                style={{
                  background: 'conic-gradient(from 0deg, transparent 0deg, transparent 240deg, rgba(0,214,254,0.85) 320deg, rgba(0,214,254,0.95) 340deg, transparent 360deg)',
                  mask: 'radial-gradient(circle, transparent 14px, black 15px)',
                  WebkitMask: 'radial-gradient(circle, transparent 14px, black 15px)',
                }} />
              <div className="w-7 h-7 rounded-full lg-glass-strong flex items-center justify-center"
                style={{ boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.30), 0 0 12px -2px rgba(0,214,254,0.45)' }}>
                <svg width={12} height={12} viewBox="0 0 14 14" fill="none" stroke="var(--brand-cyan-text)" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round" style={{ width: 12, height: 12, display: 'block' }}>
                  <path d="M2 7 L5 10 L12 3" />
                </svg>
              </div>
            </div>
            <div className="flex-1 min-w-0">
              <div className="sf text-[12.5px] font-semibold leading-tight tabular-nums" style={{ color: 'var(--text-primary)' }}>Building drop… 78%</div>
              <div className="h-[3px] mt-2 overflow-hidden rounded-full" style={{ background: 'var(--hairline-strong)' }}>
                <div className="h-full bg-halo-cyan anim-pulse" style={{ width: '78%', boxShadow: '0 0 10px rgba(0,214,254,0.65)' }} />
              </div>
            </div>
            <button onClick={() => setNotifyOpen(true)}
              className="shrink-0 sf text-[11px] font-bold squircle-sm px-3 py-2 inline-flex items-center gap-1.5 transition-all hover:scale-[1.02] active:scale-[0.97]"
              style={{
                color: 'var(--brand-cyan-text)',
                background: 'var(--brand-cyan-soft)',
                border: '1px solid var(--brand-cyan-border)',
                boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.10)',
              }}>
              <svg width={11} height={11} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round" style={{ width: 11, height: 11, display: 'block' }}>
                <path d="M3.5 6 a3.5 3.5 0 0 1 7 0 v2 l1 1.5 H2.5 l1 -1.5 Z" />
                <path d="M5.5 10 a1.5 1.5 0 0 0 3 0" />
              </svg>
              Notify me
            </button>
          </div>
        </div>
        {notifyOpen && <NotifyMeOverlay onClose={() => setNotifyOpen(false)} />}
      </div>
    );
  }

  /* ── READY ── The payoff. Drop is assembled, tap to reveal.
     Direct port of DS GameCardReady — stacked-cards bottom block. */
  if (state === 'ready') {
    const g = SEED_GAMES.find(x => x.status === 'just-ended') || SEED_GAMES[0];
    const winning = (g.scoreHome || 0) > (g.scoreAway || 0);
    const margin = Math.abs((g.scoreHome || 0) - (g.scoreAway || 0));
    return (
      <button onClick={() => onOpenDrop(g.id)}
        className="relative w-full text-start squircle-md overflow-hidden lg-aura lg-shine lg-ready-ember active:scale-[0.98]"
        style={{
          background: 'radial-gradient(ellipse 60% 70% at 22% 28%, rgba(0,214,254,0.18) 0%, transparent 60%), radial-gradient(ellipse 60% 70% at 80% 78%, rgba(132,88,255,0.10) 0%, transparent 60%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)',
          border: '1px solid var(--brand-cyan-border)',
          backdropFilter: 'blur(36px) saturate(180%)',
          WebkitBackdropFilter: 'blur(36px) saturate(180%)',
          transition: 'transform 120ms cubic-bezier(.2,.8,.2,1)',

   ============================================================ */

/* DateNavbar — 58px lg-glass pill, prev/next chevrons, center eyebrow + label */
const DateNavbar = ({ value, onChange }) => {
  const idx = Math.max(0, DATE_OPTIONS.findIndex(d => d.key === value));
  const cur = DATE_OPTIONS[idx];
  const atStart = idx === 0;
  const atEnd   = idx === DATE_OPTIONS.length - 1;
  const eyebrow = cur.dayDelta === 0
    ? 'TODAY'
    : cur.dayDelta < 0
      ? `${Math.abs(cur.dayDelta)} DAY${Math.abs(cur.dayDelta) > 1 ? 'S' : ''} AGO`
      : `IN ${cur.dayDelta} DAY${cur.dayDelta > 1 ? 'S' : ''}`;
  return (
    <div className="lg-glass squircle-md flex items-stretch overflow-hidden" style={{ height: 58 }}>
      <button onClick={() => !atStart && onChange(DATE_OPTIONS[idx - 1].key)} disabled={atStart}
        className="w-14 flex items-center justify-center transition-colors"
        style={{ color: atStart ? 'var(--text-disabled)' : 'var(--text-secondary)' }}
        aria-label="Previous day">
        <svg width={14} height={14} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">
          <path d="M8.5 2.5 L4 7 L8.5 11.5" />
        </svg>
      </button>
      <div className="flex-1 flex flex-col items-center justify-center">
        <span className="sf text-[9px] tracking-[0.18em] uppercase font-bold leading-none"
          style={{ color: cur.dayDelta === 0 ? 'var(--brand-cyan-text)' : 'var(--text-muted)' }}>
          {eyebrow}
        </span>
        <span className="sf-display text-[14px] font-bold tracking-[-0.01em] mt-1 leading-none" style={{ color: 'var(--text-primary)' }}>
          {cur.label}
        </span>
      </div>
      <button onClick={() => !atEnd && onChange(DATE_OPTIONS[idx + 1].key)} disabled={atEnd}
        className="w-14 flex items-center justify-center transition-colors"
        style={{ color: atEnd ? 'var(--text-disabled)' : 'var(--text-secondary)' }}
        aria-label="Next day">

          <path d="M5.5 2.5 L10 7 L5.5 11.5" />
        </svg>
      </button>

  );
};

/* SectionLabel for the Games tab — color-coded dot + label + flowing hairline */

/* HorizontalGameCard — unified mental model across all three statuses.
   LIVE  = bigger/bolder cinematic hero. Score is the focal point —
           62px tabular nums centered. Live pulse pill top-leading.
           No court SVG decoration. Team-color radial blobs come from
           each team's accent palette so different matchups read distinct.
   UPCOMING / ENDED = compact row. One layout, differentiated by:
     - leading-edge accent color (cyan / neutral)
     - editorial right column (countdown number / score with W/L dim)
     - eyebrow chrome (Tipoff vs Final + moments pill) */
const HorizontalGameCard = ({ game, onOpenGame }) => {
  const isLive     = game.status === 'live';
  const isUpcoming = game.status === 'upcoming';
  const isEnded    = game.status === 'just-ended' || game.status === 'final';
  const homeTeam   = teamByName(game.home);
  const awayTeam   = teamByName(game.away);

  /* ── LIVE HERO ──────────────────────────────────────────
     220px+ min-height block. Score lives center-aligned at clamp(56,14vw,72)px
     so it commands the card on phone and desktop alike. Team-color blobs
     in opposite corners give matchup-specific identity without a court SVG. */
  if (isLive) {
    return (
      <button onClick={() => onOpenGame(game.id)}
        className="w-full text-start relative squircle-md overflow-hidden lg-aura lg-shine lg-live-ember flex flex-col"
        style={{
          background: `
            radial-gradient(ellipse 95% 85% at 0% 0%, ${homeTeam.accentA} 0%, transparent 55%),
            radial-gradient(ellipse 95% 85% at 100% 100%, ${awayTeam.accentA} 0%, transparent 55%),
            radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0,170,220,0.18) 0%, transparent 65%),
            linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)`,
          backdropFilter: 'blur(40px) saturate(180%)',
          WebkitBackdropFilter: 'blur(40px) saturate(180%)',
          border: '1px solid var(--glass-card-border)',
          boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), 0 0 0 1px rgba(220,38,38,0.12), var(--glass-card-shadow)',
          color: 'var(--text-primary)',
          minHeight: 220,
        }}>
        <div className="lg-live-amp" aria-hidden="true" />
        <div className="absolute inset-0 hatch-dark opacity-[0.10] pointer-events-none" />

        {/* Top row — LIVE pill + moments count.
            The pill carries the period; moments count quietly anchors the
            top-end as ambient context — never the loudest thing. */}
        <div className="relative z-10 flex items-center justify-between p-5 lg:p-6">
          <div className="lg-glass live-red squircle-sm px-2.5 py-1 flex items-center gap-1.5">
            <span className="w-1.5 h-1.5 rounded-full bg-white anim-pulse-dot" />
            <span className="sf text-[10px] font-bold tracking-[0.18em] uppercase leading-none" style={{ color: '#FFF' }}>
              LIVE · {game.period || 'Q1'}
            </span>
          </div>
          {game.momentsCount != null && game.momentsCount > 0 && (
            <span className="sf text-[10.5px] font-bold tracking-[0.14em] uppercase" style={{ color: 'var(--text-muted)' }}>
              {game.momentsCount} moments
            </span>
          )}
        </div>

        {/* Editorial score block — THE hero.
            tabular-nums + clamp() means both phone and 640px desktop see
            the score as the most prominent thing on the card. */}
        <div className="relative z-10 flex-1 flex items-center justify-center px-5 lg:px-6 py-2">
          <div className="flex items-baseline gap-4 lg:gap-6">
            <span className="sf-display tabular-nums font-bold leading-none"
              style={{
                fontSize: 'clamp(54px, 14vw, 72px)',
                letterSpacing: '-0.045em',
                color: 'var(--text-primary)',
                textShadow: '0 0 18px rgba(0,214,254,0.28)',
              }}>
              {game.scoreHome}
            </span>
            <span className="sf-display font-bold leading-none"
              style={{
                fontSize: 'clamp(28px, 7vw, 40px)',
                letterSpacing: '-0.02em',
                color: 'var(--text-faint)',
              }}>–</span>
            <span className="sf-display tabular-nums font-bold leading-none"
              style={{
                fontSize: 'clamp(54px, 14vw, 72px)',
                letterSpacing: '-0.045em',
                color: 'var(--text-secondary)',
              }}>
              {game.scoreAway}
            </span>
          </div>
        </div>

        {/* Bottom row — teams (with crest pair) + Watch live CTA.
            Two micro-crests reinforce identity without competing with the score.
            CTA is cyan + a chevron — same affordance pattern as compact rows. */}
        <div className="relative z-10 flex items-end justify-between gap-4 px-5 lg:px-6 pb-5 lg:pb-6 pt-2">
          <div className="flex items-center gap-2.5 min-w-0 flex-1">
            <div className="relative shrink-0" style={{ width: 44, height: 28 }}>
              <div className="absolute" style={{ insetInlineStart: 0, top: 0 }}>
                <TeamCrest team={homeTeam} size={22} />
              </div>
              <div className="absolute" style={{ insetInlineEnd: 0, bottom: 0 }}>
                <TeamCrest team={awayTeam} size={22} />
              </div>
            </div>
            <div className="min-w-0">
              <div className="sf-display text-[14px] lg:text-[15px] font-bold leading-tight tracking-[-0.015em] truncate" style={{ color: 'var(--text-primary)' }}>
                {homeTeam.name} <span className="font-normal" style={{ color: 'var(--text-tertiary)' }}>vs.</span> {awayTeam.name}
              </div>
            </div>
          </div>
          <span className="sf text-[12px] font-bold tracking-tight flex items-center gap-1 shrink-0" style={{ color: 'var(--brand-cyan-text)', textShadow: '0 0 8px rgba(0,214,254,0.4)' }}>
            Watch live
            <svg width={11} height={11} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" className="icon-flip-rtl">
              <path d="M5.5 2.5 L10 7 L5.5 11.5" />
            </svg>
          </span>
        </div>
      </button>
    );
  }

  /* ── COMPACT ROW (upcoming + ended) ────────────────────
     Single layout. State communicated by leading-edge accent, eyebrow,
     and editorial right column. Stacked-crest cluster gives at-a-glance
     identity; loser crest dims on ended games for instant W/L read. */
  const homeWon = isEnded && (game.scoreHome ?? 0) > (game.scoreAway ?? 0);
  const awayWon = isEnded && (game.scoreAway ?? 0) > (game.scoreHome ?? 0);
  const c       = isUpcoming ? countdownParts(game.kickoffInSec) : null;
  const edgeBg  = isUpcoming
    ? 'linear-gradient(180deg, #00D6FE 0%, rgba(0,153,192,0.7) 100%)'
    : 'linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.04) 100%)';
  const edgeGlow = isUpcoming ? '0 0 12px rgba(0,214,254,0.55)' : 'none';
  return (
    <button onClick={() => onOpenGame(game.id)}
      className="w-full text-start relative squircle-md overflow-hidden lg-aura lg-shine"
      style={{
        background: isUpcoming
          ? `radial-gradient(ellipse 45% 100% at 0% 50%, rgba(0,214,254,0.10) 0%, transparent 60%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)`
          : `linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)`,
        backdropFilter: 'blur(36px) saturate(180%)',
        WebkitBackdropFilter: 'blur(36px) saturate(180%)',
        border: '1px solid var(--glass-card-border)',
        boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
        color: 'var(--text-primary)',
      }}>
      {/* Leading-edge accent bar */}
      <span className="absolute top-0 bottom-0 pointer-events-none" aria-hidden="true"
        style={{ insetInlineStart: 0, width: 4, background: edgeBg, boxShadow: edgeGlow }} />
      <div className="absolute inset-0 hatch-dark opacity-[0.10] pointer-events-none" />

      <div className="relative flex items-center gap-3.5 p-4 ps-5">
        {/* Stacked-crest cluster — 76×52 box, two 40px crests offset.
            Loser dims on ended games so W/L is readable without scanning score. */}
        <div className="relative shrink-0" style={{ width: 76, height: 52 }}>
          <div className="absolute" style={{ insetInlineStart: 0, top: 0, opacity: isEnded && awayWon ? 0.45 : 1 }}>
            <TeamCrest team={homeTeam} size={40} />
          </div>
          <div className="absolute" style={{ insetInlineEnd: 0, bottom: 0, opacity: isEnded && homeWon ? 0.45 : 1 }}>
            <TeamCrest team={awayTeam} size={40} />
          </div>
        </div>

        {/* Middle column — eyebrow + matchup + meta */}
        <div className="flex-1 min-w-0">
          {/* Eyebrow: status + (moments pill inline on ended games) */}
          <div className="flex items-center gap-2 mb-1">
            <span className="sf text-[10px] font-bold tracking-[0.18em] uppercase leading-none"
              style={{
                color: isUpcoming ? 'var(--brand-cyan-text)' : 'var(--text-muted)',
                textShadow: isUpcoming ? '0 0 6px rgba(0,214,254,0.28)' : 'none',
              }}>
              {isUpcoming
                ? 'Tipoff'
                : (game.when ? `Final · ${game.when}` : 'Final')}
            </span>
            {isEnded && game.momentsCount != null && game.momentsCount > 0 && (
              <span className="sf text-[9px] font-bold tracking-[0.10em] uppercase leading-none squircle-sm"
                style={{
                  color: 'var(--brand-cyan-text)',
                  background: 'rgba(0,214,254,0.10)',
                  border: '1px solid rgba(0,214,254,0.28)',
                  padding: '3px 6px',
                }}>
                {game.momentsCount} moments
              </span>
            )}
          </div>
          {/* Matchup line — primary text */}
          <div className="sf-display text-[15.5px] lg:text-[16px] font-bold leading-[1.18] tracking-[-0.015em] truncate" style={{ color: 'var(--text-primary)' }}>
            {isEnded ? (
              <>
                {homeWon ? homeTeam.name : awayTeam.name}
                <span className="font-normal" style={{ color: 'var(--text-tertiary)' }}> beat </span>
                {homeWon ? awayTeam.name : homeTeam.name}
              </>
            ) : (
              <>
                {homeTeam.name}
                <span className="font-normal" style={{ color: 'var(--text-tertiary)' }}> vs. </span>
                {awayTeam.name}
              </>
            )}
          </div>
          {/* Meta line — venue (upcoming) or empty (ended; date is in eyebrow) */}
          {isUpcoming && (
            <div className="sf text-[11px] mt-1 truncate" style={{ color: 'var(--text-muted)' }}>
              {game.venue || 'Home court'}
            </div>
          )}
        </div>

        {/* Right column — editorial number */}
        <div className="shrink-0 text-end ps-1">
          {isUpcoming && c && c.value !== null && (
            <div className="flex items-baseline justify-end leading-none">
              <span className="sf-display font-bold tabular-nums"
                style={{ fontSize: 38, letterSpacing: '-0.04em', color: 'var(--brand-cyan-text)', textShadow: '0 0 14px rgba(0,214,254,0.45)' }}>
                {c.value}
              </span>
              <span className="sf-display font-medium"
                style={{ fontSize: 17, marginInlineStart: 3, color: 'rgba(0,214,254,0.65)' }}>
                {c.unit}
              </span>
            </div>
          )}
          {isUpcoming && c && c.value === null && (
            <span className="sf-display font-bold leading-none"
              style={{ fontSize: 24, color: 'var(--brand-cyan-text)', textShadow: '0 0 12px rgba(0,214,254,0.45)' }}>
              NOW
            </span>
          )}
          {isEnded && (
            <div className="sf-display tabular-nums font-bold leading-none"
              style={{ fontSize: 28, letterSpacing: '-0.03em' }}>
              <span style={{ color: homeWon ? 'var(--text-primary)' : 'var(--text-tertiary)' }}>{game.scoreHome ?? '—'}</span>
              <span style={{ color: 'var(--text-faint)', padding: '0 5px' }}>–</span>
              <span style={{ color: awayWon ? 'var(--text-primary)' : 'var(--text-tertiary)' }}>{game.scoreAway ?? '—'}</span>
            </div>
          )}
          {/* Action affordance label — cyan on ended (Recap), chevron-only on upcoming */}
          {isEnded && (
            <div className="sf text-[10px] font-bold tracking-[0.14em] uppercase mt-1.5 flex items-center justify-end gap-1" style={{ color: 'var(--brand-cyan-text)' }}>
              Recap
              <svg width={9} height={9} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={2.2} strokeLinecap="round" strokeLinejoin="round" className="icon-flip-rtl">
                <path d="M5.5 2.5 L10 7 L5.5 11.5" />
              </svg>
            </div>
          )}
        </div>
      </div>
    </button>
  );
};

const GamesScreen = ({ onOpenGame, onOpenGameVideo }) => {
  const [date, setDate] = useState('d0');
  const ids = GAMES_BY_DATE[date] || [];
  const games = ids.map(id => SEED_GAMES.find(g => g.id === id)).filter(Boolean);
  const live     = games.filter(g => g.status === 'live');
  const upcoming = games.filter(g => g.status === 'upcoming');
  const ended    = games.filter(g => g.status === 'just-ended' || g.status === 'final');
  /* LIVE cards route to the full-game video player (cinematic stream),
     upcoming + ended route to the standard game page (PostGameScreen
     branches by status to render PreGame vs PostGame content). */
  const onOpen = (g) => g.status === 'live'
    ? onOpenGameVideo(g.id)
    : onOpenGame(g.id);

  return (
    <div className="anim-fade pb-28 sf relative" style={{ color: 'var(--text-primary)' }}>
      {/* Sticky header — Games title + count chip + DateNavbar.
          The fade strip spans full viewport; the inner column caps at 640px
          on desktop so it reads as a wide-phone hero, not a stretched billboard. */}
      <div className="relative z-20 sticky top-0 px-5 lg:px-8 xl:px-12 pt-12 pb-3 lg-header-fade">
        <div className="lg:max-w-[640px] lg:mx-auto">
          <div className="flex items-baseline gap-2.5 mb-3">
            <h1 className="sf-display text-[24px] font-bold leading-none tracking-[-0.025em]" style={{ color: 'var(--text-primary)' }}>Games</h1>
            <span className="sf text-[11px] tracking-tight font-medium" style={{ color: 'var(--text-muted)' }}>
              {games.length} scheduled
            </span>
          </div>
          <DateNavbar value={date} onChange={setDate} />
        </div>
      </div>

      {/* Body — same 640px cap so cards align with the DateNavbar above. */}
      <div className="px-5 lg:px-8 xl:px-12 pt-5 lg:max-w-[640px] lg:mx-auto space-y-5 anim-fade">
        {games.length === 0 && (
          <div className="lg-glass squircle-md p-8 text-center">
            <div className="w-12 h-12 rounded-full lg-glass-strong flex items-center justify-center mx-auto mb-3" style={{ color: 'var(--text-muted)' }}>
              <svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round">
                <rect x={3} y={5} width={18} height={16} rx={2} />
                <path d="M3 10 H21 M8 3 V7 M16 3 V7" />
              </svg>
            </div>
            <div className="sf-display text-[15px] font-bold tracking-[-0.01em] mb-1" style={{ color: 'var(--text-primary)' }}>No games on this day</div>
            <div className="sf text-[12px]" style={{ color: 'var(--text-muted)' }}>Use the chevrons above to find one</div>
          </div>
        )}
        {live.length > 0 && (
          <div>
            <GamesSectionLabel tone="live" label="Live now" />
            <div className="space-y-3">{live.map(g => <HorizontalGameCard key={g.id} game={g} onOpenGame={() => onOpen(g)} />)}</div>
          </div>
        )}
        {upcoming.length > 0 && (
          <div>
            <GamesSectionLabel tone="upcoming" label="Upcoming" />
            <div className="space-y-3">{upcoming.map(g => <HorizontalGameCard key={g.id} game={g} onOpenGame={() => onOpen(g)} />)}</div>
          </div>
        )}
        {ended.length > 0 && (
          <div>
            <GamesSectionLabel tone="ended" label="Final" />
            <div className="space-y-3">{ended.map(g => <HorizontalGameCard key={g.id} game={g} onOpenGame={() => onOpen(g)} />)}</div>
          </div>
        )}
      </div>
    </div>
  );
};

/* WatchSearchInput — lg-glass pill with search icon + suggestions
   dropdown when query is non-empty. */
const WatchSearchInput = ({ query, setQuery, onPickGame }) => {
  const [focused, setFocused] = useState(false);
  const matches = query.trim()
    ? SEED_GAMES.filter(g =>
        g.home.toLowerCase().includes(query.toLowerCase()) ||
        g.away.toLowerCase().includes(query.toLowerCase())
      ).slice(0, 5)
    : [];
  return (
    <div className="relative">
      <div className="lg-glass-strong squircle-sm h-9 px-3 flex items-center gap-2" style={{ minWidth: 200, color: '#fff' }}>
        <Icon name="search" size={14} />
        <input value={query} onChange={e => setQuery(e.target.value)}
          onFocus={() => setFocused(true)}
          onBlur={() => setTimeout(() => setFocused(false), 150)}
          placeholder="Search teams, players"
          className="auth-input sf text-[12.5px] flex-1" style={{ color: '#fff' }} />
        {query && (
          <button onClick={() => setQuery('')} className="opacity-65 hover:opacity-100">
            <Icon name="close" size={11} stroke={2} />
          </button>
        )}
      </div>
      {/* Search dropdown — was hardcoded rgba(20,22,30,0.95) which
          overrode lg-glass-strong's token-driven background and made
          the dropdown a dark island on cream in light mode. Now it
          relies entirely on lg-glass-strong's CSS for theme-aware
          surface, with text using --text-primary / --text-muted. */}
      {focused && matches.length > 0 && (
        <div className="absolute top-full inset-x-0 mt-2 lg-glass-strong squircle-md p-1 z-50">
          {matches.map(g => (
            <button key={g.id} onMouseDown={() => { onPickGame(g.id, g.status); setQuery(''); }}
              className="w-full flex items-center gap-2.5 px-3 py-2 squircle-sm hover:bg-white/5 text-start">
              <Icon name="search" size={11} />
              <span className="sf text-[12.5px] flex-1" style={{ color: 'var(--text-primary)' }}>{g.home} vs {g.away}</span>
              <span className="sf text-[10px]" style={{ color: 'var(--text-muted)' }}>
                {g.status === 'live' ? 'LIVE' : g.status === 'upcoming' ? fmt.until(g.kickoffInSec) : 'Final'}
              </span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
};

/* WatchRails — orchestrator for the 5 lanes. Honors activeDivision by
   filtering scope through WATCH_DIVISIONS[*].games whitelist. */
const WatchRails = ({ activeDivision, onPushGame, onPickMoment }) => {
  const div = activeDivision ? WATCH_DIVISIONS.find(d => d.id === activeDivision) : null;
  const liveGames = SEED_GAMES.filter(g => g.status === 'live');
  const ended = SEED_GAMES.filter(g => g.status === 'just-ended' || g.status === 'final');
  const scopedLive  = div ? liveGames.filter(g => div.games.includes(g.id)) : liveGames;
  const scopedEnded = div ? ended.filter(g => div.games.includes(g.id))    : ended;
  return (
    <>
      {scopedLive.length > 0 && (
        <WatchLane title="Live now">
          {scopedLive.map(g => <LiveCard key={g.id} game={g} onClick={() => onPushGame(g.id, 'live')} />)}
        </WatchLane>
      )}
      <WatchLane title="Full games">
        {scopedEnded.length > 0
          ? scopedEnded.map(g => <PosterCard key={g.id} game={g} big onClick={() => onPushGame(g.id, g.status)} />)
          : <EmptyScopedRail label="No full games in this division yet" />}
      </WatchLane>
      <WatchLane title="Game highlights">
        {scopedEnded.length > 0
          ? scopedEnded.slice(0, 5).map(g => <PosterCard key={g.id} game={g} big onClick={() => onPushGame(g.id, g.status)} />)
          : <EmptyScopedRail label="No highlights yet in this division" />}
      </WatchLane>
      <WatchLane title="Player highlights">
        {SEED_MOMENTS.map((m, i) => (
          <WatchVThumb key={m.id} moment={m} onClick={() => onPickMoment(i)} />
        ))}
      </WatchLane>
      <WatchLane title="Suggestions">
        {scopedEnded.length > 0
          ? scopedEnded.slice().reverse().slice(0, 6).map(g => <PosterCard key={g.id} game={g} big onClick={() => onPushGame(g.id, g.status)} />)
          : <EmptyScopedRail label="Pick a different division to see suggestions" />}
      </WatchLane>
    </>
  );
};

const EmptyScopedRail = ({ label }) => (
  <div className="shrink-0 lg-glass squircle-md px-5 py-4 flex items-center" style={{ width: 260, height: 156, color: 'rgba(255,255,255,0.65)' }}>

/* WatchScreen — phone + desktop trees. Phone uses absolute-positioned
   header over a 62vh FeaturedHero. Desktop uses WatchShell with
   WatchHeroDesktop slot + topBarCenter search slot. */
const WatchScreen = ({ onOpenGame, onOpenGameVideo, onPickMoment }) => {
  const [activeDivision, setActiveDivision] = useState(null);
  const [query, setQuery] = useState('');
  const [livePlayerGameId, setLivePlayerGameId] = useState(null);
  /* Watch tab is a VIDEO surface — all non-live taps route to the
     GameVideoViewer (16:9 video player), not to PostGameScreen (the
     stat recap). Upcoming games fall through to PostGame as a tease
     until the game starts. */
  const handlePush = (gameId, status) => {
    if (status === 'live') {
      setLivePlayerGameId(gameId);
      return;
    }
    if (status === 'upcoming') {
      onOpenGame(gameId);
      return;
    }
    onOpenGameVideo(gameId);
  };
  const body = (
    <>
      <DivisionTileGrid active={activeDivision} onPick={setActiveDivision} />
      <DivisionFilterChip active={activeDivision} onClear={() => setActiveDivision(null)} />
      <WatchRails activeDivision={activeDivision} onPushGame={handlePush} onPickMoment={onPickMoment} />
    </>
  );
  return (
    <>
      {/* ──────────────── Phone (< lg) ──────────────── */}
      <div data-theme="dark" className="lg:hidden anim-fade pb-28 text-white sf relative min-h-screen">
        <div className="lg-atmosphere" />
        <div className="absolute inset-0 z-[1] pointer-events-none"
          style={{ background: 'linear-gradient(180deg, var(--vignette-corner) 0%, transparent 30%, transparent 70%, var(--vignette-corner-soft) 100%)' }} />
        {/* Phone header — sticky so the brand + search stay pinned at the
            top of the scroll context (was `absolute` which scrolled away with
            the rest of the watch tree). */}
        <div className="sticky top-0 z-30 px-4 pt-5 pb-3"
          style={{ background: 'linear-gradient(180deg, rgba(5,8,16,0.55) 0%, rgba(5,8,16,0.20) 70%, transparent 100%)' }}>
          <div className="flex items-center justify-between mb-3">
            <span className="sf-display font-bold text-[22px] text-white">
              HALO <span className="text-halo-cyan">TV</span>
            </span>
          </div>
          <WatchSearchInput query={query} setQuery={setQuery} onPickGame={handlePush} />
        </div>
        <FeaturedHero onWatch={handlePush} />
        {body}
      </div>

      {/* ──────────────── Desktop (lg+) ──────────────── */}
      <div className="hidden lg:block">
        <WatchShell
          topBarCenter={<WatchSearchInput query={query} setQuery={setQuery} onPickGame={handlePush} />}
          hero={<WatchHeroDesktop onWatch={handlePush} />}>
          {body}
        </WatchShell>
      </div>

      {/* Live player overlay */}
      {livePlayerGameId && (
        <LivePlayerScreen game={SEED_GAMES.find(g => g.id === livePlayerGameId)} onClose={() => setLivePlayerGameId(null)} />
      )}
    </>
  );
};

            <path d="M0 1.2v11.6c0 .9 1 1.4 1.7 1l9.6-5.8c.7-.4.7-1.5 0-1.9L1.7.2C1 -.2 0 .3 0 1.2z" />
          </svg>
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-1.5 mb-1">
            <span className="w-1.5 h-1.5 rounded-full anim-pulse-dot" style={{ background: '#FFD250', boxShadow: '0 0 6px rgba(255,210,80,0.7)' }} />
            <span className="sf text-[9.5px] tracking-[0.18em] uppercase font-bold" style={{ color: '#FFD250' }}>TOP MOMENT</span>
          </div>
          <div className="sf-display text-[15px] font-bold leading-tight tracking-[-0.01em]" style={{ color: 'var(--text-primary)' }}>#{PLAYER.number} player highlight</div>
          <div className="sf text-[11.5px] mt-0.5 truncate" style={{ color: 'var(--text-tertiary)' }}>{topGame ? `${topGame.home} vs ${topGame.away}` : 'Game'}</div>
        </div>
        <span className="sf text-[18px]" style={{ color: 'var(--text-muted)' }}>›</span>
      </button>

      {/* Grouped by game */}
      {groups.map((grp, gi) => {
        const game = SEED_GAMES.find(g => g.id === grp.gameId);
        return (
          <div key={grp.gameId} className={gi > 0 ? 'mt-7' : ''}>
            <div className="flex items-end justify-between mb-3 pb-3" style={{ borderBottom: '1px solid var(--glass-card-border)' }}>
              <div className="min-w-0">
                <div className="sf text-[10px] tracking-[0.16em] uppercase font-semibold" style={{ color: 'var(--text-muted)' }}>{game?.when || 'Earlier'}</div>
                <div className="sf-display text-[14.5px] font-bold leading-tight tracking-[-0.01em] mt-0.5 truncate" style={{ color: 'var(--text-primary)' }}>vs {game?.away || 'Opponent'}</div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <span className="sf text-[10.5px]" style={{ color: 'var(--text-muted)' }}>{grp.moments.length} {grp.moments.length === 1 ? 'moment' : 'moments'}</span>
                {game && (
                  <span className="lg-glass squircle-sm sf text-[11px] font-semibold tabular-nums px-2 py-0.5 leading-none" style={{ color: 'var(--text-primary)' }}>{game.scoreHome}–{game.scoreAway}</span>
                )}
              </div>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 lg:gap-4">
              {grp.moments.map((m) => (
                <EditorialDropThumb key={m.id} moment={m} fluid onClick={() => onPickMoment(SEED_MOMENTS.indexOf(m))} />
              ))}
            </div>
          </div>
        );
      })}

      <button className="w-full mt-7 lg-glass squircle-md py-3 sf text-[12px] font-semibold tracking-tight" style={{ color: 'var(--text-primary)' }}>
        See all highlights →
      </button>
    </div>
  );
};
