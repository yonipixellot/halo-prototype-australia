/* ── LeagueAccordion ─────────────────────────────────────────────
   Collapsible league → teams picker used in fan/parent TeamsStep.
   Single-open accordion. Search auto-expands first matching league.
   "Follow all" header CTA toggles the entire league at once. */
const LeagueAccordion = ({ chosen, toggle, setChosen, query = '' }) => {
  const [openId, setOpenId] = useState(null);
  const resolved = useMemo(() => {
    const q = query.trim().toLowerCase();
    return LEAGUES.map(league => {
      const allTeams = league.teamIds.map(id => OB_TEAMS_DB.find(t => t.id === id)).filter(Boolean);
      const matches = q
        ? allTeams.filter(team => (team.name + ' ' + team.org).toLowerCase().includes(q))
        : allTeams;
      const sorted = [...matches].sort((a, b) => a.name.localeCompare(b.name));
      return { league, allTeams, teams: sorted };
    });
  }, [query]);

  useEffect(() => {
    const q = query.trim().toLowerCase();
    if (!q) return;
    const firstMatch = LEAGUES.find(league =>
      league.teamIds.some(id => {
        const team = OB_TEAMS_DB.find(t => t.id === id);
        if (!team) return false;
        return (team.name + ' ' + team.org).toLowerCase().includes(q);
      }));
    if (firstMatch) setOpenId(firstMatch.id);
  }, [query]);

  return (
    <div className="space-y-2">
      {resolved.map(({ league, allTeams, teams }) => {
        const isOpen = openId === league.id;
        const allSelected = allTeams.length > 0 && allTeams.every(tm => chosen.includes(tm.id));
        const someSelected = allTeams.some(tm => chosen.includes(tm.id));
        const matchCount = teams.length;
        const isFiltered = query.trim().length > 0;
        if (isFiltered && matchCount === 0) return null;
        const onToggleHeader = () => setOpenId(isOpen ? null : league.id);
        const onFollowAll = () => {
          if (allSelected) setChosen(chosen.filter(id => !league.teamIds.includes(id)));
          else setChosen(Array.from(new Set([...chosen, ...league.teamIds])));
        };
        return (
          <div key={league.id} className="overflow-hidden squircle-md">
            {/* squircle-md on the button itself — without it, the button's
                rectangular 1px border gets sliced by the outer's 18px
                rounded overflow clip, producing the "cut off" look at
                every corner. With matching radius, the border follows the
                curve. When open, the bottom corners flatten via the
                inline style so the dropdown below attaches flush. */}
            <button type="button" onClick={onToggleHeader} aria-expanded={isOpen}
              className={`w-full text-start px-3.5 py-3.5 flex items-center gap-3 lg-aura squircle-md${isOpen ? '' : ' lg-shine'}`}
              style={{
                background: someSelected ? 'rgba(0,214,254,0.07)' : 'var(--glass-card-bg)',
                backdropFilter: 'blur(36px) saturate(180%)',
                WebkitBackdropFilter: 'blur(36px) saturate(180%)',
                border: someSelected ? '1px solid rgba(0,214,254,0.40)' : '1px solid var(--glass-card-border)',
                borderEndStartRadius: isOpen ? 0 : undefined,
                borderEndEndRadius: isOpen ? 0 : undefined,
              }}>
              <div className="w-11 h-11 squircle-sm flex items-center justify-center shrink-0"
                style={{ background: 'var(--brand-cyan-soft)', border: '1px solid var(--brand-cyan-border)', color: 'var(--brand-cyan-text)' }}>
                <svg width={20} height={20} viewBox="0 0 20 20" fill="none" stroke="currentColor"
                  strokeWidth={1.7} strokeLinecap="round" strokeLinejoin="round"
                  style={{ width: 20, height: 20, display: 'block' }}>
                  <path d="M5 3 h10 v4 a5 5 0 0 1 -10 0 Z M8 13 h4 M9 13 v3 M11 13 v3 M7 17 h6" />
                </svg>
              </div>
              <div className="flex-1 min-w-0">
                <div className="sf-display text-[14.5px] font-bold leading-tight tracking-[-0.01em] truncate" style={{ color: 'var(--text-primary)' }}>
                  {league.name}
                </div>
                <div className="sf text-[11.5px] mt-0.5 truncate" style={{ color: 'var(--text-tertiary)' }}>
                  {league.sub ? league.sub + ' · ' : ''}{allTeams.length} {allTeams.length === 1 ? 'team' : 'teams'}

                <div className="px-3 pb-3 grid grid-cols-2 lg:grid-cols-4 gap-2.5">

                          boxShadow: active

                          const ringColor = teamRec && teamRec.accentA

/* ── TeamRosterAccordion ──────────────────────────────────────────
   Collapsible team → roster picker used in fan/parent PlayersStep.
   Mirrors LeagueAccordion behavior. Roster sorted by jersey # asc. */
const TeamRosterAccordion = ({ teamIds, chosenPlayers, togglePlayer, setChosenPlayers, query = '' }) => {
  const [openId, setOpenId] = useState(null);
  const resolved = useMemo(() => {
    const q = query.trim().toLowerCase();
    return teamIds.map(tid => {
      const team = OB_TEAMS_DB.find(t => t.id === tid);
      if (!team) return null;
      const allRoster = ROSTER.filter(p => p.teamId === tid);
      const matches = q
        ? allRoster.filter(p => (p.name + ' ' + p.position + ' ' + p.number).toLowerCase().includes(q))
        : allRoster;
      const sorted = [...matches].sort((a, b) => a.number - b.number);
      return { team, allRoster, roster: sorted };
    }).filter(Boolean);
  }, [teamIds, query]);

  useEffect(() => {
    const q = query.trim().toLowerCase();
    if (!q) return;
    const firstMatch = teamIds.find(tid => {
      const allRoster = ROSTER.filter(p => p.teamId === tid);
      return allRoster.some(p => (p.name + ' ' + p.position + ' ' + p.number).toLowerCase().includes(q));
    });
    if (firstMatch) setOpenId(firstMatch);
  }, [query, teamIds]);

  if (teamIds.length === 0) {
    return (
      <div className="squircle-md p-5 text-center"
        style={{
          background: 'var(--glass-card-bg)',
          backdropFilter: 'blur(36px) saturate(180%)',
          WebkitBackdropFilter: 'blur(36px) saturate(180%)',
          border: '1px solid var(--glass-card-border)',
        }}>
        <div className="sf text-[12.5px]" style={{ color: 'var(--text-tertiary)' }}>
          Pick teams in the previous step to see their rosters here.
        </div>
      </div>
    );
  }

  return (
    <div className="space-y-2">
      {resolved.map(({ team, allRoster, roster }) => {
        const isOpen = openId === team.id;
        const allRosterIds = allRoster.map(p => p.id);
        const followedFromTeam = allRosterIds.filter(id => chosenPlayers[id]).length;
        const allFollowed = allRoster.length > 0 && followedFromTeam === allRoster.length;
        const someFollowed = followedFromTeam > 0;
        const matchCount = roster.length;
        const isFiltered = query.trim().length > 0;
        if (isFiltered && matchCount === 0) return null;
        const onToggleHeader = () => setOpenId(isOpen ? null : team.id);
        const onFollowAll = () => {
          const next = { ...chosenPlayers };
          allRosterIds.forEach(id => { next[id] = !allFollowed; });
          setChosenPlayers(next);
        };
        return (
          <div key={team.id} className="overflow-hidden squircle-md">
            {/* Same border-radius match as LeagueAccordion above — without
                squircle-md on the button, its rectangular border gets
                sliced by the outer's rounded overflow clip and the corners
                look cut off. */}
            <button type="button" onClick={onToggleHeader} aria-expanded={isOpen}
              className={`w-full text-start px-3.5 py-3.5 flex items-center gap-3 lg-aura squircle-md${isOpen ? '' : ' lg-shine'}`}
              style={{
                background: someFollowed ? 'rgba(0,214,254,0.07)' : 'var(--glass-card-bg)',
                backdropFilter: 'blur(36px) saturate(180%)',
                WebkitBackdropFilter: 'blur(36px) saturate(180%)',
                border: someFollowed ? '1px solid rgba(0,214,254,0.40)' : '1px solid var(--glass-card-border)',
                borderEndStartRadius: isOpen ? 0 : undefined,
                borderEndEndRadius: isOpen ? 0 : undefined,
              }}>
              {(() => {
                const teamRec = teamByName(team.name);
                const logoSrc = teamRec && teamRec.src;
                const ringColor = teamRec && teamRec.accentA
                  ? teamRec.accentA.replace(/,[\d.]+\)$/, ',0.55)')
                  : 'var(--glass-strong-border)';
                if (logoSrc) {
                  return (
                    <div className="w-11 h-11 squircle-sm flex items-center justify-center shrink-0 overflow-hidden"
                      style={{ background: '#fff', border: `1.5px solid ${ringColor}` }}>
                      <img src={logoSrc} alt={team.name} style={{ width: '100%', height: '100%', objectFit: 'contain', padding: 2 }} />
                    </div>
                  );
                }
                return (
                  <div className="w-11 h-11 squircle-sm lg-glass-strong flex items-center justify-center shrink-0">
                    <span className="sf-display text-[13px] font-bold text-white">{team.initial}</span>
                  </div>
                );
              })()}
              <div className="flex-1 min-w-0">
                <div className="sf-display text-[14.5px] font-bold leading-tight tracking-[-0.01em] truncate" style={{ color: 'var(--text-primary)' }}>{team.name}</div>
                <div className="sf text-[11.5px] mt-0.5 truncate" style={{ color: 'var(--text-tertiary)' }}>
                  {team.org} · {allRoster.length} {allRoster.length === 1 ? 'player' : 'players'}
                  {someFollowed && !isFiltered ? ` · ${followedFromTeam} followed` : ''}
                  {isFiltered ? ` · ${matchCount} matches` : ''}
                </div>
              </div>
              <svg width={14} height={14} viewBox="0 0 14 14" fill="none" stroke="currentColor"
                strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"
                className="shrink-0 transition-transform duration-200"
                style={{ width: 14, height: 14, display: 'block', color: 'var(--text-tertiary)', transform: isOpen ? 'rotate(90deg)' : 'rotate(0deg)' }}>
                <path d="M5 3 L10 7 L5 11" />
              </svg>
            </button>
            {isOpen && (
              <div className="anim-fade"
                style={{
                  background: 'var(--canvas-bg-soft)',
                  borderInlineStart: '1px solid var(--glass-card-border)',
                  borderInlineEnd: '1px solid var(--glass-card-border)',
                  borderBlockEnd: '1px solid var(--glass-card-border)',
                  borderEndStartRadius: 'var(--squircle-md, 18px)',
                  borderEndEndRadius: 'var(--squircle-md, 18px)',
                }}>
                {allRoster.length > 1 && (
                  <div className="px-3.5 pt-3 pb-2 flex items-center justify-between">
                    <span className="sf text-[11px] tracking-[0.10em] uppercase font-bold" style={{ color: 'var(--text-tertiary)' }}>All players</span>
                    <button type="button" onClick={onFollowAll}
                      className="squircle-sm px-3 py-1.5 sf text-[11.5px] font-semibold lg-aura"
                      style={{
                        background: allFollowed ? 'var(--brand-cyan)' : 'var(--brand-cyan-soft)',
                        color: allFollowed ? '#000' : 'var(--brand-cyan-text)',
                        border: '1px solid var(--brand-cyan-border)',
                      }}>
                      {allFollowed ? 'Unfollow all' : `Follow all ${allRoster.length}`}
                    </button>
                  </div>
                )}
                <div className="px-2 pb-2">
                  {roster.map(p => {
                    const active = !!chosenPlayers[p.id];
                    return (
                      <button key={p.id} type="button" onClick={() => togglePlayer(p.id)} aria-pressed={active}
                        className="w-full text-start squircle-sm p-2.5 flex items-center gap-3 lg-aura"
                        style={{
                          background: active ? 'rgba(0,214,254,0.10)' : 'transparent',
                          border: active ? '1px solid rgba(0,214,254,0.40)' : '1px solid transparent',
                          marginBlockEnd: 4,
                        }}>
                        <div className="w-10 h-10 squircle-sm lg-glass-strong flex flex-col items-center justify-center shrink-0">
                          <span className="sf text-[7.5px] tracking-[0.16em] uppercase font-bold leading-none" style={{ color: 'var(--text-tertiary)' }}>No.</span>
                          <span className="sf-display text-[13px] font-bold tabular-nums text-white leading-none mt-0.5">{p.number}</span>
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="sf-display text-[13.5px] font-bold leading-tight truncate" style={{ color: 'var(--text-primary)' }}>{p.name}</div>
                          <div className="sf text-[10.5px] mt-0.5 truncate" style={{ color: 'var(--text-tertiary)' }}>
                            {p.position}
                            {p.claimed && (<><span> · </span><span style={{ color: 'var(--brand-cyan-text)' }}>Claimed</span></>)}
                          </div>
                        </div>
                        <div className="w-5 h-5 rounded-full flex items-center justify-center shrink-0"
                          style={active ? { background: 'var(--brand-cyan)' } : { background: 'var(--hatch-grain)', border: '1px solid var(--hairline-strong)' }}>
                          {active && (
                            <svg width={10} height={10} viewBox="0 0 14 14" fill="none" stroke="#000"
                              strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"
                              style={{ width: 10, height: 10, display: 'block' }}>
                              <path d="M3 7 L6 10 L11 4" />
                            </svg>
                          )}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
};

/* ── PlayersStep ──────────────────────────────────────────────────

/* ── FanOnboarding (generic Onboarding orchestrator) ──────────────
   Direct port of halo-design-system/src/screens/onboarding/Onboarding.tsx
   (fan + parent path). Three steps:
     persona  → pick fan / parent / player / coach (coach disabled)
     teams    → LeagueAccordion picker
     players  → TeamRosterAccordion picker
     done     → onDone (navigates to Home)

   Player branch short-circuits to #/onboard/player (the coach-invite
   PlayerOnboarding flow — handled by Phase 2). Coach is disabled in
   PersonaStep per DS spec. */
/* onExit — fired when the user hits the back chevron from step 1
   (PersonaStep). Routes back to the auth screen so they can sign in
   instead of continuing onboarding. The App provides this prop. */
const FanOnboarding = ({ onDone, onExit }) => {
  const [step, setStep] = useState('persona');
  const [persona, setPersona] = useState('fan');
  /* Pre-select Varsity (t1) so step 2 (TeamsStep) ships in with one
     team chosen — Continue button is enabled immediately for demos. */
  const [chosenTeams, setChosenTeams] = useState(['t1']);
  const [chosenPlayers, setChosenPlayers] = useState({});
  const togglePlayer = (id) => setChosenPlayers(prev => ({ ...prev, [id]: !prev[id] }));
  const onPickPersona = (kind) => {
    if (kind === 'player') {
      /* Route to coach-invite flow (PlayerOnboarding) — different from
         generic Onboarding's internal player path which goes through
         ClaimPage. Per user's spec, "player onboarding" === PlayerOnboarding. */
      window.location.hash = '#/onboard/player';
      return;
    }
    setPersona(kind);
    setStep('teams');
  };
  /* Layout pattern (matches DS Onboarding):
       Phone (< lg): absolute inset-0 full-bleed — the stepper, body, and
         dock together fill the screen. Atmosphere is the canvas behind.
       Desktop (lg+): a centered ~480px-wide card, max viewport height,
         glass border + rounded corners. The atmosphere fills the rest of
         the viewport as the canvas background. */
  /* w-full required so the outer div spans the full .stage-desktop flex
     track. Without it, the parent flex shrinks this div to the card's
     480px width and the whole flow sticks to the inline-start edge. */
  /* Single-scroll-container architecture (May 2026 rewrite after
     desktop + iOS scroll bugs):
     ┌─────────────────────────────────────────────────────────────┐
     │ shell: position:absolute inset:0, fills .phone-screen or    │
     │         .stage-desktop, contains atmosphere + scroll-area   │
     │ ┌─────────────────────────────────────────────────────────┐ │
     │ │ atmosphere/vignette: absolute, behind everything,       │ │
     │ │ pointer-events:none, don't scroll                       │ │
     │ └─────────────────────────────────────────────────────────┘ │
     │ ┌─────────────────────────────────────────────────────────┐ │
     │ │ scroll-area: absolute inset:0, overflow-y:auto — the    │ │
     │ │ ONLY scroll container. iOS-safe via -webkit + contain   │ │
     │ │   ┌─────────────────────────────────────────────────┐   │ │
     │ │   │ card: flex flex-col min-h-full (mobile), or     │   │ │
     │ │   │ lg:max-w-480 lg:mx-auto lg:my-10 (desktop).     │   │ │
     │ │   │ Stepper, step body, Dock flow as flex children. │   │ │
     │ │   │ Dock has position:sticky bottom:0 → binds to    │   │ │
     │ │   │ scroll-area, stays at viewport bottom while     │   │ │
     │ │   │ content scrolls behind it.                      │   │ │
     │ │   └─────────────────────────────────────────────────┘   │ │
     │ └─────────────────────────────────────────────────────────┘ │
     └─────────────────────────────────────────────────────────────┘
     This kills the iOS sticky-flex bug AND the desktop "Continue
     button buried below the fold" complaint in one shot — sticky
     binds to the single scroll container regardless of device. */
  /* Desktop layout (May 2026 redo): same sidebar-canvas SaaS pattern that
     PlayerOnboarding wears. 280px left rail with vertical step list +
     full-bleed right content (no card border). The mobile-card-centered-
     in-empty-canvas treatment is gone — fan flow no longer feels like a
     "big mobile" on desktop.

     Mobile (<lg) collapses to the existing single-scroll-container flow.
     OnboardSidebar is `hidden lg:flex` so phones never see it. The
     `.onb-with-sidebar` class hides nested OnboardSteppers on lg+ since
     the sidebar carries the progress info instead.

     Same generic OnboardSidebar component as Player flow — just passed
     a different `steps` array + flow label. */
  return (

                  onBack={() => setStep('teams')}

            </div>{/* /content max-width wrapper */}
          </div>{/* /onb-scroll-area */}

  );
};

/* ── FullSignUpScreen ──────────────────────────────────────────
   Direct port of DS screens/auth/SignUp.tsx. Name + email + password +
   confirm + birth date + gender + country, with COPPA/GDPR-K age gate
   (under-13 → short-circuits to "you need to be 13+" card).
   Used by the player flow after PlayerInviteEntry. */
/* COUNTRIES — enriched table with ISO code, display name, dial code, and
   flag emoji. Used by BOTH the Country select and the Phone dial-code
   selector so the data only lives in one place. Order picked roughly by
   expected user volume for a US-first sports app; "Other" omitted —
   prefer a real country pick over a generic catch-all. */
const COUNTRIES = [
  { code: 'US', name: 'United States',  dial: '+1',   flag: '🇺🇸' },
  { code: 'CA', name: 'Canada',         dial: '+1',   flag: '🇨🇦' },

  { code: 'AU', name: 'Australia',      dial: '+61',  flag: '🇦🇺' },
  { code: 'BR', name: 'Brazil',         dial: '+55',  flag: '🇧🇷' },
  { code: 'MX', name: 'Mexico',         dial: '+52',  flag: '🇲🇽' },
  { code: 'AR', name: 'Argentina',      dial: '+54',  flag: '🇦🇷' },
  { code: 'IN', name: 'India',          dial: '+91',  flag: '🇮🇳' },
  { code: 'JP', name: 'Japan',          dial: '+81',  flag: '🇯🇵' },
  { code: 'KR', name: 'South Korea',    dial: '+82',  flag: '🇰🇷' },
  { code: 'CN', name: 'China',          dial: '+86',  flag: '🇨🇳' },
  { code: 'TR', name: 'Turkey',         dial: '+90',  flag: '🇹🇷' },
  { code: 'AE', name: 'UAE',            dial: '+971', flag: '🇦🇪' },
  { code: 'ZA', name: 'South Africa',   dial: '+27',  flag: '🇿🇦' },
];
const GENDERS = ['Male', 'Female', 'Non-binary', 'Prefer not to say'];

const MONTHS = [
  'January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December',
];

/* Days-in-month helper used by BirthDatePicker so February doesn't let
   the user pick the 30th (a real signup form quirk worth honoring even
   in a prototype). Returns 28..31 based on year+month. */
const daysInMonth = (year, monthIdx) => {
  if (!year || monthIdx == null) return 31;
  return new Date(year, monthIdx + 1, 0).getDate();
};

/* ── BirthDatePicker ─────────────────────────────────────────────
   Three separate glass cards in one row — Month / Day / Year — each its
   own dropdown. (Earlier versions tried a single combined card with
   3 chevrons, and a popover calendar; both got rejected. The 3-separate-
   card pattern reads cleanest and matches mobile native pickers.)

   Day options auto-clip to the actual days in the picked month + year so
   the user can't pick Feb 30. Year range goes back 100 years.

   Emits an ISO `YYYY-MM-DD` string to the parent when all three parts
   are set; emits empty string otherwise. The under-13 age-gate upstream
   parses this directly. */
const BirthDatePicker = ({ value, onChange }) => {
  /* Parts are LOCAL state — not derived from `value` on every render.
     Critical: if we recomputed parts from `value` each render, picking
     just one of the three dropdowns would fire onChange('') (because the
     date isn't complete yet), which would re-derive parts as empty and
     snap the just-picked dropdown back to its placeholder. The user
     would see selection appear and then immediately disappear.
     With local state, partial picks persist; onChange fires upward only
     once all three parts are set. */
  const [parts, setParts] = useState(() => {
    if (!value) return { y: '', m: '', d: '' };
    const [y, m, d] = value.split('-');
    return { y, m: String(Number(m) - 1), d: String(Number(d)) };
  });
  const update = (next) => {
    const merged = { ...parts, ...next };
    setParts(merged);
    if (merged.y && merged.m !== '' && merged.d !== '') {
      const yy = String(merged.y).padStart(4, '0');
      const mm = String(Number(merged.m) + 1).padStart(2, '0');
      const dd = String(Number(merged.d)).padStart(2, '0');
      onChange(`${yy}-${mm}-${dd}`);
    } else {
      onChange('');
    }
  };
  const thisYear = new Date().getFullYear();
  /* Year range — 5 years ago back 100 years. The age-gate check
     downstream handles the precise 13+ boundary; we keep the menu
     generous so an older adult signing up isn't blocked here. */
  const years = [];
  for (let y = thisYear - 5; y >= thisYear - 100; y--) years.push(y);
  const maxDay = daysInMonth(Number(parts.y), parts.m === '' ? null : Number(parts.m));
  const days = Array.from({ length: maxDay }, (_, i) => i + 1);

  /* Three separate glass cards in a row. Month gets `flex-1` (widest —
     fits the full month name). Day + Year are fixed-width since their
     content is short. */
  return (
    <div>
      <SignUpFieldLabel>Birth date</SignUpFieldLabel>
      <div className="flex items-stretch gap-2">
        <div className="lg-glass-card squircle-md px-3.5 py-3 flex-1 min-w-0">
          <select value={parts.m} onChange={(e) => update({ m: e.target.value, d: '' })}
            className="auth-input sf text-[14.5px] w-full" style={{ background: 'transparent' }}>
            <option value="" disabled style={{ background: '#0a0d18' }}>Month</option>
            {MONTHS.map((mo, i) => (
              <option key={i} value={i} style={{ background: '#0a0d18' }}>{mo}</option>
            ))}
          </select>
        </div>
        <div className="lg-glass-card squircle-md px-3.5 py-3" style={{ width: 96 }}>
          <select value={parts.d} onChange={(e) => update({ d: e.target.value })}
            className="auth-input sf text-[14.5px] w-full" style={{ background: 'transparent' }}>
            <option value="" disabled style={{ background: '#0a0d18' }}>Day</option>
            {days.map((d) => (
              <option key={d} value={d} style={{ background: '#0a0d18' }}>{d}</option>
            ))}
          </select>
        </div>
        <div className="lg-glass-card squircle-md px-3.5 py-3" style={{ width: 112 }}>
          <select value={parts.y} onChange={(e) => update({ y: e.target.value })}
            className="auth-input sf text-[14.5px] w-full" style={{ background: 'transparent' }}>
            <option value="" disabled style={{ background: '#0a0d18' }}>Year</option>
            {years.map((y) => (
              <option key={y} value={y} style={{ background: '#0a0d18' }}>{y}</option>
            ))}
          </select>
        </div>
      </div>
    </div>
  );
};


/* ── PhoneField ──────────────────────────────────────────────────
   Country dial-code selector + national number. Country shows
   "[flag] [+dial]" (e.g. "🇺🇸 +1") so the row is compact. The country
   record is owned by the parent component as a country `code` (ISO);
   the rendered dial code is derived from COUNTRIES.

   Number input is `inputMode="tel"` so phones bring up the dial pad.
   We don't enforce a strict format — a prototype showing the *shape*
   of the field is enough; production should use libphonenumber. */
const PhoneField = ({ countryCode, onCountryChange, phone, onPhoneChange }) => {
  const country = COUNTRIES.find(c => c.code === countryCode) || COUNTRIES[0];
  return (
    <div>
      <SignUpFieldLabel>Phone</SignUpFieldLabel>
      <div className="lg-glass-card squircle-md px-3.5 py-3 flex items-center gap-2">
        <select value={country.code} onChange={(e) => onCountryChange(e.target.value)}
          className="auth-input sf text-[14.5px] min-w-0" style={{ background: 'transparent', width: 92 }}>
          {COUNTRIES.map((c) => (
            <option key={c.code} value={c.code} style={{ background: '#0a0d18' }}>
              {c.flag} {c.dial}
            </option>
          ))}
        </select>
        <span className="sf text-[14.5px]" style={{ color: 'var(--text-tertiary)' }} aria-hidden="true">·</span>
        <input type="tel" inputMode="tel" value={phone} onChange={(e) => onPhoneChange(e.target.value.replace(/[^\d\s\-]/g, ''))}
          placeholder="Phone number" autoComplete="tel-national"
          className="auth-input sf text-[14.5px] flex-1 min-w-0" />
      </div>
    </div>
  );
};

/* SignUpField + SignUpSelect — module-scoped so their identity is stable
   across re-renders of FullSignUpScreen. Defining these inside the parent
   caused React to remount the inputs on every keystroke, which retriggered
   the `autoFocus` on the Full Name field and stole focus mid-typing.

   Label placement matches the SignIn GlassField pattern: the label sits
   ABOVE the glass card (px-1 mb-2), not inside it. This keeps every form
   surface in the prototype visually consistent. */
const SignUpFieldLabel = ({ children }) => (

);

const SignUpField = ({ label, type = 'text', value, onChange, placeholder, hint, autoFocus, showPw, onToggleShowPw }) => (

    <div className="lg-glass-card squircle-md px-3.5 py-3 flex items-center gap-2">

const SignUpSelect = ({ label, value, onChange, options, placeholder }) => (

        {options.map(o => <option key={o} value={o} style={{ background: '#0a0d18' }}>{o}</option>)}

/* form values can be passed in (controlled by the orchestrator) so that
   when the user backs out to invite-entry and returns, the fields are
   retained instead of re-blanked. If no `form` prop is passed, the
   component falls back to its own internal useState. onBack adds the
   first chrome (OnboardStepper) to this screen so the user can return
   to the invite-entry / cancel signup. */
const FullSignUpScreen = ({ onSubmit, onSwitchToSignIn, onBack, form, setForm }) => {
  /* When `form` is provided we derive values from it and write back via
     setForm; otherwise we manage internal state. Using two separate
     code paths via tiny helpers keeps the JSX below identical to before. */
  /* Fallback state for standalone usage (when no `form` prop is passed).
     Pre-filled with the Tal Weiss demo persona so the standalone signup
     from /auth is also one-tap-Continue. */
  const _internalState = {
    name: useState('Tal Weiss'),
    email: useState('tal@halo.tv'),
    password: useState('Halohalo1'),
    confirmPw: useState('Halohalo1'),
    birthDate: useState('2008-05-14'),
    gender: useState('Male'),
    country: useState('US'),
    phoneCountry: useState('US'),
    phone: useState('5551234567'),
  };
  const get = (k, fallbackPair) => form ? (form[k] ?? '') : fallbackPair[0];
  const set = (k, fallbackPair) => (v) => form ? setForm(f => ({ ...f, [k]: v })) : fallbackPair[1](v);
  const name         = get('name',         _internalState.name);
  const email        = get('email',        _internalState.email);
  const password     = get('password',     _internalState.password);
  const confirmPw    = get('confirmPw',    _internalState.confirmPw);
  const birthDate    = get('birthDate',    _internalState.birthDate);
  const gender       = get('gender',       _internalState.gender);
  const country      = get('country',      _internalState.country);
  const phoneCountry = form ? (form.phoneCountry ?? 'US') : _internalState.phoneCountry[0];
  const phone        = get('phone',        _internalState.phone);
  const setName         = set('name',         _internalState.name);
  const setEmail        = set('email',        _internalState.email);
  const setPassword     = set('password',     _internalState.password);
  const setConfirmPw    = set('confirmPw',    _internalState.confirmPw);
  const setBirthDate    = set('birthDate',    _internalState.birthDate);
  const setGender       = set('gender',       _internalState.gender);
  const setCountry      = set('country',      _internalState.country);
  const setPhoneCountry = set('phoneCountry', _internalState.phoneCountry);
  const setPhone        = set('phone',        _internalState.phone);
  const [showPw, setShowPw] = useState(false);
  const toggleShowPw = () => setShowPw(v => !v);

  const pwOk = password.length >= 8 && /[A-Z]/.test(password) && /[0-9]/.test(password);
  const pwMatch = !confirmPw || password === confirmPw;
  const dob = birthDate ? new Date(birthDate) : null;
  const isValidDob = !!dob && !isNaN(dob.getTime());
  let age = null;
  if (isValidDob) {
    const today = new Date();
    age = today.getFullYear() - dob.getFullYear();
    const m = today.getMonth() - dob.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
  }
  const isUnder13 = age !== null && age < 13;
  /* Phone is required and must have at least 6 digits for the prototype.
     Strict format validation would belong in production. */
  const phoneDigits = phone.replace(/\D/g, '');
  const phoneOk = phoneDigits.length >= 6;
  const valid = name.length > 1 && email.includes('@') && pwOk && pwMatch && confirmPw.length > 0
    && birthDate.length > 0 && gender.length > 0 && country.length > 0 && phoneOk && !isUnder13;

  /* No outer px-5 here — each section owns its own horizontal padding so
     the inline Continue button below renders at the same width as the
     inputs (vs. previously being double-padded by OnboardDock).
     OnboardStepper added so the user can back out of signup to the
     invite-entry screen they came from. Only renders when onBack is
     provided (i.e. when used inside PlayerOnboarding) — keeps the
     standalone usage of FullSignUpScreen un-stepperised. */
  return (
    <>
    {onBack && <OnboardStepper step={1} total={4} onBack={onBack} label="Step 1 of 4" />}
    {/* Mobile: pb-[120px] keeps the form's last field above the sticky
        OnboardDock that gets pinned below. Desktop: pb-12 is enough because
        the Continue button is inline (no sticky dock there — the sidebar-
        canvas right column would dwarf a 440px-wide dock). */}
    <div className="flex-1 onb-scroll pt-10 pb-[120px] lg:pb-12 anim-fade">
      <div className="px-5">
        <h1 className="sf-display text-[28px] font-bold leading-[1.05] tracking-[-0.025em] mb-2">Create your account</h1>
        <p className="sf text-[13px] leading-relaxed mb-6" style={{ color: 'var(--text-tertiary)' }}>
          We use this to verify you're old enough and to deliver your highlights.
        </p>
        {/* === Sectioned signup form ===
            Mobile: single column, no section headings (linear flow). Each
            grid block falls back to grid-cols-1 with vertical gap-3.
            Desktop (lg+): two labeled sections — "Account" + "Profile" —
            each a 2-col grid, fitting everything on one screen without
            scroll on a typical 768–900px viewport.
            Section heading uses `hidden lg:flex` so mobile stays clean. */}
        <div className="space-y-5 lg:space-y-7">
          {/* ── Account ── */}
          <section>
            <div className="hidden lg:flex items-center gap-3 mb-3">
              <span className="sf text-[10.5px] tracking-[0.2em] uppercase font-bold" style={{ color: 'var(--text-tertiary)' }}>Account</span>
              <div className="flex-1 h-px" style={{ background: 'var(--hairline)' }} />
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-3 lg:gap-4">
              <SignUpField label="Full name" value={name} onChange={setName} placeholder="Tal Weiss" autoFocus />
              <SignUpField label="Email" type="email" value={email} onChange={setEmail} placeholder="you@school.com" />
              <SignUpField label="Password" type="password" value={password} onChange={setPassword} placeholder="Strong password"
                hint="Min 8 characters, 1 uppercase, 1 number" showPw={showPw} onToggleShowPw={toggleShowPw} />
              <SignUpField label="Confirm password" type="password" value={confirmPw} onChange={setConfirmPw} placeholder="Re-enter password"
                hint={confirmPw && !pwMatch ? "Passwords don't match" : null} showPw={showPw} onToggleShowPw={toggleShowPw} />
            </div>
          </section>

          {/* ── Profile ── (or under-13 short-circuit) */}
          {isUnder13 ? (
            <section>
              <div className="hidden lg:flex items-center gap-3 mb-3">
                <span className="sf text-[10.5px] tracking-[0.2em] uppercase font-bold" style={{ color: 'var(--text-tertiary)' }}>Profile</span>
                <div className="flex-1 h-px" style={{ background: 'var(--hairline)' }} />
              </div>
              <BirthDatePicker value={birthDate} onChange={setBirthDate} />
              <div className="mt-3 squircle-md p-4" style={{ background: 'rgba(220,38,38,0.10)', border: '1px solid rgba(220,38,38,0.40)' }}>
                <div className="sf-display text-[14px] font-bold mb-1" style={{ color: '#fca5a5' }}>You need to be 13 or older</div>
                <p className="sf text-[12px] leading-relaxed" style={{ color: 'var(--text-tertiary)' }}>
                  Halo accounts are restricted to ages 13 and up. Ask your parent or coach to set this up with you.
                </p>
              </div>
            </section>
          ) : (
            <section>
              <div className="hidden lg:flex items-center gap-3 mb-3">
                <span className="sf text-[10.5px] tracking-[0.2em] uppercase font-bold" style={{ color: 'var(--text-tertiary)' }}>Profile</span>
                <div className="flex-1 h-px" style={{ background: 'var(--hairline)' }} />
              </div>
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-3 lg:gap-4">
                {/* DOB + Phone are wider components (3 dropdowns / country+number),
                    but they still fit comfortably in a half-column at ~290px
                    cell width on lg cards. */}
                <BirthDatePicker value={birthDate} onChange={setBirthDate} />
                <PhoneField countryCode={phoneCountry} onCountryChange={setPhoneCountry}
                  phone={phone} onPhoneChange={setPhone} />
                <SignUpSelect label="Gender" value={gender} onChange={setGender} options={GENDERS} placeholder="Select your gender" />
                {/* Country select — inline because it sources from COUNTRIES
                    (emoji flag + display name) and stores ISO code, not a
                    plain string like SignUpSelect's generic options[]. */}
                <div>
                  <SignUpFieldLabel>Country</SignUpFieldLabel>
                  <div className="lg-glass-card squircle-md px-3.5 py-3">
                    <select value={country} onChange={(e) => setCountry(e.target.value)}
                      className="auth-input sf text-[14.5px] w-full" style={{ background: 'transparent' }}>
                      <option value="" disabled style={{ background: '#0a0d18' }}>Select your country</option>
                      {COUNTRIES.map(c => (
                        <option key={c.code} value={c.code} style={{ background: '#0a0d18' }}>
                          {c.flag} {c.name}
                        </option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>
            </section>
          )}
        </div>

        {/* DESKTOP-ONLY inline Continue + sign-in link.
            Renders inside the form's px-5 column at the same width as the
            inputs. We can't use OnboardDock here because the desktop layout
            is sidebar-canvas (820px right column) — a 440px-capped sticky
            dock would look stranded and the form's tab order would feel
            broken with a floating CTA over wide content. Mobile gets the
            sticky dock version below as a sibling. */}
        <div className="hidden lg:block">
          <button onClick={valid ? onSubmit : undefined} disabled={!valid}
            className="mt-7 squircle-md py-4 w-full sf text-[14.5px] font-semibold transition-all"
            style={{
              color: !valid ? 'rgba(255,255,255,0.40)' : '#0a0d18',
              background: !valid ? 'var(--glass-card-bg)' : 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
              border: !valid ? '1px solid var(--glass-card-border)' : 'none',
              boxShadow: !valid ? 'none' : '0 8px 24px -8px rgba(0,214,254,0.55), inset 0 1px 0 rgba(255,255,255,0.40)',
              cursor: !valid ? 'not-allowed' : 'pointer',
            }}>
            Continue
          </button>
          <button onClick={onSwitchToSignIn} className="w-full sf text-[12px] text-center mt-2.5"
            style={{ color: 'var(--text-tertiary)' }}>
            Already have an account? <span className="font-semibold" style={{ color: 'var(--brand-cyan-text)' }}>Sign in</span>
          </button>
        </div>
      </div>{/* /px-5 inner column */}
    </div>
    {/* MOBILE-ONLY sticky CTA dock.
        OnboardDock binds sticky to the orchestrator's .onb-scroll-area
        outer (PlayerOnboarding owns the only scroll container). The dock
        stays pinned to the viewport bottom while the form scrolls behind.
        Bottom-aligned sign-in link doubles as the "secondary" action so
        the user never has to scroll past the last form field to either
        continue OR switch flows. */}
    <div className="lg:hidden">
      <OnboardDock>
        <button onClick={valid ? onSubmit : undefined} disabled={!valid}
          className="squircle-md py-4 w-full sf text-[14.5px] font-semibold transition-all"
          style={{
            color: !valid ? 'rgba(255,255,255,0.40)' : '#0a0d18',
            background: !valid ? 'var(--glass-card-bg)' : 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            border: !valid ? '1px solid var(--glass-card-border)' : 'none',
            boxShadow: !valid ? 'none' : '0 8px 24px -8px rgba(0,214,254,0.55), inset 0 1px 0 rgba(255,255,255,0.40)',
            cursor: !valid ? 'not-allowed' : 'pointer',
          }}>
          Continue
        </button>
        <button onClick={onSwitchToSignIn} className="w-full sf text-[12px] text-center mt-2.5"
          style={{ color: 'var(--text-tertiary)' }}>
          Already have an account? <span className="font-semibold" style={{ color: 'var(--brand-cyan-text)' }}>Sign in</span>
        </button>
      </OnboardDock>
    </div>
    </>
  );
};

/* ── TeamsStepLocked ──────────────────────────────────────────
   Step 3 of player onboarding. The team from the invite is LOCKED in
   (auto-followed, non-removable). Below it, LeagueAccordion lets the
   player stack additional teams. Direct port of DS TeamsStepLocked.tsx,
   with the coach attribution stripped per user spec. */
const TeamsStepLocked = ({ lockedTeamId, chosen, setChosen, onBack, onNext }) => {
  const [q, setQ] = useState('');
  const lockedTeam = OB_TEAMS_DB.find(tm => tm.id === lockedTeamId);
  const toggle = (id) => {
    if (id === lockedTeamId) return;
    if (chosen.includes(id)) setChosen(chosen.filter(x => x !== id));
    else setChosen([...chosen, id]);
  };
  const setChosenSafe = (next) => {
    if (!next.includes(lockedTeamId)) setChosen([lockedTeamId, ...next]);
    else setChosen(next);
  };
  return (
    <>
      <OnboardStepper step={2} total={4} onBack={onBack} label="Step 2 of 4" />
      <div className="flex-1 onb-scroll px-5 pt-4 pb-[120px] anim-fade">
        <h1 className="sf-display text-[24px] font-bold leading-[1.05] tracking-[-0.025em] mb-2">
          Your team
        </h1>
        <p className="sf text-[13px] leading-relaxed mb-5" style={{ color: 'var(--text-tertiary)' }}>
          You were added to this team via your invite. Add more teams to follow below.
        </p>
        {/* Locked-team hero card */}
        {lockedTeam && (
          <div className="squircle-md p-3.5 flex items-center gap-3.5 mb-6 lg-aura"
            style={{
              background:
                'radial-gradient(ellipse 70% 60% at 25% 30%, rgba(0,214,254,0.18) 0%, transparent 60%),' +
                'var(--glass-card-bg)',
              backdropFilter: 'blur(36px) saturate(180%)',
              WebkitBackdropFilter: 'blur(36px) saturate(180%)',
              border: '1px solid rgba(0,214,254,0.35)',
              boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.14), 0 8px 30px -10px rgba(0,214,254,0.20)',
            }}>
            <div className="w-[52px] h-[52px] squircle-sm lg-glass-strong flex items-center justify-center shrink-0">
              <span className="sf-display text-[14px] font-bold text-white">{lockedTeam.initial}</span>
            </div>
            <div className="flex-1 min-w-0">
              <div className="sf text-[9.5px] tracking-[0.18em] uppercase font-bold mb-0.5" style={{ color: 'var(--brand-cyan-text)' }}>
                Your team
              </div>
              <div className="sf-display text-[15.5px] font-bold text-white leading-tight truncate tracking-[-0.01em]">
                {lockedTeam.name}
              </div>
              <div className="sf text-[11.5px] truncate mt-0.5" style={{ color: 'var(--text-tertiary)' }}>
                {lockedTeam.org} · {lockedTeam.division}
              </div>
            </div>
            <div className="squircle-sm flex items-center gap-1.5 px-2.5 py-1 shrink-0"
              style={{
                background: 'var(--brand-cyan-soft)',
                border: '1px solid var(--brand-cyan-border)',
                color: 'var(--brand-cyan-text)',
              }}
              aria-label="Locked from invite">
              <svg width={12} height={12} viewBox="0 0 14 14" fill="none" stroke="currentColor"
                strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"
                style={{ width: 12, height: 12, display: 'block' }}>
                <rect x="3" y="6" width="8" height="6" rx="1" />
                <path d="M5 6 V4 a2 2 0 0 1 4 0 v2" />
              </svg>
            </div>
          </div>
        )}
        {/* Section heading + search */}
        <h2 className="sf text-[11px] tracking-[0.18em] uppercase font-bold mb-3" style={{ color: 'var(--text-tertiary)' }}>
          Follow more teams
        </h2>
        <div className="lg-glass-card squircle-md px-3.5 py-2.5 flex items-center gap-2.5 mb-4">
          <svg width={16} height={16} viewBox="0 0 16 16" fill="none" stroke="var(--text-muted)"
            strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round"
            style={{ width: 16, height: 16, display: 'block' }}>
            <circle cx={7} cy={7} r={5} /><path d="M11 11 L14 14" />
          </svg>
          <input value={q} onChange={(e) => setQ(e.target.value)}
            placeholder="Search teams or schools…" className="auth-input sf text-[14px]" />
        </div>
        <LeagueAccordion chosen={chosen} toggle={toggle} setChosen={setChosenSafe} query={q} />
      </div>
      <OnboardDock>
        <button onClick={onNext}
          className="squircle-md py-4 w-full sf text-[14.5px] font-semibold"
          style={{
            color: '#0a0d18',
            background: 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            boxShadow: '0 8px 24px -8px rgba(0,214,254,0.55), inset 0 1px 0 rgba(255,255,255,0.40)',
          }}>
          Continue — {chosen.length} {chosen.length === 1 ? 'team' : 'teams'}
        </button>
      </OnboardDock>
    </>
  );
};

/* ── JerseyBadge ──────────────────────────────────────────────────

/* ── ClaimAndFollow ──────────────────────────────────────────────
   Step 3 of player onboarding. Combined "claim your jersey" + "follow
   your teammates" screen. Direct port of DS ClaimAndFollow.tsx.

   Pre-claim: flat list of roster, each row has "This is me" button.
   Post-claim: cyan hero card for self + dimmed teammate rows (auto-
   followed on claim; user can uncheck individuals). */
const ClaimAndFollow = ({ teamId, claimedSelfId, setClaimedSelfId, chosenPlayers, setChosenPlayers, onBack, onNext }) => {
  const [notifyOpen, setNotifyOpen] = useState(false);
  const [notifySent, setNotifySent] = useState(false);
  const team = OB_TEAMS_DB.find(tm => tm.id === teamId);
  const roster = useMemo(() => ROSTER.filter(p => p.teamId === teamId).sort((a, b) => a.number - b.number), [teamId]);

  const onClaim = (rosterId) => {
    setClaimedSelfId(rosterId);
    const next = { ...chosenPlayers };
    roster.forEach(p => { next[p.id] = p.id !== rosterId; });
    setChosenPlayers(next);
  };
  useEffect(() => {
    if (!claimedSelfId) return;
    const next = { ...chosenPlayers };
    let changed = false;
    roster.forEach(p => {
      const want = p.id !== claimedSelfId;
      if (chosenPlayers[p.id] !== want) { next[p.id] = want; changed = true; }
    });
    if (changed) setChosenPlayers(next);
  }, [claimedSelfId]);
  const togglePlayer = (id) => {
    if (id === claimedSelfId) return;
    setChosenPlayers({ ...chosenPlayers, [id]: !chosenPlayers[id] });
  };
  const canContinue = !!claimedSelfId || notifySent;

  return (
    <>
      <OnboardStepper step={3} total={4} onBack={onBack} label="Step 3 of 4" />
      <div className="flex-1 onb-scroll px-5 pt-4 pb-[120px] anim-fade">
        <h1 className="sf-display text-[24px] font-bold leading-[1.05] tracking-[-0.025em] mb-2">
          Which one is you?
        </h1>
        <p className="sf text-[13px] leading-relaxed mb-5" style={{ color: 'var(--text-tertiary)' }}>
          Tap your jersey to claim it. We'll auto-follow your teammates so their highlights show up too.
        </p>
        {team && (
          <div className="flex items-center gap-2.5 mb-3.5">
            <div className="w-7 h-7 squircle-sm lg-glass-strong flex items-center justify-center">
              <span className="sf-display text-[10px] font-bold text-white">{team.initial}</span>
            </div>
            <span className="sf text-[11.5px] tracking-[0.10em] uppercase font-bold" style={{ color: 'var(--text-tertiary)' }}>
              {team.name} roster
            </span>
          </div>
        )}
        {/* Pre-claim — flat list */}
        {!claimedSelfId && (
          <div className="space-y-2">
            {roster.map(p => (
              <div key={p.id} className="squircle-md p-3 flex items-center gap-3 lg-aura"
                style={{
                  background: 'var(--glass-card-bg)',
                  backdropFilter: 'blur(36px) saturate(180%)',
                  WebkitBackdropFilter: 'blur(36px) saturate(180%)',
                  border: '1px solid var(--glass-card-border)',
                }}>
                <JerseyBadge number={p.number} size="md" />
                <div className="flex-1 min-w-0">
                  <div className="sf-display text-[14.5px] font-bold leading-tight truncate" style={{ color: 'var(--text-primary)' }}>
                    {p.name}
                  </div>
                  <div className="sf text-[11px] mt-0.5 truncate" style={{ color: 'var(--text-tertiary)' }}>{p.position}</div>
                </div>
                <button type="button" onClick={() => onClaim(p.id)}
                  className="squircle-sm px-3 py-1.5 sf text-[11px] font-semibold lg-aura shrink-0"
                  style={{
                    background: 'var(--brand-cyan-soft)',
                    border: '1px solid var(--brand-cyan-border)',
                    color: 'var(--brand-cyan-text)',
                  }}>
                  This is me
                </button>
              </div>
            ))}
          </div>
        )}
        {/* Post-claim — hero + teammate list */}
        {claimedSelfId && (() => {
          const self = roster.find(p => p.id === claimedSelfId);
          const teammates = roster.filter(p => p.id !== claimedSelfId);
          const followedCount = teammates.filter(p => chosenPlayers[p.id]).length;
          if (!self) return null;
          return (
            <>
              <div className="squircle-md p-4 flex items-center gap-3.5 lg-aura mb-1"
                style={{
                  background:
                    'radial-gradient(ellipse 65% 60% at 22% 30%, rgba(0,214,254,0.22) 0%, transparent 62%),' +
                    'var(--glass-card-bg)',
                  backdropFilter: 'blur(36px) saturate(180%)',
                  WebkitBackdropFilter: 'blur(36px) saturate(180%)',
                  border: '1.5px solid var(--brand-cyan)',
                  boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), 0 10px 30px -10px rgba(0,214,254,0.40)',
                }}>
                <JerseyBadge number={self.number} size="lg" />
                <div className="flex-1 min-w-0">
                  <div className="sf text-[9.5px] tracking-[0.18em] uppercase font-bold mb-0.5" style={{ color: 'var(--brand-cyan-text)' }}>
                    Playing as
                  </div>
                  <div className="sf-display text-[16px] font-bold leading-tight tracking-[-0.01em] truncate" style={{ color: 'var(--text-primary)' }}>
                    {self.name}
                  </div>
                  <div className="sf text-[11.5px] mt-0.5 truncate" style={{ color: 'var(--text-tertiary)' }}>{self.position}</div>
                </div>
                <button type="button" onClick={() => setClaimedSelfId(null)}
                  className="squircle-sm px-3 py-1.5 sf text-[11px] font-semibold shrink-0 lg-aura"
                  style={{ background: 'transparent', border: '1px solid var(--brand-cyan-border)', color: 'var(--brand-cyan-text)' }}>
                  Change
                </button>
              </div>
              {teammates.length > 0 && (
                <div className="px-1 mt-7 mb-3">
                  <div className="sf text-[10px] tracking-[0.18em] uppercase font-bold" style={{ color: 'var(--text-tertiary)' }}>
                    Your teammates · {followedCount} followed
                  </div>
                  <div className="sf text-[10.5px] mt-1" style={{ color: 'var(--text-faint)' }}>
                    Tap to unfollow anyone you don't want in your feed.
                  </div>
                </div>
              )}
              <div className="space-y-1.5">
                {teammates.map(p => {
                  const isFollowed = !!chosenPlayers[p.id];
                  return (
                    <button key={p.id} type="button" onClick={() => togglePlayer(p.id)} aria-pressed={isFollowed}
                      className="w-full text-start squircle-sm p-2.5 flex items-center gap-2.5 lg-aura"
                      style={{
                        background: isFollowed ? 'rgba(0,214,254,0.06)' : 'transparent',
                        border: isFollowed ? '1px solid rgba(0,214,254,0.22)' : '1px solid var(--glass-card-border)',
                      }}>
                      <JerseyBadge number={p.number} size="sm" />
                      <div className="flex-1 min-w-0">
                        <div className="sf-display text-[13.5px] font-bold leading-tight truncate" style={{ color: 'var(--text-primary)' }}>{p.name}</div>
                        <div className="sf text-[10.5px] mt-0.5 truncate" style={{ color: 'var(--text-tertiary)' }}>{p.position}</div>
                      </div>
                      <div className="w-5 h-5 rounded-full flex items-center justify-center shrink-0"
                        style={isFollowed ? { background: 'var(--brand-cyan)' } : { background: 'var(--hatch-grain)', border: '1px solid var(--hairline-strong)' }}>
                        {isFollowed && (
                          <svg width={10} height={10} viewBox="0 0 14 14" fill="none" stroke="#000"
                            strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"
                            style={{ width: 10, height: 10, display: 'block' }}>
                            <path d="M3 7 L6 10 L11 4" />
                          </svg>
                        )}
                      </div>
                    </button>
                  );
                })}
              </div>
              {/* Stars from other teams — division standouts you might
                 want to follow. Each row shows the rival team's logo
                 chip + accent color so the cross-team identity reads
                 at a glance. Defaults to unfollowed; the user opts in. */}
              {RIVAL_STARS.length > 0 && (() => {
                const rivalsFollowed = RIVAL_STARS.filter(r => !!chosenPlayers[r.id]).length;
                return (
                  <>
                    <div className="px-1 mt-7 mb-3">
                      <div className="sf text-[10px] tracking-[0.18em] uppercase font-bold" style={{ color: 'var(--text-tertiary)' }}>
                        Stars from other teams · {rivalsFollowed} followed
                      </div>
                      <div className="sf text-[10.5px] mt-1" style={{ color: 'var(--text-faint)' }}>
                        Standouts in your division — auto-clipped into your feed when you tap follow.
                      </div>
                    </div>
                    <div className="space-y-1.5">
                      {RIVAL_STARS.map(rv => {
                        const rvTeam = TEAMS_DB[rv.teamKey];
                        const isFollowed = !!chosenPlayers[rv.id];
                        return (
                          <button key={rv.id} type="button" onClick={() => togglePlayer(rv.id)} aria-pressed={isFollowed}
                            className="w-full text-start squircle-sm p-2.5 flex items-center gap-2.5 lg-aura"
                            style={{
                              background: isFollowed ? 'rgba(0,214,254,0.06)' : 'transparent',
                              border: isFollowed ? '1px solid rgba(0,214,254,0.22)' : '1px solid var(--glass-card-border)',
                            }}>
                            <JerseyBadge number={rv.number} size="sm" />
                            <div className="flex-1 min-w-0">
                              <div className="sf-display text-[13.5px] font-bold leading-tight truncate" style={{ color: 'var(--text-primary)' }}>{rv.name}</div>
                              <div className="sf text-[10.5px] mt-0.5 truncate flex items-center gap-1.5" style={{ color: 'var(--text-tertiary)' }}>
                                {rvTeam && rvTeam.src && (
                                  <span className="inline-flex items-center justify-center overflow-hidden shrink-0"
                                    style={{ width: 14, height: 14, background: '#fff', borderRadius: 3 }}>
                                    <img src={rvTeam.src} alt=""
                                      style={{ width: '100%', height: '100%', objectFit: 'contain', padding: 1 }} />
                                  </span>
                                )}
                                <span className="truncate">{rvTeam ? rvTeam.name : 'Rival'} · {rv.position}</span>
                              </div>
                            </div>
                            <div className="w-5 h-5 rounded-full flex items-center justify-center shrink-0"
                              style={isFollowed ? { background: 'var(--brand-cyan)' } : { background: 'var(--hatch-grain)', border: '1px solid var(--hairline-strong)' }}>
                              {isFollowed && (
                                <svg width={10} height={10} viewBox="0 0 14 14" fill="none" stroke="#000"
                                  strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"
                                  style={{ width: 10, height: 10, display: 'block' }}>
                                  <path d="M3 7 L6 10 L11 4" />
                                </svg>
                              )}
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  </>
                );
              })()}
            </>
          );
        })()}
        <div className="mt-5 text-center">
          <button type="button" onClick={() => setNotifyOpen(true)} className="sf text-[12.5px] font-semibold" style={{ color: 'var(--brand-cyan-text)' }}>
            I'm not on this roster yet
          </button>
        </div>
      </div>
      <OnboardDock>
        <button onClick={canContinue ? onNext : undefined} disabled={!canContinue}
          className="squircle-md py-4 w-full sf text-[14.5px] font-semibold transition-all"
          style={{
            color: !canContinue ? 'rgba(255,255,255,0.40)' : '#0a0d18',
            background: !canContinue ? 'var(--glass-card-bg)' : 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            border: !canContinue ? '1px solid var(--glass-card-border)' : 'none',
            boxShadow: !canContinue ? 'none' : '0 8px 24px -8px rgba(0,214,254,0.55), inset 0 1px 0 rgba(255,255,255,0.40)',
            cursor: !canContinue ? 'not-allowed' : 'pointer',
          }}>
          {canContinue ? 'Continue' : 'Pick your jersey to continue'}
        </button>
      </OnboardDock>
      {notifyOpen && (
        <NotOnRosterModal notifySent={notifySent}
          onNotify={() => {
            setNotifySent(true);
            setTimeout(() => { setNotifyOpen(false); setNotifySent(false); onNext(); }, 1200);
          }}
          onClose={() => setNotifyOpen(false)} />
      )}
    </>
  );
};

/* ── PlayerOnboarding orchestrator ──────────────────────────────
   Direct port of halo-design-system/src/screens/onboarding/PlayerOnboarding.tsx
   with the coach attribution stripped per user spec (coach persona not
   built yet — Halo will generate these invites later).

   Hardcoded demo invite context: teamId = t1 (Varsity / Eastside Prep).
   When coach side ships, swap this for a URL-param reader.

   Steps:
     invite-entry → signup OR signin → teams-locked → claim-and-follow
       → notif-upsell → done(Home) */
const DEFAULT_INVITE = { teamId: 't1' };

/* OnboardSidebar — desktop-only persistent rail showing the onboarding flow
   as a vertical step list. Sits inside .onb-with-sidebar > flex-row;
   `hidden lg:flex` on the outer so mobile never sees it. Steps are
   clickable for demo navigation; in production this would gate to
   completed steps only via a `reached` index.

   `steps` and `stepToKey` are passed in so the same sidebar renders the
   4-step Player flow OR the 3-step Fan flow. flowLabel goes in the
   bottom-left meta line. */
const ONB_PLAYER_STEPS = [
  { id: 1, label: 'Welcome',       sub: 'Tap into your team',  matches: ['invite-entry', 'signup', 'signin'] },
  { id: 2, label: 'Teams',         sub: 'Pick who to follow',  matches: ['teams-locked'] },
  { id: 3, label: 'Players',       sub: 'Claim your jersey',   matches: ['claim-and-follow'] },
  { id: 4, label: 'Notifications', sub: 'Stay in the loop',    matches: ['notif-upsell'] },
];
const STEP_TO_STEP_KEY = {
  1: 'invite-entry',
  2: 'teams-locked',
  3: 'claim-and-follow',
  4: 'notif-upsell',
};
const ONB_FAN_STEPS = [
  { id: 1, label: 'Welcome', sub: 'Tell us who you are', matches: ['persona'] },
  { id: 2, label: 'Teams',   sub: 'Pick who to follow',  matches: ['teams'] },
  { id: 3, label: 'Players', sub: 'Names you care about', matches: ['players'] },
];
const FAN_STEP_TO_STEP_KEY = {
  1: 'persona',
  2: 'teams',
  3: 'players',
};

const OnboardSidebar = ({ currentStep, onJumpTo, onExit, steps = ONB_PLAYER_STEPS, stepToKey = STEP_TO_STEP_KEY, flowLabel = 'Player onboarding' }) => {
  const currentIdx = steps.findIndex(s => s.matches.includes(currentStep));
  return (
    <aside className="hidden lg:flex flex-col shrink-0"
      style={{
        width: 280,
        borderInlineEnd: '1px solid var(--hairline)',
        background: 'var(--canvas-bg-soft)',
      }}>
      {/* Brand + close cluster */}
      <div className="px-6 pt-8 pb-10 flex items-center justify-between">
        <div className="flex items-center gap-2.5">
          <div className="w-9 h-9 rounded-[10px] flex items-center justify-center sf-display"
            style={{
              background: 'linear-gradient(135deg, rgba(0,214,254,0.95) 0%, rgba(0,150,200,1) 100%)',
              color: '#0a0d18', fontSize: 18, fontWeight: 800, letterSpacing: '-0.04em',
              boxShadow: '0 0 18px rgba(0,214,254,0.30)',
            }}>H</div>
          <span className="sf-display text-[15px] font-bold tracking-[-0.01em]" style={{ color: 'var(--text-primary)' }}>Halo</span>
        </div>
        {onExit && (
          <button onClick={onExit} aria-label="Exit onboarding"
            className="w-8 h-8 lg-glass squircle-sm flex items-center justify-center"
            style={{ color: 'var(--text-secondary)' }}>
            <Icon name="close" size={11} stroke={1.8} />
          </button>
        )}
      </div>

      {/* Step list */}
      <nav className="flex-1 px-3 relative">
        {steps.map((s, i) => {
          const state = i < currentIdx ? 'past' : i === currentIdx ? 'current' : 'future';
          const canJump = state !== 'future';
          return (
            <div key={s.id} className="relative">
              <button type="button"
                className="onb-sidebar-step"
                data-state={state}
                onClick={() => canJump && onJumpTo && onJumpTo(stepToKey[s.id])}
                disabled={!canJump}>
                <div className="onb-sidebar-step-num">
                  {state === 'past' ? (
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M3 7 L6 10 L11 4" />
                    </svg>
                  ) : s.id}
                </div>
                <div className="min-w-0 flex-1">
                  <div className="onb-sidebar-step-label">{s.label}</div>
                  <div className="onb-sidebar-step-sub">{s.sub}</div>
                </div>
              </button>
              {i < steps.length - 1 && <div className="onb-sidebar-connector" />}
            </div>
          );
        })}
      </nav>

      {/* Bottom — quiet help link area */}
      <div className="px-6 py-6">
        <div className="sf text-[11px]" style={{ color: 'var(--text-faint)' }}>
          Step {currentIdx + 1} of {steps.length} · {flowLabel}
        </div>
      </div>
    </aside>
  );
};

const PlayerOnboarding = ({ onDone, onExit, inviteContext = DEFAULT_INVITE }) => {
  const [step, setStep] = useState('invite-entry');
  const [chosenTeams, setChosenTeams] = useState([inviteContext.teamId]);
  const [chosenPlayers, setChosenPlayers] = useState({});
  /* Pre-claim Tal Weiss (r1 = #7 SG on Varsity) so the user can hit
     Continue on ClaimAndFollow immediately during demo. Setting this
     here triggers the auto-follow effect inside ClaimAndFollow that
     fans-out followed teammates. */
  const [claimedSelfId, setClaimedSelfId] = useState('r1');
  /* Lifted signup form state — lives in the orchestrator so backing out
     of TeamsStepLocked to fix a typo retains every field. Per the
     May-2026 design call (TeamsLocked back → signup with pre-filled
     form). Values are pre-filled with the Tal Weiss demo persona so
     every screen of the player flow is immediately Continue-able
     without typing during a demo. Password satisfies the validation
     (8+ chars, 1 uppercase, 1 number). */
  const [signupForm, setSignupForm] = useState({
    name: 'Tal Weiss',
    email: 'tal@halo.tv',
    password: 'Halohalo1',
    confirmPw: 'Halohalo1',
    birthDate: '2008-05-14',
    gender: 'Male',
    country: 'US',
    phoneCountry: 'US',
    phone: '5551234567',
  });
  /* w-full is critical on desktop — without it, this div is a flex child
     of `.stage-desktop` (display:flex) and would shrink to the inner
     card's 480px width, pinning the whole onboarding flow to the
     inline-start edge of the viewport. With w-full the outer div spans
     the full track and the inner card's `lg:mx-auto` centers it. */
  /* Player onboarding — desktop wears a SaaS sidebar-canvas layout:
     persistent left rail (280px) with vertical step list, full-bleed
     right content (no card border). Mobile stays exactly as before —
     full-bleed scroll with the OnboardStepper at the top. The two
     layouts share the same step components; only the orchestrator
     wrapper changes between viewports.

     `.onb-with-sidebar` class on the outer scopes the CSS rule that
     hides nested OnboardSteppers on lg+ so the sidebar isn't duplicated
     by an in-content stepper. Fan flow's stepper is unaffected because
     it doesn't carry this class. */
  return (
    <div className="anim-fade sf onb-with-sidebar" style={{ position: 'absolute', inset: 0, background: 'var(--canvas-bg)', color: 'var(--text-primary)' }}>
      <div className="lg-atmosphere" />
      <div className="absolute inset-0 z-[1] pointer-events-none"
        style={{ background: 'linear-gradient(180deg, var(--vignette-corner) 0%, transparent 30%, transparent 70%, var(--vignette-corner-soft) 100%)' }} />
      <div className="absolute inset-0 z-10 flex flex-col lg:flex-row">
        <OnboardSidebar
          currentStep={step}
          onJumpTo={(s) => setStep(s)}
          onExit={onExit} />
        <main className="relative flex-1 min-w-0">
          <div className="onb-scroll-area">
            <div className="relative flex flex-col min-h-full lg:max-w-[820px] lg:mx-auto lg:px-12 lg:py-2">
          {step === 'invite-entry' && (
            <PlayerInviteEntry teamId={inviteContext.teamId}
              onSignUp={() => setStep('signup')}
              onSignIn={() => setStep('signin')}
              onBack={onExit} />
          )}
          {step === 'signup' && (
            <FullSignUpScreen
              form={signupForm} setForm={setSignupForm}
              onSubmit={() => setStep('teams-locked')}
              onSwitchToSignIn={() => setStep('signin')}
              onBack={() => setStep('invite-entry')} />
          )}
          {step === 'signin' && (
            <>
              <OnboardStepper step={1} total={4} onBack={() => setStep('invite-entry')} label="Step 1 of 4" />
              <div className="flex-1 onb-scroll px-5 pt-6">
                <SignInForm onSubmit={() => setStep('teams-locked')} />
              </div>
            </>
          )}
          {step === 'teams-locked' && (
            <TeamsStepLocked lockedTeamId={inviteContext.teamId}
              chosen={chosenTeams} setChosen={setChosenTeams}
              /* Back goes to signup (not invite-entry) — the user has
                 already created their account, so returning to a
                 pre-account screen would feel like undoing it. With the
                 lifted signupForm state above, all fields are still
                 there if they need to edit one. */
              onBack={() => setStep('signup')}
              onNext={() => setStep('claim-and-follow')} />
          )}
          {step === 'claim-and-follow' && (
            <ClaimAndFollow teamId={inviteContext.teamId}
              claimedSelfId={claimedSelfId} setClaimedSelfId={setClaimedSelfId}
              chosenPlayers={chosenPlayers} setChosenPlayers={setChosenPlayers}
              onBack={() => setStep('teams-locked')}
              onNext={() => setStep('notif-upsell')} />
          )}
          {step === 'notif-upsell' && (
            <NotifUpsell onBack={() => setStep('claim-and-follow')}
              onAllow={onDone} onSkip={onDone} />
          )}
            </div>{/* /content max-width wrapper */}
          </div>{/* /onb-scroll-area */}
        </main>
      </div>{/* /flex-row sidebar+content */}
    </div>
  );
};

/* ── AuthBackButton ──────────────────────────────────────────────
   Reusable back chevron used by the Forgot/Reset screens. Mirrors the
   DS auth back affordance — small glass squircle with left-pointing
   chevron, RTL-safe via icon-flip-rtl. */
const AuthBackButton = ({ onBack }) => (
  <button onClick={onBack}
    className="w-9 h-9 lg-glass squircle-sm flex items-center justify-center"
    style={{ color: 'rgba(255,255,255,0.85)' }}
    aria-label="Back to sign in">
    <svg width={14} height={14} viewBox="0 0 14 14" fill="none" stroke="currentColor"
      strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"
      className="icon-flip-rtl"
      style={{ width: 14, height: 14, display: 'block' }}>
      <path d="M8.5 2.5 L4 7 L8.5 11.5" />
    </svg>
  </button>
);

/* ── AuthGlassField ─────────────────────────────────────────────
   Reusable glass-card input used by Forgot/Reset screens. Same visual
   language as the existing SignInForm's GlassField but local to the
   Phase 3 screens so we don't have to refactor the existing one. */
const AuthGlassField = ({ label, type = 'text', value, onChange, placeholder, autoFocus, error }) => {
  const [showPw, setShowPw] = useState(false);
  const inputType = type === 'password' && showPw ? 'text' : type;
  return (
    <div className="lg-glass-card squircle-md px-3.5 py-3"
      style={error ? { border: '1px solid rgba(220,38,38,0.55)' } : undefined}>
      <label className="sf text-[10px] tracking-[0.14em] uppercase font-semibold block mb-1" style={{ color: 'var(--text-tertiary)' }}>{label}</label>
      <div className="flex items-center gap-2">
        <input type={inputType} value={value} onChange={(e) => onChange(e.target.value)}
          placeholder={placeholder} autoFocus={autoFocus}
          className="auth-input sf text-[14.5px] flex-1" />
        {type === 'password' && (
          <button type="button" onClick={() => setShowPw(v => !v)}
            className="sf text-[11px] font-semibold" style={{ color: 'var(--brand-cyan-text)' }}>
            {showPw ? 'Hide' : 'Show'}
          </button>
        )}
      </div>
      {error && <div className="sf text-[10.5px] mt-1" style={{ color: '#fca5a5' }}>{error}</div>}
    </div>
  );
};

/* ── ForgotPasswordScreen ────────────────────────────────────────
   Direct port of DS screens/auth/ForgotPassword.tsx. Email input →
   "Send reset link" → success card ("Check your inbox"). The sent
   state is internal — submitting flips a local boolean instead of
   navigating to a separate hash route. Mirrors DS dispatch pattern
   collapsed to local state since the prototype has no reducer. */
const ForgotPasswordScreen = ({ onBack }) => {
  const [email, setEmail] = useState('');
  const [sent, setSent] = useState(false);
  const valid = email.includes('@');

  if (sent) {
    return (
      <div className="anim-fade px-6 pt-24 text-center max-w-[440px] mx-auto">
        <div className="w-16 h-16 rounded-full lg-glass-strong mx-auto mb-5 flex items-center justify-center"
          style={{ boxShadow: '0 0 32px rgba(0,214,254,0.45)' }}>
          <svg width={28} height={28} viewBox="0 0 28 28" fill="none" stroke="var(--brand-cyan)"
            strokeWidth={2.6} strokeLinecap="round" strokeLinejoin="round"
            style={{ width: 28, height: 28, display: 'block' }}>
            <path d="M3 7l11 7L25 7" />
            <rect x={3} y={6} width={22} height={16} rx={2} />
          </svg>
        </div>
        <h1 className="sf-display text-[24px] font-bold text-white leading-tight tracking-[-0.022em] mb-2">
          Check your inbox
        </h1>
        <p className="sf text-[13px] leading-relaxed max-w-[260px] mx-auto mb-8" style={{ color: 'var(--text-tertiary)' }}>
          We sent a reset link to {email || 'your email'}. If it doesn't show in a minute, peek in spam.
        </p>
        <button onClick={onBack}
          className="squircle-md py-3 px-6 sf text-[13px] font-semibold"
          style={{
            color: '#0a0d18',
            background: 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            boxShadow: '0 4px 12px -2px rgba(0,214,254,0.45), inset 0 1px 0 rgba(255,255,255,0.40)',
          }}>
          Back to sign in
        </button>
      </div>
    );
  }

  return (
    <div className="anim-fade max-w-[440px] mx-auto">
      <div className="pt-12 px-5 lg:px-0">
        <AuthBackButton onBack={onBack} />
      </div>
      <div className="px-6 pt-8 lg:px-0">
        <h1 className="sf-display text-[28px] font-bold text-white leading-tight tracking-[-0.025em] mb-1.5">
          Reset password
        </h1>
        <p className="sf text-[13px] mb-7 leading-relaxed" style={{ color: 'rgba(255,255,255,0.60)' }}>
          Type the email on your account. We'll send a one-tap reset link.
        </p>
        <AuthGlassField label="Email" type="email" value={email} onChange={setEmail}
          placeholder="you@school.com" autoFocus />
        <button onClick={valid ? () => setSent(true) : undefined} disabled={!valid}
          className="mt-5 squircle-md py-3.5 w-full sf text-[14.5px] font-semibold transition-all"
          style={{

/* ── ResetPasswordScreen ────────────────────────────────────────
   Direct port of DS screens/auth/ResetPassword.tsx. New password +
   confirm → "Save password" → "Password updated" success card.
   `invalidToken` prop renders the "this link expired" full-screen
   state instead of the form (demo: toggle via prop). */
const ResetPasswordScreen = ({ onBack, onRequestNewLink, invalidToken = false }) => {
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [done, setDone] = useState(false);
  const pwLongEnough = password.length >= 6;
  const pwMatch = !confirm || password === confirm;
  const valid = pwLongEnough && password === confirm;
  const confirmError = confirm && !pwMatch ? "Passwords don't match" : null;

  if (invalidToken) {
    return (
      <div className="anim-fade px-6 pt-24 text-center max-w-[440px] mx-auto">
        <div className="w-16 h-16 rounded-full mx-auto mb-5 flex items-center justify-center"
          style={{
            background: 'rgba(220,38,38,0.12)',
            border: '1px solid rgba(220,38,38,0.45)',
            boxShadow: '0 0 32px rgba(220,38,38,0.30)',

          <svg width={28} height={28} viewBox="0 0 28 28" fill="none" stroke="rgba(252,165,165,0.95)"
            strokeWidth={2.4} strokeLinecap="round" strokeLinejoin="round"

            <circle cx={14} cy={14} r={11} />
            <path d="M14 8 V15" />
            <path d="M14 19 L14 19.5" />

        </div>
        <h1 className="sf-display text-[24px] font-bold text-white leading-tight tracking-[-0.022em] mb-2">

        <p className="sf text-[13px] leading-relaxed max-w-[260px] mx-auto mb-8" style={{ color: 'var(--text-tertiary)' }}>

        </p>
        <button onClick={onRequestNewLink}
          className="squircle-md py-3 px-6 sf text-[13px] font-semibold"
          style={{
            color: '#0a0d18',
            background: 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            boxShadow: '0 4px 12px -2px rgba(0,214,254,0.45), inset 0 1px 0 rgba(255,255,255,0.40)',
          }}>

      </div>

  if (done) {

      <div className="anim-fade px-6 pt-24 text-center max-w-[440px] mx-auto">
        <div className="w-16 h-16 rounded-full lg-glass-strong mx-auto mb-5 flex items-center justify-center"
          style={{ boxShadow: '0 0 32px rgba(0,214,254,0.45)' }}>
          <svg width={28} height={28} viewBox="0 0 28 28" fill="none" stroke="var(--brand-cyan)"
            strokeWidth={3} strokeLinecap="round" strokeLinejoin="round"
            style={{ width: 28, height: 28, display: 'block' }}>
            <path d="M5 14 L11 20 L23 8" />
          </svg>
        </div>
        <h1 className="sf-display text-[24px] font-bold text-white leading-tight tracking-[-0.022em] mb-2">
          Password updated
        </h1>
        <p className="sf text-[13px] leading-relaxed max-w-[260px] mx-auto mb-8" style={{ color: 'var(--text-tertiary)' }}>
          All set. Sign in with your new password.
        </p>
        <button onClick={onBack}
          className="squircle-md py-3 px-6 sf text-[13px] font-semibold"
          style={{
            color: '#0a0d18',
            background: 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            boxShadow: '0 4px 12px -2px rgba(0,214,254,0.45), inset 0 1px 0 rgba(255,255,255,0.40)',
          }}>
          Back to sign in
        </button>

  return (
    <div className="anim-fade max-w-[440px] mx-auto">
      <div className="pt-12 px-5 lg:px-0">
        <AuthBackButton onBack={onBack} />
