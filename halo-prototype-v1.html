/* ============================================================
   5. HOME — DS Home composition: Header → Circles → GameCard →
   Drops → Following → Storytelling → TeamMoments
   ============================================================ */

/* HighlightCircles — DS sort: YOU → followed teams (live first) → followed players (claimed first).
   No Add button (DS doesn't have one — empty state is a separate invite card).

   Tap behavior (per May-2026 Yoni spec): every circle opens a VIDEO viewer,
   never a profile/game-stats page.
     - YOU             → HighlightViewer (story-style 9:16 reel) starting at
                         your most recent moment, then auto-advances through
                         the rest of the moment feed.
     - Team-member     → HighlightViewer starting at that player's most
                         recent moment, then feeds onward.
     - Live team       → GameVideoViewer for the live game (16:9 landscape
                         video in portrait phone shell, fullscreen on
                         desktop).
     - Non-live team   → GameVideoViewer of that team's most recent finished
                         game (e.g. Tigers vs another team highlight).
   Seed data caveat: SEED_MOMENTS are currently all "self" so the per-player
   start indices collapse to 0 in this prototype. The routing contract is
   correct; the data will get its own per-player slicing later. */
const HighlightCircles = ({ onPickMoment, onOpenGame, onOpenGameVideo, onOpenAthlete }) => {
  const liveGame = SEED_GAMES.find(g => g.status === 'live');
  /* Helper: pick a representative game id for a non-live team circle.
     Order of preference: most-recent finished/just-ended game whose home
     OR away matches → first upcoming game for that team → fall back to
     the live game so the click never dead-ends in the prototype. */
  const gameIdForTeam = (teamName) => {
    const finished = SEED_GAMES.find(g =>
      (g.status === 'just-ended' || g.status === 'final')
      && (g.home === teamName || g.away === teamName));
    if (finished) return finished.id;
    const upcoming = SEED_GAMES.find(g =>
      g.status === 'upcoming'
      && (g.home === teamName || g.away === teamName));
    if (upcoming) return upcoming.id;
    return liveGame ? liveGame.id : (SEED_GAMES[0] && SEED_GAMES[0].id);
  };
  /* Per-person starting index inside the moment feed. Until SEED_MOMENTS
     carries personId, every circle starts at 0 — but the contract is in
     place for when we slice data per player. */
  const indexForPerson = (_personId) => 0;
  return (
    <div className="px-5 lg:px-8 xl:px-12 pt-2 pb-5">
      <div className="flex gap-4 overflow-x-auto no-scrollbar">
        {/* YOU — opens HighlightViewer starting at your latest moment. */}
        <IdentityCircle kind="self" avatar={{ initial: 'T' }} label="You" isNew
          onClick={() => onPickMoment(indexForPerson('self'))} />
        {/* Live team — opens GameVideoViewer of the live game. */}
        <IdentityCircle kind="team" avatar={{ initial: 'EP' }} label="Varsity"
          liveGame={{ gameId: liveGame.id }}
          onClick={() => onOpenGameVideo(liveGame.id)} />
        {/* Non-live team — opens GameVideoViewer of the team's last/next
            game so the circle leads to actual team video, not a profile. */}
        <IdentityCircle kind="team" avatar={{ initial: 'LH' }} label="Tigers"
          onClick={() => onOpenGameVideo(gameIdForTeam('Tigers'))} />
        {/* Followed players — every circle opens HighlightViewer at that
            player's most recent moment (claimed silhouette + unclaimed
            jersey both behave the same — tap = watch their reel). */}
        <IdentityCircle kind="player" avatar={{ initial: 'S' }} team={{ initial: 'EP' }} label="Sarah" isClaimed isNew
          onClick={() => onPickMoment(indexForPerson('sarah'))} />
        <IdentityCircle kind="player" avatar={{ initial: 'D' }} team={{ initial: 'EP' }} label="Dylan" isClaimed
          onClick={() => onPickMoment(indexForPerson('dylan'))} />
        <IdentityCircle kind="player" avatar={{ jersey: 23 }} team={{ initial: 'EP' }} label="Player #23" isClaimed={false}
          onClick={() => onPickMoment(indexForPerson('p-23'))} />
        <IdentityCircle kind="player" avatar={{ jersey: 11 }} team={{ initial: 'LH' }} label="Player #11" isClaimed={false}
          onClick={() => onPickMoment(indexForPerson('p-11'))} />
      </div>
    </div>
  );
};

/* GameCard — morphing variants.
   Renders 5 states from the DS spec (off | pre | live | just-ended | ready).
   `error` is intentionally skipped for the prototype.

   Demo cycle: tapping any variant's eyebrow strip advances the displayed
   state. The off state (NextGameTeaser) is the resting home; tapping its
   eyebrow ENTERS the game-day cycle at `pre`. Once inside the cycle,
   tapping advances through pre → live → just-ended → ready → pre — never
   returns to off (off is non-cyclic).

   Internal state lets the demo work even when the parent passes a fixed
   `state` prop — we use the prop as the initial value, then override on
   user interaction. */
const GAME_CYCLE = ['pre', 'live', 'just-ended', 'ready'];
const nextDemoState = (s) => {
  if (s === 'off') return 'pre';
  const i = GAME_CYCLE.indexOf(s);
  return GAME_CYCLE[(i + 1) % GAME_CYCLE.length];
};

/* CycleEyebrow — reusable tappable eyebrow strip. Renders a row with a
   pulse dot + uppercase tracking-wide label, and on tap calls onCycle to
   advance the demo. The cursor + active-scale make it discoverable as a
   tap target without ruining the editorial feel. */
const CycleEyebrow = ({ children, onCycle, color = 'var(--brand-cyan-text)', glow = '0 0 12px rgba(0,214,254,0.95), 0 0 4px rgba(0,214,254,0.65)', trailing }) => (
  <div className="relative z-10 px-4 pt-4 pb-2 flex items-center justify-between">
    <button onClick={onCycle} className="flex items-center gap-2 -m-1 p-1 squircle-sm transition-all active:scale-[0.96]"
      style={{ background: 'transparent' }} title="Tap to cycle demo state">
      <div className="w-2 h-2 rounded-full anim-pulse-dot" style={{ background: color, boxShadow: glow }} />
      <span className="sf text-[10.5px] tracking-[0.18em] uppercase font-bold" style={{ color }}>{children}</span>
    </button>
    {trailing}
  </div>
);

const GameCard = ({ state: initialState = 'off', onOpenGame, onOpenDrop }) => {
  const [state, setState] = useState(initialState);
  const cycle = () => setState(nextDemoState);

  /* ── PRE ── Countdown card (DS GameCardPre, line 8525 in v3.2).
     Imminent mode (<10 min) bumps the cyan ember + glow. */
  if (state === 'pre') {
    const g = SEED_GAMES.find(x => x.status === 'upcoming') || SEED_GAMES[0];
    const [remaining, setRemaining] = useState(Math.max(0, Math.min(g.kickoffInSec ?? 7200, 7200)));
    useEffect(() => {
      const tick = setInterval(() => setRemaining(r => Math.max(0, r - 1)), 1000);
      return () => clearInterval(tick);
    }, []);
    const isImminent = remaining > 0 && remaining < 600;
    const progress = 100 - Math.min(100, remaining / 72);
    return (
      <div className={`relative squircle-md p-4 overflow-hidden lg-aura ${isImminent ? 'lg-pre-imminent' : ''}`}
        style={{
          background: `radial-gradient(ellipse 60% 70% at 18% 28%, rgba(0,214,254,${isImminent ? 0.22 : 0.12}) 0%, transparent 60%), radial-gradient(ellipse 60% 70% at 88% 78%, rgba(132,88,255,0.10) 0%, transparent 60%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)`,
          border: '1px solid var(--glass-card-border)',
          backdropFilter: 'blur(36px) saturate(180%)',
          WebkitBackdropFilter: 'blur(36px) saturate(180%)',
          boxShadow: `inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow), 0 0 ${isImminent ? 40 : 20}px -8px rgba(0,214,254,${isImminent ? 0.40 : 0.18})`,
        }}>
        <div className="relative z-10 flex items-center mb-3">
          <button onClick={cycle} className="flex items-center gap-2 -m-1 p-1 squircle-sm active:scale-[0.96]" title="Tap to cycle demo state">
            <div className="w-1.5 h-1.5 rounded-full bg-halo-cyan anim-pulse-dot" style={{ boxShadow: '0 0 8px rgba(0,214,254,0.7)' }} />
            <span className="sf text-[10px] font-bold tracking-[0.16em] uppercase" style={{ color: 'var(--brand-cyan-text)' }}>
              {isImminent ? 'Starting soon' : 'Drop incoming · pre-game'}
            </span>
          </button>
        </div>
        <div className="relative z-10">
          <div className="sf-display text-[20px] font-bold tracking-[-0.015em] leading-none" style={{ color: 'var(--text-primary)' }}>{g.home}</div>
          <div className="sf text-[12.5px] mt-1" style={{ color: 'var(--text-secondary)' }}>vs {g.away}</div>
          <div className="sf text-[11px] mt-1" style={{ color: 'var(--text-tertiary)' }}>{g.venue || 'Eastside Gym'}</div>
        </div>
        <div className="relative z-10 mt-4 flex items-baseline gap-2">
          <div className="sf-display text-[34px] font-bold tabular-nums leading-none"
            style={{ color: 'var(--text-primary)', textShadow: isImminent ? '0 0 18px rgba(0,214,254,0.40)' : 'none' }}>
            {fmt.countdown(remaining)}
          </div>
          <span className="sf text-[11px]" style={{ color: 'var(--text-tertiary)' }}>tipoff</span>
        </div>
        <div className="relative z-10 h-[3px] mt-3 overflow-hidden rounded-full" style={{ background: 'var(--hairline-strong)' }}>
          <div className="h-full bg-halo-cyan" style={{
            width: progress + '%',
            transition: 'width 1s linear',
            boxShadow: `0 0 ${isImminent ? 14 : 8}px rgba(0,214,254,${isImminent ? 0.75 : 0.5})`,
          }} />
        </div>
      </div>
    );
  }

  /* ── LIVE ── In-game card with auto-ticking moments + Watch live CTA. */
  if (state === 'live') {
    const g = SEED_GAMES.find(x => x.status === 'live') || SEED_GAMES[0];
    const [moments, setMoments] = useState(g.momentsCount || 5);
    useEffect(() => {
      const t = setInterval(() => setMoments(m => m + (Math.random() > 0.5 ? 1 : 0)), 6000);
      return () => clearInterval(t);
    }, []);
    return (
      <div role="button" tabIndex={0} onClick={() => onOpenGame(g.id)}
        className="relative w-full text-start squircle-md overflow-hidden lg-aura lg-shine lg-live-ember cursor-pointer"
        style={{
          background: 'linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)',
          border: '1px solid var(--glass-card-border)',
          backdropFilter: 'blur(36px) saturate(180%)',
          WebkitBackdropFilter: 'blur(36px) saturate(180%)',
          color: 'var(--text-primary)',
        }}>
        <div className="lg-live-amp" aria-hidden="true" />
        <div className="relative px-4 pt-3 pb-2 lg:px-5 flex items-center justify-between"
          style={{ borderBottom: '1px solid var(--hairline)', zIndex: 2 }}>
          <button onClick={(e) => { e.stopPropagation(); cycle(); }}
            className="live-red squircle-sm px-2 py-1 inline-flex items-center gap-1.5 active:scale-[0.96]" title="Tap to cycle demo state">
            <div className="w-2 h-2 rounded-full bg-white anim-pulse-dot" style={{ boxShadow: '0 0 6px rgba(255,255,255,0.95)', flexShrink: 0 }} />
            <span className="sf text-[10px] font-bold tracking-[0.18em] uppercase leading-none" style={{ color: '#FFF' }}>LIVE</span>
          </button>
          <div className="flex items-center gap-2">
            <span className="sf text-[10px] font-medium tracking-tight" style={{ color: 'var(--text-muted)' }}>{moments} moments</span>
            <span className="sf text-[10px] font-semibold" style={{ color: 'var(--text-tertiary)' }}>· {g.period}</span>
          </div>
        </div>
        <div className="relative px-4 lg:px-5 py-4 flex items-center justify-between" style={{ zIndex: 2 }}>
          <div className="flex-1 min-w-0">
            <div className="sf-display text-[18px] font-bold leading-tight tracking-[-0.015em]" style={{ color: 'var(--text-primary)' }}>{g.home}</div>
            <div className="sf text-[12px]" style={{ color: 'var(--text-tertiary)' }}>vs {g.away}</div>
          </div>
          <div className="flex items-baseline gap-3 sf-display font-bold tabular-nums">
            <span className="text-[28px]" style={{ color: 'var(--text-primary)' }}>{g.scoreHome}</span>
            <span className="text-[16px]" style={{ color: 'var(--text-tertiary)' }}>—</span>
            <span className="text-[28px]" style={{ color: 'var(--text-tertiary)' }}>{g.scoreAway}</span>
          </div>
        </div>
        <div className="relative px-4 lg:px-5 pb-3 flex items-center justify-end" style={{ zIndex: 2 }}>
          <button onClick={(e) => { e.stopPropagation(); onOpenGame(g.id); }} className="lg-btn-primary squircle-sm sf text-[12px] font-bold px-4 py-2 flex items-center gap-1.5">
            <svg width={11} height={11} viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M3 2 L12 7 L3 12 Z" /></svg>
            Watch live
          </button>
        </div>
      </div>
    );
  }

  /* ── JUST-ENDED ── Score's final, drop assembling. Animated cyan ring +
     78% progress bar. Direct port of DS GameCardJustEnded. */
  if (state === 'just-ended') {
    const g = SEED_GAMES.find(x => x.status === 'just-ended') || SEED_GAMES[0];
    return (
      <div className="relative squircle-md overflow-hidden"
        style={{
          background: 'radial-gradient(ellipse 50% 70% at 22% 28%, rgba(0,214,254,0.10) 0%, transparent 60%), radial-gradient(ellipse 50% 70% at 80% 78%, rgba(255,170,90,0.08) 0%, transparent 60%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)',
          border: '1px solid var(--glass-card-border)',
          backdropFilter: 'blur(36px) saturate(180%)',
          WebkitBackdropFilter: 'blur(36px) saturate(180%)',
          boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
        }}>
        <div className="relative z-10 px-4 pt-3 pb-2 flex items-center justify-between" style={{ borderBottom: '1px solid var(--hairline)' }}>
          <button onClick={cycle} className="flex items-center gap-2 -m-1 p-1 squircle-sm active:scale-[0.96]" title="Tap to cycle demo state">
            <div className="w-1.5 h-1.5 rounded-full bg-halo-cyan anim-pulse-dot" style={{ boxShadow: '0 0 8px rgba(0,214,254,0.7)' }} />
            <span className="sf text-[10px] font-bold tracking-[0.14em] uppercase" style={{ color: 'var(--brand-cyan-text)' }}>Drop incoming</span>
          </button>
          <span className="sf text-[10px] font-bold tracking-[0.14em] uppercase" style={{ color: 'var(--text-tertiary)' }}>Final</span>
        </div>
        <div className="relative z-10 p-4 flex items-end justify-between">
          <div>
            <div className="sf-display text-[15px] font-bold tracking-[-0.01em] leading-tight" style={{ color: 'var(--text-primary)' }}>{g.home}</div>
            <div className="sf text-[11.5px] mt-0.5" style={{ color: 'var(--text-secondary)' }}>vs {g.away}</div>
          </div>
          <div className="sf-display text-[28px] font-bold tabular-nums leading-none" style={{ color: 'var(--text-primary)' }}>
            {g.scoreHome}<span className="mx-2" style={{ color: 'var(--text-faint)' }}>·</span>{g.scoreAway}
          </div>
        </div>
        <div className="relative z-10 px-4 pb-4">
          <div className="squircle-sm p-3 flex items-center gap-3 lg-prep-card"
            style={{
              background: 'var(--glass-card-bg)',
              border: '1px solid var(--brand-cyan-border)',
              boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), 0 4px 14px -6px rgba(0,214,254,0.25)',
            }}>
            <div className="relative w-12 h-12 shrink-0 flex items-center justify-center">
              <div className="absolute inset-0 rounded-full lg-prep-spinner"
                style={{
                  background: 'conic-gradient(from 0deg, transparent 0deg, transparent 240deg, rgba(0,214,254,0.85) 320deg, rgba(0,214,254,0.95) 340deg, transparent 360deg)',
                  mask: 'radial-gradient(circle, transparent 14px, black 15px)',
                  WebkitMask: 'radial-gradient(circle, transparent 14px, black 15px)',
                }} />
              <div className="w-7 h-7 rounded-full lg-glass-strong flex items-center justify-center"
                style={{ boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.30), 0 0 12px -2px rgba(0,214,254,0.45)' }}>
                <svg width={12} height={12} viewBox="0 0 14 14" fill="none" stroke="var(--brand-cyan-text)" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round" style={{ width: 12, height: 12, display: 'block' }}>
                  <path d="M2 7 L5 10 L12 3" />
                </svg>
              </div>
            </div>
            <div className="flex-1 min-w-0">
              <div className="sf text-[12.5px] font-semibold leading-tight" style={{ color: 'var(--text-primary)' }}>{g.momentsCount || 8} moments captured</div>
              <div className="sf text-[10.5px] mt-0.5" style={{ color: 'var(--text-tertiary)' }}>Building drop · 78%</div>
              <div className="h-[3px] mt-1.5 overflow-hidden rounded-full" style={{ background: 'var(--hairline-strong)' }}>
                <div className="h-full bg-halo-cyan anim-pulse" style={{ width: '78%', boxShadow: '0 0 10px rgba(0,214,254,0.65)' }} />
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ── READY ── The payoff. Drop is assembled, tap to reveal.
     Direct port of DS GameCardReady — stacked-cards bottom block. */
  if (state === 'ready') {
    const g = SEED_GAMES.find(x => x.status === 'just-ended') || SEED_GAMES[0];
    const winning = (g.scoreHome || 0) > (g.scoreAway || 0);
    const margin = Math.abs((g.scoreHome || 0) - (g.scoreAway || 0));
    return (
      <button onClick={() => onOpenDrop(g.id)}
        className="relative w-full text-start squircle-md overflow-hidden lg-aura lg-shine lg-ready-ember active:scale-[0.98]"
        style={{
          background: 'radial-gradient(ellipse 60% 70% at 22% 28%, rgba(0,214,254,0.18) 0%, transparent 60%), radial-gradient(ellipse 60% 70% at 80% 78%, rgba(132,88,255,0.10) 0%, transparent 60%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)',
          border: '1px solid var(--brand-cyan-border)',
          backdropFilter: 'blur(36px) saturate(180%)',
          WebkitBackdropFilter: 'blur(36px) saturate(180%)',
          transition: 'transform 120ms cubic-bezier(.2,.8,.2,1)',
        }}>
        <div className="relative z-10 px-4 pt-3 pb-2 flex items-center justify-between" style={{ borderBottom: '1px solid var(--hairline)' }}>
          <div onClick={(e) => { e.stopPropagation(); cycle(); }}
            className="flex items-center gap-2 -m-1 p-1 squircle-sm cursor-pointer active:scale-[0.96]" title="Tap to cycle demo state">
            <div className="w-1.5 h-1.5 rounded-full bg-halo-cyan anim-pulse-dot" style={{ boxShadow: '0 0 10px rgba(0,214,254,0.85)' }} />
            <span className="sf text-[10px] font-bold tracking-[0.14em] uppercase" style={{ color: 'var(--brand-cyan-text)' }}>Your drop is ready</span>
          </div>
          <span className="sf text-[10px] font-bold tracking-[0.14em] uppercase" style={{ color: 'var(--brand-cyan-text)' }}>
            Tap <span className="icon-flip-rtl">›</span>
          </span>
        </div>
        <div className="relative z-10 p-4 flex items-end justify-between">
          <div>
            <div className="sf-display text-[15px] font-bold tracking-[-0.01em] leading-tight" style={{ color: 'var(--text-primary)' }}>{g.home}</div>
            <div className="sf text-[11.5px] mt-0.5" style={{ color: 'var(--text-secondary)' }}>vs {g.away}</div>
          </div>
          <div className="flex items-center gap-2">
            <div className="sf-display text-[24px] font-bold tabular-nums leading-none" style={{ color: 'var(--text-primary)' }}>
              {g.scoreHome}<span style={{ color: 'var(--text-faint)' }}> · </span>{g.scoreAway}
            </div>
            <div className="sf text-[10px] tracking-[0.16em] uppercase font-bold px-1.5 py-0.5 squircle-sm"
              style={{
                background: winning ? 'var(--brand-cyan-soft)' : 'var(--hatch-grain)',
                border: '1px solid ' + (winning ? 'var(--brand-cyan-border)' : 'var(--hairline-strong)'),
                color: winning ? 'var(--brand-cyan-text)' : 'var(--text-tertiary)',
              }}>
              {winning ? '+' + margin : 'L'}
            </div>
          </div>
        </div>
        <div className="relative z-10 px-4 pb-4">
          <div className="relative h-[100px] lg-ready-stack">
            <div className="absolute inset-x-12 top-3 h-[80px] lg-glass squircle-sm" style={{ transform: 'rotate(-5deg)' }} />
            <div className="absolute inset-x-8 top-1.5 h-[90px] lg-glass-card squircle-sm" style={{ transform: 'rotate(-2deg)' }} />
            <div className="absolute inset-x-4 top-0 h-[100px] lg-glass-strong squircle-sm flex items-center justify-between px-4"
              style={{ boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.30), 0 8px 24px -8px rgba(0,214,254,0.35)' }}>
              <div>
                <div className="sf-display text-[26px] font-bold leading-none" style={{ color: 'var(--text-primary)' }}>{g.momentsCount || 8}</div>
                <span className="sf text-[9.5px] tracking-[0.14em] font-bold uppercase mt-1 block" style={{ color: 'var(--text-tertiary)' }}>Moments</span>
              </div>
              <div className="text-end">
                <div className="sf-display text-[20px] font-bold tabular-nums leading-none"
                  style={{ color: 'var(--brand-cyan-text)', textShadow: '0 0 12px rgba(0,214,254,0.45)' }}>
                  +{margin || 12} PTS
                </div>
                <span className="sf text-[9.5px] tracking-[0.14em] font-bold uppercase mt-1 block" style={{ color: 'var(--text-tertiary)' }}>
                  {winning ? 'Your night' : 'Bright spots'}
                </span>
              </div>
            </div>
          </div>
        </div>
      </button>

/* DateNavbar — 58px lg-glass pill, prev/next chevrons, center eyebrow + label */
const DateNavbar = ({ value, onChange }) => {
  const idx = Math.max(0, DATE_OPTIONS.findIndex(d => d.key === value));
  const cur = DATE_OPTIONS[idx];
  const atStart = idx === 0;
  const atEnd   = idx === DATE_OPTIONS.length - 1;
  const eyebrow = cur.dayDelta === 0
    ? 'TODAY'
    : cur.dayDelta < 0
      ? `${Math.abs(cur.dayDelta)} DAY${Math.abs(cur.dayDelta) > 1 ? 'S' : ''} AGO`
      : `IN ${cur.dayDelta} DAY${cur.dayDelta > 1 ? 'S' : ''}`;
  return (
    <div className="lg-glass squircle-md flex items-stretch overflow-hidden" style={{ height: 58 }}>
      <button onClick={() => !atStart && onChange(DATE_OPTIONS[idx - 1].key)} disabled={atStart}
        className="w-14 flex items-center justify-center transition-colors"
        style={{ color: atStart ? 'var(--text-disabled)' : 'var(--text-secondary)' }}
        aria-label="Previous day">
        <svg width={14} height={14} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">
          <path d="M8.5 2.5 L4 7 L8.5 11.5" />
        </svg>
      </button>
      <div className="flex-1 flex flex-col items-center justify-center">
        <span className="sf text-[9px] tracking-[0.18em] uppercase font-bold leading-none"
          style={{ color: cur.dayDelta === 0 ? 'var(--brand-cyan-text)' : 'var(--text-muted)' }}>
          {eyebrow}
        </span>
        <span className="sf-display text-[14px] font-bold tracking-[-0.01em] mt-1 leading-none" style={{ color: 'var(--text-primary)' }}>
          {cur.label}
        </span>
      </div>
      <button onClick={() => !atEnd && onChange(DATE_OPTIONS[idx + 1].key)} disabled={atEnd}
        className="w-14 flex items-center justify-center transition-colors"
        style={{ color: atEnd ? 'var(--text-disabled)' : 'var(--text-secondary)' }}
        aria-label="Next day">
        <svg width={14} height={14} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">
          <path d="M5.5 2.5 L10 7 L5.5 11.5" />
        </svg>
      </button>
    </div>
  );
};

              <svg width={10} height={10} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">

  /* COMPACT (upcoming / ended) — scoreboard layout.
     Two team rows stacked: [crest 32] · team name ........... score (or empty for upcoming)
     Hairline divider
     Meta footer: eyebrow + date/venue · moments count + chevron */
  const homeTeam = teamByName(game.home);
  const awayTeam = teamByName(game.away);
  const homeWon = isEnded && (game.scoreHome ?? 0) > (game.scoreAway ?? 0);
  const awayWon = isEnded && (game.scoreAway ?? 0) > (game.scoreHome ?? 0);
  const TeamRow = ({ team, score, won, isUpcoming }) => (
    <div className="flex items-center gap-3 min-w-0">
      <TeamCrest team={team} size={32} />
      <span className="sf-display flex-1 text-[15.5px] font-bold leading-tight tracking-[-0.012em] truncate"
        style={{ color: isUpcoming ? 'var(--text-primary)' : won ? 'var(--text-primary)' : 'var(--text-tertiary)' }}>
        {team.name}
      </span>
      {isEnded && score != null && (
        <span className="sf-display text-[24px] font-bold tabular-nums leading-none tracking-[-0.025em] shrink-0"
          style={{ color: won ? 'var(--text-primary)' : 'var(--text-tertiary)', textShadow: won ? '0 0 14px rgba(0,214,254,0.25)' : 'none' }}>
          {score}
        </span>
      )}
    </div>
  );
  const c = countdownParts(game.kickoffInSec);
  return (
    <button onClick={() => onOpenGame(game.id)}
      className="w-full text-start squircle-md overflow-hidden lg-aura lg-shine relative p-4"
      style={{
        background: `radial-gradient(ellipse 55% 90% at 8% 50%, ${hue.a} 0%, transparent 65%), radial-gradient(ellipse 55% 90% at 92% 50%, ${hue.b} 0%, transparent 65%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)`,
        backdropFilter: 'blur(36px) saturate(180%)',
        WebkitBackdropFilter: 'blur(36px) saturate(180%)',
        border: '1px solid var(--glass-card-border)',
        boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
        color: 'var(--text-primary)',
      }}>
      {/* Faint diagonal grain layer */}
      <div className="absolute inset-0 hatch-dark opacity-20 pointer-events-none" />
      <div className="relative flex items-center gap-4">
        {/* LEFT — two-row team stack */}
        <div className="flex-1 min-w-0 space-y-2.5">
          <TeamRow team={homeTeam} score={game.scoreHome} won={homeWon} isUpcoming={isUpcoming} />
          <TeamRow team={awayTeam} score={game.scoreAway} won={awayWon} isUpcoming={isUpcoming} />
        </div>
        {/* RIGHT — countdown for upcoming, W badge for ended */}
        {isUpcoming && c.value !== null && (
          <div className="shrink-0 flex items-baseline px-2 leading-none">
            <span className="sf-display font-bold tabular-nums"
              style={{ fontSize: 36, letterSpacing: '-0.035em', color: 'var(--brand-cyan-text)', textShadow: '0 0 14px rgba(0,214,254,0.45)' }}>
              {c.value}
            </span>
            <span className="sf-display"
              style={{ fontSize: 16, fontWeight: 500, marginInlineStart: 2, color: 'rgba(0,214,254,0.65)' }}>
              {c.unit}
            </span>
          </div>
        )}
        {isUpcoming && c.value === null && (
          <span className="shrink-0 sf-display font-bold px-2"
            style={{ fontSize: 24, color: 'var(--brand-cyan-text)', textShadow: '0 0 14px rgba(0,214,254,0.45)' }}>
            NOW
          </span>
        )}
      </div>

      {/* Hairline divider */}
      <div className="relative h-px my-3" style={{ background: 'var(--hairline)' }} />

      {/* Meta footer */}
      <div className="relative flex items-center justify-between">
        <div className="flex items-center gap-2 min-w-0">
          <span className="sf text-[10px] font-bold tracking-[0.18em] uppercase"
            style={{
              color: isUpcoming ? 'var(--brand-cyan-text)' : 'var(--text-muted)',
              textShadow: isUpcoming ? '0 0 8px rgba(0,214,254,0.30)' : 'none',
            }}>
            {isUpcoming ? 'Tipoff' : 'Final'}
          </span>
          <span className="sf text-[10.5px]" style={{ color: 'var(--text-faint)' }}>·</span>
          <span className="sf text-[10.5px] truncate" style={{ color: 'var(--text-muted)' }}>
            {isUpcoming
              ? (game.venue || 'Home court')
              : (game.when || 'Recent')}
          </span>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          {isEnded && game.momentsCount != null && (
            <span className="sf text-[10.5px] font-semibold" style={{ color: 'var(--brand-cyan-text)' }}>
              {game.momentsCount} moments
            </span>
          )}
          <svg width={14} height={14} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round" className="icon-flip-rtl" style={{ color: 'var(--text-muted)' }}>
            <path d="M5.5 2.5 L10 7 L5.5 11.5" />
          </svg>
        </div>
      </div>
    </button>
  );
};

const GamesScreen = ({ onOpenGame }) => {

    <div className="anim-fade pb-28 sf relative" style={{ color: 'var(--text-primary)' }}>

          </div>

          )}

    </button>
  );
};

/* WatchVThumb — vertical 9:16 highlight card for Player highlights rail.
   Size variants: sm/md/lg/xl with phone+desktop widths via static Tailwind

   label + duration. Direct port of DS screens/watch/_shared.tsx VThumb. */
const VTHUMB_CLASSES = {
  sm: 'w-[92px]  h-[164px] lg:w-[120px] lg:h-[213px]',
  md: 'w-[120px] h-[213px] lg:w-[160px] lg:h-[284px]',

  xl: 'w-[196px] h-[349px] lg:w-[240px] lg:h-[427px]',
};
const WatchVThumb = ({ moment, size = 'md', onClick }) => {
  const game = SEED_GAMES.find(g => g.id === moment.gameId);
  const gameLabel = game ? `${game.home} vs ${game.away}` : moment.sub || '';
  const durationStr = moment.dur != null ? `0:${String(moment.dur).padStart(2, '0')}` : null;
  const sizeCls = VTHUMB_CLASSES[size] || VTHUMB_CLASSES.md;
  return (
    <button onClick={onClick} className={`relative shrink-0 overflow-hidden squircle-md lg-aura lg-shine transition-transform hover:scale-[1.02] ${sizeCls}`}

/* WatchRails — orchestrator for the 5 lanes. Honors activeDivision by
   filtering scope through WATCH_DIVISIONS[*].games whitelist. */
const WatchRails = ({ activeDivision, onPushGame, onPickMoment }) => {
  const div = activeDivision ? WATCH_DIVISIONS.find(d => d.id === activeDivision) : null;
  const liveGames = SEED_GAMES.filter(g => g.status === 'live');
  const ended = SEED_GAMES.filter(g => g.status === 'just-ended' || g.status === 'final');
  const scopedLive  = div ? liveGames.filter(g => div.games.includes(g.id)) : liveGames;
  const scopedEnded = div ? ended.filter(g => div.games.includes(g.id))    : ended;
  return (
    <>
      {scopedLive.length > 0 && (
        <WatchLane title="Live now">
          {scopedLive.map(g => <LiveCard key={g.id} game={g} onClick={() => onPushGame(g.id, 'live')} />)}
        </WatchLane>
      )}
      <WatchLane title="Full games">
        {scopedEnded.length > 0
          ? scopedEnded.map(g => <PosterCard key={g.id} game={g} big onClick={() => onPushGame(g.id, g.status)} />)
          : <EmptyScopedRail label="No full games in this division yet" />}
      </WatchLane>
      <WatchLane title="Game highlights">
        {scopedEnded.length > 0
          ? scopedEnded.slice(0, 5).map(g => <PosterCard key={g.id} game={g} big onClick={() => onPushGame(g.id, g.status)} />)
          : <EmptyScopedRail label="No highlights yet in this division" />}
      </WatchLane>
      <WatchLane title="Player highlights">
        {SEED_MOMENTS.map((m, i) => (
          <WatchVThumb key={m.id} moment={m} onClick={() => onPickMoment(i)} />
        ))}
      </WatchLane>
      <WatchLane title="Suggestions">
        {scopedEnded.length > 0
          ? scopedEnded.slice().reverse().slice(0, 6).map(g => <PosterCard key={g.id} game={g} big onClick={() => onPushGame(g.id, g.status)} />)
          : <EmptyScopedRail label="Pick a different division to see suggestions" />}
      </WatchLane>
    </>
  );
};

   header over a 62vh FeaturedHero. Desktop uses WatchShell with
   WatchHeroDesktop slot + topBarCenter search slot. */
const WatchScreen = ({ onOpenGame, onOpenGameVideo, onPickMoment }) => {
  const [activeDivision, setActiveDivision] = useState(null);
  const [query, setQuery] = useState('');
  const [livePlayerGameId, setLivePlayerGameId] = useState(null);
  /* Watch tab is a VIDEO surface — all non-live taps route to the
     GameVideoViewer (16:9 video player), not to PostGameScreen (the
     stat recap). Upcoming games fall through to PostGame as a tease
     until the game starts. */
  const handlePush = (gameId, status) => {
    if (status === 'live') {
      setLivePlayerGameId(gameId);
      return;
    }
    if (status === 'upcoming') {
      onOpenGame(gameId);
      return;
    }
    onOpenGameVideo(gameId);
  };
  const body = (
    <>
      <DivisionTileGrid active={activeDivision} onPick={setActiveDivision} />
      <DivisionFilterChip active={activeDivision} onClear={() => setActiveDivision(null)} />
      <WatchRails activeDivision={activeDivision} onPushGame={handlePush} onPickMoment={onPickMoment} />
    </>
  );
  return (
    <>
      {/* ──────────────── Phone (< lg) ──────────────── */}
      <div data-theme="dark" className="lg:hidden anim-fade pb-28 text-white sf relative min-h-screen">
        <div className="lg-atmosphere" />
        <div className="absolute inset-0 z-[1] pointer-events-none"
          style={{ background: 'linear-gradient(180deg, var(--vignette-corner) 0%, transparent 30%, transparent 70%, var(--vignette-corner-soft) 100%)' }} />

            top of the scroll context (was `absolute` which scrolled away with

            <span className="sf-display text-[14px] font-bold tracking-tight" style={{ color: 'var(--text-primary)' }}>{awayTeam.name}</span>
          </div>
        </div>
      </div>

      {/* Score hero */}
      <ScoreHero game={g} />

      {/* Full game embed */}
      <PgSection title="Full game" first>
        <GameVideoEmbed kind="full" title="Watch the full game"
          sub={`${homeTeam.name} ${g.scoreHome} · ${awayTeam.name} ${g.scoreAway}`}
          duration="1:32:00" onClick={() => {}} />
      </PgSection>

      {/* Game highlight — big RecapCard */}
      {recap && (
        <PgSection title="Game highlight">
          <GameVideoEmbed kind="recap" title={recap.title} sub={recap.sub} duration={fmt.dur(recap.dur)} onClick={() => {}} />
        </PgSection>
      )}

      {/* Your Highlights — horizontal rail. Capped at 720px on desktop so it
          aligns with the rest of the page. */}
      <PgSectionFullBleed title="Your highlights" action="All">
        <div className="flex gap-3 overflow-x-auto no-scrollbar px-5 lg:px-8 xl:px-12 lg:max-w-[720px] lg:mx-auto pb-2">
          {myMoments.map((m, i) => (
            <EditorialDropThumb key={m.id} moment={m} onClick={() => onPickMoment(i)} />
          ))}
        </div>
      </PgSectionFullBleed>

      {/* Other players — home/away tabs */}
      <OtherPlayersSection game={g} onPickPlayer={() => onPickMoment(0)} />

      {/* Your game stats — 3-tile */}
      <YourGameStats playerNumber={PLAYER.number} />

      {/* Team stats — 8-row H2H */}
      <TeamStatsSection game={g} />

      {/* Player stats — tabbed table */}
      <PlayerStatsSection game={g} />
    </div>
  );
};

/* ============================================================
   10. VIDEO PLAYERS — full DS port (P7)
   ShareSheet · HighlightViewer · StorytellingDropViewer · PackReveal

   Real video element backed by HALO_VIDEO_URL. Phone viewer uses
   vertical 9:16 Instagram-story layout with bottom-overlay info. Desktop
   variant (lg+) flips to YouTube-style 16:9 video centered at 1200px
   cap with title + chips + CTAs as flow content BELOW the video.
   ============================================================ */

/* ── ShareIcon — small icon glyphs for the 6 share targets ─────── */
const ShareIcon = ({ name }) => {
  const paths = {
    copy:      'M5 5 H13 V13 H5 Z M7 3 H15 V11',
    facebook:  'M11 4 H13 V6.5 H11 V8 H13 L12.7 10.5 H11 V16 H8.5 V10.5 H7 V8 H8.5 V6.5 c0-1.4 1-2.5 2.5-2.5',
    instagram: 'M5 3 H15 a2 2 0 0 1 2 2 V15 a2 2 0 0 1 -2 2 H5 a2 2 0 0 1 -2 -2 V5 a2 2 0 0 1 2 -2 Z M10 7 a3 3 0 1 0 0 6 a3 3 0 0 0 0 -6 Z M14 5.5 V5.6',
    x:         'M4 4 L16 16 M16 4 L4 16',
    tiktok:    'M11 3 V12.5 a3 3 0 1 1 -3 -3 M11 3 a3.5 3.5 0 0 0 3.5 3.5',
    whatsapp:  'M4 16 L5 13 a6 6 0 1 1 2 2 Z M7 9 c0 2 2 4 4 4 M7 9 c.4-.4.9-.5 1.3-.3 L9 10 M11 13 c.4 0 .8-.1 1.1-.4 L12.8 12',

};

/* ── ShareSheet ──────────────────────────────────────────────────
   Bottom-sheet share modal with 6 targets. Direct port of DS
   screens/home/ShareSheet.tsx, glyphs simplified to single-color
   line icons so we don't need brand assets.

   Copy-link target shows inline "Copied!" confirmation for ~1.5s.
   Other targets fire the onShare callback and close after 200ms. */
const SHARE_TARGETS = [
  { id: 'copy',      label: 'Copy link', icon: 'copy' },
  { id: 'facebook',  label: 'Facebook',  icon: 'facebook' },
  { id: 'instagram', label: 'Instagram', icon: 'instagram' },
  { id: 'x',         label: 'X',         icon: 'x' },
  { id: 'tiktok',    label: 'TikTok',    icon: 'tiktok' },
  { id: 'whatsapp',  label: 'WhatsApp',  icon: 'whatsapp' },
];

const ShareSheet = ({ title, subtitle, url, thumbnail, onShare, onClose }) => {
  const [copied, setCopied] = useState(false);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const handle = (targetId) => {
    if (targetId === 'copy') {
      try { navigator.clipboard?.writeText(url || ''); } catch (e) {}
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
      return;
    }
    onShare?.(targetId);
    setTimeout(onClose, 200);
  };
  return (
    <div className="absolute inset-0 z-[70] anim-fade">
      <button onClick={onClose} aria-label="Close share sheet" className="absolute inset-0"
        style={{ background: 'rgba(0,0,0,0.55)', backdropFilter: 'blur(8px) saturate(120%)', WebkitBackdropFilter: 'blur(8px) saturate(120%)' }} />
      <div className="absolute inset-x-0 bottom-0 anim-slide-sheet lg:inset-auto lg:bottom-auto lg:top-1/2 lg:start-1/2 lg:-translate-y-1/2 lg:-translate-x-1/2 lg:max-w-[480px] lg:w-full"
        style={{
          background: 'var(--canvas-bg-soft)',
          borderTop: '1px solid var(--glass-card-border)',
          borderTopLeftRadius: 20,
          borderTopRightRadius: 20,
          padding: '14px 20px 32px',
        }}>
        {/* Drag handle (phone only) */}
        <div className="lg:hidden mx-auto mb-4" style={{ width: 40, height: 4, borderRadius: 2, background: 'rgba(255,255,255,0.20)' }} />
        {/* Title block */}
        <div className="flex items-center gap-3 mb-5 pb-4" style={{ borderBottom: '1px solid var(--hairline)' }}>
          {thumbnail && (
            <div className="w-12 h-12 squircle-sm lg-glass-strong flex items-center justify-center shrink-0">
              <span className="sf-display text-[16px] font-bold text-white">{thumbnail}</span>
            </div>
          )}
          <div className="flex-1 min-w-0">
            <div className="sf-display text-[14.5px] font-bold leading-tight truncate" style={{ color: 'var(--text-primary)' }}>{title || 'Share moment'}</div>
            {subtitle && <div className="sf text-[11.5px] mt-0.5 truncate" style={{ color: 'var(--text-tertiary)' }}>{subtitle}</div>}
          </div>
        </div>
        {/* Targets grid */}
        <div className="grid grid-cols-3 gap-3">
          {SHARE_TARGETS.map(t => {
            const isCopiedHere = t.id === 'copy' && copied;
            return (
              <button key={t.id} onClick={() => handle(t.id)}
                className="flex flex-col items-center gap-2 py-2 lg-aura"
                aria-label={t.label}>
                <div className="w-12 h-12 squircle-sm flex items-center justify-center"
                  style={isCopiedHere
                    ? { background: 'var(--brand-cyan-soft)', border: '1px solid var(--brand-cyan-border)', color: 'var(--brand-cyan-text)' }
                    : { background: 'var(--glass-card-bg)', backdropFilter: 'blur(36px) saturate(180%)', WebkitBackdropFilter: 'blur(36px) saturate(180%)', border: '1px solid var(--glass-card-border)', color: 'var(--text-secondary)' }
                  }>
                  <ShareIcon name={t.icon} />
                </div>
                <span className="sf text-[10.5px] font-semibold"
                  style={{ color: isCopiedHere ? 'var(--brand-cyan-text)' : 'var(--text-secondary)' }}>
                  {isCopiedHere ? 'Copied!' : t.label}
                </span>
              </button>
            );
          })}
        </div>
        {/* URL preview */}
        {url && (
          <div className="mt-4 pt-3 sf text-[11px] text-center truncate"
            style={{ color: 'var(--text-tertiary)', borderTop: '1px solid var(--hairline)' }}>
            {url}
          </div>
        )}
      </div>
    </div>
  );
};

/* ── HighlightViewer — VERTICAL viewer (player HL drops only) ────
   Aspect ratio follows CONTENT, not device:
     - Phone (< lg):  9:16 fills the entire phone screen (Instagram pattern)
     - Desktop (lg+): 9:16 video CENTERED in dark landscape canvas with
                      sidebars (letterboxed) + info panel docked on the right

   Used by:
     - Home DropsSection (auto-clipped player highlights)
     - Profile recent drops
     - PackReveal moment grid tap-through

   For 16:9 game footage (full games, team highlights) the entry point
   routes to <GameVideoViewer/> instead — that one keeps the 16:9 shape
   on both phone and desktop. This split is the core fix from the
   May 2026 critique: video aspect = content type, NOT device. */
const HighlightViewer = ({ momentIndex = 0, onClose, onWatchFullGame }) => {
  const [idx, setIdx] = useState(momentIndex);
  const [playing, setPlaying] = useState(true);
  const [shareOpen, setShareOpen] = useState(false);
  const m = SEED_MOMENTS[idx];
  const game = m ? SEED_GAMES.find(g => g.id === m.gameId) : null;
  /* All moments in SEED_MOMENTS are the player's own — treat them as
     player highlights with jersey #7 (PLAYER constant). */
  const isPlayerHL = true;
  const jerseyNum = PLAYER.number;
  const sectionLabel = isPlayerHL ? 'Player highlights' : 'Team moment';
  const next = () => setIdx(i => (i + 1) % SEED_MOMENTS.length);
  const prev = () => setIdx(i => (i - 1 + SEED_MOMENTS.length) % SEED_MOMENTS.length);
  if (!m) return null;

  /* Top progress segments — Instagram story pattern */
  const ProgressSegments = () => (
    <div className="flex gap-1 flex-1 me-4">
      {SEED_MOMENTS.map((_, i) => (
        <div key={i} className="flex-1 h-[2.5px] overflow-hidden rounded-full"
          style={{ background: 'rgba(255,255,255,0.18)' }}>
          <div className="h-full" style={{
            width: i < idx ? '100%' : i === idx ? '60%' : '0%',
            background: '#fff',
            boxShadow: i === idx ? '0 0 6px rgba(255,255,255,0.65)' : 'none',
            transition: 'width 200ms linear',
          }} />
        </div>
      ))}
    </div>
  );

  /* Section chip — jersey + "PLAYER HIGHLIGHTS" label */
  const SectionChip = () => (
    <div className="flex items-center gap-2 lg-glass-strong squircle-sm ps-1 pe-2.5 py-1">
      {jerseyNum != null && (
        <div className="w-6 h-6 squircle-sm flex items-center justify-center shrink-0"
          style={{ background: 'var(--brand-cyan-soft)', border: '1px solid var(--brand-cyan-border)', color: 'var(--brand-cyan-text)' }}>
          <span className="sf-display text-[11px] font-bold tabular-nums leading-none">{jerseyNum}</span>
        </div>
      )}
      <span className="sf text-[10px] tracking-[0.18em] uppercase font-bold text-white">{sectionLabel}</span>
    </div>
  );

  /* Glass play button — visible when paused. Tapping resumes. */
  const PlayHero = () => (
    <button onClick={(e) => { e.stopPropagation(); setPlaying(true); }}
      className="w-20 h-20 rounded-full lg-glass-strong flex items-center justify-center transition-transform duration-200 hover:scale-[1.06] active:scale-[0.98]"
      aria-label="Play"
      style={{
        boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.30), 0 0 40px -8px rgba(0,214,254,0.50), 0 8px 32px -8px rgba(0,0,0,0.55)',
        border: '1px solid rgba(255,255,255,0.25)',
      }}>
      <svg width={22} height={26} viewBox="0 0 22 26" fill="#fff"
        style={{ marginInlineStart: 4, filter: 'drop-shadow(0 0 8px rgba(255,255,255,0.40))', width: 22, height: 26, display: 'block' }}>
        <path d="M2 2 L20 13 L2 24 Z" />
      </svg>
    </button>
  );

  /* Info block — title + caption + score chip + CTAs. Always renders as
     a bottom-overlay on the video (phone-style). Used by both phone and
     desktop now that desktop is a centered 9:16 player with the same
     overlay pattern (was a side-panel before May 2026 critique). */
  const InfoBlock = () => (
    <div className="px-5 pb-5 pt-2">
      <div className="mb-3 flex items-center gap-2 flex-wrap">
        <span className="lg-glass-strong squircle-sm sf text-[10px] tracking-[0.14em] uppercase font-bold text-white px-2 py-0.5 leading-none">
          {m.sub}
        </span>
        {isPlayerHL && (
          <>
            <div className="w-1 h-1 rounded-full" style={{ background: 'var(--brand-cyan)', boxShadow: '0 0 6px rgba(0,214,254,0.85)' }} />
            <span className="sf text-[10px] tracking-[0.14em] uppercase font-bold" style={{ color: 'var(--brand-cyan-text)' }}>Yours</span>
          </>
        )}
      </div>
      <div className="sf-display text-white font-bold tracking-[-0.025em] leading-[1.0] mb-2 text-[26px]"
        style={{ textShadow: '0 2px 12px rgba(0,0,0,0.45)' }}>
        {isPlayerHL && jerseyNum != null ? `#${jerseyNum} ${sectionLabel}` : sectionLabel}
      </div>
      <div className="sf text-[13px] mb-4" style={{ color: 'var(--text-tertiary)' }}>
        {m.title}
      </div>
      {game && game.scoreHome != null && (
        <div className="squircle-sm px-3 py-2.5 mb-4 flex items-center justify-between"
          style={{
            background: 'var(--glass-card-bg)',
            backdropFilter: 'blur(20px) saturate(180%)',
            WebkitBackdropFilter: 'blur(20px) saturate(180%)',
            border: '1px solid var(--glass-card-border)',
            boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top)',
          }}>
          <div className="flex items-center gap-2">
            <div className="w-7 h-7 rounded-full lg-glass-strong flex items-center justify-center sf-display text-[10px] font-bold text-white">
              {game.home.charAt(0)}
            </div>
            <span className="sf text-[11.5px] font-semibold text-white">{game.home}</span>
          </div>
          <div className="sf-display text-[18px] font-bold tabular-nums text-white leading-none flex items-center gap-2">
            <span>{game.scoreHome}</span>
            <span style={{ color: 'rgba(255,255,255,0.30)' }}>·</span>
            <span>{game.scoreAway}</span>
          </div>
          <div className="flex items-center gap-2">
            <span className="sf text-[11.5px] font-semibold text-white">{game.away}</span>
            <div className="w-7 h-7 rounded-full lg-glass-strong flex items-center justify-center sf-display text-[10px] font-bold text-white">
              {game.away.charAt(0)}
            </div>
          </div>
        </div>
      )}
      <div className="flex items-stretch gap-2">
        <button onClick={() => { onClose(); onWatchFullGame && onWatchFullGame(m.gameId, m.id); }}
          className="flex-1 squircle-sm py-3 sf text-[12.5px] font-semibold flex items-center justify-center gap-2"
          style={{
            color: '#0a0d18',
            background: 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            boxShadow: '0 4px 12px -2px rgba(0,214,254,0.45), inset 0 1px 0 rgba(255,255,255,0.40)',
          }}>
          <svg width={11} height={12} viewBox="0 0 11 12" fill="currentColor"
            style={{ width: 11, height: 12, display: 'block' }}>
            <path d="M1 1 L10 6 L1 11 Z" />
          </svg>
          <span>Watch full game</span>
        </button>
        <button onClick={() => setShareOpen(true)}
          className="w-12 lg-glass squircle-sm flex items-center justify-center text-white"
          aria-label="Share">
          <svg width={14} height={14} viewBox="0 0 16 16" fill="none" stroke="currentColor"
            strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round"
            style={{ width: 14, height: 14, display: 'block' }}>
            <path d="M3 8 v5 h10 v-5" />
            <path d="M8 2 v9 M5 5 L8 2 L11 5" />
          </svg>
        </button>
      </div>
    </div>
  );

  return (
    <div data-theme="dark" className="absolute inset-0 z-50 lg:fixed lg:z-[100] anim-fade flex flex-col"
      style={{
        background:
          'radial-gradient(ellipse 60% 45% at 50% 35%, rgba(0,214,254,0.14) 0%, transparent 65%),' +
          'radial-gradient(ellipse 70% 50% at 50% 100%, rgba(132,88,255,0.10) 0%, transparent 70%),' +
          'linear-gradient(180deg, #050810 0%, #020308 100%)',
      }}>
      {/* === PHONE LAYOUT (< lg) — full-bleed vertical ===
          All chrome lives inside this container so progress segments,
          section chip, and bottom info overlay the video. */}
      <div className="lg:hidden flex-1 relative overflow-hidden">
        <div className="absolute inset-0 pointer-events-none" style={{ background: 'var(--hatch-grain)' }} />
        {/* Video — fills the phone-shape container */}
        <video key={`hv-phone-${idx}`} src={HALO_VIDEO_URL}
          autoPlay={playing} muted loop playsInline preload="auto"
          className="absolute inset-0 w-full h-full object-cover" />
        {/* Top chrome — progress segments + close */}
        <div className="absolute top-0 inset-x-0 z-30 px-4 pt-11 pb-4 flex items-center justify-between">
          <ProgressSegments />
          <button onClick={onClose} aria-label="Close"
            className="w-9 h-9 lg-glass squircle-sm flex items-center justify-center text-white">
            <Icon name="close" size={12} stroke={1.8} />
          </button>
        </div>
        {/* Section chip — below progress segments with breathing room */}
        <div className="absolute top-[80px] start-4 z-30">
          <SectionChip />
        </div>
        {/* Tap zones — prev / next */}
        <button onClick={prev} className="absolute start-0 top-[140px] bottom-[200px] w-1/3 z-10" aria-label="Previous" />
        <button onClick={next} className="absolute end-0 top-[140px] bottom-[200px] w-1/3 z-10" aria-label="Next" />
        {/* Center play hero — only when paused */}
        {!playing && (
          <div className="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
            <div className="pointer-events-auto"><PlayHero /></div>
          </div>
        )}
        {/* Bottom info — overlay with gradient scrim */}
        <div className="absolute bottom-0 inset-x-0 z-10 pt-20"
          style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.45) 30%, rgba(0,0,0,0.85) 100%)' }}>
          <InfoBlock />
        </div>
      </div>

      {/* === DESKTOP LAYOUT (lg+) — phone-shape 9:16 centered on dark canvas
          ALL chrome overlays the video (matching v3.2 reference): progress
          segments at the top of the player frame with breathing room,
          section chip below them, bottom info overlay with gradient scrim,
          no side panel. Nav arrows live on the dark canvas flanking the
          player frame. */}
      <div className="hidden lg:flex flex-1 items-center justify-center relative">
        {/* The phone-shape player frame */}
        <div className="relative overflow-hidden squircle-md"
          style={{
            height: 'min(88vh, 760px)',
            aspectRatio: '9 / 16',
            background: '#000',
            boxShadow: '0 24px 80px -16px rgba(0,0,0,0.70), 0 0 0 1px rgba(255,255,255,0.04)',
          }}>
          {/* Video — fills the player frame */}
          <video key={`hv-desktop-${idx}`} src={HALO_VIDEO_URL}
            autoPlay={playing} muted loop playsInline preload="auto"
            className="absolute inset-0 w-full h-full object-cover" />
          {/* Top chrome — progress segments + close, INSIDE the frame.
              pt-6 + pb-5 gives the Insta-story line breathing room from
              the video content below it (per user critique). */}
          <div className="absolute top-0 inset-x-0 z-30 px-4 pt-6 pb-5 flex items-center justify-between">
            <ProgressSegments />
            <button onClick={onClose} aria-label="Close"
              className="w-9 h-9 lg-glass squircle-sm flex items-center justify-center text-white">
              <Icon name="close" size={12} stroke={1.8} />
            </button>
          </div>
          {/* Section chip — below progress segments */}
          <div className="absolute top-[72px] start-4 z-30">
            <SectionChip />
          </div>
          {/* Center play hero — only when paused */}
          {!playing && (
            <div className="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
              <div className="pointer-events-auto"><PlayHero /></div>
            </div>
          )}
          {/* Bottom info — overlay with gradient scrim, SAME as phone */}
          <div className="absolute bottom-0 inset-x-0 z-10 pt-20"
            style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.45) 30%, rgba(0,0,0,0.85) 100%)' }}>
            <InfoBlock />
          </div>
        </div>
        {/* Nav arrows — on the dark canvas, vertically centered with the frame */}
        <button onClick={prev} aria-label="Previous"
          className="absolute start-12 top-1/2 -translate-y-1/2 z-20 w-12 h-12 lg-glass-strong rounded-full flex items-center justify-center"
          style={{ color: 'rgba(255,255,255,0.9)' }}>
          <svg width={16} height={16} viewBox="0 0 14 14" fill="none" stroke="currentColor"
            strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"
            className="icon-flip-rtl" style={{ width: 16, height: 16, display: 'block' }}>
            <path d="M9 2 L4 7 L9 12" />
          </svg>
        </button>
        <button onClick={next} aria-label="Next"
          className="absolute end-12 top-1/2 -translate-y-1/2 z-20 w-12 h-12 lg-glass-strong rounded-full flex items-center justify-center"
          style={{ color: 'rgba(255,255,255,0.9)' }}>
          <svg width={16} height={16} viewBox="0 0 14 14" fill="none" stroke="currentColor"
            strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"
            className="icon-flip-rtl" style={{ width: 16, height: 16, display: 'block' }}>
            <path d="M5 2 L10 7 L5 12" />
          </svg>
        </button>
      </div>

      {shareOpen && (
        <ShareSheet
          title={isPlayerHL && jerseyNum != null ? `#${jerseyNum} ${sectionLabel}` : sectionLabel}
          subtitle={game ? `${game.home} vs ${game.away}` : null}
          url={`halo.app/m/${m.id}`}
          thumbnail={jerseyNum != null ? String(jerseyNum) : null}
          onClose={() => setShareOpen(false)} />
      )}
    </div>
  );
};

/* ── StorytellingDropViewer ──────────────────────────────────────
   Direct port of DS screens/home/StorytellingDropViewer.tsx.
   60-40 layout: horizontal-snap moment cards on top (60%), insight
   panel on bottom (40%). Per-card cyan/purple/pink/amber hues so each
   moment reads as its own vibe. Tapping a card jumps into HighlightViewer
   at that moment.

   Desktop variant: same shape, centered max-w-[1200px], static card
   carousel (no snap) with arrows. */
const STORYTELLING_HUES = [
  { a: 'rgba(0,214,254,0.42)',  b: 'rgba(132,88,255,0.32)' },
  { a: 'rgba(255,90,158,0.42)', b: 'rgba(255,140,40,0.30)' },
  { a: 'rgba(74,222,128,0.36)', b: 'rgba(0,170,220,0.30)' },
  { a: 'rgba(255,210,80,0.36)', b: 'rgba(255,90,50,0.30)' },
];
const hueForStory = (id) =>
  STORYTELLING_HUES[(id || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0) % STORYTELLING_HUES.length];

/* ====================================================================
   SD_* — Story Drop scrollytelling primitives
   ====================================================================
   Ported from prototype/storydrop-tal-weiss.html. Prefixed SD_ to avoid
   colliding with other constants. Hardcoded to ONE story (Tal Weiss vs

const SD_AnchoredOpen = ({ scrollEl }) => {
  const sectionRef = useRef(null);
  const jerseyRef  = useRef(null);
  const [landed, setLanded] = useState(false);
  const [flashKey, setFlashKey] = useState(0);
  /* Refs (not state) for per-frame values — flipping these via direct
     DOM mutation avoids the React re-render that used to fire on every
     scroll event (60+/sec). Only the binary `landed` toggle still uses
     setState, since that one DOES need to flip child visibility. */
  const lastLandedRef = useRef(false);
  const rafRef = useRef(null);

  useEffect(() => {
    if (!scrollEl) return;
    const apply = () => {
      rafRef.current = null;
      const sec = sectionRef.current;
      const jersey = jerseyRef.current;
      if (!sec) return;
      const rect = sec.getBoundingClientRect();
      const scrollable = sec.offsetHeight - window.innerHeight;
      if (scrollable <= 0) return;
      const p = Math.max(0, Math.min(1, -rect.top / scrollable));
      /* Fall completes at p=0.5 (was 0.65) — jersey hits its landing
         spot halfway through the section so the user sees the "landed"
         editorial reveal for the remaining 90vh of scroll instead of
         only the last 60vh. Feels less rushed. */
      const fall = Math.min(1, p / 0.5);
      const eased = fall * fall;
      const ballTopVh = -30 + 100 * eased;
      const rotation = fall * 380;
      /* Drive the jersey transform via DOM — no React render, no
         transition CSS competing with our requestAnimationFrame loop.
         No translateZ here either — it can interfere with the sticky
         parent's positioning. */
      if (jersey) {
        jersey.style.top = ballTopVh + 'vh';
        jersey.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
      }
      const isLanded = p > 0.5;
      if (isLanded !== lastLandedRef.current) {
        lastLandedRef.current = isLanded;
        setLanded(isLanded);
        if (isLanded) setFlashKey(k => k + 1);
      }
    };
    const onScroll = () => {
      if (rafRef.current) return;
      rafRef.current = requestAnimationFrame(apply);
    };
    scrollEl.addEventListener('scroll', onScroll, { passive: true });
    apply();
    return () => {
      scrollEl.removeEventListener('scroll', onScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [scrollEl]);

  return (
    /* 180vh (was 240vh): 100vh sticky phase + 80vh of "play through"
       runway is enough for the jersey-fall animation; the extra 60vh
       was just empty unsticking. The `landed` flag flips at p > 0.5
       (was 0.65) so the cyan-flash + text reveal happens earlier in the
       scroll. */
    <section ref={sectionRef} className="relative" style={{ height: '180vh' }}>
      <div className="sticky top-0 h-screen overflow-hidden flex items-end justify-center">
        <div className="absolute top-14 inset-x-0 text-center px-6 z-10 transition-opacity duration-500"
          style={{ opacity: landed ? 0 : 1 }}>
          <div className="sd-mono text-[10.5px] tracking-[0.30em] uppercase sd-tx30 mb-3">How it started</div>
          <div className="sd-serif sd-tx" style={{ fontSize: 'clamp(2.5rem, 6vw, 5rem)', letterSpacing: '-0.02em', lineHeight: 1.05, fontWeight: 400 }}>
            One pass. Then it was on.
          </div>
        </div>
        <div ref={jerseyRef} className="absolute left-1/2 z-20" style={{
          top: '-30vh',
          transform: 'translateX(-50%)',
          filter: 'drop-shadow(0 18px 32px rgba(0,0,0,0.55))',
          opacity: landed ? 0 : 1,
          transition: 'opacity 300ms ease',
          transitionDelay: landed ? '120ms' : '0ms',
          /* will-change alone hints the compositor without forcing a
             new containing block (which would interfere with the sticky
             parent's positioning context). */
          willChange: 'transform, top',
        }}>
          <SD_JerseyPlaque size={130} />
        </div>
        {landed && (
          <div key={flashKey} className="absolute inset-0 z-30 pointer-events-none sd-flash-in"
            style={{ background: 'rgba(0,214,254,0.30)' }} />
        )}
        <div className="absolute inset-0 z-40 px-6 lg:px-16 transition-opacity duration-700 flex items-center"
          style={{ opacity: landed ? 1 : 0, pointerEvents: landed ? 'auto' : 'none' }}>
          <div className="w-full max-w-[1280px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-16 items-center">
            <div className="lg:col-span-7 flex flex-col">
              <div className="sd-mono text-[10.5px] tracking-[0.30em] uppercase sd-tx30 mb-5">
                {SD_OPENING.q} · {SD_OPENING.ts} · First basket
              </div>
              <div className="sd-serif italic sd-tx" style={{ fontSize: 'clamp(4rem, 11vw, 8.5rem)', fontWeight: 300, lineHeight: 0.85, letterSpacing: '-0.01em' }}>
                {SD_OPENING.title}
              </div>
              <p className="sd-mono text-[13px] leading-[1.85] sd-tx55 max-w-[44ch] mt-6">{SD_OPENING.body}</p>
              <div className="sd-mono text-[9.5px] tracking-[0.30em] uppercase sd-tx25 mt-6">Halo clip · auto-detected</div>
            </div>
            <div className="lg:col-span-5">
              <SD_VideoFrame tsLabel={`${SD_OPENING.q} · ${SD_OPENING.ts}`} captionLabel="No-look pass · Q1 7:33" maxWidth={420} imgSrc={SD_CLIP_IMGS[1]} />
            </div>
          </div>
        </div>
      </div>
    </section>
  );
};

      return (
        <circle key={i} cx={s.x} cy={s.y} r={isThree ? 5.5 : 5}
          fill={fill} stroke={stroke || 'none'}

    })}

);

const SD_QuarterScroll = ({ scrollEl }) => {
  const sectionRef = useRef(null);
  const trackRef = useRef(null);
  const progressRef = useRef(null);
  const [active, setActive] = useState(0);
  const activeRef = useRef(0);
  const rafRef = useRef(null);

  useEffect(() => {
    if (!scrollEl) return;
    /* On mobile the QuarterScroll converts to a vertical panel stack via
       CSS (see media query). The scroll handler then has nothing to
       drive — bail out so we don't burn frames on no-op work. */
    const isMobile = () => window.matchMedia('(max-width: 767px)').matches;
    const onScroll = () => {
      if (rafRef.current) return;
      rafRef.current = requestAnimationFrame(() => {
        rafRef.current = null;
        if (isMobile()) return;
        const sec = sectionRef.current;
        if (!sec) return;
        const rect = sec.getBoundingClientRect();
        const scrollable = sec.offsetHeight - window.innerHeight;
        if (scrollable <= 0) return;
        const p = Math.max(0, Math.min(1, -rect.top / scrollable));
        /* Track + progress = pure DOM mutation, never a React re-render. */
        if (trackRef.current) trackRef.current.style.transform = `translate3d(-${p * 300}vw, 0, 0)`;
        if (progressRef.current) progressRef.current.style.width = `${p * 100}%`;
        const a = Math.max(0, Math.min(3, Math.round(p * 3)));
        /* Skip the React render when active hasn't actually flipped to a
           new panel. */
        if (a !== activeRef.current) {
          activeRef.current = a;
          setActive(a);
        }
      });
    };
    scrollEl.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => {
      scrollEl.removeEventListener('scroll', onScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [scrollEl]);

  return (
    /* 400vh (was 460vh): 100vh sticky phase + 300vh of scroll = 100vh
       per quarter transition. Tighter pacing.
       sd-q-scroll-section / sd-q-indicators / sd-q-header tags are the
       mobile-override hooks — phones convert this whole thing to a
       vertical stack of panels (no sticky horizontal track), which is
       drastically lighter than rendering 4 viewport-wide panels at once. */
    <section ref={sectionRef} className="sd-q-scroll-section relative" style={{ height: '400vh' }}>
      <div className="sticky top-0 h-screen overflow-hidden">
        <div ref={progressRef} className="absolute top-0 start-0 h-[3px] sd-progress-bar z-30" style={{ width: '0%' }} />
        <div className="sd-q-header absolute top-7 inset-x-0 text-center z-20 pointer-events-none">
          <div className="sd-mono text-[10px] tracking-[0.30em] uppercase sd-tx30 mb-0.5">Quarter by quarter</div>
          <div className="sd-serif italic sd-tx85" style={{ fontSize: 'clamp(1rem, 1.5vw, 1.25rem)' }}>how all 24 happened</div>
        </div>
        <div ref={trackRef} className="sd-q-track flex h-full"
          style={{ width: '400vw', transition: 'transform 80ms linear' }}>
          {SD_QUARTERS.map((q, i) => (
            <SD_QuarterPanel key={i} q={q} isActive={active === i} />
          ))}
        </div>
        <div className="sd-q-indicators absolute bottom-8 left-1/2 -translate-x-1/2 flex gap-7 z-30">
          {SD_QUARTERS.map((q, i) => (
            <div key={i} className="sd-mono text-[11px] tracking-[0.25em] uppercase transition-all duration-300"
              style={{
                color: i === active ? 'var(--sd-cream)' : 'var(--sd-cream-25)',
                transform: i === active ? 'scale(1.15)' : 'scale(1)',
              }}>{q.q}</div>
          ))}
        </div>
      </div>
    </section>
  );
};

       option — we pass the overlay's scroll container so the threshold
       triggers when the section enters the overlay's viewport, not the
       document's. */

       scrolled 35vh into a 100vh section before the score animated,

/* ── StorytellingDropViewer ─────────────────────────────────────────
   Fullscreen scrollytelling overlay. Replaces the earlier 60/40 split
   viewer with the Tal Weiss editorial experience ported from
   prototype/storydrop-tal-weiss.html.
   - The overlay itself owns the scroll (overflow-y: auto on its
     absolute-inset child). Sticky sections inside sticky to the
     overlay, not to window.
   - AnchoredOpen / QuarterScroll / ScoreBoard / Closing all receive the
     scroll element as a prop so their scroll listeners and
     IntersectionObservers bind to the overlay's scroll, not the
     document's.
   - Close button is fixed top-end above all content.
   For the prototype, every story drop (sd1/sd2/sd3) renders the same
   Tal Weiss vs Northside story — per-drop data branching is a future
   enhancement. */
const StorytellingDropViewer = ({ storyId, onClose, onPickMoment }) => {
  const scrollRef = useRef(null);
  const [scrollEl, setScrollEl] = useState(null);
  const [badgeVisible, setBadgeVisible] = useState(true);
  const badgeRef = useRef(true);
  useEffect(() => {
    setScrollEl(scrollRef.current);
  }, []);
  /* Lock body scroll while the overlay is mounted. Stops iOS Safari from
     rubber-banding the underlying document and prevents the prototype's
     ambient live-amp / shine / ember animations from chewing CPU behind
     a fixed overlay the user can't see. Restore prior state on unmount. */
  useEffect(() => {
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = prevOverflow; };
  }, []);
  /* Badge fade — only setState when the boolean actually flips (not on
     every scroll tick). */
  useEffect(() => {
    if (!scrollEl) return;
    const onScroll = () => {
      const next = scrollEl.scrollTop < scrollEl.clientHeight * 0.85;
      if (next !== badgeRef.current) {
        badgeRef.current = next;
        setBadgeVisible(next);
      }
    };
    scrollEl.addEventListener('scroll', onScroll, { passive: true });
    return () => scrollEl.removeEventListener('scroll', onScroll);
  }, [scrollEl]);
  return (
    <div data-theme="dark" className="fixed inset-0 z-[100] sd-root anim-fade">
      {/* Plain overflow scroll — no transform, no `contain: paint`. Both
          previously broke `position: sticky` resolution inside the
          overlay (sticky children unstuck on first scroll, exposing the
          tall containing sections as 100-360vh of empty scroll). The
          isolation we still get from `fixed inset-0` on the parent is
          enough; aggressive containment was a premature optimization. */}
      <div ref={scrollRef} className="absolute inset-0 overflow-y-auto"
        style={{
          overflowX: 'clip',
          WebkitOverflowScrolling: 'touch',
        }}>
        <SD_Hero />
        <SD_Marquee />
        <SD_AnchoredOpen scrollEl={scrollEl} />
        <SD_QuarterScroll scrollEl={scrollEl} />
        <SD_ScoreBoard scrollEl={scrollEl} />
        <SD_Closing scrollEl={scrollEl} onPickMoment={onPickMoment} />
      </div>
      <SD_ScrollBadge visible={badgeVisible} />
      <button onClick={onClose} aria-label="Close"
        className="fixed top-4 end-4 z-[110] w-10 h-10 lg-glass squircle-sm flex items-center justify-center text-white">
        <Icon name="close" size={12} stroke={1.8} />
      </button>
    </div>
  );
};

/* ── GameVideoViewer — HORIZONTAL viewer (16:9 content) ──────────
   Used by every entry point where the video is wide-camera game footage:
     - "Full game" tap on Watch (ended posters in the Full games rail)
     - "Game highlight" tap (TeamMomentsRail on Home)
     - "Watch full game" CTA from inside HighlightViewer

   Aspect ratio is 16:9 on BOTH phone and desktop (content drives the
   shape, not the device). On phone the video sits letterboxed in the
   middle of the portrait phone with info BELOW it. On desktop the video
   centers at max-w-[1200px] with info flowing below. Reuses the
   LivePlayerScreen control dock pattern (play/pause + scrubber + time
   + fullscreen) but adapts for VOD playback instead of live edge. */
const GameVideoViewer = ({ gameId, momentId, onClose }) => {
  const game = SEED_GAMES.find(g => g.id === gameId) || SEED_GAMES.find(g => g.status === 'just-ended') || SEED_GAMES[0];
  const [playing, setPlaying] = useState(true);
  const [secs, setSecs] = useState(0);
  /* Mocked VOD timeline — fake a 1h:30m game with a moving playhead.
     Real VOD would expose timeupdate from the video element. */
  const TOTAL = 90 * 60;
  useEffect(() => {
    if (!playing) return;
    const t = setInterval(() => setSecs(v => Math.min(TOTAL, v + 1)), 1000);
    return () => clearInterval(t);
  }, [playing]);
  const mm = Math.floor(secs / 60);
  const ss = secs % 60;
  const time = `${String(Math.floor(mm / 60)).padStart(2,'0')}:${String(mm % 60).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  const total = '01:30:00';
  const pct = (secs / TOTAL) * 100;
  if (!game) return null;
  return (
    <div data-theme="dark" className="absolute inset-0 z-50 lg:fixed lg:z-[100] anim-fade flex flex-col text-white sf"
      style={{ background: '#000' }}>
      {/* Close — top-end (RTL-safe) */}
      <button onClick={onClose} aria-label="Close"
        className="absolute top-4 end-4 z-30 w-10 h-10 rounded-full flex items-center justify-center text-white/95"
        style={{
          background: 'rgba(8,12,20,0.55)',
          backdropFilter: 'blur(16px) saturate(180%)',
          WebkitBackdropFilter: 'blur(16px) saturate(180%)',
          boxShadow: '0 4px 12px -4px rgba(0,0,0,0.55)',
        }}>
        <Icon name="close" size={14} stroke={1.8} />
      </button>

      {/* Video + title block — vertically centered. Same flow on phone
          and desktop: 16:9 video at the top, title + score + CTAs below.
          Phone width = full bleed; desktop caps at 1200px. */}
      <div className="flex-1 flex flex-col items-center justify-center px-0 lg:px-8 xl:px-12">
        <div className="w-full lg:max-w-[1200px] mx-auto">
          {/* 16:9 video — full-bleed on phone, capped on desktop */}
          <div className="relative w-full bg-zinc-900 overflow-hidden lg:squircle-md"
            style={{ aspectRatio: '16 / 9' }}>
            <video key={`gv-${game.id}-${playing}`} src={HALO_VIDEO_URL}
              autoPlay={playing} muted loop playsInline preload="auto"
              className="absolute inset-0 w-full h-full object-cover pointer-events-none" />
            {!playing && (
              <div className="absolute inset-0 flex items-center justify-center z-10">
                <button onClick={() => setPlaying(true)} aria-label="Play"
                  className="w-20 h-20 rounded-full flex items-center justify-center transition-transform duration-200 hover:scale-[1.06]"
                  style={{
                    background:
                      'radial-gradient(ellipse 80% 80% at 30% 20%, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.04) 60%),' +
                      'rgba(8,12,20,0.60)',
                    backdropFilter: 'blur(16px) saturate(180%)',
                    WebkitBackdropFilter: 'blur(16px) saturate(180%)',
                    boxShadow: '0 0 32px rgba(0,214,254,0.30), 0 8px 24px -8px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.30)',
                  }}>
                  <svg width={22} height={26} viewBox="0 0 14 16" fill="white"
                    style={{ width: 22, height: 26, marginInlineStart: 3 }}>
                    <path d="M0 1.5v13c0 1 1.1 1.55 1.9 1.05l11-6.5c.8-.5.8-1.7 0-2.2l-11-6.5C1.1 -.05 0 .5 0 1.5z" />
                  </svg>
                </button>
              </div>
            )}
          </div>
          {/* Title block — flow content below the video */}
          <div className="px-4 lg:px-0 pt-5">
            <div className="flex items-center gap-2 mb-2.5">
              {game.status === 'live' && (
                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full"
                  style={{ background: 'rgba(220,38,38,0.95)', boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.25), 0 0 16px rgba(220,38,38,0.50)' }}>
                  <span className="w-1.5 h-1.5 rounded-full bg-white anim-pulse" />
                  <span className="sf text-[9.5px] tracking-[0.16em] font-bold text-white uppercase">Live</span>
                </div>
              )}
              {game.scoreHome != null && (
                <div className="inline-flex items-center px-2.5 py-1 rounded-full"
                  style={{
                    background: 'rgba(255,255,255,0.14)',
                    backdropFilter: 'blur(20px) saturate(160%)',
                    WebkitBackdropFilter: 'blur(20px) saturate(160%)',
                    border: '1px solid rgba(255,255,255,0.20)',
                    boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.18)',
                  }}>
                  <span className="sf-display text-[11.5px] font-extrabold tabular-nums text-white tracking-tight leading-none">
                    {game.scoreHome}–{game.scoreAway}
                  </span>
                </div>
              )}
              {game.when && (
                <span className="sf text-[10.5px] tracking-[0.16em] uppercase font-semibold text-white/65">
                  {game.when}
                </span>
              )}
            </div>
            <div className="sf-display text-white text-[20px] lg:text-[26px] font-bold leading-tight tracking-[-0.01em]">
              {game.home} vs {game.away}
            </div>
            <div className="sf text-white/65 text-[12.5px] mt-1">Full game · auto-clipped moments below</div>
          </div>
        </div>
      </div>

      {/* Bottom dock — play/pause + scrubber + time + fullscreen */}
      <div className="relative z-30 px-4 lg:px-8 xl:px-12 py-4 lg:py-5">
        <div className="mx-auto lg:max-w-[1200px] flex items-center gap-3 lg:gap-4 px-4 py-3 rounded-full"
          style={{
            background: 'rgba(8,12,20,0.55)',
            backdropFilter: 'blur(20px) saturate(180%)',
            WebkitBackdropFilter: 'blur(20px) saturate(180%)',
            border: '1px solid rgba(255,255,255,0.10)',
            boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.10), 0 8px 24px -8px rgba(0,0,0,0.45)',
          }}>
          <button onClick={() => setPlaying(p => !p)}
            aria-label={playing ? 'Pause' : 'Play'}
            className="w-9 h-9 rounded-full flex items-center justify-center text-white shrink-0 hover:bg-white/10">
            {playing ? (
              <svg width={12} height={14} viewBox="0 0 12 14" fill="white" style={{ width: 12, height: 14 }}>
                <rect x="0" y="0" width="4" height="14" rx="1" />
                <rect x="8" y="0" width="4" height="14" rx="1" />
              </svg>
            ) : (
              <svg width={12} height={14} viewBox="0 0 14 16" fill="white"
                style={{ width: 12, height: 14, marginInlineStart: 1.5 }}>
                <path d="M0 1.5v13c0 1 1.1 1.55 1.9 1.05l11-6.5c.8-.5.8-1.7 0-2.2l-11-6.5C1.1 -.05 0 .5 0 1.5z" />

/* ── PackReveal ──────────────────────────────────────────────────

   ceremony:

     revealing (700-1700ms) — card wiggles, cyan ramp builds
     reveal (1700ms+)    — burst flash; title + moment grid + CTA

   anim-pulse / anim-scale-in / anim-shimmer keyframes to fake the same
   ceremonial moment. Tapping a moment in the reveal grid jumps to
   HighlightViewer at that moment. */
const PackReveal = ({ gameId, onClose, onPickMoment }) => {

  const moments = SEED_MOMENTS.slice(0, 6);

  useEffect(() => {
    const t1 = setTimeout(() => setStage('revealing'), 700);
    const t2 = setTimeout(() => setStage('reveal'), 1700);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);

  return (
    <div data-theme="dark" className="absolute inset-0 z-50 lg:fixed lg:z-[100] anim-fade flex flex-col items-center justify-center px-6"
