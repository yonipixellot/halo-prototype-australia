const PostGameScreen = ({ gameId, onBack, onPickMoment, setHlOwner, captures = [] }) => {
  /* recapOpen toggles a full-screen overlay that plays the condensed
     game clip. Value is null when closed, otherwise 'recap' or 'full'
     to track which thumb opened it — controls the eyebrow label on
     the overlay's top chrome ('RECAP' vs 'FULL GAME'). Both modes
     play the same clips/condensed_game (1).mp4 for the demo; a real
     product would split them onto different assets. */
  const [recapOpen, setRecapOpen] = useState(null);
  const g = SEED_GAMES.find(x => x.id === gameId) || SEED_GAMES.find(x => x.status === 'just-ended');
  const isUpcoming = g.status === 'upcoming';
  const myMoments = SEED_MOMENTS;
  const recap = TEAM_MOMENTS.find(t => t.kind === 'full-recap');
  const homeTeam = teamByName(g.home);
  const awayTeam = teamByName(g.away);
  return (
    <div className="anim-fade pb-28 sf relative" style={{ color: 'var(--text-primary)' }}>
      {/* BackBar — full-width fade strip, inner content capped at 720px on desktop */}
      <div className="sticky top-0 z-20 lg-header-fade px-5 lg:px-8 xl:px-12 pt-12 pb-3">
        <div className="lg:max-w-[720px] lg:mx-auto flex items-center gap-3">
          <button onClick={onBack} className="w-9 h-9 lg-glass squircle-sm flex items-center justify-center" style={{ color: 'var(--text-secondary)' }}><Icon name="chevL" size={14} /></button>
          <div className="flex items-center gap-2 min-w-0">
            <TeamCrest team={homeTeam} size={22} />
            <span className="sf-display text-[14px] font-bold tracking-tight" style={{ color: 'var(--text-primary)' }}>{homeTeam.name}</span>
            <span className="sf text-[11px]" style={{ color: 'var(--text-faint)' }}>vs</span>
            <TeamCrest team={awayTeam} size={22} />
            <span className="sf-display text-[14px] font-bold tracking-tight" style={{ color: 'var(--text-primary)' }}>{awayTeam.name}</span>
          </div>
        </div>
      </div>

      {/* ── UPCOMING branch ─────────────────────────────────
          Stats and highlights don't exist yet — show countdown,
          lineups, and a preview of what populates after tipoff. */}
      {isUpcoming ? (
        <>
          <PreGameHero game={g} />
          <LineupsSection game={g} />
          <ComingAfterTipoff />
        </>
      ) : (
      <>
      {/* Score hero */}
      <ScoreHero game={g} />

      {/* Full game embed — wired to the same overlay player as the
         Game highlight card. For the demo we only have one match
         asset (condensed_game.mp4) so both thumbs route to it; a
         real product would point Full game at the unedited VOD and
         Game highlight at the recap cut. */}
      <PgSection title="Full game" first>
        <GameVideoEmbed kind="full" title="Watch the full game"
          sub={`${homeTeam.name} ${g.scoreHome} · ${awayTeam.name} ${g.scoreAway}`}
          duration="1:32:00"
          poster={FULLGAME_POSTER}
          onClick={() => setRecapOpen('full')} />
      </PgSection>

      {/* Game highlight — big RecapCard.
         Click opens the condensed_game clip in a fullscreen overlay
         (RecapPlayer below). The clip is a same-origin static asset
         shipped under clips/, so autoPlay works without a user click
         on Drive's UI. */}
      {recap && (
        <PgSection title="Game highlight">
          <GameVideoEmbed kind="recap" title={recap.title} sub={recap.sub}
            duration={fmt.dur(recap.dur)}
            poster={RECAP_POSTER}
            onClick={() => setRecapOpen('recap')} />
        </PgSection>
      )}

      {/* Your Highlights — horizontal rail. Capped at 720px on desktop so it
          aligns with the rest of the page. */}
      <PgSectionFullBleed title="Your highlights" action="All">
        <div className="flex gap-3 overflow-x-auto no-scrollbar px-5 lg:px-8 xl:px-12 lg:max-w-[720px] lg:mx-auto pb-2">
          {myMoments.map((m, i) => (
            <EditorialDropThumb key={m.id} moment={m} onClick={() => onPickMoment(i)} />
          ))}
        </div>
      </PgSectionFullBleed>

      {/* From the stands — fan-recorded public captures scoped to this
          game. Sits directly under Your Highlights as part of the same
          content stream. Constrained to the SAME lg:max-w-[720px] gutter
          as the rest of PostGameScreen (the CaptureRail's own
          px-5 lg:px-8 xl:px-12 then lives inside the centered column,
          matching how PgSectionFullBleed handles Your Highlights). */}
      <div className="mt-7 lg:max-w-[720px] lg:mx-auto">
        <CaptureRail
          title="From the stands"
          subtitle="Captured by fans at the venue."
          captures={(captures || []).filter(c =>
            c.gameId === gameId && c.privacy === 'public' && (
              c.taggedPlayerId == null ||
              c.tagApprovalStatus === 'approved' ||
              (c.tagApprovalStatus === 'pending' && c.capturedBy === 'You')
            )
          )}
          onPickCapture={(c) => { window.location.hash = '#/capture-view/' + c.id; }}
          emptyLabel="No fan captures yet for this game." />
      </div>

      {/* Other players — home/away tabs.
          onPickPlayer used to throw away the player arg and just call
          onPickMoment(0), so every tile opened whoever hlOwner was last
          set to (Sarah Kim, in practice, because she's first in the
          home-feed circle order). Now we map the clicked player's
          roster id → highlight owner via ROSTER_TO_HL_OWNER, set the
          shell's hlOwner state, and then open the viewer at clip 0.
          Players without a clip mapping (most of the bench) skip the
          open — clicking them is a no-op rather than misleadingly
          opening someone else's reel. */}
      <OtherPlayersSection game={g} onPickPlayer={(p) => {
        const ownerId = ROSTER_TO_HL_OWNER[p.id];
        if (!ownerId) return;
        setHlOwner(ownerId);
        onPickMoment(0);
      }} />

      {/* Your game stats — 3-tile */}
      <YourGameStats playerNumber={PLAYER.number} />

      {/* Team stats — 8-row H2H */}
      <TeamStatsSection game={g} />

      {/* Player stats — tabbed table */}
      <PlayerStatsSection game={g} />
      </>
      )}

      {/* Game highlight player — fullscreen overlay that plays the
         condensed_game.mp4 clip. Same pattern as the highlight viewer
         (native <video autoPlay muted playsInline> on a same-origin
         static asset). Filename has a literal space + (1) — URL-encoded
         so the src resolves without a 404. */}
      {recapOpen && (
        <div data-theme="dark" className="fixed inset-0 z-[80] anim-fade flex flex-col"
          style={{ background: '#050810' }}>
          {/* Top chrome — game title + close X. Eyebrow label flips
             between 'Recap' and 'Full game' depending on which thumb
             opened the overlay (recapOpen carries the mode). */}
          <div className="absolute top-0 inset-x-0 z-30 px-4 pt-11 pb-4 flex items-center justify-between gap-2 pointer-events-none">
            <div className="pointer-events-auto flex items-center gap-2 min-w-0">
              <TeamCrest team={homeTeam} size={22} />
              <span className="sf-display text-[13px] font-bold tracking-tight text-white truncate">{homeTeam.name}</span>
              <span className="sf text-[11px]" style={{ color: 'rgba(255,255,255,0.45)' }}>vs</span>
              <TeamCrest team={awayTeam} size={22} />
              <span className="sf-display text-[13px] font-bold tracking-tight text-white truncate">{awayTeam.name}</span>
              <span className="sf text-[10.5px] tracking-[0.16em] uppercase font-semibold ms-2"
                style={{ color: 'var(--brand-cyan-text)' }}>
                {recapOpen === 'full' ? 'Full game' : 'Recap'}
              </span>
            </div>
            <button onClick={() => setRecapOpen(null)} aria-label="Close"
              className="pointer-events-auto w-9 h-9 lg-glass squircle-sm flex items-center justify-center text-white shrink-0">
              <Icon name="close" size={12} stroke={1.8} />
            </button>
          </div>
          {/* Video — fills, contained so neither axis crops. */}
          <video
            src="clips/condensed_game.mp4"
            autoPlay muted playsInline controls
            onEnded={() => setRecapOpen(null)}
            className="flex-1 w-full h-full"
            style={{ objectFit: 'contain', background: '#000' }} />
        </div>
      )}
    </div>
  );
};

/* ============================================================
   10. VIDEO PLAYERS — full DS port (P7)
   ShareSheet · HighlightViewer · StorytellingDropViewer · PackReveal

   Real video element backed by HALO_VIDEO_URL. Phone viewer uses

/* ── ShareIcon — small icon glyphs for the 6 share targets ─────── */
const ShareIcon = ({ name }) => {
  const paths = {
    copy:      'M5 5 H13 V13 H5 Z M7 3 H15 V11',
    facebook:  'M11 4 H13 V6.5 H11 V8 H13 L12.7 10.5 H11 V16 H8.5 V10.5 H7 V8 H8.5 V6.5 c0-1.4 1-2.5 2.5-2.5',
    instagram: 'M5 3 H15 a2 2 0 0 1 2 2 V15 a2 2 0 0 1 -2 2 H5 a2 2 0 0 1 -2 -2 V5 a2 2 0 0 1 2 -2 Z M10 7 a3 3 0 1 0 0 6 a3 3 0 0 0 0 -6 Z M14 5.5 V5.6',
    x:         'M4 4 L16 16 M16 4 L4 16',
    tiktok:    'M11 3 V12.5 a3 3 0 1 1 -3 -3 M11 3 a3.5 3.5 0 0 0 3.5 3.5',
    whatsapp:  'M4 16 L5 13 a6 6 0 1 1 2 2 Z M7 9 c0 2 2 4 4 4 M7 9 c.4-.4.9-.5 1.3-.3 L9 10 M11 13 c.4 0 .8-.1 1.1-.4 L12.8 12',
  };
  return (

/* ── ShareSheet ──────────────────────────────────────────────────
   Bottom-sheet share modal with 6 targets. Direct port of DS
   screens/home/ShareSheet.tsx, glyphs simplified to single-color
   line icons so we don't need brand assets.

   Copy-link target shows inline "Copied!" confirmation for ~1.5s.
   Other targets fire the onShare callback and close after 200ms. */
const SHARE_TARGETS = [
  { id: 'copy',      label: 'Copy link', icon: 'copy' },
  { id: 'facebook',  label: 'Facebook',  icon: 'facebook' },
  { id: 'instagram', label: 'Instagram', icon: 'instagram' },
  { id: 'x',         label: 'X',         icon: 'x' },
  { id: 'tiktok',    label: 'TikTok',    icon: 'tiktok' },
  { id: 'whatsapp',  label: 'WhatsApp',  icon: 'whatsapp' },
];

const ShareSheet = ({ title, subtitle, url, thumbnail, onShare, onClose, anchor = 'curtain' }) => {
  const [copied, setCopied] = useState(false);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const handle = (targetId) => {
    if (targetId === 'copy') {
      try { navigator.clipboard?.writeText(url || ''); } catch (e) {}
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
      return;
    }
    onShare?.(targetId);
    setTimeout(onClose, 200);
  };
  /* Body content is identical between curtain (phone) and popover
     (desktop) variants — extracted into a sub-component so we don't
     duplicate the header + grid + url markup. */
  const Body = () => (
    <>
      <div className="flex items-center gap-3 mb-4 pb-3" style={{ borderBottom: '1px solid var(--hairline)' }}>
        {thumbnail && (
          <div className="w-11 h-11 squircle-sm lg-glass-strong flex items-center justify-center shrink-0">
            <span className="sf-display text-[15px] font-bold text-white">{thumbnail}</span>
          </div>
        )}
        <div className="flex-1 min-w-0">
          <div className="sf-display text-[14px] font-bold leading-tight truncate" style={{ color: 'var(--text-primary)' }}>{title || 'Share moment'}</div>
          {subtitle && <div className="sf text-[11px] mt-0.5 truncate" style={{ color: 'var(--text-tertiary)' }}>{subtitle}</div>}
        </div>
      </div>
      <div className="grid grid-cols-3 gap-2.5">
        {SHARE_TARGETS.map(t => {
          const isCopiedHere = t.id === 'copy' && copied;
          return (
            <button key={t.id} onClick={() => handle(t.id)}
              className="flex flex-col items-center gap-1.5 py-1.5 lg-aura"
              aria-label={t.label}>
              <div className="w-11 h-11 rounded-full flex items-center justify-center"
                style={isCopiedHere
                  ? { background: 'var(--brand-cyan-soft)', border: '1px solid var(--brand-cyan-border)', color: 'var(--brand-cyan-text)' }
                  : { background: 'var(--glass-card-bg)', backdropFilter: 'blur(36px) saturate(180%)', WebkitBackdropFilter: 'blur(36px) saturate(180%)', border: '1px solid var(--glass-card-border)', color: 'var(--text-secondary)' }
                }>
                <ShareIcon name={t.icon} />
              </div>
              <span className="sf text-[10px] font-semibold"
                style={{ color: isCopiedHere ? 'var(--brand-cyan-text)' : 'var(--text-secondary)' }}>
                {isCopiedHere ? 'Copied!' : t.label}
              </span>
            </button>
          );
        })}
      </div>
      {url && (
        <div className="mt-3 pt-3 sf text-[10.5px] text-center truncate"
          style={{ color: 'var(--text-tertiary)', borderTop: '1px solid var(--hairline)' }}>
          {url}
        </div>
      )}
    </>
  );

  /* Popover variant — desktop only. Anchored to the focal frame's
     bottom-end (above the Share button in the action row). No
     backdrop dim; clicking outside dismisses via the invisible
     dismiss layer. ~320px wide, sits within the focal frame's
     wrapper bounds. */
  if (anchor === 'popover') {
    return (
      <>
        <button onClick={onClose} aria-label="Close share menu"
          className="absolute inset-0 z-[60] cursor-default"
          style={{ background: 'transparent' }} />
        <div className="absolute z-[70] anim-fade"
          style={{
            insetInlineEnd: 16,
            bottom: 96,
            width: 320,
            background: 'var(--canvas-bg-soft)',
            border: '1px solid var(--glass-card-border)',
            borderRadius: 16,
            padding: '14px 16px 14px',
            boxShadow: '0 24px 56px -16px rgba(0,0,0,0.70), inset 0 1px 0 rgba(255,255,255,0.06)',
          }}>
          <Body />
          {/* Caret pointing down-right at the share button. Square
             rotated 45deg with the same bg + only the bottom + right
             borders so it reads as a tail off the bubble. */}
          <div style={{
              position: 'absolute',
              bottom: -7,
              insetInlineEnd: 36,
              width: 14,
              height: 14,
              background: 'var(--canvas-bg-soft)',
              borderInlineEnd: '1px solid var(--glass-card-border)',
              borderBottom: '1px solid var(--glass-card-border)',
              transform: 'rotate(45deg)',
            }} />
        </div>
      </>
    );
  }

  /* Curtain variant — mobile bottom sheet with full-screen scrim. */
  return (
    <div className="absolute inset-0 z-[70] anim-fade">
      <button onClick={onClose} aria-label="Close share sheet" className="absolute inset-0"
        style={{ background: 'rgba(0,0,0,0.55)', backdropFilter: 'blur(8px) saturate(120%)', WebkitBackdropFilter: 'blur(8px) saturate(120%)' }} />
      <div className="absolute inset-x-0 bottom-0 anim-slide-sheet"
        style={{
          background: 'var(--canvas-bg-soft)',
          borderTop: '1px solid var(--glass-card-border)',
          borderTopLeftRadius: 20,
          borderTopRightRadius: 20,
          padding: '14px 20px 32px',
        }}>
        <div className="mx-auto mb-4" style={{ width: 40, height: 4, borderRadius: 2, background: 'rgba(255,255,255,0.20)' }} />
        <Body />
      </div>
    </div>
  );
};

/* ── HighlightViewer — VERTICAL viewer (player HL drops only) ────
   Aspect ratio follows CONTENT, not device:
     - Phone (< lg):  9:16 fills the entire phone screen (Instagram pattern)
     - Desktop (lg+): 9:16 video CENTERED in dark landscape canvas with
                      sidebars (letterboxed) + info panel docked on the right

   Used by:
     - Home DropsSection (auto-clipped player highlights)
     - Profile recent drops
     - PackReveal moment grid tap-through

   For 16:9 game footage (full games, team highlights) the entry point
   routes to <GameVideoViewer/> instead — that one keeps the 16:9 shape
   on both phone and desktop. This split is the core fix from the
   May 2026 critique: video aspect = content type, NOT device. */
/* AD_SLOT — index in the highlight story carousel at which a
   sponsored ad slide is inserted. Position 4 (0-indexed) means
   "after the first 4 highlight clips". Only injected when the
   player actually has more than that many highlights — fewer
   clips skip the ad entirely so a sparse player profile doesn't
   feel ad-dominated. */
const AD_SLOT = 4;
const AD_AUTO_ADVANCE_MS = 6000;
/* PLAYER_HL_AD_DATA_URI — base64 of the 9:16 YONI x CLAUDE banner
   for the highlight-story sponsored slide. Source was a 941×1672
   PNG; optimised to 720w JPEG @ q85, ~84KB raw / ~112KB inline.
   Same single-file-deploy rationale as the morph card creative. */
const PLAYER_HL_AD_DATA_URI = "spalding-1080x1920.png";

const HighlightViewer = ({ hlOwner = 'self', momentIndex = 0, onClose, onWatchFullGame, onChainNext }) => {
  const [idx, setIdx] = useState(momentIndex);
  /* `playing` state — driven by the <video> element's onPlay/onPause
     events. Starts false; autoPlay fires onPlay almost immediately
     on slide change, flipping this to true (PlayHero hides). If the
     browser blocks autoplay or the user manually pauses, this goes
     false and PlayHero re-appears as a real resume affordance. */
  const [playing, setPlaying] = useState(false);
  /* Video ref — shared between phone + desktop branches (only one is
     mounted at a time due to lg:hidden / hidden lg:flex). PlayHero
     uses it to actually call .play() instead of just toggling React
     state. */
  const videoRef = useRef(null);
  const [shareOpen, setShareOpen] = useState(false);
  /* Per-player clip library — looked up from PLAYER_CLIPS via the
     HL_OWNER_TO_ROSTER bridge. Each owner ('self', 'player-sarah',
     'player-dylan', 'player-bell', 'player-reyes') maps to a roster
     ID whose clip array drives the story. Each clip carries an
     iframe `src` (Drive /preview URL) plus title + sub strings. */
  const clips = clipsForOwner(hlOwner);
  /* Game context — defaults to the live/just-ended Sesh Rigs vs
     Medium Fundamentals matchup so the score chip + Watch full
     game CTA still resolve. Per-clip game scoping would need
     each clip to carry its own gameId; for now all clips share
     the focal rivalry. */
  const game = SEED_GAMES.find(g => g.id === 'gE') || SEED_GAMES[0];
  /* Ad insertion math — only inject if the player has more clips
     than the AD_SLOT cutoff. Total counts the ad as a slide so the
     N/M counter and progress segments both render the extra slot. */
  const hasAd = clips.length > AD_SLOT;
  const total = hasAd ? clips.length + 1 : clips.length;
  const isAdAt = (i) => hasAd && i === AD_SLOT;
  /* Map a story-carousel index to the underlying clip index.
     Returns null when the slot is the ad (caller handles the ad
     render branch). Slots before the ad map 1:1; slots after shift
     down by one so the clip array isn't re-indexed. */
  const momentAt = (i) => {
    if (!hasAd) return clips[i];
    if (i < AD_SLOT) return clips[i];
    if (i === AD_SLOT) return null;
    return clips[i - 1];
  };
  const isAd = isAdAt(idx);
  const m = momentAt(idx);
  /* Owner identity — looked up from the roster so the
     "#NN · Player highlights" header reads as the actual player
     whose clips are playing, not the user's persona. */
  const ownerRosterId = HL_OWNER_TO_ROSTER[hlOwner] || 'r1';
  const ownerIsHome = ownerRosterId.startsWith('r');
  const ownerPlayer = (ownerIsHome ? HOME_ROSTER : AWAY_ROSTER).find(p => p.id === ownerRosterId) || HOME_ROSTER[0];
  /* Team name for the eyebrow under the player headline. Home roster
     is always Sesh Rigs, away roster is always Medium Fundamentals
     (the BA focal rivalry). Keeping this colocated with ownerPlayer
     so the InfoBlock can read it from closure. */
  const ownerTeamName = ownerIsHome ? 'Sesh Rigs' : 'Medium Fundamentals';
  const isPlayerHL = true;
  const jerseyNum = ownerPlayer.number;
  const sectionLabel = isPlayerHL ? `${ownerPlayer.name}'s highlights` : 'Team moment';
  /* goNext — if not on the last slide, advance. If on the last slide
     and an onChainNext handler is wired, fire it (app shell jumps to
     the next unwatched person's reel). Otherwise wrap back to slide
     0 — preserves the old loop behavior for callers that don't pass
     onChainNext. */
  const goNext = () => {
    if (idx >= total - 1) {
      if (onChainNext) onChainNext();
      else setIdx(0);
      return;
    }
    setIdx(i => i + 1);
  };
  const goPrev = () => setIdx(i => (i - 1 + total) % total);
  /* Keyboard navigation — arrow keys for prev/next + Esc to close.
     A real story player needs these or it feels broken on desktop. */
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight') goNext();
      else if (e.key === 'ArrowLeft') goPrev();
      else if (e.key === 'Escape') onClose();
      else if (e.key === ' ') {
        e.preventDefault();
        const v = videoRef.current;
        if (!v) return;
        if (v.paused) v.play().catch(() => {});
        else v.pause();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  /* Ad auto-advance — when the story lands on the ad slot, set a
     timer to roll forward to the next clip. Matches the story-viewer
     dwell-time mental model (you don't sit on an ad forever). User
     can tap/keyboard-advance early; the cleanup clears the timer on
     unmount or slot change so it doesn't fire stale. */
  useEffect(() => {
    if (!isAd) return;
    const t = setTimeout(() => goNext(), AD_AUTO_ADVANCE_MS);
    return () => clearTimeout(t);
  }, [idx, isAd]);
  if (!m && !isAd) return null;

  /* Top progress segments — slide-position only.
     The fill used to be 60% on the current slide to suggest playback
     progress, but the React state had no idea what Drive's iframe was
     actually doing — it was a hardcoded fiction. Now the fill is
     binary: previous slides are full, current is full, future are
     empty. Honest wayfinding, no false progress claim. */
  const ProgressSegments = () => (
    <div className="flex gap-1 flex-1 me-3">
      {Array.from({ length: total }).map((_, i) => (
        <div key={i} className="flex-1 h-[2.5px] overflow-hidden rounded-full"
          style={{ background: 'rgba(255,255,255,0.25)' }}>
          <div className="h-full" style={{
            width: i <= idx ? '100%' : '0%',
            background: '#fff',
            transition: 'width 200ms linear',
          }} />
        </div>
      ))}
    </div>
  );

  /* AdSlide — 9:16 banner image with SPONSORED disclosure top-leading.
     object-fit: contain (not cover) so the full banner renders without
     cropping when the container's aspect doesn't match the asset's
     9:16. The container's bg (#9CC9E6 — same light-blue as the YONI
     artwork's background) seamlessly extends any letterbox bars top/
     bottom, so the banner reads as edge-to-edge even when the phone
     viewport is taller than 9:16. Clicking anywhere on the slide
     advances to the next clip — matches the tap-zone behavior of clip
     slides so the story flows naturally. */
  const AdSlide = () => (
    <button onClick={goNext} aria-label="Continue"
      className="absolute inset-0 w-full h-full overflow-hidden"
      style={{ background: '#9CC9E6', cursor: 'pointer' }}>
      <img src={PLAYER_HL_AD_DATA_URI}
        alt="Sponsored: Yoni x Claude — A Netflix Series"
        draggable={false}
        className="absolute inset-0 w-full h-full"
        style={{ objectFit: 'contain', objectPosition: 'center', pointerEvents: 'none' }} />
      {/* SPONSORED disclosure — top-leading.
          Phone: sits at top-[80px] so it clears the in-frame progress
          chrome (which is still overlaid on the video at pt-11).
          Desktop: progress chrome moved OUTSIDE the focal frame in
          the latest layout, so we can pin the pill at top-4 (true
          top-left corner) instead of needing 72px of clearance. */}
      <div className="absolute top-[80px] lg:top-4 start-4 z-30">
        <div className="inline-flex items-center px-2.5 py-1 squircle-sm"
          style={{
            background: 'rgba(0,0,0,0.55)',
            backdropFilter: 'blur(8px)',
            WebkitBackdropFilter: 'blur(8px)',
            border: '1px solid rgba(255,255,255,0.10)',
          }}>
          <span className="sf text-[9px] font-bold tracking-[0.18em] uppercase leading-none"
            style={{ color: 'rgba(255,255,255,0.85)' }}>
            Sponsored
          </span>
        </div>
      </div>
    </button>
  );

  /* Carousel-neighbor title resolver — handles the ad slot so the
     ghost prev/next frames on desktop show "Sponsored" instead of
     reaching for a moment.title that doesn't exist. */
  const titleAt = (i) => {
    if (isAdAt(i)) return 'Sponsored';
    const ma = momentAt(i);
    return (ma && ma.title) || 'Highlight';
  };

  /* NeighborThumb — desktop ghost prev/next preview.
     Renders as a real <video> element seeked to a representative
     frame. No poster fallback — the user wants this to be pure video.
     loadedmetadata listener seeks to ~2s (or duration/3, whichever is
     less) so the element shows actual game footage paused at a
     non-fade-in frame. Ad slot keeps the data-URI <img> fallback. */
  const NeighborThumb = ({ i }) => {
    const slotIsAd = isAdAt(i);
    const ma = momentAt(i);
    const ref = useRef(null);
    useEffect(() => {
      if (slotIsAd) return;
      if (!ref.current) return;
      const v = ref.current;
      const onMeta = () => {
        try {
          v.currentTime = Math.min(2, (v.duration || 4) / 3);
        } catch (_e) {}
      };
      v.addEventListener('loadedmetadata', onMeta);
      return () => v.removeEventListener('loadedmetadata', onMeta);
    }, [slotIsAd, ma && ma.src]);
    if (slotIsAd) {
      return (
        <img src={PLAYER_HL_AD_DATA_URI} alt=""
          className="absolute inset-0 w-full h-full"
          style={{ objectFit: 'cover', objectPosition: 'center' }} />
      );
    }
    if (!ma) return null;
    return (
      <video ref={ref} src={ma.src}
        muted playsInline preload="metadata"
        className="absolute inset-0 w-full h-full"
        style={{ objectFit: 'cover', background: '#000', pointerEvents: 'none' }} />
    );
  };

  /* IndexPill — "1 / 7" indicator. Restored alongside the rest of
     the richer-layout revert; user explicitly preferred it. */
  const IndexPill = () => (
    <div className="sf text-[10.5px] tabular-nums font-bold tracking-tight pe-2"
      style={{ color: 'rgba(255,255,255,0.65)' }}>
      <span style={{ color: '#fff' }}>{idx + 1}</span>
      <span style={{ color: 'rgba(255,255,255,0.40)' }}> / {total}</span>
    </div>
  );

  /* Top-overlay eyebrow — sits at the TOP of the video frame as a
     story-style HUD chip (Q4 · 0:08 · YOURS). Replaces the prior
     SectionChip "PLAYER HIGHLIGHTS" pill that duplicated the H1.
     The descriptive context (quarter + clip duration + Yours marker)
     IS the eyebrow now — no redundant section label. */
  const TopOverlayEyebrow = () => (
    <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full"
      style={{
        background: 'rgba(8,12,20,0.55)',
        backdropFilter: 'blur(14px) saturate(160%)',
        WebkitBackdropFilter: 'blur(14px) saturate(160%)',
        border: '1px solid rgba(255,255,255,0.10)',
      }}>
      <span className="sf text-[10px] tracking-[0.14em] uppercase font-bold text-white leading-none">{m.sub}</span>
      {isPlayerHL && (
        <>
          <span className="w-[3px] h-[3px] rounded-full" style={{ background: 'var(--brand-cyan)', boxShadow: '0 0 6px rgba(0,214,254,0.85)' }} />
          <span className="sf text-[10px] tracking-[0.14em] uppercase font-bold leading-none" style={{ color: 'var(--brand-cyan-text)' }}>Yours</span>
        </>
      )}
    </div>
  );

  /* PlayHero — visible glass play button overlay. Now wired to actually
     call .play() on the underlying <video> element via the ref. If the
     browser blocked autoplay or the user manually paused, this resumes. */
  const PlayHero = () => (
    <button onClick={(e) => {
        e.stopPropagation();
        if (videoRef.current) videoRef.current.play().catch(() => {});
      }}
      className="w-20 h-20 rounded-full lg-glass-strong flex items-center justify-center transition-transform duration-200 hover:scale-[1.06] active:scale-[0.98]"
      aria-label="Play"
      style={{
        boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.30), 0 0 40px -8px rgba(0,214,254,0.50), 0 8px 32px -8px rgba(0,0,0,0.55)',
        border: '1px solid rgba(255,255,255,0.25)',
      }}>
      <svg width={22} height={26} viewBox="0 0 22 26" fill="#fff"
        style={{ marginInlineStart: 4, filter: 'drop-shadow(0 0 8px rgba(255,255,255,0.40))', width: 22, height: 26, display: 'block' }}>
        <path d="M2 2 L20 13 L2 24 Z" />
      </svg>
    </button>
  );

  /* VideoPoster — radial bleed + giant HALO monogram + hatch grain.
     Renders behind the video element so a slow / failed video doesn't
     read as a broken black box. */
  const VideoPoster = () => (
    <>
      <div className="absolute inset-0 pointer-events-none"
        style={{
          background:
            'radial-gradient(ellipse 70% 50% at 30% 30%, rgba(0,214,254,0.32) 0%, transparent 60%),' +
            'radial-gradient(ellipse 70% 50% at 75% 75%, rgba(132,88,255,0.28) 0%, transparent 60%),' +
            'linear-gradient(180deg, #0a0e1a 0%, #050810 100%)',
        }} />
      <div className="absolute inset-0 hatch-dark opacity-30 pointer-events-none" />
      <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
        <span className="sf-display font-extrabold tracking-[-0.04em] select-none"
          style={{
            fontSize: 'clamp(120px, 36vw, 320px)',
            color: 'rgba(255,255,255,0.05)',
            letterSpacing: '-0.06em',
            lineHeight: 1,
          }}>H</span>
      </div>
    </>
  );

  /* Score chip — text-only treatment. Team names sit as muted
     eyebrow-cased text flanking the dominant tabular score in the
     middle. */
  const ScoreChip = () => game && game.scoreHome != null ? (
    <div className="squircle-sm px-4 py-2.5 mb-4 flex items-center justify-between"
      style={{
        background: 'var(--glass-card-bg)',
        backdropFilter: 'blur(20px) saturate(180%)',
        WebkitBackdropFilter: 'blur(20px) saturate(180%)',
        border: '1px solid var(--glass-card-border)',
        boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top)',
      }}>
      <span className="sf text-[10.5px] tracking-[0.14em] uppercase font-bold flex-1"
        style={{ color: 'rgba(255,255,255,0.65)' }}>{game.home}</span>
      <div className="sf-display text-[19px] font-bold tabular-nums leading-none flex items-baseline gap-1.5 px-3"
        style={{ color: '#fff' }}>
        <span style={{ color: (game.scoreHome > game.scoreAway) ? '#fff' : 'rgba(255,255,255,0.55)' }}>{game.scoreHome}</span>
        <span style={{ color: 'rgba(255,255,255,0.30)', fontSize: 13 }}>·</span>
        <span style={{ color: (game.scoreAway > game.scoreHome) ? '#fff' : 'rgba(255,255,255,0.55)' }}>{game.scoreAway}</span>
      </div>
      <span className="sf text-[10.5px] tracking-[0.14em] uppercase font-bold flex-1 text-end"
        style={{ color: 'rgba(255,255,255,0.65)' }}>{game.away}</span>
    </div>
  ) : null;

  /* Action row — Watch full game (primary, flex-1) + Save (icon) +
     Share (icon). */
  const ActionRow = () => (
    <div className="flex items-stretch gap-2">
      <button onClick={() => { onClose(); onWatchFullGame && onWatchFullGame(game.id, m && m.id); }}
        className="flex-1 squircle-sm py-3 sf text-[12.5px] font-semibold flex items-center justify-center gap-2"
        style={{
          color: '#0a0d18',
          background: 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
          boxShadow: '0 4px 12px -2px rgba(0,214,254,0.45), inset 0 1px 0 rgba(255,255,255,0.40)',
        }}>
        <svg width={11} height={12} viewBox="0 0 11 12" fill="currentColor"
          style={{ width: 11, height: 12, display: 'block' }}>
          <path d="M1 1 L10 6 L1 11 Z" />
        </svg>
        <span>Watch full game</span>
      </button>
      <button onClick={() => {}} aria-label="Save"
        className="w-12 lg-glass squircle-sm flex items-center justify-center text-white transition-all hover:scale-[1.04] active:scale-[0.95]">
        <svg width={14} height={14} viewBox="0 0 16 16" fill="none" stroke="currentColor"
          strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round"
          style={{ width: 14, height: 14, display: 'block' }}>
          <path d="M3 2 v12 L8 11 L13 14 V2 Z" />
        </svg>
      </button>
      <button onClick={() => setShareOpen(true)} aria-label="Share"
        className="w-12 lg-glass squircle-sm flex items-center justify-center text-white transition-all hover:scale-[1.04] active:scale-[0.95]">
        <svg width={14} height={14} viewBox="0 0 16 16" fill="none" stroke="currentColor"
          strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round"
          style={{ width: 14, height: 14, display: 'block' }}>
          <path d="M3 8 v5 h10 v-5" />
          <path d="M8 2 v9 M5 5 L8 2 L11 5" />
        </svg>
      </button>
    </div>
  );

  /* Info block — player headline + eyebrow + score chip + CTAs.
     Headline is the player NAME (not the placeholder per-clip "Drive 1"
     string) so it stays sensible until real captions exist. */
  const InfoBlock = () => (
    <div className="px-5 pb-5 pt-2">
      <div className="sf-display text-white font-bold tracking-[-0.025em] leading-[1.0] mb-2 text-[26px] lg:text-[28px]"
        style={{ textShadow: '0 2px 12px rgba(0,0,0,0.45)' }}>
        {isPlayerHL && ownerPlayer ? ownerPlayer.name : (sectionLabel || 'Highlight')}
      </div>
      <div className="sf text-[12px] tracking-[0.12em] uppercase font-semibold mb-4"
        style={{ color: 'rgba(255,255,255,0.60)' }}>
        {isPlayerHL && jerseyNum != null
          ? `#${jerseyNum}${ownerTeamName ? ' · ' + ownerTeamName : ''}`
          : sectionLabel}
      </div>
      <ScoreChip />
      <ActionRow />
    </div>
  );

  return (
    <div data-theme="dark" className="absolute inset-0 z-50 lg:fixed lg:z-[100] anim-fade flex flex-col"
      style={{
        background:
          'radial-gradient(ellipse 60% 45% at 50% 35%, rgba(0,214,254,0.14) 0%, transparent 65%),' +
          'radial-gradient(ellipse 70% 50% at 50% 100%, rgba(132,88,255,0.10) 0%, transparent 70%),' +
          'linear-gradient(180deg, #050810 0%, #020308 100%)',
      }}>
      {/* === PHONE LAYOUT (< lg) — full-bleed vertical ===
          Top chrome: progress segments + index pill + close. Eyebrow
          overlay (Q4 · 0:08 · YOURS) tucked at the top-left of the
          video frame as a story-style HUD chip. Bottom info block
          ditches the duplicate "PLAYER HIGHLIGHTS" section pill —
          the headline carries the section context now. */}
      <div className="lg:hidden flex-1 relative overflow-hidden">
        {isAd ? (
          /* Ad slot — full-bleed 9:16 banner replaces the video + info
             block. Top chrome (progress / index / close) renders as a
             sibling below so it overlays the banner. */
          <AdSlide />
        ) : (
          <>
            <VideoPoster />
            {/* Native <video> — was a Drive /preview iframe before.
               autoPlay+muted+playsInline starts immediately on every
               new slide; onEnded chains to the next clip so the whole
               reel auto-advances without a click. `key` forces a fresh
               element when the user manually navigates so autoPlay
               re-fires. */}
            <video key={`hv-phone-${idx}-${m && m.id}`}
              ref={videoRef}
              src={m && m.src}
              autoPlay muted playsInline
              onPlay={() => setPlaying(true)}
              onPause={() => setPlaying(false)}
              onEnded={goNext}
              className="absolute inset-0 w-full h-full"
              style={{ objectFit: 'cover', background: '#000' }} />
            <div className="absolute top-[80px] start-4 z-30">
              <TopOverlayEyebrow />
            </div>
            {/* Tap zones — prev / next, 1/3 width each. */}
            <button onClick={goPrev} className="absolute start-0 top-[140px] bottom-[240px] w-1/3 z-10" aria-label="Previous" />
            <button onClick={goNext} className="absolute end-0 top-[140px] bottom-[240px] w-1/3 z-10" aria-label="Next" />
            {!playing && (
              <div className="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
                <div className="pointer-events-auto"><PlayHero /></div>
              </div>
            )}
            <div className="absolute bottom-0 inset-x-0 z-10 pt-20"
              style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.45) 30%, rgba(0,0,0,0.92) 100%)' }}>
              <InfoBlock />
            </div>
          </>
        )}
        {/* Top chrome — progress segments + index pill + close. Always
           on top regardless of ad/clip via z-30 + sibling order. */}
        <div className="absolute top-0 inset-x-0 z-30 px-4 pt-11 pb-4 flex items-center justify-between gap-2">
          <ProgressSegments />
          <div className="flex items-center gap-1.5 shrink-0">
            <IndexPill />
            <button onClick={onClose} aria-label="Close"
              className="w-9 h-9 lg-glass squircle-sm flex items-center justify-center text-white">
              <Icon name="close" size={12} stroke={1.8} />
            </button>
          </div>
        </div>
        {/* Share sheet — phone curtain variant. Lives inside the phone
           branch so it's scoped to the visible-on-phone layout. */}
        {shareOpen && (
          <ShareSheet anchor="curtain"
            title={isPlayerHL && jerseyNum != null ? `#${jerseyNum} ${sectionLabel}` : sectionLabel}
            subtitle={game ? `${game.home} vs ${game.away}` : null}
            url={`halo.app/m/${m && m.id}`}
            thumbnail={jerseyNum != null ? String(jerseyNum) : null}
            onClose={() => setShareOpen(false)} />
        )}
      </div>

      {/* === DESKTOP LAYOUT (lg+) — 3-frame composition ===
         Ghost prev + next neighbor frames flank the focal card at ~94%
         scale, tap to jump. Per latest critique, the progress segments
         + close X now live OUTSIDE the focal frame (above it), so the
         "Instagram-style story chrome" doesn't crowd the video itself.
         The eyebrow chip (Q1 · 8:24 · YOURS) stays on the video at
         top-left because it IS in-clip context. */}
      <div className="hidden lg:flex flex-1 items-center justify-center relative overflow-hidden">
        {/* Ghost prev — left of focal */}
        <button onClick={goPrev} aria-label="Previous highlight"
          className="absolute z-10 overflow-hidden squircle-md transition-all hover:opacity-80 active:scale-[0.97]"
          style={{
            height: 'min(60vh, 520px)',
            aspectRatio: '9 / 16',
            insetInlineStart: '6%',
            top: '50%',
            transform: 'translateY(-50%) scale(0.94)',
            transformOrigin: 'center',
            opacity: 0.55,
            filter: 'blur(0.5px) saturate(0.85)',
            boxShadow: '0 24px 60px -20px rgba(0,0,0,0.55)',
          }}>
          <NeighborThumb i={(idx - 1 + total) % total} />
          <div className="absolute inset-0" style={{ background: 'linear-gradient(90deg, transparent 0%, rgba(4,6,12,0.35) 100%)' }} />
          <div className="absolute bottom-4 inset-x-4 z-10">
            <div className="sf text-[9.5px] tracking-[0.18em] uppercase font-bold mb-1" style={{ color: 'rgba(255,255,255,0.55)' }}>Previous</div>
            <div className="sf-display text-[13px] font-bold leading-tight truncate" style={{ color: 'rgba(255,255,255,0.85)' }}>
              {titleAt((idx - 1 + total) % total)}
            </div>
          </div>
        </button>

        {/* Ghost next — right of focal */}
        <button onClick={goNext} aria-label="Next highlight"
          className="absolute z-10 overflow-hidden squircle-md transition-all hover:opacity-80 active:scale-[0.97]"
          style={{
            height: 'min(60vh, 520px)',
            aspectRatio: '9 / 16',
            insetInlineEnd: '6%',
            top: '50%',
            transform: 'translateY(-50%) scale(0.94)',
            transformOrigin: 'center',
            opacity: 0.55,
            filter: 'blur(0.5px) saturate(0.85)',
            boxShadow: '0 24px 60px -20px rgba(0,0,0,0.55)',
          }}>
          <NeighborThumb i={(idx + 1) % total} />
          <div className="absolute inset-0" style={{ background: 'linear-gradient(270deg, transparent 0%, rgba(4,6,12,0.35) 100%)' }} />
          <div className="absolute bottom-4 inset-x-4 z-10 text-end">
            <div className="sf text-[9.5px] tracking-[0.18em] uppercase font-bold mb-1" style={{ color: 'rgba(255,255,255,0.55)' }}>Next</div>
            <div className="sf-display text-[13px] font-bold leading-tight truncate" style={{ color: 'rgba(255,255,255,0.85)' }}>
              {titleAt((idx + 1) % total)}
            </div>
          </div>
        </button>

        {/* The focal phone-shape player frame + the chrome that sits
           ABOVE it. Stack them in a vertical flex so the progress
           segments + close X get their own row, outside the 9:16
           card. */}
        <div className="relative z-20 flex flex-col items-center" style={{ width: 'min(calc(88vh * 9 / 16), 428px)' }}>
          {/* Top chrome — progress segments + index pill + close,
             OUTSIDE the focal frame. Sits in its own row above the
             video card. Matches the width of the focal frame so the
             segments line up with the video edges. */}
          <div className="w-full flex items-center justify-between gap-2 pb-3 px-1">
            <ProgressSegments />
            <div className="flex items-center gap-1.5 shrink-0">
              <IndexPill />
              <button onClick={onClose} aria-label="Close"
                className="w-9 h-9 lg-glass squircle-sm flex items-center justify-center text-white">
                <Icon name="close" size={12} stroke={1.8} />
              </button>
            </div>
          </div>
          <div className="relative overflow-hidden squircle-md w-full"
            style={{
              height: 'min(88vh, 760px)',
              aspectRatio: '9 / 16',
              background: '#000',
              boxShadow:
                '0 32px 96px -16px rgba(0,0,0,0.80),' +
                '0 0 60px -10px rgba(0,214,254,0.20),' +
                '0 0 0 1px rgba(255,255,255,0.06)',
            }}>
            {isAd ? (
              <AdSlide />
            ) : (
              <>
                <VideoPoster />
                <video key={`hv-desktop-${idx}-${m && m.id}`}
                  src={m && m.src}
                  autoPlay muted playsInline
                  onPlay={() => setPlaying(true)}
                  onPause={() => setPlaying(false)}
                  onEnded={goNext}
                  className="absolute inset-0 w-full h-full"
                  style={{ objectFit: 'cover', background: '#000' }} />
                <div className="absolute top-4 start-4 z-30">
                  <TopOverlayEyebrow />
                </div>
                {/* Tap zones — prev (left half) / next (right half). */}
                <button onClick={goPrev} aria-label="Previous clip"
                  className="absolute start-0 top-[60px] bottom-[260px] w-1/2 z-10" />
                <button onClick={goNext} aria-label="Next clip"
                  className="absolute end-0 top-[60px] bottom-[260px] w-1/2 z-10" />
                {!playing && (
                  <div className="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
                    <div className="pointer-events-auto"><PlayHero /></div>
                  </div>
                )}
                <div className="absolute bottom-0 inset-x-0 z-20 pt-20"
                  style={{ background: 'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.45) 30%, rgba(0,0,0,0.92) 100%)' }}>
                  <InfoBlock />
                </div>
              </>
            )}
          </div>
          {/* Share sheet — desktop popover variant. Anchored to the
             focal frame wrapper (this div is `relative`), pinned to
             the bottom-end so it floats just above the Share button
             in the action row. No backdrop dim — clicking outside
             dismisses via ShareSheet's transparent close-catcher
             layer. */}
          {shareOpen && (
            <ShareSheet anchor="popover"
              title={isPlayerHL && jerseyNum != null ? `#${jerseyNum} ${sectionLabel}` : sectionLabel}
              subtitle={game ? `${game.home} vs ${game.away}` : null}
              url={`halo.app/m/${m && m.id}`}
              thumbnail={jerseyNum != null ? String(jerseyNum) : null}
              onClose={() => setShareOpen(false)} />
          )}
        </div>
      </div>

      {/* ShareSheet renders inside each layout branch above. */}
    </div>
  );
};

/* ── StorytellingDropViewer ──────────────────────────────────────
   Direct port of DS screens/home/StorytellingDropViewer.tsx.
   60-40 layout: horizontal-snap moment cards on top (60%), insight
   panel on bottom (40%). Per-card cyan/purple/pink/amber hues so each
   moment reads as its own vibe. Tapping a card jumps into HighlightViewer
   at that moment.

  STORYTELLING_HUES[(id || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0) % STORYTELLING_HUES.length];

/* SD_VideoFrame — editorial clip thumbnail.
   Two modes:
   - If videoSrc is provided (real Tal Weiss footage from SD_TAL_CLIPS),
     render a native <video autoPlay muted loop playsInline> with imgSrc
     as the underlying poster — so the first frame paints instantly while
     the MP4 decodes, then the clip starts looping in place.
   - If videoSrc is null, fall back to the Ken Burns animated still that
     the storydrop has shipped with from day one. This keeps any call
     sites that haven't been migrated to real footage working unchanged. */
const SD_VideoFrame = ({ tsLabel, captionLabel, captionAlign = 'top', ratio = '9/16', maxWidth = 360, imgSrc = SD_CLIP_IMGS[0], videoSrc = null }) => {
  return (
    <div className="relative mx-auto w-full" style={{ maxWidth }}>
      <div className="sd-video-frame"
        style={{ aspectRatio: ratio, borderRadius: '6px', overflow: 'hidden', border: '1px solid rgba(240,235,225,0.12)', boxShadow: '0 24px 64px rgba(0,0,0,0.70)' }}>

        {videoSrc ? (
          /* Real footage — autoplay muted loop. `poster` paints the
             stored first-frame still while the MP4 metadata loads, so
             the box never flashes black on slower connections. The clip
             itself is 9:16 portrait (SAR-corrected during ffmpeg), so
             object-fit:cover fills the frame natively without crop. */
          <video src={videoSrc}
            poster={imgSrc}
            autoPlay muted loop playsInline
            className="absolute inset-0 w-full h-full"
            style={{ objectFit: 'cover', objectPosition: 'center', opacity: 0.95 }} />
        ) : (
          /* Ken Burns animated poster — original fallback. The
              .sd-ken-burns CSS class drives a slow scale+translate loop
              that reads as cinematic motion at scrollytelling scale. */

const SD_AnchoredOpen = ({ scrollEl }) => {
  const sectionRef  = useRef(null);
  const ballRef     = useRef(null);
  const lastLandedRef = useRef(false);
  const rafRef      = useRef(null);
  const [landed, setLanded] = useState(false);

  useEffect(() => {
    if (!scrollEl) return;
    const apply = () => {
      rafRef.current = null;
      const sec = sectionRef.current;
      const ball = ballRef.current;
      if (!sec) return;
      const rect = sec.getBoundingClientRect();
      const scrollable = sec.offsetHeight - window.innerHeight;
      if (scrollable <= 0) return;
      const p = Math.max(0, Math.min(1, -rect.top / scrollable));
      /* Ball drops in over first 55% of scroll travel.
         Gravity ease-in: starts slow, accelerates. */
      const fall  = Math.min(1, p / 0.55);
      const eased = fall * fall * fall;
      const ballY = -12 + 80 * eased;
      if (ball) {
        ball.style.transform = `translate(-50%, ${ballY}vh)`;
      }
      const isLanded = p > 0.55;
      if (isLanded !== lastLandedRef.current) {
        lastLandedRef.current = isLanded;
        setLanded(isLanded);
      }
    };
    const onScroll = () => {
      if (rafRef.current) return;
      rafRef.current = requestAnimationFrame(apply);
    };
    scrollEl.addEventListener('scroll', onScroll, { passive: true });
    apply();
    return () => {
      scrollEl.removeEventListener('scroll', onScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [scrollEl]);

  return (
    <section ref={sectionRef} className="relative" style={{ height: '190vh' }}>
      <div className="sticky top-0 h-screen" style={{ clipPath: 'inset(0)' }}>

        {/* ── pre-land: eyebrow + headline — staggered clip-path reveal on mount ── */}
        <div className="absolute inset-x-0 text-center px-6"
          style={{ top: '8%', zIndex: 10, opacity: landed ? 0 : 1, transition: 'opacity 0.35s ease-in' }}>
          <div className="sd-rh1 sd-mono text-[10px] tracking-[0.35em] uppercase sd-tx25 mb-4">How it started</div>
          <div className="sd-serif sd-tx" style={{ fontSize: 'clamp(2.8rem, 6.5vw, 5.5rem)', letterSpacing: '-0.02em', lineHeight: 1.0, fontWeight: 400 }}>
            <span className="sd-rh2 block">One shot.</span>
            <span className="sd-rh3 block">Everything changed.</span>
          </div>
        </div>

        {/* ── backboard — fades last in chain ── */}
        <div className="absolute left-1/2"
          style={{ top: '57%', transform: 'translateX(-50%)', zIndex: 5, opacity: landed ? 0 : 1, transition: 'opacity 0.35s ease-in 0.35s' }}>
          <SD_HoopBackboard />
        </div>

        {/* ── rim + net — fades second ── */}
        <div className="absolute left-1/2"
          style={{ top: '57%', transform: 'translateX(-50%)', zIndex: 20, opacity: landed ? 0 : 1, transition: 'opacity 0.3s ease-in 0.18s' }}>
          <SD_HoopRimNet />
        </div>

        {/* ── basketball — fades first, ball "enters" the net ── */}
        <div ref={ballRef} className="absolute left-1/2"
          style={{ top: 0, transform: 'translate(-50%, -12vh)', zIndex: 30, willChange: 'transform',
            filter: 'drop-shadow(0 16px 32px rgba(0,0,0,0.70))',
            opacity: landed ? 0 : 1, transition: 'opacity 0.2s ease-in' }}>
          <SD_Basketball />
        </div>

        {/* ── post-land: editorial reveal — translateY stagger ── */}
        <div className="absolute inset-0 z-40 px-6 lg:px-16 flex items-center"
          style={{ pointerEvents: landed ? 'auto' : 'none' }}>
          <div className="w-full max-w-[1280px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-16 items-center">

const SD_QuarterScroll = ({ scrollEl }) => {
  const sectionRef = useRef(null);
  const trackRef = useRef(null);
  const progressRef = useRef(null);
  const [active, setActive] = useState(0);
  const activeRef = useRef(0);
  const rafRef = useRef(null);

  useEffect(() => {
    if (!scrollEl) return;
    /* On mobile the QuarterScroll converts to a vertical panel stack via
       CSS (see media query). The scroll handler then has nothing to
       drive — bail out so we don't burn frames on no-op work. */
    const isMobile = () => window.matchMedia('(max-width: 767px)').matches;
    const onScroll = () => {
      if (rafRef.current) return;
      rafRef.current = requestAnimationFrame(() => {
        rafRef.current = null;
        if (isMobile()) return;
        const sec = sectionRef.current;
        if (!sec) return;
        const rect = sec.getBoundingClientRect();
        const scrollable = sec.offsetHeight - window.innerHeight;
        if (scrollable <= 0) return;
        const p = Math.max(0, Math.min(1, -rect.top / scrollable));
        /* Track + progress = pure DOM mutation, never a React re-render. */
        if (trackRef.current) trackRef.current.style.transform = `translate3d(-${p * 300}vw, 0, 0)`;
        if (progressRef.current) progressRef.current.style.width = `${p * 100}%`;
        const a = Math.max(0, Math.min(3, Math.round(p * 3)));
        /* Skip the React render when active hasn't actually flipped to a
           new panel. */
        if (a !== activeRef.current) {
          activeRef.current = a;
          setActive(a);
        }
      });
    };
    scrollEl.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => {
      scrollEl.removeEventListener('scroll', onScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [scrollEl]);

  return (
    /* 400vh (was 460vh): 100vh sticky phase + 300vh of scroll = 100vh
       per quarter transition. Tighter pacing.
       sd-q-scroll-section / sd-q-indicators / sd-q-header tags are the
       mobile-override hooks — phones convert this whole thing to a
       vertical stack of panels (no sticky horizontal track), which is
       drastically lighter than rendering 4 viewport-wide panels at once. */
    <section ref={sectionRef} className="sd-q-scroll-section relative" style={{ height: '400vh' }}>
      <div className="sticky top-0 h-screen overflow-hidden">
        <div ref={progressRef} className="absolute top-0 start-0 h-[3px] sd-progress-bar z-30" style={{ width: '0%' }} />
        <div className="sd-q-header absolute top-7 inset-x-0 text-center z-20 pointer-events-none">
          <div className="sd-mono text-[10px] tracking-[0.30em] uppercase sd-tx30 mb-0.5">Quarter by quarter</div>
          <div className="sd-serif italic sd-tx85" style={{ fontSize: 'clamp(1rem, 1.5vw, 1.25rem)' }}>how all 24 happened</div>
        </div>
        <div ref={trackRef} className="sd-q-track flex h-full"
          style={{ width: '400vw', transition: 'transform 55ms cubic-bezier(0,0,0.2,1)' }}>
          {SD_QUARTERS.map((q, i) => (
            <SD_QuarterPanel key={i} q={q} isActive={active === i} />
          ))}
        </div>
        <div className="sd-q-indicators absolute bottom-8 left-1/2 -translate-x-1/2 flex gap-7 z-30">
          {SD_QUARTERS.map((q, i) => (
            <div key={i} className="sd-mono text-[11px] tracking-[0.25em] uppercase transition-all duration-300"
              style={{
                color: i === active ? 'var(--sd-cream)' : 'var(--sd-cream-25)',
                transform: i === active ? 'scale(1.15)' : 'scale(1)',
              }}>{q.q}</div>
          ))}
        </div>
      </div>
    </section>
  );
};

const SD_ScoreBoard = ({ scrollEl }) => {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    if (!scrollEl) return;
    /* IntersectionObserver respects scrollable ancestors via its `root`
       option — we pass the overlay's scroll container so the threshold
       triggers when the section enters the overlay's viewport, not the
       document's. */
    /* threshold 0.05 (was 0.35) — fire as soon as the scoreboard slides
       even slightly into view. The 0.35 threshold meant the user had
       scrolled 35vh into a 100vh section before the score animated,
       which read as empty scroll. */
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) setVis(true); },
      { root: scrollEl, threshold: 0.05 }
    );
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [scrollEl]);
  return (
    <section ref={ref} className="relative flex flex-col items-center justify-center overflow-hidden py-24 lg:py-32"
      style={{ minHeight: '55vh', background: '#050810' }}>
      <div className="absolute inset-0 pointer-events-none" style={{

        opacity: vis ? 1 : 0, transition: 'opacity 0.8s cubic-bezier(0.16,1,0.3,1) 0.15s',
      }} />
      <div className="sd-mono text-[9.5px] tracking-[0.45em] uppercase sd-tx25 mb-10"
        style={{ opacity: vis ? 1 : 0, transition: 'opacity 0.5s cubic-bezier(0.16,1,0.3,1) 0.10s' }}>

        clipPath: vis ? 'inset(0 0 0% 0)' : 'inset(0 0 100% 0)',
        transform: vis ? 'translateY(0)' : 'translateY(36px)',
        transition: 'clip-path 0.85s cubic-bezier(0.16,1,0.3,1) 0.20s, transform 0.85s cubic-bezier(0.16,1,0.3,1) 0.20s',
      }}>

        }}>
          <span style={{ color: 'var(--sd-cream)' }}>{SD_GAME.scoreHome}</span>
          <span style={{ color: 'var(--sd-cream-30)', margin: '0 0.12em' }}>—</span>
          <span style={{ color: 'var(--sd-cream-45)' }}>{SD_GAME.scoreAway}</span>

      <div className="mt-12 flex items-center justify-center gap-6 sm:gap-10"

        <div className="flex items-center gap-3">
          <SD_TeamLogo team={SD_GAME.home} size={52} accent />
          <div className="sd-mono text-[10px] tracking-[0.30em] uppercase sd-tx85">{SD_GAME.home}</div>

/* ── StorytellingDropViewer ─────────────────────────────────────────
   Fullscreen scrollytelling overlay. Replaces the earlier 60/40 split
   viewer with the Tal Weiss editorial experience ported from
   prototype/storydrop-tal-weiss.html.
   - The overlay itself owns the scroll (overflow-y: auto on its
     absolute-inset child). Sticky sections inside sticky to the
     overlay, not to window.
   - AnchoredOpen / QuarterScroll / ScoreBoard / Closing all receive the
     scroll element as a prop so their scroll listeners and
     IntersectionObservers bind to the overlay's scroll, not the
     document's.
   - Close button is fixed top-end above all content.
   For the prototype, every story drop (sd1/sd2/sd3) renders the same
   Tal Weiss vs Northside story — per-drop data branching is a future
   enhancement. */
const StorytellingDropViewer = ({ storyId, onClose, onPickMoment }) => {
  const scrollRef = useRef(null);
  const [scrollEl, setScrollEl] = useState(null);
  const [badgeVisible, setBadgeVisible] = useState(true);
  const badgeRef = useRef(true);
  useEffect(() => {
    setScrollEl(scrollRef.current);
  }, []);
  /* Lock body scroll while the overlay is mounted. Stops iOS Safari from
     rubber-banding the underlying document and prevents the prototype's
     ambient live-amp / shine / ember animations from chewing CPU behind
     a fixed overlay the user can't see. Restore prior state on unmount. */
  useEffect(() => {
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = prevOverflow; };
  }, []);
  /* Badge fade — only setState when the boolean actually flips (not on
     every scroll tick). */
  useEffect(() => {
    if (!scrollEl) return;
    const onScroll = () => {
      const next = scrollEl.scrollTop < scrollEl.clientHeight * 0.85;
      if (next !== badgeRef.current) {
        badgeRef.current = next;
        setBadgeVisible(next);
      }
    };
    scrollEl.addEventListener('scroll', onScroll, { passive: true });
    return () => scrollEl.removeEventListener('scroll', onScroll);
  }, [scrollEl]);
  return (
    <div data-theme="dark" className="fixed inset-0 z-[100] sd-root anim-fade">
      {/* Plain overflow scroll — no transform, no `contain: paint`. Both
          previously broke `position: sticky` resolution inside the
          overlay (sticky children unstuck on first scroll, exposing the
          tall containing sections as 100-360vh of empty scroll). The
          isolation we still get from `fixed inset-0` on the parent is
          enough; aggressive containment was a premature optimization. */}
      <div ref={scrollRef} className="absolute inset-0 overflow-y-auto"
        style={{
          overflowX: 'clip',
          WebkitOverflowScrolling: 'touch',
        }}>
        <SD_Hero />
        <SD_Marquee />
        <SD_AnchoredOpen scrollEl={scrollEl} />
        <SD_QuarterScroll scrollEl={scrollEl} />
        <SD_ScoreBoard scrollEl={scrollEl} />
        <SD_Closing scrollEl={scrollEl} onPickMoment={onPickMoment} />
      </div>
      {/* SD_ScrollBadge removed per critique — corner brand mark was
          beautiful but invisible to most users. The bottom-center
          scroll prompt inside SD_Hero now carries the affordance
          alone, more prominently. */}
      <button onClick={onClose} aria-label="Close"
        className="fixed top-4 end-4 z-[110] w-10 h-10 lg-glass squircle-sm flex items-center justify-center text-white">
        <Icon name="close" size={12} stroke={1.8} />
      </button>
    </div>
  );
};

/* ── GameVideoViewer — HORIZONTAL viewer (16:9 content) ──────────
   Used by every entry point where the video is wide-camera game footage:
     - "Full game" tap on Watch (ended posters in the Full games rail)
     - "Game highlight" tap (TeamMomentsRail on Home)
     - "Watch full game" CTA from inside HighlightViewer

   Aspect ratio is 16:9 on BOTH phone and desktop (content drives the
   shape, not the device). On phone the video sits letterboxed in the
   middle of the portrait phone with info BELOW it. On desktop the video
   centers at max-w-[1200px] with info flowing below. Reuses the
   LivePlayerScreen control dock pattern (play/pause + scrubber + time
   + fullscreen) but adapts for VOD playback instead of live edge. */
const GameVideoViewer = ({ gameId, momentId, onClose }) => {
  const game = SEED_GAMES.find(g => g.id === gameId) || SEED_GAMES.find(g => g.status === 'just-ended') || SEED_GAMES[0];
  const [playing, setPlaying] = useState(true);
  const [secs, setSecs] = useState(0);
  /* Mocked VOD timeline — fake a 1h:30m game with a moving playhead.
     Real VOD would expose timeupdate from the video element. */
  const TOTAL = 90 * 60;
  useEffect(() => {
    if (!playing) return;
    const t = setInterval(() => setSecs(v => Math.min(TOTAL, v + 1)), 1000);
    return () => clearInterval(t);
  }, [playing]);
  const mm = Math.floor(secs / 60);
  const ss = secs % 60;
  const time = `${String(Math.floor(mm / 60)).padStart(2,'0')}:${String(mm % 60).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  const total = '01:30:00';
  const pct = (secs / TOTAL) * 100;
  if (!game) return null;

  /* Layout (May 2026 — critique pass after the prior centered version
     buried the H1 under the dock):
       ┌──────────────────────────────────────────────────┐
       │  game replay (tiny, demoted)                ✕    │  thin chrome (52px)
       ├──────────────────────────────────────────────────┤
       │      ┌────────────────────────────────┐          │
       │      │     16:9 video (with poster)    │          │
       │      └────────────────────────────────┘          │
       │      LIVE · 64-58 FINAL · YESTERDAY              │  eyebrow row
       │      Varsity vs Northside                        │  EDITORIAL H1
       │      Full game · 1h 30m                          │  meta
       │      Moments                                     │  rail header
       │      [thumb][thumb][thumb][thumb]...             │  EditorialDropThumb rail
       ├──────────────────────────────────────────────────┤
       │  ╭──────────────────────╮                        │  sticky dock pill
       │  │ ▶ ━━━●━━━━ 0:00:12/1:30:00 ⛶ │              │
       │  ╰──────────────────────╯                        │
       └──────────────────────────────────────────────────┘
     Three zones, no vertical centering — content stacks top-down with
     explicit padding. The middle zone scrolls so longer moment rails
     stay reachable; the dock stays pinned at the bottom of the viewport
     via shrink-0 outside the scroll container. Kills the prior issue
     where the H1 was rendering under the dock due to fragile flex math. */
  return (
    <div data-theme="dark" className="absolute inset-0 z-50 lg:fixed lg:z-[100] anim-fade flex flex-col text-white sf"
      style={{
        background:
          'radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,40,72,0.45) 0%, transparent 55%),' +
          'radial-gradient(ellipse 70% 50% at 50% 100%, rgba(132,88,255,0.18) 0%, transparent 60%),' +
          '#04060c',
      }}>
      {/* ── TOP CHROME ─────────────────────────────────────────────
          Demoted to a thin 52px bar. Wayfinding label is tiny + low
          opacity so it stops competing with the video / game identity.
          Back button removed (was redundant with the close X — both
          called onClose). Single close affordance now. */}
      <div className="shrink-0 relative z-30 flex items-center justify-between px-5 lg:px-8 xl:px-12 pt-4 pb-3">
        <span className="sf text-[9.5px] tracking-[0.24em] uppercase font-bold pointer-events-none"
          style={{ color: 'rgba(255,255,255,0.35)' }}>
          {game.status === 'live' ? 'Live game' : 'Game replay'}

        <button onClick={onClose} aria-label="Close"
          className="w-9 h-9 rounded-full flex items-center justify-center transition-all hover:scale-[1.04] active:scale-[0.95]"
          style={{
            background: 'rgba(255,255,255,0.08)',
            backdropFilter: 'blur(20px) saturate(180%)',
            WebkitBackdropFilter: 'blur(20px) saturate(180%)',
            border: '1px solid rgba(255,255,255,0.10)',
            boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.10)',
            color: 'rgba(255,255,255,0.95)',
          }}>
          <Icon name="close" size={11} stroke={2} />
        </button>
      </div>

      {/* ── SCROLLABLE CONTENT ─────────────────────────────────────

          bottom delivers on the "auto-clipped moments below" promise. */}
      <div className="flex-1 min-h-0 overflow-y-auto onb-scroll px-0 lg:px-10 xl:px-14 pt-2 lg:pt-4 pb-8">
        <div className="w-full lg:max-w-[1100px] mx-auto">
          {/* 16:9 video frame. The container now ships a baked-in
              radial-cyan + radial-purple poster gradient + Halo letter

          <div className="relative w-full overflow-hidden lg:squircle-md"

                      'inset 0 1px 0 rgba(255,255,255,0.32)',

                    <path d="M0 1.5v13c0 1 1.1 1.55 1.9 1.05l11-6.5c.8-.5.8-1.7 0-2.2l-11-6.5C1.1 -.05 0 .5 0 1.5z" />
                  </svg>
                </button>
              </div>
            )}
            {/* In-frame player dock removed per spec — the video is an
               ambient atmosphere loop, not a scrubbable VOD, so the
               pause + scrubber + fullscreen pill was offering controls
               that didn't match the underlying playback model. Tap on
               the video continues to be a no-op; close X in the top
               chrome remains the only chrome on this surface. */}
          </div>

          {/* ── EDITORIAL TITLE BLOCK ─────────────────────────────
              Sits directly below the video (no vertical centering).
              relative z-20 so it never gets covered by the dock at the
              z-30 layer (the dock is now outside the scroll container

          <div className="relative z-20 px-5 lg:px-0 pt-6 lg:pt-8">
            <div className="flex items-center gap-2 mb-3 flex-wrap">
              {game.status === 'live' && (

      </div>

      {/* Bottom dock used to live here, pinned outside the scroll

          {/* Tap-to-reveal CTA — only in locked */}
          {stage === 'locked' && (
            <button onClick={() => setStage('reveal')}

              style={{
                color: '#0a0d18',
                background: 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',

              }}>

      {/* === STAGE 3 — revealed moments grid ===
         Desktop-first rebuild: header strip with game context,
         title block with player attribution, hero + 5-sidekick grid
         that fills the canvas (no more 640px island), real posters,
         CTA row pinned at the bottom of the flow.
         Phone (< lg) collapses the same structure into a 2-col grid
         with the hero spanning the top row. */}
      {stage === 'reveal' && (() => {
        const homeTeam = teamByName(game.home);
        const awayTeam = teamByName(game.away);
        const homeWon = (game.scoreHome ?? 0) > (game.scoreAway ?? 0);
        const awayWon = (game.scoreAway ?? 0) > (game.scoreHome ?? 0);
        return (
        <>
          {/* Header strip — sticky inside the scroll container so the
             game context stays visible while the user scans the grid. */}
          <div className="sticky top-0 z-30 lg-header-fade px-5 lg:px-8 xl:px-12 pt-11 pb-4">
            <div className="lg:max-w-[1100px] lg:mx-auto flex items-center gap-3 min-w-0">
              <div className="flex items-center gap-2 min-w-0 flex-1">
                <TeamCrest team={homeTeam} size={22} />
                <span className="sf-display text-[14px] font-bold tracking-tight text-white truncate">{homeTeam.name}</span>
                <span className="sf-display text-[15px] font-bold tabular-nums ms-1"
                  style={{ color: homeWon ? '#fff' : 'rgba(255,255,255,0.55)' }}>{game.scoreHome}</span>
                <span className="sf text-[10px]" style={{ color: 'rgba(255,255,255,0.40)' }}>—</span>
                <span className="sf-display text-[15px] font-bold tabular-nums"
                  style={{ color: awayWon ? '#fff' : 'rgba(255,255,255,0.55)' }}>{game.scoreAway}</span>
                <TeamCrest team={awayTeam} size={22} />
                <span className="sf-display text-[14px] font-bold tracking-tight text-white truncate">{awayTeam.name}</span>
                {game.when && (
                  <span className="sf text-[10.5px] tracking-[0.14em] uppercase font-semibold ms-3 shrink-0 hidden lg:inline"
                    style={{ color: 'rgba(255,255,255,0.50)' }}>· {game.when}</span>
                )}
              </div>
              <button onClick={onClose} aria-label="Close"
                className="w-9 h-9 lg-glass squircle-sm flex items-center justify-center text-white shrink-0">
                <Icon name="close" size={12} stroke={1.8} />
              </button>
            </div>
          </div>

          {/* Title block — drop ceremony reveal text + player attribution. */}
          <div className="anim-scale-in px-5 lg:px-8 xl:px-12 pt-2 lg:pt-4 pb-6 text-center">
            <div className="lg:max-w-[1100px] lg:mx-auto">
              <div className="sf text-[10.5px] tracking-[0.20em] uppercase font-bold mb-3"

            </div>

          {/* Hero + sidekick grid.
             Desktop (lg): 4-col grid, first moment spans 2×2 as hero.
             Phone: 3-col with hero spanning 2 cols of row 1.
             auto-rows-fr keeps every cell the same height so the hero's
             2-row span stays in proportion. */}
          <div className="px-5 lg:px-8 xl:px-12 pb-6">
            <div className="lg:max-w-[1100px] lg:mx-auto grid gap-2.5 grid-cols-3 lg:grid-cols-4 auto-rows-fr">
              {moments.map((m, i) => {

                return (
                  <button key={m.id} onClick={() => onPickMoment(SEED_MOMENTS.indexOf(m))}

/* ── PersonaCard ──────────────────────────────────────────────────
   Single row in the persona picker. Direct port of DS
   screens/onboarding/PersonaCard.tsx. Variants:
     - featured  — cyan halo + cyan border + cyan icon (the recommended pick)
     - selected  — cyan ring, slightly stronger glow (current choice)
     - disabled  — non-interactive, dimmed (coach in this build)
     - default   — plain glass card */
const PERSONA_ICON_PATHS = {
  player: 'M10 9 a3 3 0 1 0 0 -6 a3 3 0 1 0 0 6 Z M3 17 c0 -3.5 3 -6 7 -6 s7 2.5 7 6',
  parent: 'M5 8 a3 3 0 1 0 0 -6 a3 3 0 1 0 0 6 Z M15 8 a3 3 0 1 0 0 -6 a3 3 0 1 0 0 6 Z M2 17 c0 -3 2 -5 5 -5 M13 12 c3 0 5 2 5 5 M10 17 c-1.5 0 -2.5 -1 -2.5 -2.5 s1 -2.5 2.5 -2.5 s2.5 1 2.5 2.5 S 11.5 17 10 17 Z',
  fan:    'M10 2 L12.6 7.4 L18.5 8.3 L14.2 12.4 L15.3 18.3 L10 15.5 L4.7 18.3 L5.8 12.4 L1.5 8.3 L7.4 7.4 Z',
  coach:  'M2 4 h16 v9 h-7 l-2 3 -2 -3 H2 Z M5 7.5 h10 M5 10.5 h6',
};

const PersonaCard = ({ kind, title, sub, featured, selected, disabled, onClick }) => {
  const tone = disabled ? 'disabled' : selected ? 'selected' : featured ? 'featured' : 'default';
  const cardStyle =
    tone === 'featured' ? {
      background:
        'radial-gradient(ellipse 65% 60% at 25% 30%, rgba(0,214,254,0.22) 0%, transparent 60%),' +
        'radial-gradient(ellipse 70% 60% at 80% 70%, rgba(132,88,255,0.16) 0%, transparent 60%),' +
        'var(--glass-card-bg)',
      backdropFilter: 'blur(36px) saturate(180%)',
      WebkitBackdropFilter: 'blur(36px) saturate(180%)',
      border: '1px solid rgba(0,214,254,0.35)',
      boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.14), 0 12px 40px -12px rgba(0,214,254,0.30)',
    }
    : tone === 'selected' ? {
      background:
        'radial-gradient(ellipse 60% 60% at 30% 35%, rgba(0,214,254,0.16) 0%, transparent 65%),' +
        'var(--glass-card-bg)',
      backdropFilter: 'blur(36px) saturate(180%)',
      WebkitBackdropFilter: 'blur(36px) saturate(180%)',
      border: '1.5px solid var(--brand-cyan)',
      boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), 0 0 0 4px rgba(0,214,254,0.12), 0 8px 24px -10px rgba(0,214,254,0.40)',
    }
    : tone === 'disabled' ? {
      background: 'var(--glass-card-bg)',
      backdropFilter: 'blur(36px) saturate(180%)',
      WebkitBackdropFilter: 'blur(36px) saturate(180%)',
      border: '1px solid var(--glass-card-border)',
      boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top)',
      opacity: 0.45,
    }
    : {
      background: 'var(--glass-card-bg)',
      backdropFilter: 'blur(36px) saturate(180%)',
      WebkitBackdropFilter: 'blur(36px) saturate(180%)',
      border: '1px solid var(--glass-card-border)',
      boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
    };
  const iconWellStyle =
    (tone === 'featured' || tone === 'selected')
      ? { width: 48, height: 48, background: 'rgba(0,214,254,0.15)', border: '1px solid rgba(0,214,254,0.45)', color: 'var(--brand-cyan-text)' }
      : { width: 48, height: 48, background: 'var(--hatch-grain)', border: '1px solid var(--glass-card-border)', color: 'var(--text-secondary)' };
  /* Mobile: horizontal row — icon left, text middle, chevron end.
     Desktop (lg+): vertical card — icon top, title + sub below, no
     chevron (the grid context makes the trailing chevron feel redundant,
     and removing it gives the card a tighter SaaS-role-picker shape).
     `lg:flex-col lg:items-start lg:gap-3 lg:p-5 lg:h-full` lays out the
     desktop variant; the chevron has `lg:hidden`. */
  return (
    <button onClick={disabled ? undefined : onClick} disabled={disabled} aria-pressed={selected} aria-label={title}
      className={`w-full text-start squircle-md p-4 lg:p-5 flex items-center gap-3.5 lg:flex-col lg:items-start lg:gap-3 lg:h-full relative overflow-hidden${disabled ? '' : ' lg-aura lg-shine'}`}
      style={cardStyle}>
      <div className="squircle-sm flex items-center justify-center shrink-0" style={iconWellStyle}>
        <svg width={22} height={22} viewBox="0 0 20 20" fill="none" stroke="currentColor"
          strokeWidth={tone === 'featured' || tone === 'selected' ? 2 : 1.6} strokeLinecap="round" strokeLinejoin="round"
          style={{ width: 22, height: 22, display: 'block' }}>
          <path d={PERSONA_ICON_PATHS[kind]} />

      </div>
      <div className="flex-1 min-w-0 lg:flex-initial">
        <div className="sf-display text-[16px] font-bold text-white leading-tight tracking-[-0.01em]">{title}</div>
        <div className="sf text-[12px] text-white/60 mt-0.5">{sub}</div>
      </div>
      {!disabled && !selected && (
        <svg width={16} height={16} viewBox="0 0 14 14" fill="none" stroke="currentColor"
          strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"
          className="icon-flip-rtl lg:hidden"
          style={{ width: 16, height: 16, display: 'block', color: tone === 'featured' ? 'var(--brand-cyan-text)' : 'rgba(255,255,255,0.40)' }}>
          <path d="M5.5 2.5 L10 7 L5.5 11.5" />
        </svg>
      )}
      {selected && (
        <svg width={18} height={18} viewBox="0 0 16 16" fill="none" stroke="currentColor"
          strokeWidth={2.2} strokeLinecap="round" strokeLinejoin="round"
          className="lg:absolute lg:top-3 lg:end-3"
          style={{ width: 18, height: 18, display: 'block', color: 'var(--brand-cyan-text)' }}>
          <path d="M3 8.5 L6.5 12 L13 4.5" />
        </svg>
      )}

};
