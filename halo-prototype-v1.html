        <div onClick={(e) => e.stopPropagation()}
          className="w-full lg:max-w-[420px] anim-slide-sheet"
          style={{
            background: 'linear-gradient(180deg, #0e1118 0%, #06080e 100%)',
            border: '1px solid rgba(255,255,255,0.10)',
            borderRadius: '20px 20px 0 0',
            maxHeight: '80vh',
            display: 'flex', flexDirection: 'column',
          }}>
          <div className="px-5 pt-5 pb-3 flex items-center justify-between">
            <div className="sf-display text-[16px] font-bold text-white">Tag a player</div>
            <button onClick={() => setPickerForId(null)} aria-label="Close"
              className="w-8 h-8 rounded-full flex items-center justify-center"
              style={{ background: 'rgba(255,255,255,0.08)', color: '#fff' }}>
              <Icon name="close" size={10} stroke={2} />
            </button>
          </div>
          <div className="flex-1 overflow-y-auto px-3 pb-4">
            {/* Skip — set to null */}
            <button onClick={() => { onUpdatePending(pickerForId, { taggedPlayerId: null }); setPickerForId(null); }}
              className="w-full squircle-sm p-3 mb-2 flex items-center gap-3 text-start"
              style={{
                background: pickedFor && !pickedFor.taggedPlayerId ? 'rgba(255,255,255,0.10)' : 'transparent',
                border: '1px solid rgba(255,255,255,0.10)',
              }}>
              <div className="w-9 h-9 squircle-sm flex items-center justify-center shrink-0"
                style={{ background: 'rgba(255,255,255,0.05)', color: 'rgba(255,255,255,0.55)' }}>
                <Icon name="close" size={12} stroke={1.8} />
              </div>
              <span className="sf text-[13px] font-semibold text-white">No tag — just the moment</span>
            </button>
            {ROSTER.map(p => {
              const selected = pickedFor && pickedFor.taggedPlayerId === p.id;
              return (
                <button key={p.id} onClick={() => { onUpdatePending(pickerForId, { taggedPlayerId: p.id }); setPickerForId(null); }}
                  className="w-full squircle-sm p-3 mb-2 flex items-center gap-3 text-start transition-all"
                  style={{
                    background: selected ? 'rgba(0,214,254,0.12)' : 'transparent',
                    border: '1px solid ' + (selected ? 'rgba(0,214,254,0.45)' : 'rgba(255,255,255,0.08)'),
                  }}>
                  <div className="w-9 h-9 squircle-sm flex items-center justify-center shrink-0 sf-display text-[12px] font-bold text-white"
                    style={{ background: 'rgba(0,214,254,0.18)', border: '1px solid rgba(0,214,254,0.40)' }}>
                    {p.number}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="sf-display text-[13.5px] font-bold leading-tight text-white">{p.name}</div>
                    <div className="sf text-[10.5px] mt-0.5" style={{ color: 'rgba(255,255,255,0.55)' }}>#{p.number} · {p.team}</div>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    )}
    </>
  );
};

/* CaptureFlow — orchestrator. Reads `step` to decide which sub-screen
   to render. Manages pending captures via captureSession. Routes step
   transitions via hash + setCaptureSession side effects. */
const CaptureFlow = ({ step, captureSession, setCaptureSession, addCaptures, onClose, navigate }) => {
  if (!step) return null;
  if (step === 'permissions') {
    return <CapturePermissionsStep
      onClose={onClose}
      onContinue={() => navigate('capture/pick-game')} />;
  }
  if (step === 'pick-game') {
    return <CapturePickGameStep
      onClose={onClose}
      onBack={() => navigate('capture')}
      onPick={(id) => { setCaptureSession({ gameId: id, pending: [] }); navigate('capture/camera'); }} />;
  }
  if (step === 'camera') {
    return <CaptureCameraStep
      pending={captureSession.pending || []}
      onCapture={(cap) => setCaptureSession(s => ({ ...s, pending: [...(s.pending || []), cap] }))}
      onDone={() => navigate('capture/review')}
      onBack={() => navigate('capture/pick-game')}
      onClose={onClose} />;
  }
  if (step === 'review') {
    return <CaptureReviewStep
      pending={captureSession.pending || []}
      gameId={captureSession.gameId}
      onClose={onClose}
      onBack={() => navigate('capture/camera')}
      onUpdatePending={(id, patch) => setCaptureSession(s => ({
        ...s, pending: s.pending.map(p => p.id === id ? { ...p, ...patch } : p),
      }))}
      onDeleteLocal={(id) => setCaptureSession(s => ({
        ...s, pending: s.pending.filter(p => p.id !== id),
      }))}
      onPublish={() => {
        const finalized = (captureSession.pending || []).map(p => ({
          ...p,
          gameId: captureSession.gameId,
          privacy: p.privacy || 'private',
          taggedPlayerId: p.taggedPlayerId || null,
          tagApprovalStatus: p.taggedPlayerId ? 'pending' : null,
          capturedBy: 'You',
          capturedAt: Date.now(),
        }));
        addCaptures(finalized);
        setCaptureSession({ gameId: null, pending: [] });
        /* Land on Profile (not Home) so the user immediately sees their
           new captures in the "My captures" rail. The Bell badge surfaces
           any pending tag-approval cards for review. */
        navigate('profile');
      }} />;
  }
  return null;
};

const NotificationsSheet = ({ onClose, onOpenGame, captures = [], onApproveTag, onDeclineTag }) => {
  /* Build dynamic tag-approval notif items from `captures` that are
     tagged for the current user (r1 = self) and still pending consent.
     Each rendered as an inline Approve/Decline card. */
  const pendingTagApprovals = (captures || []).filter(c =>
    c.taggedPlayerId === 'r1' && c.tagApprovalStatus === 'pending'
  );
  const [items, setItems] = useState([
    { id: 'n1', kind: 'live',   title: 'Varsity is LIVE',          body: 'Q2 · vs Westfield',               when: 'now',    cta: () => onOpenGame('gL') },
    { id: 'n2', kind: 'drop',   title: 'New drop ready',           body: '8 of your moments from last night', when: '12m ago', cta: () => onOpenGame('gE') },
    { id: 'n3', kind: 'follow', title: 'Sarah Kim followed you',   body: '#12 PG · Varsity',                 when: '1h ago' },
    { id: 'n4', kind: 'system', title: 'Your story dropped',       body: '"You\'re 14% sharper in 4Q"',       when: '3h ago' },
  ]);
  const KIND = {
    live:   { dot: 'var(--state-live)',     icon: 'play',  label: 'LIVE' },
    drop:   { dot: 'var(--brand-cyan)',     icon: 'flame', label: 'DROP' },
    follow: { dot: '#8458ff',                icon: 'heart', label: 'FOLLOW' },
    system: { dot: 'var(--text-faint)',      icon: 'bell',  label: 'HALO' },
    capture:{ dot: '#ff7575',                icon: 'camera',label: 'FAN TAG' },
  };
  return (
    <div className="absolute inset-0 z-50 anim-fade" onClick={onClose}>
      <div className="absolute inset-0 bg-black/55" />
      <div className="absolute top-0 inset-x-0 anim-slide-sheet" style={{ transform: 'translateY(0)', background: 'var(--menu-surface)', backdropFilter: 'blur(48px) saturate(180%)', WebkitBackdropFilter: 'blur(48px) saturate(180%)', borderBottomLeftRadius: 28, borderBottomRightRadius: 28, paddingBottom: 18, borderBottom: '1px solid var(--hairline)' }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 pt-12 pb-3">
          <div className="sf-display text-[18px] font-bold" style={{ color: 'var(--text-primary)' }}>Notifications</div>
          <div className="flex items-center gap-2">
            <button onClick={() => setItems([])} className="sf text-[12px] font-semibold" style={{ color: 'var(--text-tertiary)' }}>Clear all</button>
            <button onClick={onClose} className="w-8 h-8 lg-glass squircle-sm flex items-center justify-center" style={{ color: 'var(--text-secondary)' }}><Icon name="close" size={14} /></button>
          </div>
        </div>
        <div className="px-3 max-h-[60vh] overflow-y-auto no-scrollbar">
          {/* Tag-approval cards — render ABOVE regular notifs since they
              require user action. Approve flips tagApprovalStatus to
              'approved' which surfaces the capture on rails. Decline
              flips to 'declined' which keeps it hidden from the player's
              fan-captures rail. */}
          {pendingTagApprovals.map(cap => {
            const k = KIND.capture;
            return (
              <div key={cap.id} className="flex items-start gap-3 px-3 py-3 squircle-sm anim-fade"
                style={{
                  background: 'rgba(255,117,117,0.08)',
                  border: '1px solid rgba(255,117,117,0.25)',
                  marginBottom: 8,
                }}>
                <div className="w-12 h-16 squircle-sm shrink-0 relative overflow-hidden"
                  style={{
                    background: `radial-gradient(ellipse 70% 50% at 30% 30%, ${cap.hue.a} 0%, transparent 60%), radial-gradient(ellipse 70% 50% at 75% 75%, ${cap.hue.b} 0%, transparent 60%), #0a0e1a`,
                  }}>
                  <div className="absolute inset-0 hatch-dark opacity-30" />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-0.5">
                    <span className="sf text-[9px] font-bold tracking-[0.15em]" style={{ color: k.dot }}>{k.label}</span>
                    <span className="sf text-[10px]" style={{ color: 'var(--text-faint)' }}>just now</span>
                  </div>
                  <div className="sf text-[13.5px] font-semibold leading-tight mb-0.5" style={{ color: 'var(--text-primary)' }}>
                    {cap.capturedBy || 'A fan'} tagged you
                  </div>
                  <div className="sf text-[11.5px] mb-2" style={{ color: 'var(--text-tertiary)' }}>
                    "{cap.caption || 'From the stands'}" · {cap.kind === 'photo' ? 'photo' : 'video'}
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => onApproveTag && onApproveTag(cap.id)}
                      className="squircle-sm px-3 py-1.5 sf text-[11px] font-bold"
                      style={{
                        background: 'var(--brand-cyan)',
                        color: '#0a0d18',
                        boxShadow: '0 2px 8px -2px rgba(0,214,254,0.55)',
                      }}>
                      Approve
                    </button>
                    <button onClick={() => onDeclineTag && onDeclineTag(cap.id)}
                      className="squircle-sm px-3 py-1.5 sf text-[11px] font-bold lg-glass"
                      style={{ color: 'var(--text-primary)' }}>
                      Decline
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
          {items.length === 0 && pendingTagApprovals.length === 0 ? (
            <div className="sf text-center py-12" style={{ color: 'var(--text-faint)' }}>You're all caught up.</div>
          ) : items.map(n => {
            const k = KIND[n.kind] || KIND.system;
            return (
              <button key={n.id} onClick={() => { n.cta && n.cta(); onClose(); }} className="w-full flex items-start gap-3 px-3 py-3 squircle-sm hover:bg-white/5 text-start anim-fade">
                <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: 'var(--glass-card-bg)', border: '1px solid var(--glass-card-border)', color: k.dot }}>
                  <Icon name={k.icon} size={14} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-0.5">
                    <span className="sf text-[9px] font-bold tracking-[0.15em]" style={{ color: k.dot }}>{k.label}</span>
                    <span className="sf text-[10px]" style={{ color: 'var(--text-faint)' }}>{n.when}</span>
                  </div>
                  <div className="sf text-[13.5px] font-semibold leading-tight mb-0.5" style={{ color: 'var(--text-primary)' }}>{n.title}</div>
                  <div className="sf text-[11.5px]" style={{ color: 'var(--text-tertiary)' }}>{n.body}</div>
                </div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
