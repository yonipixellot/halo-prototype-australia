/* ── SettingsModal ────────────────────────────────────────────────
   Desktop-only centered modal that wraps the SAME Menu*Page components
   the phone drawer uses. Replaces the right-side phone-style drawer on
   desktop (per design critique May 2026: 340px slide-out looked like a
   misapplied mobile pattern on a 1920px canvas).

   Structure:
     • Backdrop — full-viewport dim + light blur
     • Centered card — 92vw capped at 940px, 86vh capped at 640px
     • Header bar — "Settings" title + X close
     • 2-column body:
         - Left rail (240px): compact identity + verify banner +
           grouped nav items + inline theme toggle + sign out
         - Right column: the active Menu*Page renders here, with its
           MenuPageHeader degrading to a chrome-less title (onBack
           undefined for top-level pages — the left rail IS the back)

   Internal page state mirrors the phone drawer; clicking left rail
   items swaps the right column. Default page: 'account' so the modal
   has content the moment it opens (the empty-rail state would look
   broken). ESC and backdrop click both close. */
const SettingsModal = ({ onClose, theme, onTheme, onSignOut, locale, setLocale, emailVerified, onVerifyEmail }) => {
  const [page, setPage] = useState('account');

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  /* Active rail item — collapses nested sub-pages back to their parent
     so the left rail's highlight stays anchored on the section the user
     is conceptually inside. e.g. opening Change password while on
     Account keeps "Account & profile" lit in the rail. */
  const railActive = (() => {
    if (page === 'change-password' || page === 'delete-account') return 'account';
    if (page && page.startsWith('info-')) return 'info';
    return page;
  })();

  /* Sub-page navigation handlers for nested screens. Top-level pages
     get onBack=undefined → MenuPageHeader hides the chevron, the title
     reads as a section heading. */
  const goAccount = () => setPage('account');

  const RailItem = ({ k, icon, label, trailing, onClick }) => {
    const isActive = railActive === k;
    return (
      <button onClick={onClick || (() => setPage(k))}
        className="w-full flex items-center gap-3 px-3 py-2.5 squircle-sm transition-colors text-start"
        style={{
          background: isActive ? 'rgba(0,214,254,0.10)' : 'transparent',
          border: isActive ? '1px solid rgba(0,214,254,0.32)' : '1px solid transparent',
          color: isActive ? 'var(--text-primary)' : 'var(--text-secondary)',
          marginBlockEnd: 2,
        }}>
        <span className="w-7 h-7 squircle-sm flex items-center justify-center shrink-0"
          style={{
            background: isActive ? 'var(--brand-cyan-soft)' : 'var(--hatch-grain)',
            border: '1px solid ' + (isActive ? 'var(--brand-cyan-border)' : 'var(--hairline)'),
            color: isActive ? 'var(--brand-cyan-text)' : 'var(--text-secondary)',
          }}>
          <Icon name={icon} size={13} stroke={1.7} />
        </span>
        <span className="sf text-[13px] font-semibold flex-1 truncate">{label}</span>
        {trailing && (
          <span className="sf text-[11px]" style={{ color: 'var(--text-tertiary)' }}>{trailing}</span>
        )}
      </button>
    );
  };

  const RailSectionHead = ({ children }) => (
    <div className="px-3 pt-3 pb-1 sf text-[9.5px] tracking-[0.18em] uppercase font-bold"
      style={{ color: 'var(--text-muted)' }}>
      {children}
    </div>
  );

  return (
    <div className="absolute inset-0 z-[60] anim-fade flex items-center justify-center px-6">
      {/* Backdrop — flat dim + slight blur so the canvas behind dies out */}
      <button onClick={onClose} aria-label="Close settings"
        className="absolute inset-0"
        style={{
          background: 'rgba(0,0,0,0.62)',
          backdropFilter: 'blur(8px) saturate(120%)',
          WebkitBackdropFilter: 'blur(8px) saturate(120%)',
        }} />

      {/* Modal card — opaque dark surface, cyan hairline border, soft shadow */}
      <div className="relative anim-scale-in flex flex-col overflow-hidden"
        style={{
          width: 'min(92vw, 940px)',
          height: 'min(86vh, 640px)',
          background: 'linear-gradient(180deg, var(--canvas-bg-soft) 0%, var(--canvas-bg) 60%, var(--canvas-bg) 100%)',
          border: '1px solid rgba(0,214,254,0.28)',
          borderRadius: 20,
          boxShadow: '0 24px 80px -16px rgba(0,0,0,0.70), 0 0 0 1px rgba(255,255,255,0.04)',
        }}>
        {/* Header bar — "Settings" title + close */}
        <div className="shrink-0 px-5 py-4 flex items-center justify-between"
          style={{ borderBottom: '1px solid var(--glass-strong-border)' }}>
          <span className="sf-display text-[18px] font-bold tracking-[-0.015em]"
            style={{ color: 'var(--text-primary)' }}>
            Settings
          </span>
          <button onClick={onClose} aria-label="Close"
            className="w-9 h-9 lg-glass squircle-sm flex items-center justify-center"
            style={{ color: 'var(--text-primary)' }}>
            <Icon name="close" size={12} stroke={1.8} />
          </button>
        </div>

        {/* 2-column body */}
        <div className="flex-1 min-h-0 flex">
          {/* Left rail — identity + verify + nav + theme + sign out */}
          <div className="shrink-0 flex flex-col overflow-y-auto"
            style={{
              width: 248,
              borderInlineEnd: '1px solid var(--glass-strong-border)',
              background: 'rgba(255,255,255,0.015)',
            }}>
            {/* Compact identity row */}
            <div className="px-3 pt-3 pb-2 shrink-0">
              <div className="squircle-sm p-2.5 flex items-center gap-2.5"
                style={{
                  background: 'var(--glass-card-bg)',
                  backdropFilter: 'blur(36px) saturate(180%)',
                  WebkitBackdropFilter: 'blur(36px) saturate(180%)',
                  border: '1px solid var(--glass-card-border)',
                }}>
                <div className="relative w-9 h-9 rounded-full shrink-0"
                  style={{
                    background: 'conic-gradient(from 220deg, #00D6FE, #8458FF, #FF5A9E, #00D6FE)',
                    padding: 2,
                  }}>
                  <div className="w-full h-full rounded-full lg-glass-strong flex items-center justify-center sf-display font-bold text-[11px]"
                    style={{ color: 'var(--text-primary)' }}>
                    {PLAYER.initials}
                  </div>
                </div>
                <div className="flex-1 min-w-0">
                  <div className="sf-display text-[12.5px] font-bold leading-tight truncate"
                    style={{ color: 'var(--text-primary)' }}>
                    {PLAYER.name}
                  </div>
                  <div className="sf text-[10px] mt-0.5 truncate" style={{ color: 'var(--text-tertiary)' }}>
                    Player
                  </div>
                </div>
              </div>
            </div>

            {/* Verify banner — same as drawer, narrower */}
            {!emailVerified && (
              <div className="px-3 pb-2 shrink-0">
                <div className="squircle-sm p-2.5"
                  style={{ background: 'var(--brand-cyan-soft)', border: '1px solid var(--brand-cyan-border)' }}>
                  <div className="sf text-[10.5px] font-bold leading-tight" style={{ color: 'var(--brand-cyan-text)' }}>
                    Verify your email
                  </div>
                  <button onClick={onVerifyEmail}
                    className="sf text-[10.5px] font-semibold underline mt-1"
                    style={{ color: 'var(--brand-cyan-text)' }}>
                    Resend link
                  </button>
                </div>
              </div>
            )}

            {/* Nav groups */}
            <nav className="flex-1 px-2 pb-2">
              <RailSectionHead>Account</RailSectionHead>
              <RailItem k="account"          icon="profile"    label="Account & profile" />
              <RailItem k="notifications"    icon="bell"       label="Notifications" />
              <RailItem k="manage-following" icon="heart"      label="Manage following" />

              <RailSectionHead>Plan</RailSectionHead>
              <RailItem k="subscription"     icon="card"       label="Subscription & billing" />
              <RailItem k="permissions"      icon="shield"     label="Privacy & permissions" />

              <RailSectionHead>App</RailSectionHead>
              <RailItem k="language"         icon="languages"  label="Language"
                trailing={locale === 'he' ? 'עברית' : 'English'} />
              <RailItem k="theme"            icon={theme === 'dark' ? 'sun' : 'moon'}
                label={theme === 'dark' ? 'Light mode' : 'Dark mode'}
                onClick={onTheme} />
              <RailItem k="info"             icon="info"       label="Help & about"
                onClick={() => setPage('info-about')} />

              {/* Sign out — destructive, separated */}
              <div className="mt-2 mb-1 mx-2 border-t" style={{ borderColor: 'var(--hairline)' }} />
              <button onClick={() => { onClose(); onSignOut && onSignOut(); }}
                className="w-full flex items-center gap-3 px-3 py-2.5 squircle-sm transition-colors text-start"
                style={{ color: '#fca5a5', marginBlockEnd: 2 }}>
                <span className="w-7 h-7 squircle-sm flex items-center justify-center shrink-0"
                  style={{
                    background: 'rgba(220,38,38,0.12)',
                    border: '1px solid rgba(220,38,38,0.32)',
                    color: '#fca5a5',
                  }}>
                  <Icon name="logout" size={13} stroke={1.7} />
                </span>
                <span className="sf text-[13px] font-semibold flex-1">Sign out</span>
              </button>
            </nav>
          </div>

          {/* Right column — active page renders here. Same Menu*Page
              components the phone drawer uses; we just pass onBack=undefined
              for top-level pages so MenuPageHeader drops its chevron. */}
          <div className="flex-1 min-h-0 flex flex-col relative">
            {page === 'account' && (
              <MenuAccountPage onBack={undefined} onSubPage={setPage} />
            )}
            {page === 'change-password' && (
              <MenuChangePasswordPage onBack={goAccount} />
            )}
            {page === 'delete-account' && (
              <MenuDeleteAccountPage onBack={goAccount}
                onSignOut={() => { onClose(); onSignOut && onSignOut(); }} />
            )}
            {page === 'notifications' && (
              <MenuNotificationsPage onBack={undefined} />
            )}
            {page === 'manage-following' && (
              <MenuManageFollowingPage onBack={undefined} />
            )}
            {page === 'subscription' && (
              <MenuSubscriptionPage onBack={undefined} />
            )}
            {page === 'permissions' && (
              <MenuPermissionsPage onBack={undefined} onSubPage={setPage} />
            )}
            {page === 'language' && (
              <MenuLanguagePage locale={locale} setLocale={setLocale} onBack={undefined} />
            )}
            {page && page.startsWith('info-') && (
              <MenuInfoPage infoId={page.slice(5)}
                onBack={undefined}
                onNavigate={(otherId) => setPage('info-' + otherId)} />
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

    {[{ key: 'signin', label: 'Sign In' }, { key: 'signup', label: 'Sign Up' }].map(t => {
      const active = mode === t.key;
      return (
        <button key={t.key} onClick={() => onChange(t.key)}
          className={`flex-1 py-2.5 sf text-[12.5px] font-semibold tracking-tight squircle-sm transition-all ${active ? '' : 'opacity-65'}`}
          style={active
            ? { background: 'var(--auth-tab-active-bg)', color: 'var(--auth-tab-active-text)', border: '1px solid var(--auth-tab-active-bg)', boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.10), 0 2px 8px -2px rgba(0,0,0,0.18)' }
            : { border: '1px solid transparent', color: 'var(--text-muted)' }
          }>
          {t.label}
        </button>
      );
    })}
  </div>
);

/* GlassField — token-driven input with focus ring + error ring */
const GlassField = ({ label, type = 'text', value, onChange, placeholder, autoFocus, rightSlot, hint, error }) => {
  const [focused, setFocused] = useState(false);
  const showError = !!error && !focused && !!value;
  return (
    <div>
      <label className="sf text-[10px] tracking-[0.16em] uppercase font-semibold mb-2 block px-1" style={{ color: 'var(--text-muted)' }}>{label}</label>
      <div className="lg-glass-card squircle-md px-3.5 py-3 flex items-center gap-2"
        style={showError
          ? { boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.14), 0 0 0 2px rgba(220,38,38,0.55), 0 12px 40px -12px rgba(0,0,0,0.55)', borderColor: 'rgba(220,38,38,0.65)' }
          : focused
          ? { boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.14), 0 0 0 2px rgba(0,214,254,0.45), 0 12px 40px -12px rgba(0,0,0,0.55)', borderColor: 'rgba(0,214,254,0.55)' }
          : undefined}>
        <input type={type} value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} autoFocus={autoFocus}
          onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} className="auth-input sf text-[15px] flex-1" />
        {rightSlot}
      </div>
      {(hint || showError) && (
        <div className="sf text-[10.5px] mt-1.5 px-1 leading-snug" style={{ color: showError ? '#FCA5A5' : 'var(--text-faint)' }}>
          {showError ? error : hint}
        </div>
      )}
    </div>
  );
};

/* SignIn / SignUp form body — single component, owns mode state.

   Two callbacks:
     onSubmit  → fired in Sign-In mode (existing user, lands on Home).
     onSignUp  → fired in Sign-Up mode (new user — enters onboarding instead
                 of going straight to Home). Required so we can wire the
                 fan / parent / player persona-pick flow after sign up.
   Apple / Google / form Continue all branch on `mode`. */
const SignInForm = ({ onSubmit, onSignUp }) => {
  const [mode, setMode] = useState('signin');
  /* Pre-fill with the Tal Weiss demo persona so BOTH tabs (Sign In and
     Sign Up) are one-tap-Continue. Password satisfies the stricter
     sign-up rules (≥8 chars, 1 uppercase, 1 digit). confirmPw matches
     so the validator passes when the user flips into Sign Up mode. */
  const [email, setEmail] = useState('tal@halo.tv');
  const [password, setPassword] = useState('Halohalo1');
  const [name, setName] = useState('Tal Weiss');
  const [confirmPw, setConfirmPw] = useState('Halohalo1');
  const [showPw, setShowPw] = useState(false);
  const isSignUp = mode === 'signup';
  const valid = isSignUp
    ? name.length > 1 && email.includes('@') && password.length >= 8 && /[A-Z]/.test(password) && /[0-9]/.test(password) && password === confirmPw
    : email.includes('@') && password.length >= 4;
  /* In sign-up mode every primary CTA routes the user into the
     onboarding flow. Falls back to onSubmit if onSignUp wasn't passed
     (legacy callers — e.g. the PlayerOnboarding signin-step embedding). */
  const handlePrimary = () => (isSignUp ? (onSignUp || onSubmit)() : onSubmit());
  return (
    <div className="px-6 pt-6 lg:px-0 lg:pt-4 anim-fade">
      <AuthModeToggle mode={mode} onChange={setMode} />
      {isSignUp && (
        <div className="mb-4">
          <div className="inline-flex items-center gap-1.5 mb-3 px-2.5 py-1 squircle-sm" style={{ background: 'var(--brand-cyan-soft)', border: '1px solid var(--brand-cyan-border)' }}>
            <span className="sf text-[9.5px] tracking-[0.18em] uppercase font-bold" style={{ color: 'var(--brand-cyan-text)' }}>Step 1 of 3</span>
            <span className="sf text-[9.5px]" style={{ color: 'rgba(0,214,254,0.55)' }}>·</span>
            <span className="sf text-[9.5px] tracking-[0.16em] uppercase font-semibold" style={{ color: 'var(--brand-cyan-text)' }}>Account details</span>
          </div>
          <p className="sf text-[12.5px] leading-relaxed" style={{ color: 'var(--text-muted)' }}>Personalisation comes next.</p>
        </div>
      )}
      <div className="space-y-3">
        {isSignUp && (
          <GlassField label="Display name" value={name} onChange={setName} placeholder="Tal Weiss" autoFocus />
        )}
        <GlassField label="Email" type="email" value={email} onChange={setEmail} placeholder="you@school.com" autoFocus={!isSignUp} />
        <GlassField label="Password" type={showPw ? 'text' : 'password'} value={password} onChange={setPassword}
          placeholder={isSignUp ? 'Strong password' : '••••••••'}
          hint={isSignUp ? 'Min 8 characters, 1 uppercase, 1 number' : null}
          rightSlot={
            <button onClick={() => setShowPw(v => !v)} className="sf text-[10.5px] tracking-tight font-semibold px-1.5" style={{ color: 'var(--brand-cyan-text)' }}>
              {showPw ? 'Hide' : 'Show'}
            </button>
          } />
        {isSignUp && (
          <GlassField label="Confirm password" type={showPw ? 'text' : 'password'} value={confirmPw} onChange={setConfirmPw} placeholder="Type it again"
            error={confirmPw && password !== confirmPw ? "Passwords don't match" : null} />
        )}
      </div>
      {/* Primary CTA — sticky to the bottom of the viewport on mobile so
          the user can submit from anywhere in the (often-tall) Sign Up
          form without scrolling down past every field. On desktop the
          button sits at its natural place after the fields.
          - `sticky bottom-3` pins it 12px above the scroll container's
            bottom edge once its natural position would scroll past
          - `z-30` keeps it above the OR/Apple/Google block that follows
            in document order — those slide BEHIND the button as the user
            scrolls past them, hidden by the button's opaque gradient
          - `lg:static lg:bottom-auto lg:z-auto` reverts the behavior on
            desktop where the form fits comfortably in one screen */}
      <button onClick={handlePrimary} disabled={!valid}
        className="mt-5 lg-btn-primary lg-shine lg-aura squircle-md py-3.5 w-full sf text-[14.5px] font-semibold sticky bottom-3 z-30 lg:static lg:bottom-auto lg:z-auto">
        {isSignUp ? 'Continue' : 'Sign in'}
      </button>
      {!isSignUp && (
        <div className="mt-3 text-center">
          <button onClick={() => { window.location.hash = '#/auth/forgot'; }} className="sf text-[12px] font-medium transition-colors hover:text-halo-cyan" style={{ color: 'var(--text-muted)' }}>Forgot password?</button>
        </div>
      )}
      <div className="flex items-center gap-3 my-5">
        <div className="flex-1 h-px" style={{ background: 'var(--hairline-strong)' }} />
        <span className="sf text-[10px] tracking-[0.18em] uppercase font-semibold" style={{ color: 'var(--text-faint)' }}>or</span>
        <div className="flex-1 h-px" style={{ background: 'var(--hairline-strong)' }} />
      </div>
      <div className="space-y-2.5">
        <button onClick={handlePrimary} className="lg-glass squircle-md py-3 w-full flex items-center justify-center gap-2.5 sf text-[13.5px] font-semibold" style={{ color: 'var(--text-primary)' }}>
          <AppleIcon />{isSignUp ? 'Sign up' : 'Continue'} with Apple
        </button>
        <button onClick={handlePrimary} className="lg-glass squircle-md py-3 w-full flex items-center justify-center gap-2.5 sf text-[13.5px] font-semibold" style={{ color: 'var(--text-primary)' }}>
          <GoogleIcon />{isSignUp ? 'Sign up' : 'Continue'} with Google
        </button>
      </div>
      <p className="mt-7 px-2 sf text-[10.5px] leading-relaxed text-center" style={{ color: 'var(--text-faint)' }}>
        By {isSignUp ? 'creating an account' : 'continuing'} you agree to our{' '}
        <span className="underline" style={{ color: 'var(--text-muted)' }}>Terms</span> and{' '}
        <span className="underline" style={{ color: 'var(--text-muted)' }}>Privacy Policy</span>.
      </p>
    </div>
  );
};

/* ============================================================
   5. HOME — DS Home composition: Header → Circles → GameCard →
   Drops → Following → Storytelling → TeamMoments
   ============================================================ */

/* HighlightCircles — DS sort: YOU → followed teams (live first) → followed players (claimed first).
   No Add button (DS doesn't have one — empty state is a separate invite card).

   Tap behavior (per May-2026 Yoni spec): every circle opens a VIDEO viewer,
   never a profile/game-stats page.
     - YOU             → HighlightViewer (story-style 9:16 reel) starting at
                         your most recent moment, then auto-advances through
                         the rest of the moment feed.
     - Team-member     → HighlightViewer starting at that player's most
                         recent moment, then feeds onward.
     - Live team       → GameVideoViewer for the live game (16:9 landscape
                         video in portrait phone shell, fullscreen on
                         desktop).
     - Non-live team   → GameVideoViewer of that team's most recent finished
                         game (e.g. Tigers vs another team highlight).
   Seed data caveat: SEED_MOMENTS are currently all "self" so the per-player
   start indices collapse to 0 in this prototype. The routing contract is
   correct; the data will get its own per-player slicing later. */
/* VIEWED_STORAGE_KEY — localStorage key for the set of person/team IDs
   the user has opened a story/video for. Persists across reloads so the
   gray "seen" ring behaves like Instagram's seen-stories pattern.
   State lives on the app shell now (so both HighlightCircles, which
   READS to render gray rings, and HighlightViewer, which WRITES on
   chain-advance, can share it). These helpers are exported at module
   scope so the app shell can lazily hydrate. */
const VIEWED_STORAGE_KEY = 'halo:viewed-circles';
const loadViewedSet = () => {
  try { return new Set(JSON.parse(localStorage.getItem(VIEWED_STORAGE_KEY) || '[]')); }
  catch { return new Set(); }
};
const saveViewedSet = (s) => {
  try { localStorage.setItem(VIEWED_STORAGE_KEY, JSON.stringify([...s])); } catch {}
};
/* HL_OWNER_QUEUE — order the auto-chain visits unwatched circles.
   Matches the visible order of the home top-bar (excluding the live
   team circle, which opens GameVideoViewer not HighlightViewer).
   Replaced the placeholder #23 / #11 entries with the two real
   opponent-team players (C. Bell, M. Reyes) so every chain hop now
   plays real clip footage. */
const HL_OWNER_QUEUE = ['self', 'player-sarah', 'player-dylan', 'player-bell', 'player-reyes'];

const HighlightCircles = ({ viewed, onWatch, setHlOwner, onPickMoment, onOpenGame, onOpenGameVideo, onOpenAthlete }) => {
  /* Builder — produces an onClick that marks the circle viewed, sets
     the app shell's current highlight owner (so the auto-chain knows
     who's playing), then opens the HighlightViewer at clip 0. Used
     for every HL-routed circle (self + players). Live + non-live team
     circles open GameVideoViewer instead and don't need owner state. */
  const openHLFor = (id) => onWatch(id, () => { setHlOwner(id); onPickMoment(0); });
  const liveGame = SEED_GAMES.find(g => g.status === 'live');
  /* Helper: pick a representative game id for a non-live team circle.
     Order of preference: most-recent finished/just-ended game whose home
     OR away matches → first upcoming game for that team → fall back to
     the live game so the click never dead-ends in the prototype. */
  const gameIdForTeam = (teamName) => {
    const finished = SEED_GAMES.find(g =>
      (g.status === 'just-ended' || g.status === 'final')
      && (g.home === teamName || g.away === teamName));
    if (finished) return finished.id;
    const upcoming = SEED_GAMES.find(g =>
      g.status === 'upcoming'
      && (g.home === teamName || g.away === teamName));
    if (upcoming) return upcoming.id;
    return liveGame ? liveGame.id : (SEED_GAMES[0] && SEED_GAMES[0].id);
  };
  /* Per-person starting index inside the moment feed. Until SEED_MOMENTS
     carries personId, every circle starts at 0 — but the contract is in
     place for when we slice data per player. */
  const indexForPerson = (_personId) => 0;
  return (
    <div className="px-5 lg:px-8 xl:px-12 pt-2 pb-5">
      <div className="flex gap-4 overflow-x-auto no-scrollbar">
        {/* YOU — opens HighlightViewer starting at your latest moment.
            Self IS in the viewed-set used by the auto-chain (so the
            chain knows when to skip past self), but IdentityCircle
            ignores isViewed for kind='self' — the ring stays cyan,
            "new" dot stays visible. Your own content shouldn't
            visually read as "watched and done." */}
        <IdentityCircle kind="self" avatar={{ initial: 'T', src: 'avatars/weiss.png' }} label="You" isNew
          onClick={openHLFor('self')} />
        {/* Live team — opens GameVideoViewer of the live game. Always
            red, never gray — live is live. Outside the HL chain. */}
        <IdentityCircle kind="team" avatar={{ initial: 'SR' }} label="Sesh Rigs"
          liveGame={{ gameId: liveGame.id }}
          onClick={() => onOpenGameVideo(liveGame.id)} />
        {/* Non-live team — opens GameVideoViewer of the team's last/next
            game so the circle leads to actual team video, not a profile.
            Outside the HL chain (different viewer surface). */}
        <IdentityCircle kind="team" avatar={{ initial: 'HQ' }} label="Hustle HQ"
          isViewed={viewed.has('team-hustleHQ')}
          onClick={onWatch('team-hustleHQ', () => onOpenGameVideo(gameIdForTeam('Hustle HQ')))} />
        {/* Followed players — every circle opens HighlightViewer at that
            player's most recent moment. openHLFor wires up the chain
            owner so finishing this player's reel auto-advances to the
            next unwatched circle. */}
        {/* Home circles — each player carries an avatar.src pointing
            at prototype/avatars/<name>.jpg. The IdentityCircle's
            avatar-resolution chain shows the silhouette/initial
            fallback when the file is missing (onError hides the
            broken img), so the circle never renders broken — drop
            the photo in to activate. */}
        <IdentityCircle kind="player" avatar={{ initial: 'S', src: 'avatars/kim.png' }} team={{ initial: 'SR' }} label="S. Kim" isClaimed isNew
          isViewed={viewed.has('player-sarah')}
          onClick={openHLFor('player-sarah')} />
        <IdentityCircle kind="player" avatar={{ initial: 'D', src: 'avatars/torres.png' }} team={{ initial: 'SR' }} label="D. Torres" isClaimed
          isViewed={viewed.has('player-dylan')}
          onClick={openHLFor('player-dylan')} />
        {/* Opponent-team players (Medium Fundamentals) — replaced the
            placeholder #23 / #11 circles with the two real opponents
            from the BA video library. Each carries a real per-player
            clip set so the auto-chain plays actual footage instead
            of dummy SEED_MOMENTS for these slots. */}
        <IdentityCircle kind="player" avatar={{ jersey: 7, src: 'avatars/bell.png' }} team={{ initial: 'MF' }} label="C. Bell" isClaimed={false}
          isViewed={viewed.has('player-bell')}
          onClick={openHLFor('player-bell')} />
        <IdentityCircle kind="player" avatar={{ jersey: 15, src: 'avatars/m-reyes.png' }} team={{ initial: 'MF' }} label="M. Reyes" isClaimed={false}
          isViewed={viewed.has('player-reyes')}
          onClick={openHLFor('player-reyes')} />
      </div>
    </div>
  );
};

/* GameCard — morphing variants.
   Renders 5 states from the DS spec (off | pre | live | just-ended | ready).
   `error` is intentionally skipped for the prototype.

   Demo cycle: tapping any variant's eyebrow strip advances the displayed
   state. The off state (NextGameTeaser) is the resting home; tapping its
   eyebrow ENTERS the game-day cycle at `pre`. Once inside the cycle,
   tapping advances through pre → live → just-ended → ready → pre — never
   returns to off (off is non-cyclic).

   Internal state lets the demo work even when the parent passes a fixed
   `state` prop — we use the prop as the initial value, then override on
   user interaction. */
/* Demo-only state sequencing for the morph GameCard.
   GAME_CYCLE — the 4 "game-day" states that loop in the legacy
                tap-the-eyebrow flow (off enters via the eyebrow on the
                resting NextGameTeaser).
   ALL_STATES  — the FULL 5-state sequence used by StateNav prev/next
                so demo viewers can also step back to the off resting
                state, not just cycle through the active 4.
   advanceState — pure helper, wraps both directions around the 5-state
                array. Used by the StateNav arrow buttons. */
/* 'ad' is the sponsored-banner slot — included in the demo cycle so
   reviewers see how the morph card looks when monetised. Lives between
   'ready' and looping back to 'pre' (a natural "content pause"). */
const GAME_CYCLE = ['pre', 'live', 'just-ended', 'ready', 'ad'];
const ALL_STATES = ['off', 'pre', 'live', 'just-ended', 'ready', 'ad'];

/* MORPH_CARD_MIN_HEIGHT — single unified card height applied as a
   min-height across every morph variant on every viewport. 240px fits
   the densest variant (ready, with its 100px stacked-cards block on
   top of header + score row + bottom padding ≈ 240px native). All
   other variants get vertical breathing space — content stays
   vertically-centered or justify-between within the frame so the card
   never visually changes shape when the demo cycles. The home feed
   below stops shifting between transitions.
   Was 220 initially — bumped to 240 after the ready variant's
   stacked-cards block (h-[100px] absolute stack + score row + chrome)
   exceeded the floor and made ready visually taller than the others. */
const MORPH_CARD_MIN_HEIGHT = 240;
const nextDemoState = (s) => {
  if (s === 'off') return 'pre';
  const i = GAME_CYCLE.indexOf(s);
  return GAME_CYCLE[(i + 1) % GAME_CYCLE.length];
};
const advanceState = (s, dir) => {
  const i = ALL_STATES.indexOf(s);
  const n = (i + dir + ALL_STATES.length) % ALL_STATES.length;
  return ALL_STATES[n];
};

/* StateNav — compact glass-pill prev/next chevron pair.
   Renders as `[ < ‖ > ]` — two 24x24 buttons split by a hairline,
   wrapped in a frosted glass capsule that matches the liquid-glass
   language without competing with real app chrome. Sits adjacent to
   each variant's eyebrow so the demo viewer can step forward OR back
   through the 5-state sequence (off + 4 active states).

   stopPropagation on each click so taps don't bubble to the parent
   card's onClick (which would open the linked game/drop). */
const StateNav = ({ onPrev, onNext }) => {
  const handle = (e, fn) => { e.stopPropagation(); e.preventDefault(); fn(); };
  return (
    <div className="inline-flex items-center rounded-full overflow-hidden shrink-0"
      style={{
        background: 'rgba(255,255,255,0.06)',
        border: '1px solid var(--glass-card-border)',
        backdropFilter: 'blur(12px) saturate(160%)',
        WebkitBackdropFilter: 'blur(12px) saturate(160%)',
        boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.06)',
      }}
      title="Step through demo states"
      onClick={(e) => e.stopPropagation()}>
      <button type="button" onClick={(e) => handle(e, onPrev)} aria-label="Previous demo state"
        className="w-6 h-6 flex items-center justify-center transition-all hover:bg-white/10 active:scale-[0.92]"
        style={{ color: 'var(--text-tertiary)' }}>
        <svg width={9} height={9} viewBox="0 0 14 14" fill="none" stroke="currentColor"
          strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"
          className="icon-flip-rtl" style={{ width: 9, height: 9, display: 'block' }}>
          <path d="M9 3 L5 7 L9 11" />
        </svg>
      </button>
      <div className="w-px h-3" style={{ background: 'var(--glass-card-border)' }} />
      <button type="button" onClick={(e) => handle(e, onNext)} aria-label="Next demo state"
        className="w-6 h-6 flex items-center justify-center transition-all hover:bg-white/10 active:scale-[0.92]"
        style={{ color: 'var(--text-tertiary)' }}>
        <svg width={9} height={9} viewBox="0 0 14 14" fill="none" stroke="currentColor"
          strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"
          className="icon-flip-rtl" style={{ width: 9, height: 9, display: 'block' }}>
          <path d="M5 3 L9 7 L5 11" />
        </svg>
      </button>
    </div>
  );
};

/* CycleEyebrow — reusable tappable eyebrow strip. Renders a row with a
   pulse dot + uppercase tracking-wide label, and on tap calls onCycle to
   advance the demo. The cursor + active-scale make it discoverable as a
   tap target without ruining the editorial feel. */
const CycleEyebrow = ({ children, onCycle, color = 'var(--brand-cyan-text)', glow = '0 0 12px rgba(0,214,254,0.95), 0 0 4px rgba(0,214,254,0.65)', trailing }) => (
  <div className="relative z-10 px-4 pt-4 pb-2 flex items-center justify-between">
    <button onClick={onCycle} className="flex items-center gap-2 -m-1 p-1 squircle-sm transition-all active:scale-[0.96]"
      style={{ background: 'transparent' }} title="Tap to cycle demo state">

/* NotifyMeOverlay — centered glass modal triggered from the just-ended

/* MorphPreCard — extracted into its own component so its useState +
   useEffect hooks live at the top of THIS function's scope, not nested
   inside a GameCard conditional. Rules-of-Hooks compliance: when state
   transitions in/out of this branch, the component mounts/unmounts as
   a whole, instead of changing the hook count of its parent mid-render
   (which would crash React with a black-screen runtime error). Same
   fix pattern is applied to MorphLiveCard below. */
const MorphPreCard = ({ cycle, goPrev, goNext, onNotify }) => {
  const g = SEED_GAMES.find(x => x.status === 'upcoming') || SEED_GAMES[0];
  const [remaining, setRemaining] = useState(Math.max(0, Math.min(g.kickoffInSec ?? 7200, 7200)));
  useEffect(() => {
    const tick = setInterval(() => setRemaining(r => Math.max(0, r - 1)), 1000);
    return () => clearInterval(tick);
  }, []);
  const isImminent = remaining > 0 && remaining < 600;
  const progress = 100 - Math.min(100, remaining / 72);
  return (
    <div className={`relative squircle-md p-4 overflow-hidden lg-aura flex flex-col justify-between ${isImminent ? 'lg-pre-imminent' : ''}`}
        style={{
          minHeight: MORPH_CARD_MIN_HEIGHT,
          background: `radial-gradient(ellipse 60% 70% at 18% 28%, rgba(0,214,254,${isImminent ? 0.22 : 0.12}) 0%, transparent 60%), radial-gradient(ellipse 60% 70% at 88% 78%, rgba(132,88,255,0.10) 0%, transparent 60%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)`,
          border: '1px solid var(--glass-card-border)',
          backdropFilter: 'blur(36px) saturate(180%)',
          WebkitBackdropFilter: 'blur(36px) saturate(180%)',
          boxShadow: `inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow), 0 0 ${isImminent ? 40 : 20}px -8px rgba(0,214,254,${isImminent ? 0.40 : 0.18})`,
        }}>
        <div className="relative z-10 flex items-center justify-between mb-3">
          <button onClick={cycle} className="flex items-center gap-2 -m-1 p-1 squircle-sm active:scale-[0.96]" title="Tap to cycle demo state">
            <div className="w-1.5 h-1.5 rounded-full bg-halo-cyan anim-pulse-dot" style={{ boxShadow: '0 0 8px rgba(0,214,254,0.7)' }} />
            <span className="sf text-[10px] font-bold tracking-[0.16em] uppercase" style={{ color: 'var(--brand-cyan-text)' }}>
              {isImminent ? 'Starting soon' : 'Drop incoming · pre-game'}
            </span>
          </button>
          <StateNav onPrev={goPrev} onNext={goNext} />
        </div>
        <div className="relative z-10">
          <div className="sf-display text-[20px] font-bold tracking-[-0.015em] leading-none" style={{ color: 'var(--text-primary)' }}>{g.home}</div>
          <div className="sf text-[12.5px] mt-1" style={{ color: 'var(--text-secondary)' }}>vs {g.away}</div>
          <div className="sf text-[11px] mt-1" style={{ color: 'var(--text-tertiary)' }}>{g.venue || 'Rowland Cowan Stadium'}</div>
        </div>
        {/* Countdown row + Notify me CTA aligned on opposite ends.
            justify-between pushes the cyan-soft "Notify me" pill to the
            trailing edge so the cluster reads as "big number / action
            button" — same RH-edge alignment the just-ended prep card uses,
            keeping the pre/post-game CTA in a predictable visual spot. */}
        <div className="relative z-10 mt-4 flex items-end justify-between gap-3">
          <div className="flex items-baseline gap-2 min-w-0">
            <div className="sf-display text-[34px] font-bold tabular-nums leading-none"
              style={{ color: 'var(--text-primary)', textShadow: isImminent ? '0 0 18px rgba(0,214,254,0.40)' : 'none' }}>
              {fmt.countdown(remaining)}
            </div>
            <span className="sf text-[11px]" style={{ color: 'var(--text-tertiary)' }}>tipoff</span>
          </div>
          <button onClick={onNotify}
            className="shrink-0 sf text-[11px] font-bold squircle-sm px-3 py-2 inline-flex items-center gap-1.5 transition-all hover:scale-[1.02] active:scale-[0.97]"
            style={{
              color: 'var(--brand-cyan-text)',
              background: 'var(--brand-cyan-soft)',
              border: '1px solid var(--brand-cyan-border)',
              boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.10)',
            }}>
            <svg width={11} height={11} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round" style={{ width: 11, height: 11, display: 'block' }}>
              <path d="M3.5 6 a3.5 3.5 0 0 1 7 0 v2 l1 1.5 H2.5 l1 -1.5 Z" />
              <path d="M5.5 10 a1.5 1.5 0 0 0 3 0" />
            </svg>
            Notify me
          </button>
        </div>
      <div className="relative z-10 h-[3px] mt-3 overflow-hidden rounded-full" style={{ background: 'var(--hairline-strong)' }}>
        <div className="h-full bg-halo-cyan" style={{
          width: progress + '%',
          transition: 'width 1s linear',
          boxShadow: `0 0 ${isImminent ? 14 : 8}px rgba(0,214,254,${isImminent ? 0.75 : 0.5})`,
        }} />
      </div>
    </div>
  );
};

/* MorphLiveCard — rebuilt with a 3-tier vertical hierarchy that
   matches the prototype's editorial pattern:
     1. TOP chrome     — LIVE pill (with period + clock baked in)
                         on the left; moments count + StateNav right.
     2. CENTER hero    — massive score (clamp 56–76px) flanked by
                         team names at equal weight. The score is
                         the focal point.
     3. BOTTOM CTA     — full-width Watch live button with cyan glow.
                         Unmistakable primary action.
   Previously the score and team names lived at opposite bottom
   corners disconnected from each other; the LIVE pill was
   contextless; the empty middle 60% read as a layout bug. */
const MorphLiveCard = ({ cycle, goPrev, goNext, onOpenGame }) => {
  const g = SEED_GAMES.find(x => x.status === 'live') || SEED_GAMES[0];
  const [moments, setMoments] = useState(g.momentsCount || 5);
  /* Clock ticks within the current period — pure visual, doesn't
     advance the period. Gives the LIVE chrome live-feel motion. */
  const [clockSec, setClockSec] = useState(4 * 60 + 21); // 04:21
  useEffect(() => {
    const t = setInterval(() => setMoments(m => m + (Math.random() > 0.5 ? 1 : 0)), 6000);
    return () => clearInterval(t);
  }, []);
  useEffect(() => {
    const t = setInterval(() => setClockSec(s => (s > 0 ? s - 1 : 11 * 60 + 59)), 1000);
    return () => clearInterval(t);
  }, []);
  const fmtClock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const homeTeam = teamByName(g.home);
  const awayTeam = teamByName(g.away);
  /* Who's leading right now — used by the team-score columns to
     emphasise the leading side with full primary color + cyan glow
     and dim the trailing side to muted text. */
  const homeWon = (g.scoreHome || 0) > (g.scoreAway || 0);
  const awayWon = (g.scoreAway || 0) > (g.scoreHome || 0);
  return (
    <div role="button" tabIndex={0} onClick={() => onOpenGame(g.id)}
      className="relative w-full text-start squircle-md overflow-hidden lg-aura lg-shine lg-live-ember cursor-pointer flex flex-col"
      style={{
        minHeight: MORPH_CARD_MIN_HEIGHT,
        background:
          `radial-gradient(ellipse 60% 80% at 0% 50%, ${homeTeam.accentA} 0%, transparent 60%),` +
          `radial-gradient(ellipse 60% 80% at 100% 50%, ${awayTeam.accentA} 0%, transparent 60%),` +
          'radial-gradient(ellipse 80% 50% at 50% 0%, rgba(220,38,38,0.20) 0%, transparent 60%),' +
          'linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)',
        border: '1px solid var(--glass-card-border)',
        /* Dropped the 0 0 0 1px rgba(220,38,38,0.18) outline-shadow —
           it was rendering as an inset second border, looked like a
           "card inside a card" glitch. The lg-live-ember CSS class
           already provides the warm red outer aura. */
        boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
        backdropFilter: 'blur(36px) saturate(180%)',
        WebkitBackdropFilter: 'blur(36px) saturate(180%)',
        color: 'var(--text-primary)',
      }}>
      {/* Removed the lg-live-amp div — its ::before pseudo-element
          rendered a 14px broadcast tally rail at the top of the
          card with a 12px box-shadow that bled downward as a
          visible horizontal hairline crossing the LIVE pill and
          StateNav. The rebuilt card already has its own red
          radial blobs as background + the lg-live-ember outer
          aura, so the additional tally rail was redundant. */}

      {/* ── TIER 1 · TOP CHROME ─────────────────────────────────
          LIVE pill carries period + clock so the live state is
          fully self-describing ("LIVE · Q2 04:21"). StateNav alone
          on the right — moments count removed (was redundant
          metadata that competed with the LIVE chrome at equal
          uppercase tracking weight). */}
      <div className="relative z-10 px-4 lg:px-5 pt-3.5 pb-2 flex items-center justify-between">
        <button onClick={(e) => { e.stopPropagation(); cycle(); }}
          className="live-red squircle-sm px-2.5 py-1 inline-flex items-center gap-1.5 active:scale-[0.96]" title="Tap to cycle demo state">
          <div className="w-1.5 h-1.5 rounded-full bg-white anim-pulse-dot" style={{ boxShadow: '0 0 6px rgba(255,255,255,0.95)', flexShrink: 0 }} />
          <span className="sf text-[10px] font-bold tracking-[0.18em] uppercase leading-none tabular-nums" style={{ color: '#FFF' }}>
            LIVE · {g.period} {fmtClock(clockSec)}
          </span>
        </button>
        <StateNav onPrev={goPrev} onNext={goNext} />
      </div>

      {/* ── TIER 2 · CENTER HERO ────────────────────────────────
          Crest-anchored matchup poster. 5 elements horizontal:
            [crest + name] · score · em-dash · score · [crest + name]
          Crests are uniform 44px squares, so the visual mass on
          each side stays balanced regardless of team name length
          (Sesh Rigs vs Medium Fundamentals previously slid the
          whole block right). Full names live as 10px captions
          under the crests and truncate gracefully on narrow
          screens via max-width + text-overflow. Same pattern as
          PostGameScreen's ScoreHero — consistent visual language
          across live + finished game surfaces. */}
      <div className="relative z-10 flex-1 flex items-center justify-center px-3 lg:px-5 py-1">
        {/* Single-row scoreboard: [crest] scoreA — scoreB [crest]
           Team-name captions removed per critique — the crests +
           the LIVE eyebrow above + the Watch live CTA below
           already identify the matchup, and the captions were
           clipping ("SH RIGS" / "MEDIUM FUNDAM") because the
           120px column max-width couldn't fit alongside two 44px
           scores + dash inside a ~320px card. Crests now sit on
           the score baseline since they're flex-row siblings to
           the scores, not vertically-stacked columns. */}
        <div className="flex items-center justify-center gap-3 lg:gap-5">
          <div style={{ opacity: homeWon ? 1 : 0.55 }}>
            <TeamCrest team={homeTeam} size={44} />
          </div>
          {/* Score A */}
          <span className="sf-display tabular-nums font-bold leading-none"
            style={{
              fontSize: 'clamp(44px, 11vw, 60px)',
              letterSpacing: '-0.045em',
              color: homeWon ? 'var(--text-primary)' : 'var(--text-secondary)',
              textShadow: homeWon ? '0 0 18px rgba(0,214,254,0.32)' : 'none',
            }}>
            {g.scoreHome}
          </span>
          {/* Em-dash separator */}
          <span className="sf-display font-bold leading-none"
            style={{ fontSize: 'clamp(20px, 5vw, 30px)', color: 'var(--text-faint)', letterSpacing: '-0.02em' }}>
            —
          </span>
          {/* Score B */}
          <span className="sf-display tabular-nums font-bold leading-none"
            style={{
              fontSize: 'clamp(44px, 11vw, 60px)',
              letterSpacing: '-0.045em',
              color: awayWon ? 'var(--text-primary)' : 'var(--text-secondary)',
              textShadow: awayWon ? '0 0 18px rgba(0,214,254,0.32)' : 'none',
            }}>
            {g.scoreAway}
          </span>
          <div style={{ opacity: awayWon ? 1 : 0.55 }}>
            <TeamCrest team={awayTeam} size={44} />
          </div>
        </div>
      </div>

      {/* ── TIER 3 · BOTTOM CTA ─────────────────────────────────
          Watch live is the primary action — content-width pill
          centered horizontally so it aligns with the centered
          LIVE chrome above and the centered score block. */}
      <div className="relative z-10 px-4 lg:px-5 pb-3.5 pt-1 flex justify-center">
        <button onClick={(e) => { e.stopPropagation(); onOpenGame(g.id); }}
          className="lg-btn-primary squircle-sm sf text-[13px] font-bold inline-flex items-center justify-center gap-2 px-5 py-2.5"
          style={{ boxShadow: '0 6px 22px -6px rgba(0,214,254,0.50), inset 0 1px 0 rgba(255,255,255,0.30)' }}>
          <svg width={12} height={12} viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
            <path d="M3 2 L12 7 L3 12 Z" />
          </svg>
          Watch live now
        </button>
      </div>
    </div>
  );
};

/* "Yoni × Claude · A Netflix Series" custom ad creative, embedded

                              @ q85, ~41KB raw / ~54KB inline.

const YONI_AD_DATA_URI = "spalding-1600x838.png";

/* MorphJustEndedCard / MorphReadyCard / MorphOffCard — these branches
   don't have their own hooks, so they're rendered inline as plain JSX
   sub-trees from GameCard's switch below. Only PRE + LIVE needed
   component extraction (they call useState/useEffect for tickers). */
const GameCard = ({ state: initialState = 'off', onOpenGame, onOpenDrop, atVenue = false, onStartCapture }) => {
  const [state, setState] = useState(initialState);
  /* Notify-me overlay state — driven by Notify me CTAs on PRE + just-ended
     variants. Lives at GameCard root so:
     1. The overlay can render as a sibling of any state's card (escapes
        per-card overflow:hidden contexts).
     2. The user can open it from any variant that has a CTA (currently
        PRE for tipoff alerts + just-ended for drop-ready alerts).
     3. Cycling states while the overlay is open doesn't unmount it. */
  const [notifyOpen, setNotifyOpen] = useState(false);
  const openNotify = () => setNotifyOpen(true);
  const cycle = () => setState(nextDemoState);
  const goPrev = () => setState(s => advanceState(s, -1));
  const goNext = () => setState(s => advanceState(s, +1));

  /* Capture override — when the "I'm at the venue" SideMenu toggle is
     on, the morph card becomes the red-glow Capture variant regardless
     of any other state. Returns early before the normal switch since
     atVenue trumps the demo cycle (no StateNav arrows on capture). */
  if (atVenue) {
    return <MorphCaptureCard onStartCapture={onStartCapture || (() => { window.location.hash = '#/capture'; })} />;
  }

  /* Render strategy: every state branch assigns `card`, then a single
     fragment return wraps the card + the optional overlay. That way the
     overlay renders regardless of which state is active. */
  let card;

  /* PRE — countdown card (hooks isolated in MorphPreCard component). */
  if (state === 'pre') {
    card = <MorphPreCard cycle={cycle} goPrev={goPrev} goNext={goNext} onNotify={openNotify} />;
    return (
      <>
        {card}
        {notifyOpen && <NotifyMeOverlay onClose={() => setNotifyOpen(false)} />}
      </>
    );
  }
  /* LIVE — in-game card with moments ticker (hooks isolated in MorphLiveCard). */
  if (state === 'live') {
    return <MorphLiveCard cycle={cycle} goPrev={goPrev} goNext={goNext} onOpenGame={onOpenGame} />;
  }

  /* AD — sponsored billboard variant. No hooks needed (static creative)
     but extracted to its own component for consistency with the other
     state branches. */
  if (state === 'ad') {
    return <MorphAdCard cycle={cycle} goPrev={goPrev} goNext={goNext} />;

  /* ── JUST-ENDED ── Score's final, drop assembling. Animated cyan ring +

/* StorytellingDropsRail — direct port of DS screens/home/StorytellingDropsRail.tsx
   240×336 (5:7) cards with stacked-cards centerpiece + per-item hue
   rotation by id-hash. */
const STORY_HUES = [
  { a: 'rgba(0,214,254,0.40)',  b: 'rgba(132,88,255,0.32)' },
  { a: 'rgba(255,90,158,0.40)', b: 'rgba(255,140,40,0.30)' },
  { a: 'rgba(74,222,128,0.36)', b: 'rgba(0,170,220,0.30)' },
  { a: 'rgba(255,210,80,0.36)', b: 'rgba(255,90,50,0.30)' },
];
const hueFor = (id) => {
  const sum = String(id).split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  return STORY_HUES[sum % STORY_HUES.length];

/* DateNavbar — 58px lg-glass pill, prev/next chevrons, center eyebrow + label */
const DateNavbar = ({ value, onChange }) => {
  const idx = Math.max(0, DATE_OPTIONS.findIndex(d => d.key === value));
  const cur = DATE_OPTIONS[idx];
  const atStart = idx === 0;
  const atEnd   = idx === DATE_OPTIONS.length - 1;
  const eyebrow = cur.dayDelta === 0
    ? 'TODAY'
    : cur.dayDelta < 0
      ? `${Math.abs(cur.dayDelta)} DAY${Math.abs(cur.dayDelta) > 1 ? 'S' : ''} AGO`
      : `IN ${cur.dayDelta} DAY${cur.dayDelta > 1 ? 'S' : ''}`;
  return (
    <div className="lg-glass squircle-md flex items-stretch overflow-hidden" style={{ height: 58 }}>
      <button onClick={() => !atStart && onChange(DATE_OPTIONS[idx - 1].key)} disabled={atStart}
        className="w-14 flex items-center justify-center transition-colors"
        style={{ color: atStart ? 'var(--text-disabled)' : 'var(--text-secondary)' }}
        aria-label="Previous day">
        <svg width={14} height={14} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">
          <path d="M8.5 2.5 L4 7 L8.5 11.5" />
        </svg>
      </button>
      <div className="flex-1 flex flex-col items-center justify-center">
        <span className="sf text-[9px] tracking-[0.18em] uppercase font-bold leading-none"
          style={{ color: cur.dayDelta === 0 ? 'var(--brand-cyan-text)' : 'var(--text-muted)' }}>
          {eyebrow}
        </span>
        <span className="sf-display text-[14px] font-bold tracking-[-0.01em] mt-1 leading-none" style={{ color: 'var(--text-primary)' }}>
          {cur.label}
        </span>
      </div>
      <button onClick={() => !atEnd && onChange(DATE_OPTIONS[idx + 1].key)} disabled={atEnd}
        className="w-14 flex items-center justify-center transition-colors"
        style={{ color: atEnd ? 'var(--text-disabled)' : 'var(--text-secondary)' }}
        aria-label="Next day">
        <svg width={14} height={14} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">
          <path d="M5.5 2.5 L10 7 L5.5 11.5" />

  );
};

/* HorizontalGameCard — unified mental model across all three statuses.
   LIVE  = bigger/bolder cinematic hero. Score is the focal point —
           62px tabular nums centered. Live pulse pill top-leading.
           No court SVG decoration. Team-color radial blobs come from
           each team's accent palette so different matchups read distinct.
   UPCOMING / ENDED = compact row. One layout, differentiated by:
     - leading-edge accent color (cyan / neutral)
     - editorial right column (countdown number / score with W/L dim)
     - eyebrow chrome (Tipoff vs Final + moments pill) */
const HorizontalGameCard = ({ game, onOpenGame }) => {
  const isLive     = game.status === 'live';
  const isUpcoming = game.status === 'upcoming';
  const isEnded    = game.status === 'just-ended' || game.status === 'final';
  const homeTeam   = teamByName(game.home);
  const awayTeam   = teamByName(game.away);

  /* ── LIVE HERO ──────────────────────────────────────────
     220px+ min-height block. Score lives center-aligned at clamp(56,14vw,72)px
     so it commands the card on phone and desktop alike. Team-color blobs
     in opposite corners give matchup-specific identity without a court SVG. */
  if (isLive) {
    return (
      <button onClick={() => onOpenGame(game.id)}
        className="w-full text-start relative squircle-md overflow-hidden lg-aura lg-shine lg-live-ember flex flex-col"
        style={{
          background: `
            radial-gradient(ellipse 95% 85% at 0% 0%, ${homeTeam.accentA} 0%, transparent 55%),
            radial-gradient(ellipse 95% 85% at 100% 100%, ${awayTeam.accentA} 0%, transparent 55%),
            radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0,170,220,0.18) 0%, transparent 65%),
            linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)`,
          backdropFilter: 'blur(40px) saturate(180%)',
          WebkitBackdropFilter: 'blur(40px) saturate(180%)',
          border: '1px solid var(--glass-card-border)',
          boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), 0 0 0 1px rgba(220,38,38,0.12), var(--glass-card-shadow)',
          color: 'var(--text-primary)',
          minHeight: 220,
        }}>
        <div className="lg-live-amp" aria-hidden="true" />
        <div className="absolute inset-0 hatch-dark opacity-[0.10] pointer-events-none" />

        {/* Top row — LIVE pill + moments count.
            The pill carries the period; moments count quietly anchors the
            top-end as ambient context — never the loudest thing. */}
        <div className="relative z-10 flex items-center p-5 lg:p-6">
          {/* Moments count removed from the live state row — a running
             clip count next to LIVE reads as a stat that ticks, which
             it doesn't. Ended cards still surface it (in the meta line). */}
          <div className="lg-glass live-red squircle-sm px-2.5 py-1 flex items-center gap-1.5">
            <span className="w-1.5 h-1.5 rounded-full bg-white anim-pulse-dot" />
            <span className="sf text-[10px] font-bold tracking-[0.18em] uppercase leading-none" style={{ color: '#FFF' }}>
              LIVE · {game.period || 'Q1'}
            </span>
          </div>
        </div>

        {/* Editorial scoreboard — single horizontal row, crest on
            baseline next to score on each side. Same pattern as
            MorphLiveCard's scoreboard so the two live surfaces (home
            morph card + Games tab live card) read with one visual
            language. The previous version stacked a 22+22 mini-crest
            cluster beside a 'Sesh Rigs vs. Medium Fundamentals'
            caption in the bottom strip — that text clipped on phone
            and the crest cluster looked separate from the score. */}
        <div className="relative z-10 flex-1 flex items-center justify-center px-5 lg:px-6 py-2">
          <div className="flex items-center justify-center gap-3 lg:gap-5">
            <TeamCrest team={homeTeam} size={56} />
            <span className="sf-display tabular-nums font-bold leading-none"
              style={{
                fontSize: 'clamp(54px, 14vw, 72px)',
                letterSpacing: '-0.045em',
                color: 'var(--text-primary)',
                textShadow: '0 0 18px rgba(0,214,254,0.28)',
              }}>
              {game.scoreHome}

            <span className="sf-display font-bold leading-none"
              style={{
                fontSize: 'clamp(28px, 7vw, 40px)',
                letterSpacing: '-0.02em',
                color: 'var(--text-faint)',
              }}>–</span>
            <span className="sf-display tabular-nums font-bold leading-none"
              style={{
                fontSize: 'clamp(54px, 14vw, 72px)',
                letterSpacing: '-0.045em',
                color: 'var(--text-secondary)',
              }}>
              {game.scoreAway}
            </span>
            <TeamCrest team={awayTeam} size={56} />
          </div>
        </div>

        {/* Bottom row — Watch live CTA only.
            The bottom team-name caption was dropped along with the
            stacked-crest cluster — crests now live on the score
            baseline above. CTA right-aligned so it doesn't compete
            visually with the centered scoreboard. */}
        <div className="relative z-10 flex items-end justify-end gap-4 px-5 lg:px-6 pb-5 lg:pb-6 pt-2">

              <path d="M5.5 2.5 L10 7 L5.5 11.5" />

          </span>
        </div>
      </button>

  /* ── COMPACT ROW (upcoming + ended) ────────────────────
     Single layout. State communicated by leading-edge accent, eyebrow,
     and editorial right column. Stacked-crest cluster gives at-a-glance
     identity; loser crest dims on ended games for instant W/L read. */
  const homeWon = isEnded && (game.scoreHome ?? 0) > (game.scoreAway ?? 0);
  const awayWon = isEnded && (game.scoreAway ?? 0) > (game.scoreHome ?? 0);
  const c       = isUpcoming ? countdownParts(game.kickoffInSec) : null;
  const edgeBg  = isUpcoming
    ? 'linear-gradient(180deg, #00D6FE 0%, rgba(0,153,192,0.7) 100%)'

  return (
    <button onClick={() => onOpenGame(game.id)}
      className="w-full text-start relative squircle-md overflow-hidden lg-aura lg-shine"
      style={{
        background: isUpcoming
          ? `radial-gradient(ellipse 45% 100% at 0% 50%, rgba(0,214,254,0.10) 0%, transparent 60%), linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)`
          : `linear-gradient(180deg, var(--card-base-soft-top) 0%, var(--card-base-soft-bot) 100%)`,
        backdropFilter: 'blur(36px) saturate(180%)',
        WebkitBackdropFilter: 'blur(36px) saturate(180%)',
        border: '1px solid var(--glass-card-border)',
        boxShadow: 'inset 0 1px 0 var(--glass-card-inset-top), var(--glass-card-shadow)',
        color: 'var(--text-primary)',
      }}>
      {/* Leading-edge accent bar */}
      <span className="absolute top-0 bottom-0 pointer-events-none" aria-hidden="true"
        style={{ insetInlineStart: 0, width: 4, background: edgeBg, boxShadow: edgeGlow }} />
      <div className="absolute inset-0 hatch-dark opacity-[0.10] pointer-events-none" />

      {/* Rebuilt compact row layout for phone.
          Previous version stuffed 5 things into the eyebrow row (FINAL
          · YESTERDAY · 7:30 PM + an inline moments pill) which then
          wrapped onto 3 lines on a 393px viewport and squeezed the
          matchup ("Sesh Rigs beat Medium Fundamentals") down to
          "Sesh Rigs b..." Now:
            - Eyebrow is just the state ("Final" or "Tipoff")
            - Matchup line gets the full middle-column width
            - Meta line beneath carries date + venue + moments count
              as a single comma-separated string
            - Right column drops "Recap"/chevron label below score
              (was redundant with the card itself being tappable). */}
      <div className="relative flex items-center gap-3 p-4 ps-5">
        {/* Stacked-crest cluster — shrunk from 76x52 to 64x44 to give
            the middle column more breathing room on phone. */}
        <div className="relative shrink-0" style={{ width: 64, height: 44 }}>
          <div className="absolute" style={{ insetInlineStart: 0, top: 0, opacity: isEnded && awayWon ? 0.45 : 1 }}>
            <TeamCrest team={homeTeam} size={34} />
          </div>
          <div className="absolute" style={{ insetInlineEnd: 0, bottom: 0, opacity: isEnded && homeWon ? 0.45 : 1 }}>
            <TeamCrest team={awayTeam} size={34} />
          </div>
        </div>

        {/* Middle column — eyebrow + matchup + meta */}
        <div className="flex-1 min-w-0">
          {/* Eyebrow — just the state, no inline chip. Reads cleanly. */}
          <div className="sf text-[10px] font-bold tracking-[0.18em] uppercase leading-none mb-1"
            style={{
              color: isUpcoming ? 'var(--brand-cyan-text)' : 'var(--text-muted)',
              textShadow: isUpcoming ? '0 0 6px rgba(0,214,254,0.28)' : 'none',
            }}>
            {isUpcoming ? 'Tipoff' : 'Final'}
          </div>
          {/* Matchup line — primary text */}
          <div className="sf-display text-[15px] lg:text-[16px] font-bold leading-[1.18] tracking-[-0.015em] truncate" style={{ color: 'var(--text-primary)' }}>
            {isEnded ? (
              <>
                {homeWon ? homeTeam.name : awayTeam.name}
                <span className="font-normal" style={{ color: 'var(--text-tertiary)' }}> beat </span>
                {homeWon ? awayTeam.name : homeTeam.name}
              </>
            ) : (
              <>
                {homeTeam.name}
                <span className="font-normal" style={{ color: 'var(--text-tertiary)' }}> vs. </span>
                {awayTeam.name}
              </>
            )}
          </div>
          {/* Meta line — single comma-separated string. Carries date,
             venue, and moments count without inline pills/chips so
             the row never wraps awkwardly. */}
          <div className="sf text-[11px] mt-1 truncate" style={{ color: 'var(--text-muted)' }}>
            {isUpcoming
              ? (game.venue || 'Home court')
              : [
                  game.when,
                  game.momentsCount > 0 ? `${game.momentsCount} moments` : null,
                ].filter(Boolean).join(' · ')}
          </div>
        </div>

        {/* Right column — editorial number only.
            Dropped the "Recap ›" label that used to sit under the
            score — the whole row is the affordance, the label was
            buying redundant chrome at a cost of horizontal space. */}
        <div className="shrink-0 text-end ps-1">
          {isUpcoming && c && c.value !== null && (
            <div className="flex items-baseline justify-end leading-none">
              <span className="sf-display font-bold tabular-nums"
                style={{ fontSize: 34, letterSpacing: '-0.04em', color: 'var(--brand-cyan-text)', textShadow: '0 0 14px rgba(0,214,254,0.45)' }}>
                {c.value}
              </span>
              <span className="sf-display font-medium"
                style={{ fontSize: 15, marginInlineStart: 2, color: 'rgba(0,214,254,0.65)' }}>
                {c.unit}
              </span>
            </div>
          )}
          {isUpcoming && c && c.value === null && (
            <span className="sf-display font-bold leading-none"
              style={{ fontSize: 22, color: 'var(--brand-cyan-text)', textShadow: '0 0 12px rgba(0,214,254,0.45)' }}>
              NOW
            </span>
          )}
          {isEnded && (
            <div className="sf-display tabular-nums font-bold leading-none"
              style={{ fontSize: 24, letterSpacing: '-0.03em' }}>
              <span style={{ color: homeWon ? 'var(--text-primary)' : 'var(--text-tertiary)' }}>{game.scoreHome ?? '—'}</span>
              <span style={{ color: 'var(--text-faint)', padding: '0 4px' }}>–</span>
              <span style={{ color: awayWon ? 'var(--text-primary)' : 'var(--text-tertiary)' }}>{game.scoreAway ?? '—'}</span>
            </div>
          )}
        </div>
      </div>
    </button>
  );
};

const GamesScreen = ({ onOpenGame, onOpenGameVideo }) => {
  const [date, setDate] = useState('d0');
  const ids = GAMES_BY_DATE[date] || [];
  const games = ids.map(id => SEED_GAMES.find(g => g.id === id)).filter(Boolean);
  const live     = games.filter(g => g.status === 'live');
  const upcoming = games.filter(g => g.status === 'upcoming');
  const ended    = games.filter(g => g.status === 'just-ended' || g.status === 'final');
  /* LIVE cards route to the full-game video player (cinematic stream),
     upcoming + ended route to the standard game page (PostGameScreen
     branches by status to render PreGame vs PostGame content). */
  const onOpen = (g) => g.status === 'live'
    ? onOpenGameVideo(g.id)
    : onOpenGame(g.id);

  return (
    <div className="anim-fade pb-28 sf relative" style={{ color: 'var(--text-primary)' }}>
      {/* Sticky header — Games title + count chip + DateNavbar.
          The fade strip spans full viewport; the inner column caps at 640px
          on desktop so it reads as a wide-phone hero, not a stretched billboard. */}
      <div className="relative z-20 sticky top-0 px-5 lg:px-8 xl:px-12 pt-12 pb-3 lg-header-fade">

          </div>

        {/* Sponsor ad slot — sits above the LIVE card on Games tab.
            Uses the yoni-x-claude collaboration banner. 4:1 aspect

          <div>
            <div className="sf text-[9px] tracking-[0.22em] uppercase font-semibold mb-1.5 px-0.5" style={{ color: 'rgba(255,255,255,0.40)' }}>

              <span className="sf-display text-[12.5px] font-bold tracking-tight block leading-tight"
                style={{ color: isOn ? '#fff' : 'rgba(255,255,255,0.95)' }}>
                {d.name}

              <span className="sf text-[8.5px] tracking-[0.10em] uppercase font-semibold mt-1 block leading-none"
                style={{ color: isOn ? 'rgba(255,255,255,0.80)' : 'rgba(255,255,255,0.50)' }}>
                {d.sub}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
};

              }
