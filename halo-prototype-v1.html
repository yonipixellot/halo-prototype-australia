/* ── PlayerOnboarding orchestrator ──────────────────────────────
   Direct port of halo-design-system/src/screens/onboarding/PlayerOnboarding.tsx
   with the coach attribution stripped per user spec (coach persona not
   built yet — Halo will generate these invites later).

   Hardcoded demo invite context: teamId = t1 (Varsity / Eastside Prep).
   When coach side ships, swap this for a URL-param reader.

   Steps:
     invite-entry → signup OR signin → teams-locked → claim-and-follow
       → notif-upsell → done(Home) */
const DEFAULT_INVITE = { teamId: 't1' };

/* OnboardSidebar — desktop-only persistent rail showing the player flow
   as a vertical step list. Sits inside .onb-with-sidebar > flex-row;
   `hidden lg:flex` on the outer so mobile never sees it. Steps are
   clickable for demo navigation; in production this would gate to
   completed steps only via a `reached` index. */
const ONB_PLAYER_STEPS = [
  { id: 1, label: 'Welcome',       sub: 'Tap into your team',  matches: ['invite-entry', 'signup', 'signin'] },
  { id: 2, label: 'Teams',         sub: 'Pick who to follow',  matches: ['teams-locked'] },
  { id: 3, label: 'Players',       sub: 'Claim your jersey',   matches: ['claim-and-follow'] },
  { id: 4, label: 'Notifications', sub: 'Stay in the loop',    matches: ['notif-upsell'] },
];
const STEP_TO_STEP_KEY = {
  1: 'invite-entry',
  2: 'teams-locked',
  3: 'claim-and-follow',
  4: 'notif-upsell',
};

const OnboardSidebar = ({ currentStep, onJumpTo, onExit }) => {
  const currentIdx = ONB_PLAYER_STEPS.findIndex(s => s.matches.includes(currentStep));
  return (
    <aside className="hidden lg:flex flex-col shrink-0"
      style={{
        width: 280,
        borderInlineEnd: '1px solid var(--hairline)',
        background: 'var(--canvas-bg-soft)',
      }}>
      {/* Brand + close cluster */}
      <div className="px-6 pt-8 pb-10 flex items-center justify-between">
        <div className="flex items-center gap-2.5">
          <div className="w-9 h-9 rounded-[10px] flex items-center justify-center sf-display"
            style={{
              background: 'linear-gradient(135deg, rgba(0,214,254,0.95) 0%, rgba(0,150,200,1) 100%)',
              color: '#0a0d18', fontSize: 18, fontWeight: 800, letterSpacing: '-0.04em',
              boxShadow: '0 0 18px rgba(0,214,254,0.30)',
            }}>H</div>
          <span className="sf-display text-[15px] font-bold tracking-[-0.01em]" style={{ color: 'var(--text-primary)' }}>Halo</span>
        </div>
        {onExit && (
          <button onClick={onExit} aria-label="Exit onboarding"
            className="w-8 h-8 lg-glass squircle-sm flex items-center justify-center"
            style={{ color: 'var(--text-secondary)' }}>
            <Icon name="close" size={11} stroke={1.8} />
          </button>
        )}
      </div>

      {/* Step list */}
      <nav className="flex-1 px-3 relative">
        {ONB_PLAYER_STEPS.map((s, i) => {
          const state = i < currentIdx ? 'past' : i === currentIdx ? 'current' : 'future';
          const canJump = state !== 'future';
          return (
            <div key={s.id} className="relative">
              <button type="button"
                className="onb-sidebar-step"
                data-state={state}
                onClick={() => canJump && onJumpTo && onJumpTo(STEP_TO_STEP_KEY[s.id])}
                disabled={!canJump}>
                <div className="onb-sidebar-step-num">
                  {state === 'past' ? (
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M3 7 L6 10 L11 4" />
                    </svg>
                  ) : s.id}
                </div>
                <div className="min-w-0 flex-1">
                  <div className="onb-sidebar-step-label">{s.label}</div>
                  <div className="onb-sidebar-step-sub">{s.sub}</div>
                </div>
              </button>
              {i < ONB_PLAYER_STEPS.length - 1 && <div className="onb-sidebar-connector" />}
            </div>
          );
        })}
      </nav>

      {/* Bottom — quiet help link area */}
      <div className="px-6 py-6">
        <div className="sf text-[11px]" style={{ color: 'var(--text-faint)' }}>
          Step {currentIdx + 1} of {ONB_PLAYER_STEPS.length} · Player onboarding
        </div>
      </div>
    </aside>
  );
};

const PlayerOnboarding = ({ onDone, onExit, inviteContext = DEFAULT_INVITE }) => {
  const [step, setStep] = useState('invite-entry');
  const [chosenTeams, setChosenTeams] = useState([inviteContext.teamId]);
  const [chosenPlayers, setChosenPlayers] = useState({});
  /* Pre-claim Tal Weiss (r1 = #7 SG on Varsity) so the user can hit
     Continue on ClaimAndFollow immediately during demo. Setting this
     here triggers the auto-follow effect inside ClaimAndFollow that
     fans-out followed teammates. */
  const [claimedSelfId, setClaimedSelfId] = useState('r1');
  /* Lifted signup form state — lives in the orchestrator so backing out
     of TeamsStepLocked to fix a typo retains every field. Per the
     May-2026 design call (TeamsLocked back → signup with pre-filled
     form). Values are pre-filled with the Tal Weiss demo persona so
     every screen of the player flow is immediately Continue-able
     without typing during a demo. Password satisfies the validation
     (8+ chars, 1 uppercase, 1 number). */
  const [signupForm, setSignupForm] = useState({
    name: 'Tal Weiss',
    email: 'tal@halo.tv',
    password: 'Halohalo1',
    confirmPw: 'Halohalo1',
    birthDate: '2008-05-14',
    gender: 'Male',
    country: 'US',
    phoneCountry: 'US',
    phone: '5551234567',
  });
  /* w-full is critical on desktop — without it, this div is a flex child
     of `.stage-desktop` (display:flex) and would shrink to the inner
     card's 480px width, pinning the whole onboarding flow to the
     inline-start edge of the viewport. With w-full the outer div spans
     the full track and the inner card's `lg:mx-auto` centers it. */
  /* Player onboarding — desktop wears a SaaS sidebar-canvas layout:
     persistent left rail (280px) with vertical step list, full-bleed
     right content (no card border). Mobile stays exactly as before —
     full-bleed scroll with the OnboardStepper at the top. The two
     layouts share the same step components; only the orchestrator
     wrapper changes between viewports.

     `.onb-with-sidebar` class on the outer scopes the CSS rule that
     hides nested OnboardSteppers on lg+ so the sidebar isn't duplicated
     by an in-content stepper. Fan flow's stepper is unaffected because
     it doesn't carry this class. */
  return (
    <div className="anim-fade sf onb-with-sidebar" style={{ position: 'absolute', inset: 0, background: 'var(--canvas-bg)', color: 'var(--text-primary)' }}>
      <div className="lg-atmosphere" />
      <div className="absolute inset-0 z-[1] pointer-events-none"
        style={{ background: 'linear-gradient(180deg, var(--vignette-corner) 0%, transparent 30%, transparent 70%, var(--vignette-corner-soft) 100%)' }} />
      <div className="absolute inset-0 z-10 flex flex-col lg:flex-row">
        <OnboardSidebar
          currentStep={step}
          onJumpTo={(s) => setStep(s)}
          onExit={onExit} />
        <main className="relative flex-1 min-w-0">
          <div className="onb-scroll-area">
            <div className="relative flex flex-col min-h-full lg:max-w-[820px] lg:mx-auto lg:px-12 lg:py-2">
          {step === 'invite-entry' && (
            <PlayerInviteEntry teamId={inviteContext.teamId}
              onSignUp={() => setStep('signup')}
              onSignIn={() => setStep('signin')}
              onBack={onExit} />
          )}
          {step === 'signup' && (
            <FullSignUpScreen
              form={signupForm} setForm={setSignupForm}
              onSubmit={() => setStep('teams-locked')}
              onSwitchToSignIn={() => setStep('signin')}
              onBack={() => setStep('invite-entry')} />
          )}
          {step === 'signin' && (
            <>
              <OnboardStepper step={1} total={4} onBack={() => setStep('invite-entry')} label="Step 1 of 4" />
              <div className="flex-1 onb-scroll px-5 pt-6">
                <SignInForm onSubmit={() => setStep('teams-locked')} />
              </div>
            </>
          )}
          {step === 'teams-locked' && (
            <TeamsStepLocked lockedTeamId={inviteContext.teamId}
              chosen={chosenTeams} setChosen={setChosenTeams}
              /* Back goes to signup (not invite-entry) — the user has
                 already created their account, so returning to a
                 pre-account screen would feel like undoing it. With the
                 lifted signupForm state above, all fields are still
                 there if they need to edit one. */
              onBack={() => setStep('signup')}
              onNext={() => setStep('claim-and-follow')} />
          )}
          {step === 'claim-and-follow' && (
            <ClaimAndFollow teamId={inviteContext.teamId}
              claimedSelfId={claimedSelfId} setClaimedSelfId={setClaimedSelfId}
              chosenPlayers={chosenPlayers} setChosenPlayers={setChosenPlayers}
              onBack={() => setStep('teams-locked')}
              onNext={() => setStep('notif-upsell')} />
          )}
          {step === 'notif-upsell' && (
            <NotifUpsell onBack={() => setStep('claim-and-follow')}
              onAllow={onDone} onSkip={onDone} />
          )}
            </div>{/* /content max-width wrapper */}
          </div>{/* /onb-scroll-area */}
        </main>
      </div>{/* /flex-row sidebar+content */}
    </div>
  );
};

/* ── AuthBackButton ──────────────────────────────────────────────
   Reusable back chevron used by the Forgot/Reset screens. Mirrors the
   DS auth back affordance — small glass squircle with left-pointing
   chevron, RTL-safe via icon-flip-rtl. */
const AuthBackButton = ({ onBack }) => (
  <button onClick={onBack}
    className="w-9 h-9 lg-glass squircle-sm flex items-center justify-center"
    style={{ color: 'rgba(255,255,255,0.85)' }}
    aria-label="Back to sign in">
    <svg width={14} height={14} viewBox="0 0 14 14" fill="none" stroke="currentColor"
      strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"
      className="icon-flip-rtl"
      style={{ width: 14, height: 14, display: 'block' }}>
      <path d="M8.5 2.5 L4 7 L8.5 11.5" />
    </svg>
  </button>
);

/* ── AuthGlassField ─────────────────────────────────────────────
   Reusable glass-card input used by Forgot/Reset screens. Same visual
   language as the existing SignInForm's GlassField but local to the
   Phase 3 screens so we don't have to refactor the existing one. */
const AuthGlassField = ({ label, type = 'text', value, onChange, placeholder, autoFocus, error }) => {
  const [showPw, setShowPw] = useState(false);
  const inputType = type === 'password' && showPw ? 'text' : type;
  return (
    <div className="lg-glass-card squircle-md px-3.5 py-3"
      style={error ? { border: '1px solid rgba(220,38,38,0.55)' } : undefined}>
      <label className="sf text-[10px] tracking-[0.14em] uppercase font-semibold block mb-1" style={{ color: 'var(--text-tertiary)' }}>{label}</label>
      <div className="flex items-center gap-2">
        <input type={inputType} value={value} onChange={(e) => onChange(e.target.value)}
          placeholder={placeholder} autoFocus={autoFocus}
          className="auth-input sf text-[14.5px] flex-1" />
        {type === 'password' && (
          <button type="button" onClick={() => setShowPw(v => !v)}
            className="sf text-[11px] font-semibold" style={{ color: 'var(--brand-cyan-text)' }}>
            {showPw ? 'Hide' : 'Show'}
          </button>
        )}
      </div>
      {error && <div className="sf text-[10.5px] mt-1" style={{ color: '#fca5a5' }}>{error}</div>}
    </div>
  );
};

/* ── ForgotPasswordScreen ────────────────────────────────────────

  if (sent) {
    return (
      <div className="anim-fade px-6 pt-24 text-center max-w-[440px] mx-auto">
        <div className="w-16 h-16 rounded-full lg-glass-strong mx-auto mb-5 flex items-center justify-center"
          style={{ boxShadow: '0 0 32px rgba(0,214,254,0.45)' }}>
          <svg width={28} height={28} viewBox="0 0 28 28" fill="none" stroke="var(--brand-cyan)"
            strokeWidth={2.6} strokeLinecap="round" strokeLinejoin="round"
            style={{ width: 28, height: 28, display: 'block' }}>
            <path d="M3 7l11 7L25 7" />
            <rect x={3} y={6} width={22} height={16} rx={2} />
          </svg>
        </div>
        <h1 className="sf-display text-[24px] font-bold text-white leading-tight tracking-[-0.022em] mb-2">
          Check your inbox
        </h1>
        <p className="sf text-[13px] leading-relaxed max-w-[260px] mx-auto mb-8" style={{ color: 'var(--text-tertiary)' }}>
          We sent a reset link to {email || 'your email'}. If it doesn't show in a minute, peek in spam.
        </p>
        <button onClick={onBack}
          className="squircle-md py-3 px-6 sf text-[13px] font-semibold"
          style={{
            color: '#0a0d18',
            background: 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            boxShadow: '0 4px 12px -2px rgba(0,214,254,0.45), inset 0 1px 0 rgba(255,255,255,0.40)',
          }}>
          Back to sign in
        </button>
      </div>
    );
  }

  return (
    <div className="anim-fade max-w-[440px] mx-auto">
      <div className="pt-12 px-5 lg:px-0">
        <AuthBackButton onBack={onBack} />
      </div>
      <div className="px-6 pt-8 lg:px-0">
        <h1 className="sf-display text-[28px] font-bold text-white leading-tight tracking-[-0.025em] mb-1.5">
          Reset password
        </h1>
        <p className="sf text-[13px] mb-7 leading-relaxed" style={{ color: 'rgba(255,255,255,0.60)' }}>
          Type the email on your account. We'll send a one-tap reset link.
        </p>
        <AuthGlassField label="Email" type="email" value={email} onChange={setEmail}
          placeholder="you@school.com" autoFocus />
        <button onClick={valid ? () => setSent(true) : undefined} disabled={!valid}
          className="mt-5 squircle-md py-3.5 w-full sf text-[14.5px] font-semibold transition-all"
          style={{
            color: !valid ? 'rgba(255,255,255,0.40)' : '#0a0d18',
            background: !valid ? 'var(--glass-card-bg)' : 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            border: !valid ? '1px solid var(--glass-card-border)' : 'none',
            boxShadow: !valid ? 'none' : '0 8px 24px -8px rgba(0,214,254,0.55), inset 0 1px 0 rgba(255,255,255,0.40)',
            cursor: !valid ? 'not-allowed' : 'pointer',
          }}>
          Send reset link
        </button>
      </div>
    </div>
  );
};

/* ── ResetPasswordScreen ────────────────────────────────────────
   Direct port of DS screens/auth/ResetPassword.tsx. New password +
   confirm → "Save password" → "Password updated" success card.
   `invalidToken` prop renders the "this link expired" full-screen
   state instead of the form (demo: toggle via prop). */
const ResetPasswordScreen = ({ onBack, onRequestNewLink, invalidToken = false }) => {
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [done, setDone] = useState(false);
  const pwLongEnough = password.length >= 6;
  const pwMatch = !confirm || password === confirm;
  const valid = pwLongEnough && password === confirm;
  const confirmError = confirm && !pwMatch ? "Passwords don't match" : null;

  if (invalidToken) {
    return (
      <div className="anim-fade px-6 pt-24 text-center max-w-[440px] mx-auto">
        <div className="w-16 h-16 rounded-full mx-auto mb-5 flex items-center justify-center"
          style={{
            background: 'rgba(220,38,38,0.12)',
            border: '1px solid rgba(220,38,38,0.45)',
            boxShadow: '0 0 32px rgba(220,38,38,0.30)',
          }}>
          <svg width={28} height={28} viewBox="0 0 28 28" fill="none" stroke="rgba(252,165,165,0.95)"
            strokeWidth={2.4} strokeLinecap="round" strokeLinejoin="round"
            style={{ width: 28, height: 28, display: 'block' }}>
            <circle cx={14} cy={14} r={11} />
            <path d="M14 8 V15" />
            <path d="M14 19 L14 19.5" />
          </svg>
        </div>
        <h1 className="sf-display text-[24px] font-bold text-white leading-tight tracking-[-0.022em] mb-2">
          This link expired
        </h1>
        <p className="sf text-[13px] leading-relaxed max-w-[260px] mx-auto mb-8" style={{ color: 'var(--text-tertiary)' }}>
          For your security, reset links work once and only for an hour. Request a fresh one.
        </p>
        <button onClick={onRequestNewLink}
          className="squircle-md py-3 px-6 sf text-[13px] font-semibold"
          style={{
            color: '#0a0d18',
            background: 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            boxShadow: '0 4px 12px -2px rgba(0,214,254,0.45), inset 0 1px 0 rgba(255,255,255,0.40)',
          }}>
          Send a new link
        </button>
      </div>
    );
  }

  if (done) {
    return (
      <div className="anim-fade px-6 pt-24 text-center max-w-[440px] mx-auto">
        <div className="w-16 h-16 rounded-full lg-glass-strong mx-auto mb-5 flex items-center justify-center"
          style={{ boxShadow: '0 0 32px rgba(0,214,254,0.45)' }}>
          <svg width={28} height={28} viewBox="0 0 28 28" fill="none" stroke="var(--brand-cyan)"
            strokeWidth={3} strokeLinecap="round" strokeLinejoin="round"
            style={{ width: 28, height: 28, display: 'block' }}>
            <path d="M5 14 L11 20 L23 8" />
          </svg>
        </div>
        <h1 className="sf-display text-[24px] font-bold text-white leading-tight tracking-[-0.022em] mb-2">
          Password updated
        </h1>
        <p className="sf text-[13px] leading-relaxed max-w-[260px] mx-auto mb-8" style={{ color: 'var(--text-tertiary)' }}>
          All set. Sign in with your new password.
        </p>
        <button onClick={onBack}
          className="squircle-md py-3 px-6 sf text-[13px] font-semibold"
          style={{
            color: '#0a0d18',
            background: 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            boxShadow: '0 4px 12px -2px rgba(0,214,254,0.45), inset 0 1px 0 rgba(255,255,255,0.40)',
          }}>
          Back to sign in
        </button>
      </div>
    );
  }

  return (
    <div className="anim-fade max-w-[440px] mx-auto">
      <div className="pt-12 px-5 lg:px-0">
        <AuthBackButton onBack={onBack} />
      </div>
      <div className="px-6 pt-8 lg:px-0">
        <h1 className="sf-display text-[26px] font-bold text-white leading-tight tracking-[-0.025em] text-center mb-1.5">
          Set a new password
        </h1>
        <p className="sf text-[13px] text-center mb-7" style={{ color: 'rgba(255,255,255,0.60)' }}>
          6+ characters. Use something memorable.
        </p>
        <div className="space-y-3">
          <AuthGlassField label="New password" type="password" value={password} onChange={setPassword}
            placeholder="6+ characters" autoFocus />
          <AuthGlassField label="Confirm" type="password" value={confirm} onChange={setConfirm}
            placeholder="Type it again" error={confirmError} />
        </div>
        <button onClick={valid ? () => setDone(true) : undefined} disabled={!valid}
          className="mt-5 squircle-md py-3.5 w-full sf text-[14.5px] font-semibold transition-all"
          style={{
            color: !valid ? 'rgba(255,255,255,0.40)' : '#0a0d18',
            background: !valid ? 'var(--glass-card-bg)' : 'linear-gradient(180deg, rgba(0,235,255,1) 0%, rgba(0,200,250,1) 100%)',
            border: !valid ? '1px solid var(--glass-card-border)' : 'none',
            boxShadow: !valid ? 'none' : '0 8px 24px -8px rgba(0,214,254,0.55), inset 0 1px 0 rgba(255,255,255,0.40)',
            cursor: !valid ? 'not-allowed' : 'pointer',
          }}>
          Save password
        </button>
      </div>
    </div>
  );
};

/* AuthSubScreen — orchestrator for #/auth/forgot and #/auth/reset.
   Wraps the screen in the same atmosphere + vignette as the main auth
   surface so the visual frame stays consistent. */
const AuthSubScreen = ({ step, onBack, onRequestNewLink }) => (
  <div data-theme="dark" className="anim-fade text-white sf relative" style={{ minHeight: '100vh', background: 'var(--canvas-bg)' }}>
    <div className="lg-atmosphere" />
    <div className="absolute inset-0 z-[1] pointer-events-none"
      style={{ background: 'linear-gradient(180deg, var(--vignette-corner) 0%, transparent 30%, transparent 70%, var(--vignette-corner-soft) 100%)' }} />
    <div className="absolute inset-0 z-10 overflow-y-auto">
      {step === 'forgot' && <ForgotPasswordScreen onBack={onBack} />}
      {step === 'reset' && <ResetPasswordScreen onBack={onBack} onRequestNewLink={onRequestNewLink} />}
    </div>
  </div>
);

/* ============================================================
   11. APP — phone shell + desktop SideNav + router
   ============================================================ */
const App = () => {
  const [theme, setTheme] = useState('dark');
  const [auth, setAuth] = useState(false);
  const [tab, setTab] = useState('home');
  const [pushed, setPushed] = useState(null); // { kind: 'post-game'|'highlight-viewer'|'storytelling-drop'|'pack-reveal', id?, momentIndex? }
  const [menuOpen, setMenuOpen] = useState(false);
  const [bellOpen, setBellOpen] = useState(false);
  const [gameState, setGameState] = useState('off'); // off | live | ready
  /* Onboarding flow overlay — null = no onboarding, 'fan' = generic Onboarding
     (persona picker → teams → players → done), 'player' = PlayerOnboarding
     (coach-invite → signup/signin → teams-locked → claim-and-follow → notif).
     Driven by hash route (#/onboard, #/onboard/player). When set, the App
     renders the onboarding orchestrator instead of the auth or app tree. */
  const [onboardFlow, setOnboardFlow] = useState(null);
  /* Auth sub-route — null = SignIn (the existing default), 'forgot' = forgot
     password, 'reset' = reset password. Driven by #/auth/forgot, #/auth/reset
     hash routes. Placeholders stubbed in Phase 0; real screens in Phase 3. */
  const [authStep, setAuthStep] = useState(null);
  /* Locale — 'en' (default) or 'he'. Hebrew flips dir="rtl" on the app
     wrapper. Switched via the Language sub-page in SideMenu. Persisted
     to localStorage so the next session restores the same direction. */
  const [locale, setLocaleState] = useState(() => {
    try { return localStorage.getItem('halo.lang') || 'en'; }
    catch (e) { return 'en'; }
  });
  const setLocale = (next) => {
    setLocaleState(next);
    try { localStorage.setItem('halo.lang', next); } catch (e) {}
  };
  /* Email-verification state — demo only. Defaults to false so the
     verify-email banner is visible the first time the user opens the
     SideMenu. Tapping "Resend link" flips it to true (banner hides). */
  const [emailVerified, setEmailVerified] = useState(false);
  /* SideNav collapse — persists across reloads via localStorage. */
  const [sideNavCollapsed, setSideNavCollapsed] = useState(() => {
    try { return localStorage.getItem('halo.sidenav.collapsed') === '1'; }
    catch (e) { return false; }
  });
  const toggleSideNav = () => {
    setSideNavCollapsed(v => {
      const next = !v;
      try { localStorage.setItem('halo.sidenav.collapsed', next ? '1' : '0'); } catch (e) {}
      return next;
    });
  };

  // Hash-based routing for shareable URLs
  useEffect(() => {
    const apply = () => {
      const h = window.location.hash.replace(/^#\/?/, '') || 'auth';
      const [route, sub, ...rest] = h.split('/');
      /* Onboarding routes — show the orchestrator instead of auth or app
         tree. `#/onboard` = fan/parent persona picker flow. `#/onboard/player`
         = coach-invite player flow. Both branches keep auth=false so the
         onboarding screens own the canvas (no SideNav/BottomNav chrome). */
      if (route === 'onboard') {
        setAuth(false);
        setAuthStep(null);
        setOnboardFlow(sub === 'player' ? 'player' : 'fan');
        return;
      }
      /* Auth sub-routes — `#/auth/forgot`, `#/auth/reset`. Default `#/auth`
         falls back to SignIn (authStep=null). */
      if (route === 'auth') {
        setAuth(false);
        setOnboardFlow(null);
        setAuthStep(sub === 'forgot' ? 'forgot' : sub === 'reset' ? 'reset' : null);
        return;
      }
      setAuth(true);
      setOnboardFlow(null);
      setAuthStep(null);
      if (['home','games','watch','profile'].includes(route)) {
        setTab(route);
        setPushed(null);
      } else if (route === 'post-game') {
        setPushed({ kind: 'post-game', id: sub || 'gE' });
      } else if (route === 'highlight') {
        setPushed({ kind: 'highlight-viewer', momentIndex: Number(sub || 0) });
      } else if (route === 'story') {
        setPushed({ kind: 'storytelling-drop', id: sub || 'sd1' });
      } else if (route === 'pack') {
        setPushed({ kind: 'pack-reveal', id: sub || 'gE' });
      } else if (route === 'game-video') {
        setPushed({ kind: 'game-video', id: sub || 'gE' });
      }
    };
    apply();
    window.addEventListener('hashchange', apply);
    return () => window.removeEventListener('hashchange', apply);
  }, []);
  const navigate = (h) => { window.location.hash = '#/' + h; };

  const onSignIn = () => { setAuth(true); navigate('home'); };
  /* Sign-Up entry — routes into the generic FanOnboarding persona picker.
     PersonaStep auto-forks to PlayerOnboarding (#/onboard/player) when the
     user picks "Player", so this single entry covers fan, parent, and
     player paths. The user keeps onboard chrome (no SideNav) until the
     orchestrator calls onOnboardDone. */
  const onSignUp = () => { navigate('onboard'); };
  /* Sign out — clears auth + sends user back to the SignIn screen via the
     #/auth hash route. Same effect from phone SideMenu and desktop SideNav. */
  const onSignOut = () => { setAuth(false); navigate('auth'); };
  /* Demo handler — wired to the "Player invite (demo)" affordance in both
     the desktop SideNav and the phone SideMenu. Drops the signed-in user
     directly at PlayerInviteEntry, the first screen a real player would
     see after tapping a coach's invite link. Closes the phone drawer
     before navigating so the overlay doesn't sit on top of the flow. */
  const onDemoPlayerInvite = () => { setMenuOpen(false); navigate('onboard/player'); };
  /* Same handler reused on the SignIn screen's mail icon — lets a brand
     new player from a coach link jump straight to PlayerInviteEntry
     without going through Sign Up first. No menu state to close here. */
  const onOpenInviteFromAuth = () => navigate('onboard/player');
  /* Onboarding completion handlers — both flows land on Home when done. */
  const onOnboardDone = () => { setOnboardFlow(null); setAuth(true); navigate('home'); };
  const onSetTab = (k) => { navigate(k); };
  const onPickMoment = (idx) => navigate('highlight/' + idx);
  /* Game card tap — opens the PostGameScreen recap (stats + tabs). */
  const onOpenGame = (id) => navigate('post-game/' + id);
  /* 16:9 game-video tap — opens GameVideoViewer (full game / team
     highlight playback). Distinct from `onOpenGame` (which opens the
     stat recap). Per the May 2026 critique: video viewer for video
     content, recap for stats. */
  const onOpenGameVideo = (id) => navigate('game-video/' + id);
  /* Story drop tap — routes to the dedicated StorytellingDropViewer
     (60-40 layout with horizontal-snap moment cards + insight panel). */
  const onOpenStory = (id) => navigate('story/' + id);
  const onOpenAthlete = (id) => navigate('profile');
  /* "Drop is ready" CTA on the GameCard — routes to the cinematic
     PackReveal ceremony (3-stage anim), which then jumps into
     HighlightViewer when the user picks a moment. */
  const onOpenDrop = (id) => navigate('pack/' + id);

  const phoneHeader = (
    <HomeHeader
      greeting={tab === 'home' ? 'Game day' : tab === 'games' ? 'Games' : tab === 'profile' ? 'You' : ''}
      theme={theme}
      onTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
      onMenu={() => setMenuOpen(true)}
      onBell={() => setBellOpen(true)}
    />
  );

  const renderTabContent = (showHeader = true) => {
    const header = showHeader ? phoneHeader : null;
    if (tab === 'home') return <HomeScreen header={header} gameState={gameState} onPickMoment={onPickMoment} onOpenGame={onOpenGame} onOpenGameVideo={onOpenGameVideo} onOpenStory={onOpenStory} onOpenAthlete={onOpenAthlete} onOpenDrop={onOpenDrop} />;
    if (tab === 'games') return <GamesScreen onOpenGame={onOpenGame} />;
    if (tab === 'watch') return <WatchScreen onOpenGame={onOpenGame} onOpenGameVideo={onOpenGameVideo} onPickMoment={onPickMoment} />;
    if (tab === 'profile') return <AthleteProfileScreen onPickMoment={onPickMoment} onOpenGame={onOpenGame} onBack={() => navigate('home')} asTab />;
    return null;
  };

  // === ONBOARDING ===
  // Routed via #/onboard (fan) and #/onboard/player. Auth stays false
  // (onboarding screens own the canvas; no SideNav/BottomNav chrome).
  if (onboardFlow) {
    const Flow = onboardFlow === 'player' ? PlayerOnboarding : FanOnboarding;
    /* onExit — fired when the user hits the back chevron from the first
       onboarding screen. Routes back to the auth screen so they can
       sign in instead of continuing onboarding. */
    const onExitOnboard = () => navigate('auth');
    return (
      <div className={`glass-app app-stage`} data-theme={theme} dir={locale === 'he' ? 'rtl' : 'ltr'}>
        <div className="stage-phone">
          <div className="phone" data-theme={theme}>
            {/* 100dvh, not 100vh — see .phone CSS rationale. The
                phone-screen wrapper has to match the .phone height
                exactly or the orchestrator card's `absolute inset:0`
                stretches past the visible viewport. */}
            <div className="phone-screen relative" style={{ minHeight: '100dvh' }}>
              <Flow onDone={onOnboardDone} onExit={onExitOnboard} />
            </div>
          </div>
        </div>
        <div className="stage-desktop relative" style={{ minHeight: '100vh' }}>
          <Flow onDone={onOnboardDone} onExit={onExitOnboard} />
        </div>
      </div>
    );
  }

  // === AUTH ===
  // Phone: ClientLogoHero (lg:hidden) + form. Desktop: BrandPanel (~55% navy + cyan mark) + form (~45%, max-w-440).
  // Mirrors halo-design-system/src/layouts/AuthCanvas.tsx. Sub-routes:
  //   #/auth          → SignIn (default)
  //   #/auth/forgot   → ForgotPassword (placeholder until Phase 3)
  //   #/auth/reset    → ResetPassword (placeholder until Phase 3)
  if (!auth) {
    /* Sub-route placeholder — shown above the normal SignIn surface. */
    if (authStep === 'forgot' || authStep === 'reset') {
      return (
        <div className={`glass-app app-stage`} data-theme={theme} dir={locale === 'he' ? 'rtl' : 'ltr'}>
          <div className="stage-phone">
            <div className="phone" data-theme={theme}>
              <div className="phone-screen relative">
                {/* scroll-area wrap matches the main auth fix above —
                    forgot/reset password screens also need to scroll
                    on phone. */}
                <div className="scroll-area">
                  <AuthSubScreen step={authStep} onBack={() => navigate('auth')} onRequestNewLink={() => navigate('auth/forgot')} />
                </div>
              </div>
            </div>
          </div>
          <div className="stage-desktop relative" style={{ minHeight: '100vh' }}>
            <AuthSubScreen step={authStep} onBack={() => navigate('auth')} onRequestNewLink={() => navigate('auth/forgot')} />
          </div>
        </div>
      );
    }
    return (
      <div className={`glass-app app-stage`} data-theme={theme} dir={locale === 'he' ? 'rtl' : 'ltr'}>
        {/* PHONE — ClientLogoHero + form.
            .scroll-area wrap added: without it the phone-screen's
            overflow:hidden clips the Sign Up form (the fields below the
            fold became unreachable on phone). Post-auth tabs already
            wrap their content in .scroll-area, auth had been missing
            this. */}
        <div className="stage-phone">
          <div className="phone" data-theme={theme}>
            <div className="phone-screen">
              <div className="scroll-area">
                <SignInScreen onSignIn={onSignIn} onSignUp={onSignUp} onOpenInvite={onOpenInviteFromAuth}
                  theme={theme} onToggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} />
              </div>
            </div>
          </div>
        </div>
        {/* DESKTOP — split: BrandPanel (left ~55%) + form (right ~45%).
            position:relative is required so the InviteIconButton below
            anchors to this stage instead of the document body. */}
        <div className="stage-desktop" style={{ minHeight: '100vh', position: 'relative', color: 'var(--text-primary)', background: 'var(--canvas-bg)' }}>
          {/* Top-corner cluster — theme toggle inline-start of the
              invite mail icon. Both anchor to .stage-desktop (position
              relative). Pre-auth there's no SideNav yet, so this is
              where the theme flip lives until the user signs in. */}
          <AuthThemeToggle theme={theme} onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} />
          <InviteIconButton onClick={onOpenInviteFromAuth} />
          <aside data-theme="dark" aria-hidden="true"
            style={{
              flex: '11 1 0',
              display: 'flex',
              flexDirection: 'column',
              justifyContent: 'center',
              alignItems: 'center',
              position: 'relative',
              overflow: 'hidden',
              background: 'radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0,214,254,0.10) 0%, transparent 65%), linear-gradient(180deg, transparent 0%, transparent 50%, rgba(0,0,0,0.20) 100%), var(--client-accent)',
              boxShadow: 'inset 0 -1px 0 rgba(255,255,255,0.06)',
              color: '#fff',
            }}>
            <div style={{ filter: 'drop-shadow(0 0 40px rgba(0,214,254,0.35))' }}>
              <ClientLogoMark />
            </div>
          </aside>
          <main className="relative z-10 flex flex-col px-10 xl:px-16 pb-16 max-h-screen overflow-y-auto"
            style={{ flex: '9 1 0', paddingTop: '20vh' }}>
            <div className="w-full mx-auto" style={{ maxWidth: 440 }}>
              <SignInForm onSubmit={onSignIn} onSignUp={onSignUp} />
            </div>
          </main>
        </div>
      </div>
    );
  }

  // === APP (post-auth) ===

  // Phone-mode pushed screens cover the tab — desktop pushes inline.
  const phonePush = pushed && (
    pushed.kind === 'post-game' ? <PostGameScreen gameId={pushed.id} onBack={() => navigate(tab)} onPickMoment={onPickMoment} />
    : null
  );
  /* Overlay layer — sits above the tab tree. Routed by `pushed.kind`.
     Aspect ratio of the video follows the CONTENT (not the device):
       'highlight-viewer'  → 9:16 (player HL drops)
       'storytelling-drop' → 9:16 multi-moment story
       'game-video'        → 16:9 (full game / team highlight)
       'pack-reveal'       → ceremony (no video; routes forward to HL viewer)
     "Watch full game" CTA inside HighlightViewer routes to game-video,
     not post-game (post-game is the stat recap, not the video). */
  const overlay = (
    pushed?.kind === 'highlight-viewer'
      ? <HighlightViewer momentIndex={pushed.momentIndex} onClose={() => navigate(tab)}
          onWatchFullGame={(gid) => navigate('game-video/' + gid)} />
    : pushed?.kind === 'storytelling-drop'
      ? <StorytellingDropViewer storyId={pushed.id} onClose={() => navigate(tab)}
          onPickMoment={(idx) => navigate('highlight/' + idx)} />
    : pushed?.kind === 'game-video'
      ? <GameVideoViewer gameId={pushed.id} onClose={() => navigate(tab)} />
    : pushed?.kind === 'pack-reveal'
      ? <PackReveal gameId={pushed.id} onClose={() => navigate(tab)}
          onPickMoment={(idx) => navigate('highlight/' + idx)} />
    : null
  );

  return (
    <div className={`glass-app app-stage`} data-theme={theme} dir={locale === 'he' ? 'rtl' : 'ltr'}>
      {/* === PHONE STAGE (< lg) === */}
      <div className="stage-phone">
        <div className="phone" data-theme={theme}>
          <div className="phone-screen">
            <div className="scroll-area">
              {phonePush || renderTabContent(true)}
            </div>
            {(!pushed || (pushed.kind !== 'highlight-viewer' && pushed.kind !== 'storytelling-drop' && pushed.kind !== 'pack-reveal' && pushed.kind !== 'game-video')) && <BottomNav active={tab} onSet={onSetTab} />}
            {menuOpen && <SideMenu onClose={() => setMenuOpen(false)} onNav={onSetTab}
              theme={theme} onTheme={() => { setTheme(t => t === 'dark' ? 'light' : 'dark'); }}
              onSignOut={onSignOut}
              locale={locale} setLocale={setLocale}
              emailVerified={emailVerified} onVerifyEmail={() => setEmailVerified(true)}
              onDemoPlayerInvite={onDemoPlayerInvite} />}
            {bellOpen && <NotificationsSheet onClose={() => setBellOpen(false)} onOpenGame={onOpenGame} />}
            {overlay}
          </div>
        </div>
      </div>

      {/* === DESKTOP STAGE (lg+) === */}
      <div className="stage-desktop" style={{ position: 'relative', minHeight: '100vh' }}>
        <div className="lg-atmosphere" />
        <div className="relative z-10 flex w-full" style={{ minHeight: '100vh' }}>
          {/* Side nav — collapsible. Toggle persists in localStorage. */}
          <aside className={`ds-sidenav ${sideNavCollapsed ? 'collapsed' : ''}`}>
            {/* Brand row — favicon-style cyan mark + HALO wordmark + cyan PLAYER eyebrow.
                When collapsed, only the mark remains. */}
            <div className="ds-sidenav-brand-row">
              <div className="ds-sidenav-brand-mark">H</div>
              <div className="ds-sidenav-brand-wordmark flex items-baseline gap-1.5">
                <span className="sf-display font-bold text-[18px] leading-none" style={{ color: 'var(--text-primary)' }}>HALO</span>
                <span className="sf text-[9px] tracking-[0.18em] uppercase font-bold" style={{ color: 'var(--brand-cyan-text)' }}>player</span>
              </div>
            </div>
            {/* Toggle button — small chevron, lives at the top of the bar */}
            <button onClick={toggleSideNav} className="ds-sidenav-toggle mb-5" aria-label={sideNavCollapsed ? 'Expand sidebar' : 'Collapse sidebar'}>
              <svg width={11} height={11} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">
                <path d="M8.5 2.5 L4 7 L8.5 11.5" />
              </svg>
            </button>
            {[
              { key: 'home',    label: 'Home', icon: 'home' },
              { key: 'games',   label: 'Games', icon: 'games' },
              { key: 'watch',   label: 'Watch', icon: 'watch' },
              { key: 'profile', label: 'You',   icon: 'profile' },
            ].map(it => (
              <button key={it.key} onClick={() => onSetTab(it.key)} title={sideNavCollapsed ? it.label : ''}
                className={`ds-sidenav-item ${tab === it.key ? 'active' : ''}`}>
                <Icon name={it.icon} size={18} stroke={tab === it.key ? 2 : 1.6} />
                <span className="ds-sidenav-label">{it.label}</span>
              </button>
            ))}
            <div className="flex-1" />
            <button onClick={() => setBellOpen(true)} className="ds-sidenav-item" title={sideNavCollapsed ? 'Notifications · 3 unread' : ''}>
              <span className="ds-sidenav-icon-wrap">
                <Icon name="bell" size={18} />
                <span className="ds-sidenav-dot" aria-hidden="true" />
              </span>
              <span className="ds-sidenav-label">Notifications</span>
              <span className="ds-sidenav-badge ms-auto sf text-[10px] live-red rounded-full px-1.5 py-0.5 font-bold leading-none" style={{ minWidth: 18, textAlign: 'center' }}>3</span>
            </button>
            {/* Settings gear — opens the SideMenu drawer. Per user spec
                (P4a), this is the desktop entry point for Account /
                Notifications / Language / Subscription / Permissions /
                Help — all the surfaces the hamburger gives phone users.
                Sits between Notifications and Theme so it groups with
                the other "system" actions in the bottom cluster. */}
            <button onClick={() => setMenuOpen(true)} className="ds-sidenav-item" title={sideNavCollapsed ? 'Settings' : ''}>
              <Icon name="settings" size={18} />
              <span className="ds-sidenav-label">Settings</span>
            </button>
            {/* Demo · Player invite — drops the user at PlayerInviteEntry,
                the first screen a real player sees after tapping a coach
                invite link. Cyan-tinted "(demo)" suffix so reviewers know
                this row is a prototype shortcut, not production UX.
                Sits right after Settings per Yoni's spec. */}
            <button onClick={onDemoPlayerInvite} className="ds-sidenav-item" title={sideNavCollapsed ? 'Demo: Player invite link' : ''}>
              <Icon name="mail" size={18} />
              <span className="ds-sidenav-label">
                Player invite
                <span className="ms-1.5 sf text-[9.5px] tracking-[0.16em] uppercase font-bold"
                  style={{ color: 'var(--brand-cyan-text)' }}>demo</span>
              </span>
            </button>
            <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} className="ds-sidenav-item" title={sideNavCollapsed ? (theme === 'dark' ? 'Light mode' : 'Dark mode') : ''}>
              <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={18} />
              <span className="ds-sidenav-label">{theme === 'dark' ? 'Light' : 'Dark'} mode</span>
            </button>
            {/* Sign out — danger-tinted text. Same handler as the phone
                SideMenu version. Sits between Theme and the user card so
                it's visible whether the bar is expanded or collapsed
                (icon-only in the collapsed bar; tooltip clarifies). */}
            <button onClick={onSignOut} className="ds-sidenav-item" title={sideNavCollapsed ? 'Sign out' : ''} style={{ color: '#fca5a5' }}>
              <Icon name="logout" size={18} />
              <span className="ds-sidenav-label">Sign out</span>
            </button>
            {!sideNavCollapsed && <div className="border-t mx-2 my-3" style={{ borderColor: 'var(--hairline)' }} />}
            {sideNavCollapsed && <div className="my-2" />}
            <button onClick={() => onSetTab('profile')} className="ds-sidenav-user" title={sideNavCollapsed ? `${PLAYER.name} · #${PLAYER.number}` : ''}>
              <div className="ds-sidenav-avatar">{PLAYER.initials}</div>
              <div className="ds-sidenav-meta flex-1 min-w-0">
                <div className="sf text-[13px] font-semibold leading-tight" style={{ color: 'var(--text-primary)' }}>{PLAYER.name}</div>
                <div className="sf text-[10.5px]" style={{ color: 'var(--text-tertiary)' }}>#{PLAYER.number} · {PLAYER.team}</div>
              </div>
            </button>
          </aside>

          {/* Main — Watch escapes the 920px cap and goes full-bleed
              per DS WatchShell. Other tabs stay in the capped main column. */}
          {tab === 'watch' && !phonePush ? (
            <div className="ds-watch-full">
              {renderTabContent(false)}
            </div>
          ) : (
            <main className="ds-desktop-main relative">
              {phonePush || renderTabContent(false)}
            </main>
          )}
        </div>
        {bellOpen && <NotificationsSheet onClose={() => setBellOpen(false)} onOpenGame={onOpenGame} />}
        {/* SettingsModal — desktop render. Replaces the phone-style
            right-side drawer with a centered 2-column glass modal that
            fits a desktop canvas. Reuses every Menu*Page component the
            drawer uses; only the outer shell differs. Triggered by the
            gear icon in the desktop SideNav. */}
        {menuOpen && <SettingsModal onClose={() => setMenuOpen(false)}
          theme={theme} onTheme={() => { setTheme(t => t === 'dark' ? 'light' : 'dark'); }}
          onSignOut={onSignOut}
          locale={locale} setLocale={setLocale}
          emailVerified={emailVerified} onVerifyEmail={() => setEmailVerified(true)} />}
        {overlay}
      </div>
    </div>
  );
};

const NotificationsSheet = ({ onClose, onOpenGame }) => {
  const [items, setItems] = useState([
    { id: 'n1', kind: 'live',   title: 'Varsity is LIVE',          body: 'Q2 · vs Westfield Hawks',         when: 'now',    cta: () => onOpenGame('gL') },
    { id: 'n2', kind: 'drop',   title: 'New drop ready',           body: '8 of your moments from last night', when: '12m ago', cta: () => onOpenGame('gE') },
    { id: 'n3', kind: 'follow', title: 'Sarah Kim followed you',   body: '#12 PG · Varsity',                 when: '1h ago' },
    { id: 'n4', kind: 'system', title: 'Your story dropped',       body: '"You\'re 14% sharper in 4Q"',       when: '3h ago' },
  ]);
  const KIND = {
    live:   { dot: 'var(--state-live)',     icon: 'play',  label: 'LIVE' },
    drop:   { dot: 'var(--brand-cyan)',     icon: 'flame', label: 'DROP' },
    follow: { dot: '#8458ff',                icon: 'heart', label: 'FOLLOW' },
    system: { dot: 'var(--text-faint)',      icon: 'bell',  label: 'HALO' },
  };
  return (
    <div className="absolute inset-0 z-50 anim-fade" onClick={onClose}>
      <div className="absolute inset-0 bg-black/55" />
      <div className="absolute top-0 inset-x-0 anim-slide-sheet" style={{ transform: 'translateY(0)', background: 'var(--menu-surface)', backdropFilter: 'blur(48px) saturate(180%)', WebkitBackdropFilter: 'blur(48px) saturate(180%)', borderBottomLeftRadius: 28, borderBottomRightRadius: 28, paddingBottom: 18, borderBottom: '1px solid var(--hairline)' }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 pt-12 pb-3">
          <div className="sf-display text-[18px] font-bold" style={{ color: 'var(--text-primary)' }}>Notifications</div>
          <div className="flex items-center gap-2">
            <button onClick={() => setItems([])} className="sf text-[12px] font-semibold" style={{ color: 'var(--text-tertiary)' }}>Clear all</button>
            <button onClick={onClose} className="w-8 h-8 lg-glass squircle-sm flex items-center justify-center" style={{ color: 'var(--text-secondary)' }}><Icon name="close" size={14} /></button>
          </div>
        </div>
        <div className="px-3 max-h-[60vh] overflow-y-auto no-scrollbar">
          {items.length === 0 ? (
            <div className="sf text-center py-12" style={{ color: 'var(--text-faint)' }}>You're all caught up.</div>
          ) : items.map(n => {
            const k = KIND[n.kind] || KIND.system;
            return (
              <button key={n.id} onClick={() => { n.cta && n.cta(); onClose(); }} className="w-full flex items-start gap-3 px-3 py-3 squircle-sm hover:bg-white/5 text-start anim-fade">
                <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: 'var(--glass-card-bg)', border: '1px solid var(--glass-card-border)', color: k.dot }}>
                  <Icon name={k.icon} size={14} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-0.5">
                    <span className="sf text-[9px] font-bold tracking-[0.15em]" style={{ color: k.dot }}>{k.label}</span>
                    <span className="sf text-[10px]" style={{ color: 'var(--text-faint)' }}>{n.when}</span>
                  </div>
                  <div className="sf text-[13.5px] font-semibold leading-tight mb-0.5" style={{ color: 'var(--text-primary)' }}>{n.title}</div>
                  <div className="sf text-[11.5px]" style={{ color: 'var(--text-tertiary)' }}>{n.body}</div>
                </div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
