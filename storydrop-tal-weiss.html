const Cursor = () => {
  const dotRef  = useRef(null);
  const ringRef = useRef(null);
  const pos     = useRef({ x: -200, y: -200 });
  const ring    = useRef({ x: -200, y: -200 });

  useEffect(() => {
    const onMove = ({ clientX: x, clientY: y }) => {
      pos.current = { x, y };
      if (dotRef.current) {
        dotRef.current.style.left = x + 'px';
        dotRef.current.style.top  = y + 'px';
      }
    };
    const onOver = (e) => {
      const t = e.target.closest('a, button, [role="button"], [tabindex]');
      if (!ringRef.current) return;
      if (t) {
        ringRef.current.style.width  = '54px';
        ringRef.current.style.height = '54px';
        ringRef.current.style.borderColor = 'rgba(0,214,254,0.65)';
        ringRef.current.style.opacity = '0.9';
      } else {
        ringRef.current.style.width  = '34px';
        ringRef.current.style.height = '34px';
        ringRef.current.style.borderColor = 'rgba(240,235,225,0.45)';
        ringRef.current.style.opacity = '1';
      }
    };
    let raf;
    const tick = () => {
      ring.current.x += (pos.current.x - ring.current.x) * 0.10;
      ring.current.y += (pos.current.y - ring.current.y) * 0.10;
      if (ringRef.current) {
        ringRef.current.style.left = ring.current.x + 'px';
        ringRef.current.style.top  = ring.current.y + 'px';
      }
      raf = requestAnimationFrame(tick);
    };
    window.addEventListener('mousemove', onMove);
    document.addEventListener('mouseover', onOver);
    raf = requestAnimationFrame(tick);
    return () => {
      window.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseover', onOver);
      cancelAnimationFrame(raf);
    };
  }, []);

  return (
    <>
      <div ref={dotRef} aria-hidden="true" style={{
        position: 'fixed', width: 5, height: 5, borderRadius: '50%',
        background: 'var(--cream)', transform: 'translate(-50%, -50%)',
        pointerEvents: 'none', zIndex: 10001, mixBlendMode: 'difference',
      }} />
      <div ref={ringRef} className="cursor-ring" aria-hidden="true" style={{
        position: 'fixed', width: 34, height: 34, borderRadius: '50%',
        border: '1px solid rgba(240,235,225,0.45)',
        transform: 'translate(-50%, -50%)',
        pointerEvents: 'none', zIndex: 10000,
      }} />
    </>
  );
};

const AnchoredOpen = () => {
  const sectionRef = useRef(null);
  const [progress, setProgress] = useState(0);
  const [landed, setLanded] = useState(false);
  const [flashKey, setFlashKey] = useState(0);
  const lastLandedRef = useRef(false);

  useEffect(() => {
    const onScroll = () => {
      const sec = sectionRef.current;
      if (!sec) return;
      const rect = sec.getBoundingClientRect();
      const scrollable = sec.offsetHeight - window.innerHeight;
      const p = Math.max(0, Math.min(1, -rect.top / scrollable));
      setProgress(p);
      const isLanded = p > 0.65;
      if (isLanded && !lastLandedRef.current) setFlashKey(k => k + 1);
      lastLandedRef.current = isLanded;
      setLanded(isLanded);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const fallProgress = Math.min(1, progress / 0.65);
  const eased = fallProgress * fallProgress;
  const ballTopVh = -30 + 100 * eased;
  const rotation = fallProgress * 380;

  return (
    <section ref={sectionRef} className="relative" style={{ height: '240vh' }}>
      <div className="sticky top-0 h-screen overflow-hidden flex items-end justify-center">
        <div className="absolute top-14 inset-x-0 text-center px-6 z-10 transition-opacity duration-500"
          style={{ opacity: landed ? 0 : 1 }}>
          <div className="mono text-[10.5px] tracking-[0.30em] uppercase text-cream-30 mb-3">
            How it started
          </div>
          <div className="serif text-cream-95" style={{ fontSize: 'clamp(2.5rem, 6vw, 5rem)', letterSpacing: '-0.02em', lineHeight: 1.05, fontWeight: 400 }}>
            One pass. Then it was on.
          </div>
        </div>

        <div
          className="absolute left-1/2 z-20"
          style={{
            top: `${ballTopVh}vh`,
            transform: `translateX(-50%) rotate(${rotation}deg)`,
            transition: 'top 60ms linear, transform 60ms linear',
            filter: 'drop-shadow(0 18px 32px rgba(0,0,0,0.55))',
            opacity: landed ? 0 : 1,
            transitionProperty: 'opacity',
            transitionDuration: '300ms',
            transitionDelay: landed ? '120ms' : '0ms',
          }}>
          <JerseyPlaque size={130} />
        </div>

        {landed && (
          <div key={flashKey} className="absolute inset-0 z-30 pointer-events-none flash-in"
            style={{ background: 'rgba(0,214,254,0.30)' }} />
        )}

        <div className="absolute inset-0 z-40 px-6 lg:px-16 transition-opacity duration-700 flex items-center"
          style={{ opacity: landed ? 1 : 0, pointerEvents: landed ? 'auto' : 'none' }}>
          <div className="w-full max-w-[1280px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-16 items-center">
            <div className="lg:col-span-7 flex flex-col">
              <div className="mono text-[10.5px] tracking-[0.30em] uppercase text-cream-30 mb-5">
                {OPENING.q} · {OPENING.ts} · First basket
              </div>
              <div className="serif italic text-cream-95" style={{ fontSize: 'clamp(4rem, 11vw, 8.5rem)', fontWeight: 300, lineHeight: 0.85, letterSpacing: '-0.01em' }}>
                {OPENING.title}
              </div>
              <p className="mono text-[13px] leading-[1.85] text-cream-55 max-w-[44ch] mt-6">
                {OPENING.body}
              </p>
              <div className="mono text-[9.5px] tracking-[0.30em] uppercase text-cream-25 mt-6">
                Halo clip · auto-detected
              </div>
            </div>

            <div className="lg:col-span-5">
              <VideoFrame tsLabel={`${OPENING.q} · ${OPENING.ts}`} captionLabel="No-look pass · Q1 7:33" maxWidth={420} imgSrc={CLIP_IMGS[1]} />

const QuarterScroll = () => {
  const sectionRef = useRef(null);
  const trackRef = useRef(null);
  const progressRef = useRef(null);
  const [active, setActive] = useState(0);
  const rafRef = useRef(null);

  /* Pacing model — 4 panels, 3 transitions.
     Section height = 100vh (panel-1 dwell) + 3 × 100vh (transitions) + a
     small tail so panel-4 doesn't unstick immediately after centering.
     Total ≈ 460vh. The track translates -300vw across the scrollable
     range, so panel-N is fully centered at p = N/3 (N = 0..3). */
  useEffect(() => {
    const onScroll = () => {
      if (rafRef.current) return;
      rafRef.current = requestAnimationFrame(() => {
        rafRef.current = null;
        const sec = sectionRef.current;
        if (!sec) return;
        const rect = sec.getBoundingClientRect();
        const scrollable = sec.offsetHeight - window.innerHeight;
        if (scrollable <= 0) return;
        const p = Math.max(0, Math.min(1, -rect.top / scrollable));
        /* Each panel is centered at p = i/3. translate -p*300vw lines up
           panel i with the viewport when p = i/3. */
        if (trackRef.current) {
          trackRef.current.style.transform = `translate3d(-${p * 300}vw, 0, 0)`;
        }
        if (progressRef.current) progressRef.current.style.width = `${p * 100}%`;
        /* Snap the indicator to the nearest panel. With Math.round(p*3) the
           transitions land at p = 1/6, 1/2, 5/6 — i.e. halfway between
           neighbouring panel centers, which feels right. */
        const a = Math.max(0, Math.min(3, Math.round(p * 3)));
        setActive(a);
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => {
      window.removeEventListener('scroll', onScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  return (
    <section ref={sectionRef} className="relative" style={{ height: '460vh' }}>
      <div className="sticky top-0 h-screen overflow-hidden">
        <div ref={progressRef} className="absolute top-0 start-0 h-[3px] progress-bar z-30" style={{ width: '0%' }} />

        <div className="absolute top-7 inset-x-0 text-center z-20 pointer-events-none">
          <div className="mono text-[10px] tracking-[0.30em] uppercase text-cream-30 mb-0.5">
            Quarter by quarter
          </div>
          <div className="serif italic text-cream-85" style={{ fontSize: 'clamp(1rem, 1.5vw, 1.25rem)' }}>
            how all 24 happened
          </div>
        </div>

        <div ref={trackRef}
          className="flex h-full"
          style={{
            width: '400vw',
            willChange: 'transform',
            /* tiny ease so the slide feels analog under fast scroll wheels —
               not so much that it lags behind the user's finger. */
            transition: 'transform 80ms linear',
          }}>
          {QUARTERS.map((q, i) => (
            <QuarterPanel key={i} q={q} isActive={active === i} />
          ))}
        </div>

        <div className="absolute bottom-8 left-1/2 -translate-x-1/2 flex gap-7 z-30">
          {QUARTERS.map((q, i) => (
            <div key={i}
              className="mono text-[11px] tracking-[0.25em] uppercase transition-all duration-300"
              style={{
                color: i === active ? 'var(--cream)' : 'var(--cream-25)',
                transform: i === active ? 'scale(1.15)' : 'scale(1)',
              }}>
              {q.q}
            </div>
          ))}
        </div>
      </div>
    </section>
  );
};

const ScoreBoard = () => {

  const [vis, setVis] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) setVis(true); },
      { threshold: 0.35 }

    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <section ref={ref} className="relative flex flex-col items-center justify-center overflow-hidden"
      style={{ minHeight: '100vh', background: '#050810' }}>
      <div className="absolute inset-0 pointer-events-none" style={{
        background: 'radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,214,254,0.09) 0%, transparent 65%)',

        transition: 'opacity 1.5s ease 0.6s',
      }} />

      <div className="mono text-[9.5px] tracking-[0.45em] uppercase text-cream-25 mb-10"
        style={{ opacity: vis ? 1 : 0, transition: 'opacity 0.8s ease 0.3s' }}>
        Final Score · {GAME.date} · {GAME.venue}
      </div>

      <div style={{
        overflow: 'hidden',
        padding: '0.08em 0.20em 0.04em',
        clipPath: vis ? 'inset(0 0 0% 0)' : 'inset(0 0 100% 0)',
        transform: vis ? 'translateY(0)' : 'translateY(36px)',
        transition: 'clip-path 1.4s cubic-bezier(0.16,1,0.3,1) 0.5s, transform 1.4s cubic-bezier(0.16,1,0.3,1) 0.5s',
      }}>
        <div className="serif text-center" style={{
          fontSize: 'clamp(5.5rem, 18vw, 16rem)',
          fontWeight: 400, lineHeight: 0.95, letterSpacing: '-0.03em',
          whiteSpace: 'nowrap',
        }}>
          <span style={{ color: 'var(--cream)' }}>{GAME.scoreHome}</span>
          <span style={{ color: 'var(--cream-30)', margin: '0 0.12em' }}>—</span>
          <span style={{ color: 'var(--cream-45)' }}>{GAME.scoreAway}</span>
        </div>
      </div>

      <div className="mt-12 flex items-center justify-center gap-6 sm:gap-10"
        style={{ opacity: vis ? 1 : 0, transition: 'opacity 0.8s ease 1.1s' }}>
        <div className="flex items-center gap-3">
          <TeamLogo team={GAME.home} size={52} accent={true} />
          <div className="mono text-[10px] tracking-[0.30em] uppercase text-cream-85">{GAME.home}</div>
        </div>
        <div className="mono text-[9px] tracking-[0.35em] uppercase text-cream-25">VS</div>
        <div className="flex items-center gap-3">
          <div className="mono text-[10px] tracking-[0.30em] uppercase text-cream-45">{GAME.away}</div>
          <TeamLogo team={GAME.away} size={52} />
        </div>
      </div>
    </section>
  );
};

const Closing = () => {
  const wrapRef = useRef(null);
  const [visible, setVisible] = useState(false);
  const [activeIdx, setActiveIdx] = useState(SEASON_TOP_THREE.findIndex(g => g.isThis));
  const [hoverIdx, setHoverIdx] = useState(null);

  useEffect(() => {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) setVisible(true); });
    }, { threshold: 0.20 });
    if (wrapRef.current) obs.observe(wrapRef.current);
    return () => obs.disconnect();
  }, []);

  const active = SEASON_TOP_THREE[activeIdx];

  return (
    <section ref={wrapRef} className="relative min-h-screen flex flex-col items-center justify-center px-6 py-24">
      <div className="mono text-[10.5px] tracking-[0.35em] uppercase text-cream-30 mb-4">
        Where this night ranks
      </div>
      <div className="serif text-center text-cream-95 mb-12" style={{ fontSize: 'clamp(2rem, 4.5vw, 3.6rem)', fontWeight: 400, lineHeight: 1.05, letterSpacing: '-0.02em', maxWidth: '20ch' }}>
        Your top three<br/>
        <em className="italic" style={{ color: 'var(--cream-45)' }}>this season.</em>
      </div>

      {/* Numbered game selector */}
      <div className={'w-full max-w-[1100px] reveal-up ' + (visible ? 'visible' : '')}>
        <div className="border-t border-cream-08 mb-10">
          {SEASON_TOP_THREE.map((g, i) => {
            const isActive = i === activeIdx;
            const isHovered = i === hoverIdx && !isActive;
            const nameColor = isActive
              ? 'var(--cream)'
              : isHovered ? 'rgba(240,235,225,0.50)' : 'rgba(240,235,225,0.16)';
            const metaColor = isActive ? 'rgba(240,235,225,0.45)' : isHovered ? 'rgba(240,235,225,0.28)' : 'rgba(240,235,225,0.12)';
            const nameSize = isActive
              ? 'clamp(2rem, 4.4vw, 3.5rem)'
              : 'clamp(1.5rem, 3.2vw, 2.5rem)';
            const ptsSize = isActive
              ? 'clamp(1.4rem, 2.6vw, 2.2rem)'
              : 'clamp(1.05rem, 1.9vw, 1.6rem)';
            const rowPadY = isActive ? '1.6rem' : '1.1rem';
            return (
              <button
                key={i}
                type="button"
                className="game-row w-full flex items-center gap-5 lg:gap-8 border-b border-cream-08 text-left"
                style={{
                  background: 'transparent',
                  border: 'none',
                  borderBottom: '1px solid rgba(240,235,225,0.08)',
                  borderLeft: isActive ? '2px solid var(--cyan)' : '2px solid transparent',
                  paddingLeft: isActive ? '1.5rem' : '0.25rem',
                  paddingTop: rowPadY,
                  paddingBottom: rowPadY,
                  cursor: 'pointer',
                  transition: 'border-left-color 0.3s ease, padding 0.35s ease',
                }}
                onClick={() => setActiveIdx(i)}
                onMouseEnter={() => setHoverIdx(i)}
                onMouseLeave={() => setHoverIdx(null)}
              >
                {/* Index */}
                <div className="mono flex-shrink-0 w-5" style={{ fontSize: 10, letterSpacing: '0.2em', color: isActive ? 'var(--cyan-text)' : 'rgba(240,235,225,0.22)' }}>
                  {String(i + 1).padStart(2, '0')}
                </div>

                {/* Logo */}
                <div style={{ opacity: isActive ? 1 : isHovered ? 0.75 : 0.35, transition: 'opacity 0.25s ease' }}>
                  <TeamLogo team={g.name} size={38} accent={isActive && g.isThis} />
                </div>

                {/* Game name */}
                <div className="serif flex-1" style={{
                  fontSize: nameSize,
                  fontWeight: 400, lineHeight: 1, letterSpacing: '-0.03em',
                  color: nameColor,
                  transition: 'color 0.25s ease, font-size 0.35s ease',
                }}>
                  {g.name}
                </div>

                {/* pts */}
                <div className="flex items-baseline gap-1.5 flex-shrink-0">
                  <span className="serif" style={{
                    fontSize: ptsSize,
                    fontWeight: 400, lineHeight: 1, letterSpacing: '-0.02em',
                    color: isActive && g.isThis ? 'var(--cyan-text)' : nameColor,
                    transition: 'color 0.25s ease, font-size 0.35s ease',
                  }}>{g.pts}</span>
                  <span className="mono" style={{ fontSize: 9, letterSpacing: '0.22em', color: metaColor, transition: 'color 0.25s ease' }}>PTS</span>
                </div>

                {/* Date */}
                <div className="mono flex-shrink-0 hidden sm:block" style={{
                  fontSize: 10, letterSpacing: '0.20em', textTransform: 'uppercase',
                  color: metaColor, transition: 'color 0.25s ease', minWidth: '3.5rem', textAlign: 'right',
                }}>
                  {g.date}
                </div>

                {/* Arrow */}
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" className="flex-shrink-0" style={{
                  opacity: isActive ? 1 : isHovered ? 0.5 : 0.15,
                  transform: isActive ? 'translateX(0)' : 'translateX(-3px)',
                  transition: 'opacity 0.25s ease, transform 0.25s ease',
                }}>
                  <path d="M2 7h10M8 3l4 4-4 4" stroke={isActive ? 'var(--cyan-text)' : 'var(--cream)'}
                    strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
              </button>
            );
          })}
        </div>

        {/* Stats + clip */}
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
          <div className="lg:col-span-7 p-7"
            style={{
              background: '#080b12',
              border: '1px solid ' + (active.isThis ? 'rgba(0,214,254,0.45)' : 'rgba(240,235,225,0.10)'),
            }}>
            <div className="mono text-[9.5px] tracking-[0.30em] uppercase text-cream-30 mb-3">
              {active.rank}
            </div>
            <div className="flex items-baseline gap-3 mb-3">
              <div className="serif" style={{ fontSize: '3.5rem', fontWeight: 400, lineHeight: 1, letterSpacing: '-0.02em', color: 'var(--cream)' }}>
                {active.pts}
              </div>
              <div className="mono text-[10px] tracking-[0.20em] uppercase text-cream-30">pts</div>
            </div>
            <div className="serif italic text-cream-85 mb-5" style={{ fontSize: '1.05rem', lineHeight: 1.4 }}>
              {active.headline}
            </div>
            <div className="mono text-[9.5px] tracking-[0.15em] uppercase text-cream-30 leading-[2] border-t border-cream-08 pt-4">
              vs {active.name} · {active.date}<br/>
              FG {active.fg} · 3PT {active.tpt}<br/>
              {active.venue}
            </div>
          </div>

          <div className="lg:col-span-5">
            <VideoFrame
              key={activeIdx}
              tsLabel={active.clipTs}
              captionLabel={active.clipCaption}
              maxWidth={300}
              imgSrc={active.img}
            />
          </div>
        </div>
      </div>

      <div className="mt-16 max-w-[36ch] text-center serif italic text-cream-45" style={{ fontSize: 'clamp(0.95rem, 1.4vw, 1.15rem)', lineHeight: 1.5 }}>
        Tomorrow's Halo will read these games again and write you a new one.
      </div>

      <div className="mt-12 flex items-center gap-3">
        <HaloMark size={26} />
        <div className="mono text-[9.5px] tracking-[0.30em] uppercase text-cream-30">
          Halo · Story Drop prototype
        </div>
      </div>
    </section>
  );
};

const App = () => {
  const [badgeVisible, setBadgeVisible] = useState(true);
  useEffect(() => {
    const onScroll = () => setBadgeVisible(window.scrollY < window.innerHeight * 0.85);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <Fragment>
      <ScrollBadge visible={badgeVisible} />
      <Hero />
      <Marquee />
      <AnchoredOpen />
      <QuarterScroll />
      <ScoreBoard />
      <Closing />
    </Fragment>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
